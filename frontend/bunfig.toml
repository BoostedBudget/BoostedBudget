# Bun configuration for BoostedBudget frontend
# Issue #575: Migration from pnpm/Vitest/Vite to Bun

[install]
# Don't freeze lockfile during development
frozen = false

[test]
# Preload files for bun test (order matters!)
# 1. happydom.ts - Register DOM globals first
# 2. testing-library.ts - Setup testing library matchers
preload = ["./src/test/happydom.ts", "./src/test/testing-library.ts"]

# Note: Coverage thresholds will be enforced in CI scripts
# Bun's built-in coverage is used via --coverage flag
