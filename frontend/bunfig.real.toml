# Bun configuration for tests that need REAL implementations
# Issue #575: These tests cannot use centralized mocks
#
# Use with: bun test --config bunfig.real.toml <files>
#
# Files that use this config:
# - src/features/dashboard/widgets/registry.test.ts (tests real registry)
# - src/features/dashboard/context/DashboardContext.test.tsx (tests real context)

[test]
# Only preload DOM and testing-library - NO mocks!
preload = [
  "./src/test/happydom.ts",
  "./src/test/testing-library.ts"
]

# Match vitest's generous timeout for CI stability
timeout = 30000
