# Budget Templates
# Issue #331: E2E Test Scenarios Framework
#
# Reusable budget configurations for testing budget features (Phase 3+)
# These templates are FUTURE-READY for when budget features are implemented
#
# Usage:
#   budgets:
#     - <<: *monthly_groceries_budget
#       user_id: "{{ user.id }}"
#       account_id: "{{ accounts[0].id }}"

# ============================================================================
# BASIC BUDGET TYPES
# ============================================================================

# Monthly budget (most common)
monthly_budget: &monthly_budget
  name: "Monthly Budget"
  period: "monthly"  # One of: daily, weekly, monthly, yearly
  amount: 1000.00
  category: "Shopping"
  alert_threshold: 0.80  # Alert at 80% spent
  rollover_enabled: false
  # Note: Budget features not yet implemented (Phase 3+)

# Weekly budget
weekly_budget: &weekly_budget
  name: "Weekly Budget"
  period: "weekly"
  amount: 250.00
  category: "Food and Drink"
  alert_threshold: 0.90
  rollover_enabled: false

# Yearly budget (for annual expenses)
yearly_budget: &yearly_budget
  name: "Yearly Budget"
  period: "yearly"
  amount: 12000.00
  category: "Travel"
  alert_threshold: 0.75
  rollover_enabled: true

# ============================================================================
# CATEGORY-SPECIFIC BUDGETS
# ============================================================================

# Groceries budget
groceries_budget: &groceries_budget
  <<: *monthly_budget
  name: "Monthly Groceries"
  amount: 600.00
  category: "Groceries"
  alert_threshold: 0.80

# Dining out budget
dining_budget: &dining_budget
  <<: *monthly_budget
  name: "Dining Out"
  amount: 300.00
  category: "Food and Drink"
  alert_threshold: 0.85

# Gas budget
gas_budget: &gas_budget
  <<: *monthly_budget
  name: "Gas & Fuel"
  amount: 200.00
  category: "Gas"
  alert_threshold: 0.90

# Entertainment budget
entertainment_budget: &entertainment_budget
  <<: *monthly_budget
  name: "Entertainment"
  amount: 150.00
  category: "Entertainment"
  alert_threshold: 0.80

# Shopping budget
shopping_budget: &shopping_budget
  <<: *monthly_budget
  name: "Shopping"
  amount: 500.00
  category: "Shopping"
  alert_threshold: 0.75

# Bills budget (fixed expenses)
bills_budget: &bills_budget
  <<: *monthly_budget
  name: "Bills & Utilities"
  amount: 1500.00
  category: "Bills"
  alert_threshold: 0.95  # Higher threshold since bills are fixed

# Healthcare budget
healthcare_budget: &healthcare_budget
  <<: *monthly_budget
  name: "Healthcare"
  amount: 300.00
  category: "Healthcare"
  alert_threshold: 0.70

# Travel budget
travel_budget: &travel_budget
  <<: *yearly_budget
  name: "Annual Travel"
  amount: 5000.00
  category: "Travel"
  alert_threshold: 0.75

# ============================================================================
# BUDGET WITH ROLLOVER
# ============================================================================

# Rollover budget (unused funds carry forward)
rollover_budget: &rollover_budget
  <<: *monthly_budget
  name: "Savings Budget"
  amount: 1000.00
  category: "Savings"
  rollover_enabled: true  # Unused budget carries to next period
  alert_threshold: 0.80

# Example: If you budget $1000 and spend $800, $200 rolls to next month
# Next month: $1000 (new) + $200 (rollover) = $1200 available

# ============================================================================
# ALERT THRESHOLDS
# ============================================================================

# Conservative budget (early alerts)
conservative_budget: &conservative_budget
  <<: *monthly_budget
  alert_threshold: 0.50  # Alert at 50% spent

# Standard budget (normal alerts)
standard_budget: &standard_budget
  <<: *monthly_budget
  alert_threshold: 0.80  # Alert at 80% spent

# Aggressive budget (late alerts)
aggressive_budget: &aggressive_budget
  <<: *monthly_budget
  alert_threshold: 0.95  # Alert at 95% spent (almost over)

# No alerts budget
no_alerts_budget: &no_alerts_budget
  <<: *monthly_budget
  alert_threshold: null  # No alerts

# ============================================================================
# BUDGET SCENARIOS FOR TESTING
# ============================================================================

# Budget near limit (for alert testing)
near_limit_budget: &near_limit_budget
  <<: *monthly_budget
  name: "Near Limit Budget"
  amount: 100.00
  category: "Shopping"
  alert_threshold: 0.80
  # Use with transactions totaling $85 (85% spent)

# Budget over limit (for overage testing)
over_limit_budget: &over_limit_budget
  <<: *monthly_budget
  name: "Over Limit Budget"
  amount: 100.00
  category: "Shopping"
  alert_threshold: 0.80
  # Use with transactions totaling $120 (120% spent, 20% over)

# Budget far under limit (for under-budget testing)
under_budget: &under_budget
  <<: *monthly_budget
  name: "Under Budget"
  amount: 1000.00
  category: "Shopping"
  alert_threshold: 0.80
  # Use with transactions totaling $200 (20% spent)

# ============================================================================
# MULTI-BUDGET SETUP
# ============================================================================

# Complete budget plan (common categories)
standard_budget_plan: &standard_budget_plan
  - <<: *groceries_budget
  - <<: *dining_budget
  - <<: *gas_budget
  - <<: *entertainment_budget
  - <<: *bills_budget

# Minimal budget plan (essentials only)
minimal_budget_plan: &minimal_budget_plan
  - <<: *groceries_budget
  - <<: *gas_budget
  - <<: *bills_budget

# Example usage:
# budgets: *standard_budget_plan
# Note: Each budget still needs user_id and account_id set

# ============================================================================
# TIER-SPECIFIC BUDGETS
# ============================================================================

# Free tier (max 1 budget rule)
free_tier_budget: &free_tier_budget
  <<: *groceries_budget
  # Free tier limit: 1 budget rule only

# Premium Lite tier (max 5 budget rules)
premium_lite_budgets: &premium_lite_budgets
  - <<: *groceries_budget
  - <<: *dining_budget
  - <<: *gas_budget
  - <<: *entertainment_budget
  - <<: *bills_budget
  # Premium Lite limit: 5 budget rules

# Premium tier (max 15 budget rules)
premium_budgets: &premium_budgets
  - <<: *groceries_budget
  - <<: *dining_budget
  - <<: *gas_budget
  - <<: *entertainment_budget
  - <<: *bills_budget
  - <<: *shopping_budget
  - <<: *healthcare_budget
  - <<: *travel_budget
  # ... up to 15 rules for premium tier

# ============================================================================
# BUDGET RULES (automation)
# ============================================================================

# Auto-categorize rule
auto_categorize_rule: &auto_categorize_rule
  name: "Auto-categorize Starbucks"
  condition_type: "merchant_name"
  condition_value: "Starbucks"
  action_type: "set_category"
  action_value: "Food and Drink"
  enabled: true
  # Note: Budget rules not yet implemented (Phase 4+)

# Set budget alert rule
budget_alert_rule: &budget_alert_rule
  name: "Alert on groceries budget"
  condition_type: "budget_threshold"
  condition_value: "0.80"  # 80%
  action_type: "send_alert"
  action_value: "email"
  enabled: true

# ============================================================================
# BUDGET STATES FOR TESTING
# ============================================================================

# Active budget
active_budget: &active_budget
  <<: *monthly_budget
  enabled: true
  # Normal active state

# Disabled budget
disabled_budget: &disabled_budget
  <<: *monthly_budget
  enabled: false
  # Budget exists but not enforced

# Expired budget (past period)
expired_budget: &expired_budget
  <<: *monthly_budget
  period_start: "2024-01-01"
  period_end: "2024-01-31"
  # Use for testing period rollover

# Future budget (not yet started)
future_budget: &future_budget
  <<: *monthly_budget
  period_start: "2025-01-01"
  period_end: "2025-01-31"
  # Use for testing scheduled budgets

# ============================================================================
# NOTES
# ============================================================================

# Budget Features (Phase 3+):
#   - Monthly/weekly/yearly periods
#   - Category-based spending limits
#   - Alert thresholds (80% = alert at 80% spent)
#   - Rollover (unused budget carries to next period)
#   - Multiple budgets per user (tier-limited)
#
# Alert Thresholds:
#   - 0.50 = Alert at 50% spent (conservative)
#   - 0.80 = Alert at 80% spent (standard)
#   - 0.95 = Alert at 95% spent (aggressive)
#   - null = No alerts
#
# Rollover Example:
#   Month 1: Budget $1000, Spent $800 → $200 unused
#   Month 2: Budget $1000 + $200 rollover = $1200 available
#
# Tier Limits (from config/subscription_tiers.yaml):
#   - Free: 1 budget rule
#   - Premium Lite: 5 budget rules
#   - Premium: 15 budget rules
#   - Premium Plus: Unlimited budget rules
#
# Testing Strategy:
#   - Use category-specific budgets for realistic scenarios
#   - Use threshold variations for alert testing
#   - Use near/over/under limits for edge cases
#   - Use tier-specific templates for limit enforcement tests
#
# Future Enhancement:
#   - Budget trends (spending vs budget over time)
#   - Budget recommendations (AI-powered)
#   - Shared budgets (household budgeting)
#   - Flexible periods (custom date ranges)
