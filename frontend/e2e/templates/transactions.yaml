# Transaction Templates
# Issue #331: E2E Test Scenarios Framework
#
# Reusable transaction patterns for different scenarios
# Reference these in scenarios using YAML anchors/aliases
#
# Usage:
#   existing_transactions:
#     - <<: *purchase_transaction
#       account_id: "{{ accounts[0].id }}"
#       date: "2024-01-15"

# ============================================================================
# BASIC TRANSACTION TYPES
# ============================================================================

# Purchase transaction (expense)
purchase_transaction: &purchase_transaction
  amount: -50.00  # Negative = expense
  name: "Generic Purchase"
  merchant_name: "Generic Store"
  category: "Shopping"
  pending: false
  user_notes: null

# Income transaction (deposit)
income_transaction: &income_transaction
  amount: 3000.00  # Positive = income
  name: "Payroll Deposit"
  merchant_name: "Employer Inc"
  category: "Income"
  pending: false
  user_notes: null

# Refund transaction (positive expense reversal)
refund_transaction: &refund_transaction
  amount: 25.00  # Positive = money back
  name: "Refund"
  merchant_name: "Store Refund"
  category: "Refund"
  pending: false
  user_notes: "Returned item"

# Pending transaction (not yet posted)
pending_transaction: &pending_transaction
  amount: -35.00
  name: "Pending Purchase"
  merchant_name: "Online Store"
  category: "Shopping"
  pending: true  # Key difference: pending = true
  user_notes: null

# ============================================================================
# SPECIFIC MERCHANT PATTERNS
# ============================================================================

# Coffee shop purchase
coffee_purchase: &coffee_purchase
  <<: *purchase_transaction
  amount: -5.50
  name: "Starbucks"
  merchant_name: "Starbucks"
  category: "Food and Drink"

# Grocery store purchase
grocery_purchase: &grocery_purchase
  <<: *purchase_transaction
  amount: -125.00
  name: "Whole Foods"
  merchant_name: "Whole Foods Market"
  category: "Groceries"

# Gas station purchase
gas_purchase: &gas_purchase
  <<: *purchase_transaction
  amount: -55.00
  name: "Shell"
  merchant_name: "Shell Gas Station"
  category: "Gas"

# Restaurant purchase
restaurant_purchase: &restaurant_purchase
  <<: *purchase_transaction
  amount: -75.00
  name: "Restaurant Dining"
  merchant_name: "Local Restaurant"
  category: "Food and Drink"

# Online shopping (Amazon)
amazon_purchase: &amazon_purchase
  <<: *purchase_transaction
  amount: -89.99
  name: "Amazon"
  merchant_name: "Amazon"
  category: "Shopping"

# Utility bill payment
utility_payment: &utility_payment
  <<: *purchase_transaction
  amount: -150.00
  name: "PG&E Electric"
  merchant_name: "Pacific Gas & Electric"
  category: "Bills"

# Subscription payment
subscription_payment: &subscription_payment
  <<: *purchase_transaction
  amount: -14.99
  name: "Netflix"
  merchant_name: "Netflix"
  category: "Entertainment"

# ATM withdrawal
atm_withdrawal: &atm_withdrawal
  <<: *purchase_transaction
  amount: -100.00
  name: "ATM Withdrawal"
  merchant_name: "Bank ATM"
  category: "Cash"

# Bank transfer
bank_transfer: &bank_transfer
  <<: *purchase_transaction
  amount: -500.00
  name: "Transfer to Savings"
  merchant_name: "Internal Transfer"
  category: "Transfer"

# ============================================================================
# INCOME PATTERNS
# ============================================================================

# Salary/paycheck (bi-weekly)
salary_deposit: &salary_deposit
  <<: *income_transaction
  amount: 3250.00
  name: "Payroll Deposit"
  merchant_name: "Employer Inc"
  category: "Income"

# Freelance income
freelance_income: &freelance_income
  <<: *income_transaction
  amount: 1500.00
  name: "Freelance Payment"
  merchant_name: "Client Name"
  category: "Income"

# Interest deposit
interest_deposit: &interest_deposit
  <<: *income_transaction
  amount: 12.50
  name: "Interest Deposit"
  merchant_name: "Bank Interest"
  category: "Income"

# Tax refund
tax_refund: &tax_refund
  <<: *income_transaction
  amount: 2500.00
  name: "Tax Refund"
  merchant_name: "IRS"
  category: "Income"

# ============================================================================
# TRANSACTION STATES FOR TESTING
# ============================================================================

# Transaction with user notes (for data preservation tests)
transaction_with_notes: &transaction_with_notes
  <<: *purchase_transaction
  user_notes: "Important note - must be preserved!"
  # Use for Issue #332 data integrity tests

# Large transaction (over $1000)
large_transaction: &large_transaction
  <<: *purchase_transaction
  amount: -2500.00
  name: "Large Purchase"
  merchant_name: "Electronics Store"
  category: "Shopping"
  # Use for testing spending limits, alerts

# Micro transaction (under $5)
micro_transaction: &micro_transaction
  <<: *purchase_transaction
  amount: -2.50
  name: "Small Purchase"
  merchant_name: "Vending Machine"
  category: "Other"

# Round dollar amount
round_transaction: &round_transaction
  <<: *purchase_transaction
  amount: -100.00
  name: "Round Amount"
  merchant_name: "Store"
  category: "Shopping"

# Transaction with cents
cents_transaction: &cents_transaction
  <<: *purchase_transaction
  amount: -42.37
  name: "Odd Amount"
  merchant_name: "Store"
  category: "Shopping"

# ============================================================================
# RECURRING TRANSACTIONS
# ============================================================================

# Monthly rent payment
rent_payment: &rent_payment
  <<: *purchase_transaction
  amount: -2000.00
  name: "Rent Payment"
  merchant_name: "Property Management"
  category: "Bills"
  # Use with date_range to create recurring pattern

# Monthly phone bill
phone_bill: &phone_bill
  <<: *purchase_transaction
  amount: -80.00
  name: "AT&T Phone Bill"
  merchant_name: "AT&T"
  category: "Bills"

# Monthly gym membership
gym_membership: &gym_membership
  <<: *purchase_transaction
  amount: -50.00
  name: "Gym Membership"
  merchant_name: "24 Hour Fitness"
  category: "Health"

# ============================================================================
# TRANSACTION LISTS (for bulk seeding)
# ============================================================================

# Typical monthly expenses
monthly_expenses: &monthly_expenses
  - <<: *rent_payment
  - <<: *utility_payment
  - <<: *phone_bill
  - <<: *gym_membership
  - <<: *subscription_payment

# Weekly groceries and gas
weekly_essentials: &weekly_essentials
  - <<: *grocery_purchase
  - <<: *gas_purchase
  - <<: *coffee_purchase

# Example usage:
# existing_transactions:
#   - <<: *rent_payment
#     account_id: "{{ accounts[0].id }}"
#     date: "2024-01-01"
#   - <<: *utility_payment
#     account_id: "{{ accounts[0].id }}"
#     date: "2024-01-05"

# ============================================================================
# SPECIAL SCENARIOS
# ============================================================================

# Duplicate transaction (for testing deduplication)
duplicate_transaction: &duplicate_transaction
  <<: *purchase_transaction
  external_transaction_id: "duplicate-txn-001"
  amount: -50.00
  date: "2024-01-15"
  name: "Duplicate Test"
  # Use twice with same external_transaction_id to test dedup logic

# Transaction to be removed (for TRANSACTIONS_REMOVED webhook)
removed_transaction: &removed_transaction
  <<: *purchase_transaction
  external_transaction_id: "txn-to-be-removed-001"
  amount: -75.00
  name: "Will Be Removed"
  # Use in setup, then fire TRANSACTIONS_REMOVED webhook

# Transaction state change (pending → posted)
pending_to_posted_transaction: &pending_to_posted_transaction
  <<: *pending_transaction
  external_transaction_id: "pending-001"
  amount: -42.00
  pending: true
  # Use in setup with pending: true, then sync again with pending: false

# Corrected transaction (amount changed)
corrected_transaction: &corrected_transaction
  <<: *purchase_transaction
  external_transaction_id: "corrected-001"
  amount: -50.00  # Initial amount
  name: "Transaction To Correct"
  # Use in setup, then sync again with amount: -55.00 (correction)

# ============================================================================
# CATEGORIZED TRANSACTION SETS
# ============================================================================

# Food & Dining (for budget testing)
food_transactions:
  - <<: *coffee_purchase
    date: "2024-01-01"
  - <<: *restaurant_purchase
    date: "2024-01-03"
  - <<: *grocery_purchase
    date: "2024-01-05"

# Bills (for budget tracking)
bills_transactions:
  - <<: *rent_payment
    date: "2024-01-01"
  - <<: *utility_payment
    date: "2024-01-05"
  - <<: *phone_bill
    date: "2024-01-10"

# Entertainment (for spending insights)
entertainment_transactions:
  - <<: *subscription_payment
    date: "2024-01-01"
  - <<: *restaurant_purchase
    date: "2024-01-10"

# ============================================================================
# AMOUNT PATTERNS FOR TESTING
# ============================================================================

# Ascending amounts (for sorting tests)
ascending_amounts:
  - amount: -10.00
  - amount: -20.00
  - amount: -30.00
  - amount: -40.00
  - amount: -50.00

# Descending amounts (for sorting tests)
descending_amounts:
  - amount: -100.00
  - amount: -75.00
  - amount: -50.00
  - amount: -25.00
  - amount: -10.00

# Mixed positive and negative (for balance tests)
mixed_amounts:
  - amount: 3000.00  # Income
  - amount: -500.00  # Rent
  - amount: -100.00  # Groceries
  - amount: 50.00    # Refund
  - amount: -25.00   # Gas

# ============================================================================
# NOTES
# ============================================================================

# Amount Conventions:
#   - Negative = expense/debit (money going out)
#   - Positive = income/credit (money coming in)
#
# Transaction States:
#   - pending: true = Transaction not yet posted
#   - pending: false = Transaction posted/settled
#
# Date Format:
#   - Always YYYY-MM-DD (ISO 8601)
#
# External Transaction ID:
#   - Unique identifier from Plaid
#   - Used for deduplication
#   - Must be unique per transaction
#
# Testing Strategy:
#   - Use specific merchants for realistic scenarios
#   - Use patterns for bulk seeding
#   - Use state templates for edge cases
#   - Use lists for common expense groups
