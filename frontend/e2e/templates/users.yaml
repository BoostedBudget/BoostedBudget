# User Templates
# Issue #331: E2E Test Scenarios Framework
#
# Reusable user configurations for different subscription tiers
# Reference these in scenarios using YAML anchors/aliases
#
# Usage:
#   setup:
#     user:
#       <<: *free_user
#       email: "custom@test.example.com"

# ============================================================================
# FREE TIER USER
# ============================================================================

free_user: &free_user
  tier: "free"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Free tier limits (reference):
  #   - Max 3 accounts
  #   - Max 1 budget rule
  #   - Sync 1x per day
  #   - 30-day transaction history
  #   - AdSense ads enabled

# Example usage:
# user:
#   <<: *free_user
#   email: "freetier@test.example.com"

# ============================================================================
# PREMIUM LITE USER
# ============================================================================

premium_lite_user: &premium_lite_user
  tier: "premium_lite"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Premium Lite limits (reference):
  #   - Max 15 accounts
  #   - Max 5 budget rules
  #   - Sync 2x per day
  #   - 1-year transaction history
  #   - No ads
  #   - Price: $4.99/month

# Example usage:
# user:
#   <<: *premium_lite_user
#   email: "premiumlite@test.example.com"

# ============================================================================
# PREMIUM USER
# ============================================================================

premium_user: &premium_user
  tier: "premium"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Premium limits (reference):
  #   - Max 30 accounts
  #   - Max 15 budget rules
  #   - Sync 6x per day
  #   - 2-year transaction history
  #   - No ads
  #   - Priority support
  #   - Price: $9.99/month

# Example usage:
# user:
#   <<: *premium_user
#   email: "premium@test.example.com"

# ============================================================================
# PREMIUM PLUS USER
# ============================================================================

premium_plus_user: &premium_plus_user
  tier: "premium_plus"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Premium Plus limits (reference):
  #   - Unlimited accounts
  #   - Unlimited budget rules
  #   - Sync every 10 minutes
  #   - Unlimited transaction history
  #   - No ads
  #   - Priority support
  #   - AI insights
  #   - API access
  #   - Price: $19.99/month

# Example usage:
# user:
#   <<: *premium_plus_user
#   email: "premiumplus@test.example.com"

# ============================================================================
# TRIAL USER (14-day trial, then downgrades to free)
# ============================================================================

trial_user: &trial_user
  tier: "premium"
  auth0_user_id: "auto-generate"
  subscription_status: "trial"
  # Trial period: 14 days
  # After trial: Automatically downgrade to free tier
  # Trial features: Full premium access during trial

# Example usage:
# user:
#   <<: *trial_user
#   email: "trial@test.example.com"

# ============================================================================
# CANCELLED USER (subscription cancelled, still in grace period)
# ============================================================================

cancelled_user: &cancelled_user
  tier: "premium"
  auth0_user_id: "auto-generate"
  subscription_status: "cancelled"
  # Cancelled but still has access until end of billing period
  # After grace period: Downgrade to free

# Example usage:
# user:
#   <<: *cancelled_user
#   email: "cancelled@test.example.com"

# ============================================================================
# EXPIRED USER (subscription expired, downgraded to free)
# ============================================================================

expired_user: &expired_user
  tier: "free"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Previously had premium, now downgraded to free
  # May have orphaned data (e.g., 4th account from premium days)
  # Use for testing tier limit enforcement after downgrade

# Example usage:
# user:
#   <<: *expired_user
#   email: "expired@test.example.com"

# ============================================================================
# ADMIN USER (for testing admin-only features)
# ============================================================================

admin_user: &admin_user
  tier: "premium_plus"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Admin role: Can access admin API endpoints
  # Note: Role would be set in Auth0 custom claims (not in DB)

# Example usage:
# user:
#   <<: *admin_user
#   email: "admin@test.example.com"

# ============================================================================
# COMPOUND TEMPLATES (combining common patterns)
# ============================================================================

# Free user with custom email pattern
free_user_with_test_email: &free_user_with_test_email
  <<: *free_user
  email: "test-{{ faker.nanoid(8) }}@test.example.com"

# Premium user ready for upgrade scenarios
upgradeable_user: &upgradeable_user
  tier: "free"
  auth0_user_id: "auto-generate"
  subscription_status: "active"
  # Starting as free, ready to be upgraded to premium in test

# GDPR testing user (EU resident)
gdpr_user: &gdpr_user
  <<: *free_user
  primary_region: "eu-west-1"  # Note: MVP uses us-east-1, this is future-ready
  # For testing GDPR compliance:
  #   - Data export
  #   - Account deletion (30-day grace period)
  #   - Privacy settings
  #   - Cookie consent

# ============================================================================
# NOTES
# ============================================================================

# Subscription tier limits are defined in config/subscription_tiers.yaml
# These templates represent the user's subscription status in the database
# Auth0 custom claims would include the tier information for middleware checks
#
# Future enhancement: Load tier limits from subscription_tiers.yaml
# and validate against them during scenario execution
