# E2E Test Scenarios - Schema Documentation
# Issue #331: E2E Test Scenarios Framework
#
# This file documents the complete schema for scenario YAML files.
# All scenarios must follow this structure and will be validated with Zod at runtime.
#
# Quick Start:
#   1. Copy an example below
#   2. Modify setup, steps, assertions for your test case
#   3. Run: npx playwright test scenarios/your-scenario.spec.ts
#
# Variable Interpolation:
#   Use {{ path.to.value }} to reference context values
#   Examples: {{ user.id }}, {{ accounts[0].name }}, {{ linked_items[0].item_id }}

# ============================================================================
# COMPLETE SCHEMA REFERENCE
# ============================================================================

version: "1.0"  # REQUIRED: Schema version (always "1.0")

scenario:
  # ========== METADATA ==========
  name: "scenario-name"  # REQUIRED: Unique identifier (kebab-case)
  description: "Human-readable description of what this scenario tests"
  category: "transaction-sync"  # REQUIRED: One of: transaction-sync, budgets, rules, user-journeys, auth, settings

  # ========== SETUP PHASE ==========
  # Database seeding - creates test data before scenario execution
  setup:
    # User (REQUIRED)
    user:
      id: "test-user-001"  # Optional: UUID, auto-generated if omitted
      email: "test@example.com"
      tier: "free"  # One of: free, premium_lite, premium, premium_plus
      auth0_user_id: "auto-generate"  # Or specific Auth0 ID

    # Linked Items (Optional) - Plaid connections
    linked_items:
      - id: "item-001"  # Optional: UUID
        item_id: "plaid-sandbox-item-001"  # Plaid item ID
        institution: "Chase"  # Institution name
        institution_id: "ins_3"  # Optional: Plaid institution ID
        cursor: null  # Optional: Sync cursor
        status: "active"  # One of: active, error, login_required

    # Accounts (Optional)
    accounts:
      - id: "acc-001"  # Optional: UUID
        linked_item_id: "item-001"  # References linked_items[].id
        plaid_account_id: "plaid-acc-sandbox-001"
        name: "Chase Checking"
        type: "depository"  # One of: depository, credit, loan, investment
        subtype: "checking"  # Specific subtype (checking, savings, credit card, etc.)
        current_balance: 5000.00
        available_balance: 4800.00

    # Existing Transactions (Optional) - Manual transaction creation
    existing_transactions:
      - id: "txn-001"  # Optional: UUID
        account_id: "acc-001"  # References accounts[].id
        external_transaction_id: "plaid-txn-001"
        amount: -50.00  # Negative = expense, Positive = income
        date: "2024-01-15"  # YYYY-MM-DD format
        name: "Starbucks"
        merchant_name: "Starbucks"
        category: "Food and Drink"
        pending: false
        user_notes: "Morning coffee"  # Optional

    # Generated Transactions (Optional) - Use templates for bulk data
    generate_transactions:
      template: "monthly_salary"  # Built-in templates: monthly_salary, grocery_shopping, gas_purchases, utility_payments, subscription_payments
      count: 3  # Number of transactions to generate
      date_range: "last_90_days"  # One of: last_week, last_month, last_30_days, last_60_days, last_90_days, last_6_months, last_year

  # ========== EXECUTION STEPS ==========
  # Actions to perform during the scenario
  steps:
    # API Call Step - Make HTTP requests
    - action: "api_call"
      method: "POST"  # One of: GET, POST, PUT, DELETE, PATCH
      endpoint: "/api/v1/transactions"
      headers:  # Optional
        X-Custom-Header: "value"
      body:  # Optional (for POST/PUT/PATCH)
        field: "value"
      expect_status: 200  # Optional: Verify response status
      save_as: "api_response"  # Optional: Save response to context

    # Delay Step - Wait for processing
    - action: "delay"
      duration: 5000  # Milliseconds

    # Navigate Step - Go to URL
    - action: "navigate"
      url: "/transactions"

    # Click Step - Click element
    - action: "click"
      selector: "[data-testid='add-transaction-button']"

    # Fill Step - Fill input field
    - action: "fill"
      selector: "input[name='amount']"
      value: "50.00"

    # Wait For Selector Step - Wait for element to appear
    - action: "wait_for_selector"
      selector: "[data-testid='transaction-list']"
      timeout: 30000  # Optional: milliseconds (default: 30000)

  # ========== ASSERTIONS ==========
  # Validations to run after steps complete
  assertions:
    # Database Assertions - SQL queries with expected results
    database:
      - description: "User should have 30 transactions"
        query: "SELECT COUNT(*) as count FROM transactions WHERE account_id = '{{ accounts[0].id }}'"
        expected:  # Exact match
          count: 30

      - description: "Transaction balance should be positive"
        query: "SELECT SUM(amount) as balance FROM transactions WHERE account_id = '{{ accounts[0].id }}'"
        expected_min:  # Minimum values
          balance: 1000.00

      - description: "All transactions should have dates"
        query: "SELECT id, date FROM transactions WHERE account_id = '{{ accounts[0].id }}' LIMIT 1"
        expected_not_null: ["id", "date"]  # Fields that must not be null

      - description: "Recent transaction should exist"
        query: "SELECT COUNT(*) as count FROM transactions WHERE account_id = '{{ accounts[0].id }}' AND date >= CURRENT_DATE - INTERVAL '7 days'"
        expected_greater_than:  # Greater than comparison
          count: 0

    # API Assertions - HTTP requests with expected responses
    api:
      - description: "GET transactions returns 200"
        method: "GET"
        endpoint: "/api/v1/transactions?account_id={{ accounts[0].id }}"
        expect_status: 200
        expect_body_contains: ["id", "amount", "date"]  # Fields that must be in response body (as JSON string)

      - description: "POST transaction creates new record"
        method: "POST"
        endpoint: "/api/v1/transactions"
        body:
          account_id: "{{ accounts[0].id }}"
          amount: -25.00
          date: "2024-01-20"
          name: "Test Transaction"
        expect_status: 201

    # UI Assertions - Playwright locator checks
    ui:
      - description: "Transaction list should be visible"
        selector: "[data-testid='transaction-list']"
        should_be_visible: true

      - description: "Transaction count should display correct number"
        selector: "[data-testid='transaction-count']"
        should_contain: "30 transactions"

      - description: "Amount should match regex pattern"
        selector: "[data-testid='total-amount']"
        should_match_regex: "^\\$[0-9,]+\\.[0-9]{2}$"

      - description: "Should have exactly 30 transaction rows"
        selector: "[data-testid='transaction-row']"
        should_have_count: 30

  # ========== CLEANUP (Optional) ==========
  # Database cleanup strategy after scenario completes
  cleanup:
    strategy: "truncate_all"  # One of: delete_test_users, truncate_all, none (default: truncate_all)

# ============================================================================
# EXAMPLE 1: TRANSACTION SYNC - FREE TIER FIRST SYNC
# ============================================================================

---
version: "1.0"

scenario:
  name: "free-tier-first-sync"
  description: "Verify free tier users get 30-day transaction history on first sync"
  category: "transaction-sync"

  setup:
    user:
      email: "freetier@test.example.com"
      tier: "free"
      auth0_user_id: "auto-generate"

    linked_items:
      - item_id: "plaid-sandbox-free-tier"
        institution: "Chase"
        status: "active"

    accounts:
      - linked_item_id: "{{ linked_items[0].id }}"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 5000.00

    generate_transactions:
      template: "grocery_shopping"
      count: 45  # Generate 45 days worth (should only sync last 30)
      date_range: "last_90_days"

  steps:
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/plaid/webhook"
      body:
        webhook_type: "TRANSACTIONS"
        webhook_code: "INITIAL_UPDATE"
        item_id: "{{ linked_items[0].item_id }}"
      expect_status: 200

    - action: "delay"
      duration: 5000  # Wait for webhook processing

  assertions:
    database:
      - description: "Free tier should have exactly 30 days of transactions"
        query: |
          SELECT COUNT(*) as count
          FROM transactions
          WHERE account_id = '{{ accounts[0].id }}'
          AND date >= CURRENT_DATE - INTERVAL '30 days'
        expected:
          count: 30

      - description: "Should not have transactions older than 30 days"
        query: |
          SELECT COUNT(*) as count
          FROM transactions
          WHERE account_id = '{{ accounts[0].id }}'
          AND date < CURRENT_DATE - INTERVAL '30 days'
        expected:
          count: 0

# ============================================================================
# EXAMPLE 2: DATA INTEGRITY - PRESERVE USER NOTES
# ============================================================================

---
version: "1.0"

scenario:
  name: "preserve-user-notes"
  description: "Verify user notes are preserved during transaction sync (DATA LOSS BUG PREVENTION)"
  category: "transaction-sync"

  setup:
    user:
      email: "notes@test.example.com"
      tier: "premium"
      auth0_user_id: "auto-generate"

    linked_items:
      - item_id: "plaid-sandbox-notes-test"
        institution: "Chase"
        cursor: "existing-cursor-001"  # Not first sync

    accounts:
      - linked_item_id: "{{ linked_items[0].id }}"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 3000.00

    existing_transactions:
      - account_id: "{{ accounts[0].id }}"
        external_transaction_id: "plaid-txn-preserve-001"
        amount: -100.00
        date: "2024-01-10"
        name: "Amazon"
        user_notes: "Important note - do not lose this!"

  steps:
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/plaid/webhook"
      body:
        webhook_type: "TRANSACTIONS"
        webhook_code: "DEFAULT_UPDATE"
        item_id: "{{ linked_items[0].item_id }}"
      expect_status: 200

    - action: "delay"
      duration: 3000

  assertions:
    database:
      - description: "User note must be preserved after sync"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-preserve-001'
        expected:
          user_notes: "Important note - do not lose this!"

      - description: "User note should not be null"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-preserve-001'
        expected_not_null: ["user_notes"]

# ============================================================================
# EXAMPLE 3: UI USER JOURNEY - ONBOARDING FLOW
# ============================================================================

---
version: "1.0"

scenario:
  name: "onboarding-flow"
  description: "Complete onboarding flow from signup to first transaction view"
  category: "user-journeys"

  setup:
    user:
      email: "onboarding@test.example.com"
      tier: "free"
      auth0_user_id: "auto-generate"

    # No linked items or accounts - fresh user

  steps:
    - action: "navigate"
      url: "/onboarding"

    - action: "wait_for_selector"
      selector: "[data-testid='connect-bank-button']"

    - action: "click"
      selector: "[data-testid='connect-bank-button']"

    - action: "wait_for_selector"
      selector: "[data-testid='plaid-link-iframe']"
      timeout: 10000

    - action: "delay"
      duration: 2000  # Wait for Plaid Link to load

  assertions:
    ui:
      - description: "Plaid Link should be visible"
        selector: "[data-testid='plaid-link-iframe']"
        should_be_visible: true

      - description: "Welcome message should show user's email"
        selector: "[data-testid='welcome-message']"
        should_contain: "onboarding@test.example.com"

    database:
      - description: "User should exist in database"
        query: "SELECT COUNT(*) as count FROM users WHERE email = 'onboarding@test.example.com'"
        expected:
          count: 1

# ============================================================================
# VARIABLE INTERPOLATION REFERENCE
# ============================================================================

# Available context variables after setup:
# {{ user.id }}                    - User UUID
# {{ user.email }}                 - User email
# {{ user.tier }}                  - User tier (free, premium_lite, premium, premium_plus)
# {{ linked_items[0].id }}         - First linked item UUID
# {{ linked_items[0].item_id }}    - First linked item Plaid ID
# {{ accounts[0].id }}             - First account UUID
# {{ accounts[0].name }}           - First account name
# {{ accounts[1].id }}             - Second account UUID (if exists)
# {{ transactions[0].id }}         - First transaction UUID (if created in setup)

# Advanced interpolation:
# {{ accounts.length }}            - Number of accounts (NOT YET IMPLEMENTED)
# {{ date.now() }}                 - Current date YYYY-MM-DD (NOT YET IMPLEMENTED)
# {{ date.subtract(30, 'days') }}  - Date 30 days ago (NOT YET IMPLEMENTED)
# {{ faker.email() }}              - Random email (NOT YET IMPLEMENTED)

# ============================================================================
# YAML ANCHORS & ALIASES (DRY TEMPLATES)
# ============================================================================

# Define reusable templates with anchors (&)
free_user_template: &free_user
  tier: "free"
  auth0_user_id: "auto-generate"

checking_account_template: &checking_account
  type: "depository"
  subtype: "checking"
  current_balance: 5000.00
  available_balance: 4800.00

# Use templates with aliases (*) and merge (<<)
---
version: "1.0"

scenario:
  name: "anchor-example"
  description: "Example using YAML anchors for DRY templates"
  category: "transaction-sync"

  setup:
    user:
      <<: *free_user  # Merge free_user_template
      email: "anchor@test.example.com"  # Override/add specific fields

    linked_items:
      - item_id: "item-001"
        institution: "Chase"

    accounts:
      - <<: *checking_account  # Merge checking_account_template
        linked_item_id: "{{ linked_items[0].id }}"
        name: "Chase Checking"

  steps: []
  assertions: {}

# ============================================================================
# NOTES
# ============================================================================

# - All scenarios MUST have version: "1.0"
# - All scenarios MUST have name, description, category
# - All scenarios MUST have setup.user
# - Steps and assertions are optional but recommended
# - Cleanup defaults to truncate_all if omitted
# - Variable interpolation uses {{ }} syntax (Handlebars-style)
# - YAML anchors (&) and aliases (*) are supported via js-yaml
# - Comments are encouraged for complex scenarios
# - Use 2-space indentation (no tabs)
# - Validate with: yamllint scenarios/*.yaml
