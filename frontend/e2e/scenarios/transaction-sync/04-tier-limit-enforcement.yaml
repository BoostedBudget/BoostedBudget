# P0 Scenario: Tier Limit Enforcement
# Issue #331: E2E Test Scenarios Framework
#
# Tests that subscription tier limits are enforced for account creation.
# Free tier users should be limited to 3 accounts max (monthly limit).
#
# CRITICAL: Revenue protection - prevents free users from getting premium features
#
# Expected Behavior:
#   - Free tier: Max 3 accounts per month
#   - Premium Lite: Max 15 accounts
#   - Premium: Max 30 accounts
#   - Premium Plus: Unlimited accounts
#
# This scenario verifies the free tier 3-account monthly limit is enforced.
#
# Test Approach:
#   1. Create free tier user with 3 accounts (at limit)
#   2. Attempt to add 4th account via Plaid Link
#   3. Verify 4th account is rejected with proper error
#   4. Verify user still has only 3 accounts

version: "1.0"

scenario:
  name: "tier-limit-enforcement"
  description: "Verify free tier 3-account monthly limit is enforced"
  category: "transaction-sync"

  setup:
    # Create free tier user
    user:
      id: "00000000-0000-0000-0000-000000000001"
      email: "tier-limit@test.example.com"
      tier: "free"
      auth0_user_id: "auto-generate"

    # Create Plaid linked item
    linked_items:
      - id: "linked-item-limit-001"
        item_id: "plaid-sandbox-limit-001"
        institution: "Chase"
        institution_id: "ins_3"
        cursor: null
        status: "active"

    # Create exactly 3 accounts (free tier limit)
    accounts:
      # Account 1: Checking
      - id: "account-limit-001"
        linked_item_id: "linked-item-limit-001"
        plaid_account_id: "plaid-acc-limit-001"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 5000.00
        available_balance: 4800.00

      # Account 2: Savings
      - id: "account-limit-002"
        linked_item_id: "linked-item-limit-001"
        plaid_account_id: "plaid-acc-limit-002"
        name: "Chase Savings"
        type: "depository"
        subtype: "savings"
        current_balance: 10000.00
        available_balance: 10000.00

      # Account 3: Credit Card (at limit now)
      - id: "account-limit-003"
        linked_item_id: "linked-item-limit-001"
        plaid_account_id: "plaid-acc-limit-003"
        name: "Chase Credit Card"
        type: "credit"
        subtype: "credit card"
        current_balance: -1500.00
        available_balance: 8500.00

  steps:
    # Step 1: Verify user has exactly 3 accounts (at limit)
    - action: "api_call"
      method: "GET"
      endpoint: "/api/v1/accounts?user_id=test-tier-limit-001"
      expect_status: 200
      save_as: "initial_accounts"

    # Step 2: Attempt to add 4th account via POST /accounts
    # This should be REJECTED due to free tier limit
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/accounts"
      body:
        user_id: "test-tier-limit-001"
        linked_item_id: "linked-item-limit-001"
        plaid_account_id: "plaid-acc-limit-004"
        name: "Chase Investment Account"
        type: "investment"
        subtype: "brokerage"
        current_balance: 50000.00
      expect_status: 403  # Forbidden - tier limit exceeded

    # Step 3: Wait briefly
    - action: "delay"
      duration: 1000

  assertions:
    database:
      # Assertion 1: User should still have exactly 3 accounts
      - description: "Free tier user should have exactly 3 accounts (limit enforced)"
        query: |
          SELECT COUNT(*) as count
          FROM accounts
          WHERE user_id = 'test-tier-limit-001'
        expected:
          count: 3

      # Assertion 2: 4th account should NOT exist in database
      - description: "4th account should not exist in database"
        query: |
          SELECT COUNT(*) as count
          FROM accounts
          WHERE user_id = 'test-tier-limit-001'
          AND plaid_account_id = 'plaid-acc-limit-004'
        expected:
          count: 0

      # Assertion 3: User tier should still be 'free'
      - description: "User should still be on free tier"
        query: |
          SELECT tier
          FROM users
          WHERE id = 'test-tier-limit-001'
        expected:
          tier: "free"

      # Assertion 4: Verify the 3 accounts that exist are the original ones
      - description: "Original 3 accounts should still exist"
        query: |
          SELECT COUNT(*) as count
          FROM accounts
          WHERE user_id = 'test-tier-limit-001'
          AND plaid_account_id IN ('plaid-acc-limit-001', 'plaid-acc-limit-002', 'plaid-acc-limit-003')
        expected:
          count: 3

    api:
      # Assertion 5: GET /accounts should return exactly 3 accounts
      - description: "GET /accounts should return 3 accounts for free tier user"
        method: "GET"
        endpoint: "/api/v1/accounts?user_id=test-tier-limit-001"
        expect_status: 200
        expect_body_contains: ["id", "name", "type"]

      # Assertion 6: POST /accounts for 4th account should return 403
      - description: "POST /accounts should return 403 when tier limit exceeded"
        method: "POST"
        endpoint: "/api/v1/accounts"
        body:
          user_id: "test-tier-limit-001"
          linked_item_id: "linked-item-limit-001"
          plaid_account_id: "plaid-acc-limit-005"
          name: "Another Account"
          type: "depository"
          subtype: "checking"
          current_balance: 1000.00
        expect_status: 403
        expect_body_contains: ["error", "tier", "limit"]

  cleanup:
    strategy: "truncate_all"
