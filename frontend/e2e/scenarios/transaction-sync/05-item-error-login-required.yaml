# P1 Scenario: Item Error - Login Required
# Issue #331: E2E Test Scenarios Framework
#
# Tests that the system handles Plaid item errors gracefully when user
# credentials expire and LOGIN_REQUIRED error occurs.
#
# HIGH PRIORITY: Ensures graceful error handling without data loss
#
# Expected Behavior:
#   - Item status changes to "login_required" on ITEM_LOGIN_REQUIRED webhook
#   - Existing transactions are preserved (no data loss)
#   - No new transactions synced while item in error state
#   - User sees prompt to reconnect via Plaid Link
#   - After reconnection, syncing resumes normally
#
# This scenario verifies error state handling maintains data integrity.

version: "1.0"

scenario:
  name: "item-error-login-required"
  description: "Verify graceful handling of Plaid item LOGIN_REQUIRED error state"
  category: "transaction-sync"

  setup:
    # Create user with active linked item
    user:
      id: "test-item-error-001"
      email: "item-error@test.example.com"
      tier: "premium"
      auth0_user_id: "auto-generate"

    # Create Plaid linked item (initially active)
    linked_items:
      - id: "linked-item-error-001"
        item_id: "plaid-sandbox-error-001"
        institution: "Chase"
        institution_id: "ins_3"
        cursor: "cursor-before-error-123"
        status: "active"

    # Create checking account
    accounts:
      - id: "account-error-001"
        linked_item_id: "linked-item-error-001"
        plaid_account_id: "plaid-acc-error-001"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 5000.00
        available_balance: 4800.00

    # Create existing transactions (before error occurred)
    existing_transactions:
      - id: "txn-before-error-001"
        account_id: "account-error-001"
        external_transaction_id: "plaid-txn-error-001"
        amount: -100.00
        date: "2024-01-15"
        name: "Grocery Store"
        merchant_name: "Whole Foods"
        category: "Groceries"
        user_notes: "Weekly groceries - important note"

      - id: "txn-before-error-002"
        account_id: "account-error-001"
        external_transaction_id: "plaid-txn-error-002"
        amount: -50.00
        date: "2024-01-14"
        name: "Gas Station"
        merchant_name: "Shell"
        category: "Transportation"

  steps:
    # Step 1: Verify item is initially active
    - action: "api_call"
      method: "GET"
      endpoint: "/api/v1/linked-items/linked-item-error-001"
      expect_status: 200
      save_as: "initial_item_status"

    # Step 2: Fire ITEM_LOGIN_REQUIRED webhook (credentials expired)
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/admin/plaid/fire-webhook"
      body:
        webhook_type: "ITEM"
        webhook_code: "ERROR"
        item_id: "plaid-sandbox-error-001"
        error:
          error_code: "ITEM_LOGIN_REQUIRED"
          error_message: "the login details of this item have changed (credentials, MFA, or required user action) and a user login is required to update this information"
          error_type: "ITEM_ERROR"
      expect_status: 200

    # Step 3: Wait for webhook processing
    - action: "delay"
      duration: 3000

    # Step 4: Attempt to sync transactions (should fail gracefully)
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/admin/plaid/fire-webhook"
      body:
        webhook_type: "TRANSACTIONS"
        webhook_code: "DEFAULT_UPDATE"
        item_id: "plaid-sandbox-error-001"
      expect_status: 200  # Should accept webhook but not process due to error state

    # Step 5: Wait to verify no new transactions added
    - action: "delay"
      duration: 2000

  assertions:
    database:
      # Assertion 1: Item status should be changed to "login_required"
      - description: "Linked item status should be 'login_required' after error"
        query: |
          SELECT status, error_code
          FROM linked_items
          WHERE id = 'linked-item-error-001'
        expected:
          status: "login_required"
          error_code: "ITEM_LOGIN_REQUIRED"

      # Assertion 2: Existing transactions should be preserved (data integrity)
      - description: "Existing transactions should be preserved during error state"
        query: |
          SELECT COUNT(*) as count
          FROM transactions
          WHERE account_id = 'account-error-001'
        expected:
          count: 2

      # Assertion 3: User notes should be preserved (no data loss)
      - description: "User notes should be preserved during error state"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-error-001'
        expected:
          user_notes: "Weekly groceries - important note"

      # Assertion 4: Cursor should be preserved (no cursor reset)
      - description: "Cursor should remain unchanged during error state"
        query: |
          SELECT cursor
          FROM linked_items
          WHERE id = 'linked-item-error-001'
        expected:
          cursor: "cursor-before-error-123"

      # Assertion 5: No new transactions should be added during error state
      - description: "No new transactions should be synced while item in error state"
        query: |
          SELECT COUNT(*) as count
          FROM transactions
          WHERE account_id = 'account-error-001'
          AND created_at > (
            SELECT updated_at
            FROM linked_items
            WHERE id = 'linked-item-error-001'
          )
        expected:
          count: 0

      # Assertion 6: Error timestamp should be set
      - description: "Error timestamp should be recorded"
        query: |
          SELECT error_timestamp
          FROM linked_items
          WHERE id = 'linked-item-error-001'
        expected_not_null: ["error_timestamp"]

    api:
      # Assertion 7: GET /linked-items should show error status
      - description: "GET /linked-items should return error status with reconnection prompt"
        method: "GET"
        endpoint: "/api/v1/linked-items/linked-item-error-001"
        expect_status: 200
        expect_body_contains: ["status", "login_required", "error_code", "ITEM_LOGIN_REQUIRED"]

      # Assertion 8: GET /transactions should still return existing transactions
      - description: "GET /transactions should return existing transactions during error state"
        method: "GET"
        endpoint: "/api/v1/transactions?account_id=account-error-001"
        expect_status: 200
        expect_body_contains: ["id", "amount", "date"]

  cleanup:
    strategy: "truncate_all"
