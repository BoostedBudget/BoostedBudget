# P0 Scenario: Preserve User Notes
# Issue #331: E2E Test Scenarios Framework
# Related: Issue #332 - Data Integrity Tests
#
# Tests that user notes on transactions are preserved during sync operations.
# This is a CRITICAL data integrity test - losing user notes is a data loss bug.
#
# CRITICAL: Data loss prevention - user notes must never be overwritten or deleted
#
# Expected Behavior:
#   - Existing user notes should be preserved during DEFAULT_UPDATE sync
#   - New transaction data from Plaid should NOT overwrite user notes
#   - User notes field should remain exactly as user entered it
#
# Background:
#   When Plaid sends transaction updates, we must merge new data (amount, date, etc.)
#   but preserve user-entered fields like user_notes. Failing to do so causes data loss.

version: "1.0"

scenario:
  name: "preserve-user-notes"
  description: "Verify user notes are preserved during transaction sync (DATA LOSS BUG PREVENTION)"
  category: "transaction-sync"

  setup:
    # Create premium user (has already done initial sync)
    user:
      id: "e2e00003-0000-0000-0000-000000000001"
      email: "preserve-notes@test.example.com"
      tier: "premium"
      auth0_user_id: "auto-generate"

    # Create Plaid linked item with existing cursor (not first sync)
    linked_items:
      - id: "e2e00003-item-0000-0000-000000000001"
        item_id: "e2e00003-plid-0000-0000-000000000001"
        institution: "Chase"
        institution_id: "ins_3"
        cursor: "existing-cursor-abc123"  # Has synced before
        status: "active"

    # Create checking account
    accounts:
      - id: "e2e00003-0001-0000-0000-000000000001"
        linked_item_id: "e2e00003-item-0000-0000-000000000001"
        plaid_account_id: "plaid-acc-notes-001"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 3000.00
        available_balance: 2800.00

    # Create existing transactions WITH user notes
    existing_transactions:
      # Transaction 1: Has important user note
      - id: "txn-with-note-001"
        account_id: "e2e00003-0001-0000-0000-000000000001"
        external_transaction_id: "plaid-txn-preserve-001"
        amount: -100.00
        date: "2024-01-10"
        name: "Amazon"
        merchant_name: "Amazon"
        category: "Shopping"
        pending: false
        user_notes: "Important note - do not lose this! Project XYZ expense."

      # Transaction 2: Has another important note
      - id: "txn-with-note-002"
        account_id: "e2e00003-0001-0000-0000-000000000001"
        external_transaction_id: "plaid-txn-preserve-002"
        amount: -50.00
        date: "2024-01-12"
        name: "Starbucks"
        merchant_name: "Starbucks"
        category: "Food and Drink"
        pending: false
        user_notes: "Coffee with Sarah - discuss Q1 planning"

      # Transaction 3: Has multi-line note
      - id: "txn-with-note-003"
        account_id: "e2e00003-0001-0000-0000-000000000001"
        external_transaction_id: "plaid-txn-preserve-003"
        amount: -200.00
        date: "2024-01-15"
        name: "Office Supplies"
        merchant_name: "Staples"
        category: "Business"
        pending: false
        user_notes: "Reimbursable expense\nReceipt in folder\nSubmit by 01/31"

  steps:
    # Step 1: Fire DEFAULT_UPDATE webhook (incremental sync)
    # This simulates Plaid sending updates for existing transactions
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/admin/plaid/fire-webhook"
      body:
        webhook_type: "TRANSACTIONS"
        webhook_code: "DEFAULT_UPDATE"
        item_id: "e2e00003-plid-0000-0000-000000000001"
      expect_status: 200

    # Step 2: Wait for webhook processing
    - action: "delay"
      duration: 3000  # 3 seconds

  assertions:
    database:
      # Assertion 1: Transaction 1 note must be preserved exactly
      - description: "Transaction 1 user note must be preserved exactly"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-preserve-001'
        expected:
          user_notes: "Important note - do not lose this! Project XYZ expense."

      # Assertion 2: Transaction 2 note must be preserved exactly
      - description: "Transaction 2 user note must be preserved exactly"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-preserve-002'
        expected:
          user_notes: "Coffee with Sarah - discuss Q1 planning"

      # Assertion 3: Transaction 3 multi-line note must be preserved exactly
      - description: "Transaction 3 multi-line user note must be preserved exactly"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-preserve-003'
        expected:
          user_notes: "Reimbursable expense\nReceipt in folder\nSubmit by 01/31"

      # Assertion 4: All three transactions should have non-null notes
      - description: "All transactions with notes should have non-null user_notes field"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE external_transaction_id IN ('plaid-txn-preserve-001', 'plaid-txn-preserve-002', 'plaid-txn-preserve-003')
          ORDER BY external_transaction_id
          LIMIT 1
        expected_not_null: ["user_notes"]

      # Assertion 5: Count should remain 3 (no duplicates created)
      - description: "Should have exactly 3 transactions (no duplicates)"
        query: |
          SELECT COUNT(*) as count
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'e2e00003-0001-0000-0000-000000000001'
        expected:
          count: 3

      # Assertion 6: Verify other fields were updated (amount, name) but notes preserved
      # This ensures we're actually processing the webhook, not skipping it
      - description: "Transaction metadata should exist (proving sync happened)"
        query: |
          SELECT COUNT(*) as count
          FROM transactions
          WHERE external_transaction_id = 'plaid-txn-preserve-001'
          AND amount = -100.00
          AND name = 'Amazon'
        expected:
          count: 1

    api:
      # Assertion 7: API should return transactions with preserved notes
      - description: "GET /transactions should return transactions with user notes intact"
        method: "GET"
        endpoint: "/api/v1/transactions?account_id=e2e00003-0001-0000-0000-000000000001"
        expect_status: 200
        expect_body_contains: ["user_notes", "Important note"]

  cleanup:
    strategy: "truncate_all"
