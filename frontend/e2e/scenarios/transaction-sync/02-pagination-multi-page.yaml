# P1 Scenario: Pagination Multi-Page
# Issue #331: E2E Test Scenarios Framework
#
# Tests that transaction sync handles pagination correctly when Plaid returns
# more than 500 transactions (typical page size).
#
# HIGH PRIORITY: Ensures large transaction volumes are handled correctly
#
# Expected Behavior:
#   - Plaid returns transactions in pages (typically 500 per page)
#   - System should fetch all pages until no more transactions
#   - Cursor should be updated after all pages fetched
#   - No duplicate transactions across pages
#   - All transactions should be stored correctly
#
# This scenario verifies pagination logic handles multi-page responses.

version: "1.0"

scenario:
  name: "pagination-multi-page"
  description: "Verify transaction sync handles >500 transactions across multiple pages correctly"
  category: "transaction-sync"

  setup:
    # Create premium user (has 2-year history, enough for many transactions)
    user:
      id: "e2e00002-0000-0000-0000-000000000001"
      email: "pagination@test.example.com"
      tier: "premium"
      auth0_user_id: "auto-generate"

    # Create Plaid linked item
    linked_items:
      - id: "e2e00002-item-0000-0000-000000000001"
        item_id: "e2e00002-plid-0000-0000-000000000001"
        institution: "Chase"
        institution_id: "ins_3"
        cursor: null  # First sync
        status: "active"

    # Create checking account
    accounts:
      - id: "e2e00002-0001-0000-0000-000000000001"
        linked_item_id: "e2e00002-item-0000-0000-000000000001"
        plaid_account_id: "plaid-acc-pagination-001"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 10000.00
        available_balance: 9500.00

    # Generate 600 transactions (more than 1 page)
    # This simulates a user with high transaction volume
    generate_transactions:
      template: "grocery_shopping"
      count: 600  # Exceeds typical 500-transaction page size
      date_range: "last_90_days"

  steps:
    # Step 1: Fire INITIAL_UPDATE webhook (first sync with pagination)
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/admin/plaid/fire-webhook"
      body:
        webhook_type: "TRANSACTIONS"
        webhook_code: "INITIAL_UPDATE"
        item_id: "e2e00002-plid-0000-0000-000000000001"
      expect_status: 200

    # Step 2: Wait for webhook processing (pagination may take longer)
    - action: "delay"
      duration: 10000  # 10 seconds for multi-page processing

  assertions:
    database:
      # Assertion 1: Should have all 600 transactions (no data loss across pages)
      - description: "Should have all 600 transactions (complete pagination)"
        query: |
          SELECT COUNT(*) as count
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'e2e00002-0001-0000-0000-000000000001'
        expected:
          count: 600

      # Assertion 2: Should have no duplicate transactions
      # (duplicates are a common pagination bug)
      - description: "Should have no duplicate transactions"
        query: |
          SELECT COUNT(*) as duplicate_count
          FROM (
            SELECT external_transaction_id, COUNT(*) as cnt
            FROM transactions t
            JOIN accounts a ON t.account_id = a.id
            WHERE a.id = 'e2e00002-0001-0000-0000-000000000001'
            GROUP BY external_transaction_id
            HAVING COUNT(*) > 1
          ) duplicates
        expected:
          duplicate_count: 0

      # Assertion 3: All transactions should have unique external IDs
      - description: "All transactions should have unique external IDs"
        query: |
          SELECT COUNT(DISTINCT external_transaction_id) as unique_count
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'e2e00002-0001-0000-0000-000000000001'
        expected:
          unique_count: 600

      # Assertion 4: Cursor should be updated (pagination complete)
      - description: "Linked item cursor should be updated after pagination"
        query: |
          SELECT cursor
          FROM linked_items
          WHERE id = 'e2e00002-item-0000-0000-000000000001'
        expected_not_null: ["cursor"]

      # Assertion 5: All transactions should have valid data
      - description: "All transactions should have required fields populated"
        query: |
          SELECT COUNT(*) as count
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'e2e00002-0001-0000-0000-000000000001'
          AND (
            t.external_transaction_id IS NULL
            OR t.amount IS NULL
            OR t.date IS NULL
            OR t.name IS NULL
          )
        expected:
          count: 0

      # Assertion 6: Transactions should span the expected date range
      - description: "Transactions should cover the last 90 days"
        query: |
          SELECT
            COUNT(*) as valid_date_range
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'e2e00002-0001-0000-0000-000000000001'
          AND t.date >= CURRENT_DATE - INTERVAL '90 days'
        expected:
          valid_date_range: 600  # All 600 transactions should be within 90 days

    api:
      # Assertion 7: GET /transactions should return paginated results
      - description: "GET /transactions should return transactions with pagination support"
        method: "GET"
        endpoint: "/api/v1/transactions?account_id=e2e00002-0001-0000-0000-000000000001&limit=100"
        expect_status: 200
        expect_body_contains: ["id", "amount", "date"]

  cleanup:
    strategy: "truncate_all"
