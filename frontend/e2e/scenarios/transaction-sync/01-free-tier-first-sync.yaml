# P0 Scenario: Free Tier First Sync
# Issue #331: E2E Test Scenarios Framework
#
# Tests that free tier users receive exactly 30 days of transaction history
# on their first sync (INITIAL_UPDATE webhook).
#
# CRITICAL: Revenue protection - ensures free users don't get premium features
#
# Expected Behavior:
#   - Free tier: 30-day historical depth
#   - Premium Lite: 365-day historical depth
#   - Premium: 730-day historical depth (2 years)
#   - Premium Plus: Unlimited historical depth
#
# This scenario verifies the free tier limit is enforced.

version: "1.0"

scenario:
  name: "free-tier-first-sync"
  description: "Verify free tier users get exactly 30 days of transaction history on first sync"
  category: "transaction-sync"

  setup:
    # Create free tier user
    user:
      id: "test-free-tier-sync-001"
      email: "free-tier-sync@test.example.com"
      tier: "free"
      auth0_user_id: "auto-generate"

    # Create Plaid linked item
    linked_items:
      - id: "linked-item-free-001"
        item_id: "plaid-sandbox-free-tier-001"
        institution: "Chase"
        institution_id: "ins_3"
        cursor: null  # First sync - no cursor yet
        status: "active"

    # Create checking account
    accounts:
      - id: "account-free-checking-001"
        linked_item_id: "linked-item-free-001"
        plaid_account_id: "plaid-acc-free-001"
        name: "Chase Everyday Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 5000.00
        available_balance: 4800.00

    # Generate 60 days of transactions (but only last 30 should sync)
    generate_transactions:
      template: "grocery_shopping"
      count: 60  # 60 days worth
      date_range: "last_60_days"

  steps:
    # Step 1: Fire INITIAL_UPDATE webhook (first sync)
    - action: "api_call"
      method: "POST"
      endpoint: "/api/v1/admin/plaid/fire-webhook"
      body:
        webhook_type: "TRANSACTIONS"
        webhook_code: "INITIAL_UPDATE"
        item_id: "plaid-sandbox-free-tier-001"
      expect_status: 200

    # Step 2: Wait for webhook processing
    - action: "delay"
      duration: 5000  # 5 seconds for processing

  assertions:
    database:
      # Assertion 1: Should have exactly 30 days of transactions (free tier limit)
      - description: "Free tier should have exactly 30 transactions (30 days)"
        query: |
          SELECT COUNT(*) as count
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'account-free-checking-001'
          AND t.date >= CURRENT_DATE - INTERVAL '30 days'
        expected:
          count: 30

      # Assertion 2: Should NOT have transactions older than 30 days
      - description: "Should not have transactions older than 30 days"
        query: |
          SELECT COUNT(*) as count
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'account-free-checking-001'
          AND t.date < CURRENT_DATE - INTERVAL '30 days'
        expected:
          count: 0

      # Assertion 3: All transactions should have required fields
      - description: "All transactions should have valid data"
        query: |
          SELECT id, external_transaction_id, amount, date, name
          FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.id = 'account-free-checking-001'
          LIMIT 1
        expected_not_null: ["id", "external_transaction_id", "amount", "date", "name"]

      # Assertion 4: Linked item cursor should be updated (sync completed)
      - description: "Linked item cursor should be updated after sync"
        query: |
          SELECT cursor
          FROM linked_items
          WHERE id = 'linked-item-free-001'
        expected_not_null: ["cursor"]

    api:
      # Assertion 5: GET transactions should return 30 transactions
      - description: "API should return 30 transactions for free tier user"
        method: "GET"
        endpoint: "/api/v1/transactions?account_id=account-free-checking-001"
        expect_status: 200
        expect_body_contains: ["id", "amount", "date"]

  cleanup:
    strategy: "truncate_all"  # Fast cleanup for next test
