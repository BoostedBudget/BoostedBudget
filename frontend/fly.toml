# Fly.io configuration for BoostedBudget Frontend Web App
# Deploy with: fly deploy --config frontend/fly.toml

app = "boostedbudget-web"
primary_region = "iad"  # US East (Virginia) - Single region for MVP
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  # Build Docker image from frontend/Dockerfile
  dockerfile = "Dockerfile"

[env]
  PORT = "80"
  ENVIRONMENT = "production"

  # API endpoint (no /v1 suffix - endpoints include full path like /api/v1/user/profile)
  API_URL = "https://api.boostedbudget.com"

  # Auth0 configuration (runtime injection via docker-entrypoint.sh)
  AUTH0_DOMAIN = "dev-evuy37ow1xcidsmw.us.auth0.com"
  AUTH0_AUDIENCE = "https://api.boostedbudget.com"

  # NOTE: Sensitive environment variables set via `fly secrets set`:
  # - AUTH0_CLIENT_ID (Auth0 SPA client ID)
  # - PLAID_PUBLIC_KEY
  # - GOOGLE_ADSENSE_CLIENT (for free tier ads)

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 80
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
    protocol = "http"
    tls_skip_verify = false

[deploy]
  strategy = "rolling"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
