# Squawk Configuration for BoostedBudget
# PostgreSQL migration linter for golang-migrate
# Documentation: https://squawkhq.com/docs/rules
# Issue #631: golang-migrate + Squawk for database migrations

# Target PostgreSQL version (matches Neon production)
pg_version = "17"

# Assume migrations run in transactions. Verified empirically (2026-08 audit, Issue #1461/#1464
# follow-up): TRUE for the standalone `migrate` CLI (used by CI's backend-integration-test job,
# backend/scripts/docker-entrypoint.sh, and scripts/test-migrations.sh) — golang-migrate's postgres
# driver sends each migration file's full contents as one query string, which Postgres's simple
# query protocol implicitly wraps in a single transaction (confirmed: a later-statement error
# rolled back an earlier statement's already-"successful" INSERT in the same file).
#
# FALSE for `make migrate-up`/`migrate-down`: those targets bypass golang-migrate entirely and
# pipe each file into `psql -f -` with no `-1`/`--single-transaction` flag, so psql executes each
# statement in its own autocommitted transaction (confirmed empirically: two `SELECT
# txid_current()` statements sent via one `psql -f -` invocation returned two different txids, and
# an INSERT that ran before a later failing statement in the same file was NOT rolled back).
#
# This setting only affects Squawk's own transaction-aware lint rules (e.g. rules that check
# whether a lock is held for the rest of "the transaction"); it does not change what golang-migrate
# or psql actually do. Not changing the value — `true` is still the more accurate default for the
# migrate-CLI-driven paths CI actually uses — but the value should NOT be assumed to describe
# `make migrate-up`.
assume_in_transaction = true

# Exclude .down.sql files - rollback migrations NEED DROP TABLE statements
# Only lint .up.sql files for safety checks
# Exclude River's third-party generated schema (not our code to modify)
excluded_paths = [
  "*.down.sql",
  "*000030_add_river_queue*.sql",
  "*000047_drop_sync_audit*.sql",  # Intentional schema cleanup — drops dead sync audit table/columns
  "*000145_river_migration_007*.sql",  # Mirrors River's own main-line migration 007; the DROP TABLEs are the point
]

# Rules to exclude from linting
excluded_rules = [
  "require-concurrent-index-creation",  # Small tables initially
  "prefer-text-field",                  # We prefer VARCHAR for intent clarity
  "require-timeout-settings",           # Connection-level timeouts in docker-entrypoint.sh
  "prefer-robust-stmts",                # Legacy migrations lack IF NOT EXISTS
  "prefer-identity",                    # Using gen_random_uuid() and legacy SERIAL/BIGSERIAL
  "prefer-bigint-over-int",             # INT appropriate for non-overflowing fields
  "prefer-bigint-over-smallint",        # SMALLINT appropriate for retry counts, priorities
  "prefer-timestamp-tz",                # Legacy columns use TIMESTAMP
  "constraint-missing-not-valid",       # Legacy migrations lack NOT VALID pattern
  "require-concurrent-index-deletion",  # Acceptable for small tables
  "renaming-column",                    # Intentional schema evolutions
  "changing-column-type",               # Intentional schema evolutions
  # Issue #1569 (000157): flipping rule_execution_history.transaction_id from ON DELETE CASCADE to
  # ON DELETE SET NULL REQUIRES dropping its NOT NULL -- SET NULL cannot fire against a NOT NULL
  # column, so the rule fires on the one statement that makes the audit trail survivable. Squawk has
  # no per-statement ignore comment that this version honours (tried `-- squawk-ignore
  # ban-drop-not-null`; still reported), so the suppression has to live here. The rule's stated risk
  # is "may break existing clients": rule_execution_history has NO Go client at all
  # (`grep -rn "rule_execution_history\\|RuleExecution" backend --include="*.go"` matches only
  # migrations), so there is nothing to break.
  "ban-drop-not-null",
]

# Note: The following critical safety rules remain ENABLED:
# - ban-drop-table: Prevents accidental DROP TABLE in .up.sql (rollbacks excluded via excluded_paths)
# - ban-drop-column: Prevents accidental DROP COLUMN
# - ban-drop-database: Prevents dropping the database
# - adding-not-nullable-field: Warns on NOT NULL without DEFAULT
# - adding-foreign-key-constraint: Warns on FK additions that may lock tables
# - disallowed-unique-constraint: Warns about unique constraints that may lock
