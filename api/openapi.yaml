info:
  contact:
    email: support@boostedbudget.com
    name: BoostedBudget Support
    url: https://boostedbudget.com/support
  description: |
    BoostedBudget API - Global budgeting platform with intelligent automation rules and GDPR compliance.

    ## Authentication

    All protected endpoints require Clerk JWT Bearer token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```

    ## Subscription Tiers

    | Tier | Rules | Accounts | Sync Frequency | Price |
    |------|-------|----------|----------------|-------|
    | free | 1 | 3 | 1x/day | $0 (ad-supported) |
    | premium_lite | 5 | 15 | 2x/day | $4.99/mo |
    | premium | 15 | 30 | 6x/day | $9.99/mo |
    | premium_plus | Unlimited | Unlimited | every 10min | $19.99/mo |

    ## Regions

    Use the GET /api/v1/regions endpoint to discover available data residency regions.
    Multi-region support planned for Phase 7+.
  license:
    name: Proprietary
    url: https://boostedbudget.com/terms
  title: BoostedBudget API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/accounts:
    get:
      description: Retrieves all linked bank accounts for the authenticated user.
      operationId: getAccounts
      parameters:
        - description: If 'true', includes hidden accounts
          explode: false
          in: query
          name: include_hidden
          schema:
            description: If 'true', includes hidden accounts
            type: string
        - description: "Filter by account status: 'active' (default), 'replaced', or 'all'"
          explode: false
          in: query
          name: status
          schema:
            description: "Filter by account status: 'active' (default), 'replaced', or 'all'"
            type: string
        - description: If 'true', equivalent to status=all (backward-compat alias)
          explode: false
          in: query
          name: include_replaced
          schema:
            description: If 'true', equivalent to status=all (backward-compat alias)
            type: string
        - description: When supplied, returns all accounts in the chain (active and replaced) for the given user_account_id. Status filter defaults to 'all' when this param is set.
          explode: false
          in: query
          name: user_account_id
          schema:
            description: When supplied, returns all accounts in the chain (active and replaced) for the given user_account_id. Status filter defaults to 'all' when this param is set.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Get accounts
      tags:
        - Accounts
  /api/v1/accounts/reorder:
