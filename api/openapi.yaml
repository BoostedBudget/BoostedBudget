  /api/v1/admin/plaid/orphaned-items:
    get:
      description: "Returns Plaid Items whose local record was deleted by a completed GDPR erasure before removal could be proved, labelled with the action required: 'manual_intervention_required' (remove the Item in Plaid's dashboard using plaid_item_id, or it may keep billing), 'auto_retrying' (an automated retry holds a live credential — no action), 'operator_attested' (an admin has stated they removed it by hand; this is an UNVERIFIED claim, resolved_at is NOT set, and the automated sweep keeps re-attempting the removal precisely because it may yet disprove the claim), or 'resolved' (Plaid confirmed the removal — history, not work). Never returns the retained access token. Requires admin role."
      operationId: listAdminPlaidOrphanedItems
      parameters:
        - description: Number of records to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Number of records to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Number of records to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of records to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlaidOrphanedItemsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: List orphaned Plaid Items (admin)
      tags:
        - Admin
  /api/v1/admin/plaid/orphaned-items/{id}/operator-resolution:
    post:
      description: "Records that YOU removed this Plaid Item yourself in Plaid's dashboard. This is an UNVERIFIED attestation, not a proved removal: it is stored against your admin identity with your note, moves the record to admin_state 'operator_attested' so nobody is asked to redo the work, and deliberately does NOT set resolved_at (which means Plaid itself confirmed the removal), does NOT destroy the retained access token, and does NOT stop the automated retry sweep — the sweep is what can eventually confirm your claim. First-wins: if the record is already attested this returns 409 and your note is not stored. Requires admin role."
      operationId: recordAdminPlaidOrphanedItemOperatorResolution
      parameters:
        - description: plaid_orphaned_items.id of the record being attested
          in: path
          name: id
          required: true
          schema:
            description: plaid_orphaned_items.id of the record being attested
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPlaidOrphanedItemOperatorResolutionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPlaidOrphanedItemOperatorResolutionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Attest that an orphaned Plaid Item was removed by hand (admin)
      tags:
        - Admin
  /api/v1/admin/retention/withheld:
    get:
      description: "Returns inactive or cancelled accounts whose data-retention window has expired but which the pre-deletion-notice gate is refusing to hard-delete, because at least one of the 30-day and 7-day notices promised by the privacy policy was never recorded. What is blocked is the retention sweep, and only it: the notice queries select only users whose retention clock has not yet run out, so no existing path can send the missing notice and the retention sweep will hold these accounts indefinitely. A user-requested GDPR erasure is a separate authorisation and still deletes them normally; requesting deletion also removes the account from this listing. This is a read-only view — it sends nothing, extends no retention clock and waives no notice; choosing between those remedies is an open decision and will land as its own endpoint. has_email_on_file is reported per account because it is the one withholding reason the retention_deletions_withheld metric cannot separate. No email address is returned. withheld_total and the returned page come from two separate queries and are eventually consistent: a notice marker, a deletion request or a retention clock crossing the current instant between them can make the total disagree with the page by any number of rows — the gap is not bounded. as_of is when the response was calculated, after both queries returned. Keyset-paginated: pass next_cursor's two fields back as cursor_expires_at and cursor_user_id; next_cursor is absent on the final page. Requires admin role."
      operationId: listAdminRetentionWithheld
      parameters:
        - description: Number of accounts to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Number of accounts to return
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: "Keyset cursor: retention_expires_at of the last account on the previous page (RFC3339). Must be sent together with cursor_user_id."
          explode: false
          in: query
          name: cursor_expires_at
          schema:
            description: "Keyset cursor: retention_expires_at of the last account on the previous page (RFC3339). Must be sent together with cursor_user_id."
            type: string
        - description: "Keyset cursor: user_id of the last account on the previous page. Must be sent together with cursor_expires_at."
          explode: false
          in: query
          name: cursor_user_id
          schema:
            description: "Keyset cursor: user_id of the last account on the previous page. Must be sent together with cursor_expires_at."
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminRetentionWithheldOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: List accounts withheld from retention deletion (admin)
      tags:
        - Admin
