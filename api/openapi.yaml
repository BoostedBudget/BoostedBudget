          items:
            $ref: "#/components/schemas/AccountBalanceDetail"
          type:
            - array
            - "null"
        balance:
          format: double
          type: number
      required:
        - balance
        - account_count
        - accounts
      type: object
    AccountTypeInfo:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        key:
          type: string
        label:
          type: string
        total_balance:
          format: double
          type: number
      required:
        - key
        - label
        - count
        - total_balance
      type: object
    AccountTypesResponse:
      additionalProperties: false
