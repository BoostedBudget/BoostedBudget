  /webhooks/paddle:
    post:
      description: Public endpoint for Paddle to send subscription and payment event notifications. Verifies HMAC-SHA256 signature, stores in database, and enqueues async processing job.
      operationId: paddle-webhook
      parameters:
        - description: HMAC-SHA256 signature from Paddle for verification
          in: header
          name: Paddle-Signature
          schema:
            description: HMAC-SHA256 signature from Paddle for verification
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaddleWebhookResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Receive Paddle webhook notifications
      tags:
        - Webhooks
        - Paddle
  /webhooks/plaid:
    post:
