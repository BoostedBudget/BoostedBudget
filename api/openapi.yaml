  /api/v1/admin/budget-hierarchy-audits:
    get:
      description: "Returns budgets the Issue #1630 Task B7 audit has examined. domain.DuplicateParentIdentity and domain.EscapedNestedChild are write-time guards that refuse a new budget category colliding on parent identity or escaping a nested parent's containment envelope; neither is ever run against a row that predates it. The periodic BudgetHierarchyAuditWorker examines every budget once, corrects any stale spent_amount (safe: a derived cache), and NEVER rewrites match_logic or identity fields for a flagged pair — there is no correct automatic answer for either, and guessing would silently change what the user's budget matches while destroying the evidence needed to ask them. Omitting outcome defaults to the two reported_* (actionable) outcomes; pass outcome=all for every verdict including repaired/verified. This is a read-only view: it repairs nothing and does not resolve the identity/match_logic ambiguity a reported_* row names — that requires asking the user what they meant. Requires admin role."
      operationId: listAdminBudgetHierarchyAudits
      parameters:
        - description: Filter to one outcome (repaired, verified, reported_duplicate_identity, reported_escaping_pair), or 'all' for every outcome. Omitted defaults to the two reported_* (actionable) outcomes.
          explode: false
          in: query
          name: outcome
          schema:
            description: Filter to one outcome (repaired, verified, reported_duplicate_identity, reported_escaping_pair), or 'all' for every outcome. Omitted defaults to the two reported_* (actionable) outcomes.
            type: string
        - description: Number of findings to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Number of findings to return
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
