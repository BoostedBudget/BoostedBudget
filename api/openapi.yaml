        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/AccountTypesResponse.json
          format: uri
          readOnly: true
          type: string
        types:
          items:
            $ref: "#/components/schemas/AccountTypeInfo"
          type:
            - array
            - "null"
      required:
        - types
      type: object
    ActivityItem:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/Account"
        account_id:
          type: string
        activity_type:
          type: string
        amount:
          format: double
          type: number
        authorized_date:
          description: UTC calendar day (YYYY-MM-DD) the transaction was authorized; omitted for investment rows and when the provider gave none
          format: date
          type: string
        category_override_kind:
          type: string
        currency_code:
          description: Currency of amount, investment_price and investment_fees on an investment row (ISO-4217, or a Plaid unofficial code for crypto). Omitted for banking rows and for investment rows ingested before the currency was recorded — absence means 'not stated', never 'USD'.
          type: string
        custom_category_override_display:
          type: string
        custom_category_override_id:
          type: string
        data_source:
          type: string
        date:
          description: UTC calendar day (YYYY-MM-DD) of this item
          format: date
          type: string
        effective_category_name:
          type: string
        effective_merchant_name:
          type: string
        effective_pfc_detailed:
          type: string
        effective_pfc_primary:
          type: string
        external_transaction_id:
          type: string
        id:
          type: string
        investment_fees:
          format: double
          type: number
        investment_price:
          format: double
          type: number
        investment_quantity:
          format: double
          type: number
        investment_subtype:
          type: string
        linked_item_id:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
        name:
          type: string
        payment_channel:
          type: string
        pending:
          type: boolean
        pfc_category_icon_url:
          type: string
        pfc_confidence_level:
          type: string
        pfc_detailed:
          type: string
        pfc_detailed_display:
          type: string
        pfc_detailed_override:
          type: string
        pfc_detailed_override_display:
          type: string
        pfc_primary:
          type: string
        pfc_primary_display:
          type: string
        pfc_primary_override:
          type: string
        pfc_primary_override_display:
          type: string
        reversed:
          type: boolean
        reversed_at:
          format: date-time
          type: string
        reviewed:
          type: boolean
        reviewed_at:
          format: date-time
          type: string
        security_id:
          type: string
        security_name:
          type: string
        sort_date:
          description: UTC calendar day (YYYY-MM-DD) this item sorts on
          format: date
          type: string
        source:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        ticker_symbol:
          type: string
        user_account_id:
          type: string
        user_id:
          type: string
        user_notes:
          type: string
      required:
        - source
        - sort_date
        - id
        - user_id
        - account_id
        - date
        - amount
        - name
      type: object
