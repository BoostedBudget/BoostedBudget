openapi: 3.1.0
info:
  title: BoostedBudget API
  version: 0.1.0
  description: Global budgeting platform with intelligent automation
  contact:
    email: api@boostedbudget.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.boostedbudget.com/v1
    description: Production (USA - us-east-1)

security:
  - auth0: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []  # Public endpoint - no auth required
      tags: [System]
      summary: Health check endpoint
      description: Returns the health status of the API and its dependencies
      responses:
        '200':
          description: Service is healthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/user/profile:
    get:
      operationId: getUserProfile
      tags: [User]
      summary: Get user profile
      description: Retrieves the authenticated user's profile information
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/user/privacy:
    get:
      operationId: getPrivacySettings
      tags: [User]
      summary: Get user privacy settings (GDPR)
      description: Retrieves the user's privacy and consent settings
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      operationId: updatePrivacySettings
      tags: [User]
      summary: Update privacy settings
      description: Updates the user's privacy and consent settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettingsUpdate'
      responses:
        '200':
          description: Privacy settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/user/data-export:
    post:
      operationId: requestDataExport
      tags: [User]
      summary: Request GDPR data export
      description: Initiates a data export request for GDPR compliance
      responses:
        '202':
          description: Export request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data export initiated
                  export_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/user/delete:
    delete:
      operationId: deleteUserAccount
      tags: [User]
      summary: Delete user account (GDPR right to deletion)
      description: Schedules user account for deletion (30-day grace period)
      responses:
        '204':
          description: Account deletion scheduled
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    auth0:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://boostedbudget.auth0.com/authorize
          scopes:
            openid: OpenID
            profile: User profile
            email: User email

  schemas:
    HealthResponse:
      type: object
      required: [status, version, timestamp, checks]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall system health status
        version:
          type: string
          example: "0.1.0"
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean

    UserProfile:
      type: object
      required: [id, email, created_at, primary_region]
      properties:
        id:
          type: string
          format: uuid
        auth0_id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        primary_region:
          type: string
          enum: [us-east-1]  # Future: eu-west-1, ap-southeast-1 (Phase 7+)
          default: us-east-1
          description: Data residency region
        subscription:
          $ref: '#/components/schemas/Subscription'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        tier:
          type: string
          enum: [free, premium, premium_plus]
          default: free
        expires_at:
          type: string
          format: date-time

    PrivacySettings:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        primary_region:
          type: string
          enum: [us-east-1]
          default: us-east-1
          readOnly: true  # Not user-editable in MVP
        analytics_consent:
          type: boolean
          default: false
        marketing_consent:
          type: boolean
          default: false
        data_sharing_consent:
          type: boolean
          default: false
        ad_personalization_consent:
          type: boolean
          default: false
        consent_updated_at:
          type: string
          format: date-time

    PrivacySettingsUpdate:
      type: object
      properties:
        analytics_consent:
          type: boolean
        marketing_consent:
          type: boolean
        data_sharing_consent:
          type: boolean
        ad_personalization_consent:
          type: boolean

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    Unauthorized:
      description: Unauthorized - invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Invalid or missing authentication token

    BadRequest:
      description: Bad Request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: Invalid request parameters
