  /api/v1/transactions:
    get:
      description: Retrieves transactions for the authenticated user with optional filters and pagination.
      operationId: getTransactions
      parameters:
        - description: Number of items to return (1-100)
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Number of items to return (1-100)
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of items to skip for pagination
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip for pagination
            format: int64
            minimum: 0
            type: integer
        - description: "Filter by specific account ID (deprecated: use account_ids)"
          explode: false
          in: query
          name: account_id
          schema:
            description: "Filter by specific account ID (deprecated: use account_ids)"
            type: string
        - description: Filter by multiple account IDs (comma-separated UUIDs)
          explode: false
          in: query
          name: account_ids
          schema:
            description: Filter by multiple account IDs (comma-separated UUIDs)
            type: string
        - description: Filter transactions on or after this date (YYYY-MM-DD)
          explode: false
          in: query
          name: start_date
          schema:
            description: Filter transactions on or after this date (YYYY-MM-DD)
            type: string
        - description: Filter transactions on or before this date (YYYY-MM-DD)
          explode: false
          in: query
          name: end_date
          schema:
            description: Filter transactions on or before this date (YYYY-MM-DD)
            type: string
        - description: "Filter by category (deprecated: use categories)"
          explode: false
          in: query
          name: category
          schema:
            description: "Filter by category (deprecated: use categories)"
            type: string
        - description: Filter by multiple categories (comma-separated)
          explode: false
          in: query
          name: categories
          schema:
            description: Filter by multiple categories (comma-separated)
            type: string
        - description: Search in merchant name or transaction name
          explode: false
          in: query
          name: search
          schema:
            description: Search in merchant name or transaction name
            type: string
        - description: Filter by pending status (true/false)
          explode: false
          in: query
          name: pending
          schema:
            description: Filter by pending status (true/false)
            type: string
        - description: Filter by minimum absolute amount
          explode: false
          in: query
          name: min_amount
          schema:
            description: Filter by minimum absolute amount
            type: string
        - description: Filter by maximum absolute amount
          explode: false
          in: query
          name: max_amount
          schema:
            description: Filter by maximum absolute amount
            type: string
        - description: Filter by transaction type
          explode: false
          in: query
          name: amount_type
          schema:
            description: Filter by transaction type
            enum:
              - income
              - expense
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - auth0: []
      summary: List transactions
      tags:
        - Transactions
  /api/v1/transactions/{id}:
    get:
      description: Retrieves a specific transaction by its UUID.
      operationId: getTransactionByID
      parameters:
        - description: Transaction UUID
          in: path
          name: id
          required: true
          schema:
            description: Transaction UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
