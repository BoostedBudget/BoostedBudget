            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Delete account
      tags:
        - Accounts
    patch:
      description: Updates account customization fields.
      operationId: updateAccount
      parameters:
        - description: Account ID
          in: path
          name: id
          required: true
          schema:
            description: Account ID
            type: string
