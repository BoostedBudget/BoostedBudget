          description: Amount of matching transactions filed directly under the targeted category itself, excluding any nested custom category and excluding tag-only-outside-category matches. Zero-valued when there is nothing to disclose.
          format: double
          type: number
        direct_transaction_count:
          description: Count of matching transactions filed directly under the targeted category itself, excluding any nested custom category and excluding tag-only-outside-category matches. Zero-valued when there is nothing to disclose.
          format: int64
          type: integer
        tag_only_amount:
          description: Amount of matching transactions pulled into the total by the tag clause (match_logic or/tag_only) that the category clause did not match at all — not the targeted category itself, and not any nested custom category. Always zero for match_logic category_only or and, since every included row there is required to satisfy the category clause.
          format: double
          type: number
        tag_only_transaction_count:
          description: Count of matching transactions pulled into the total by the tag clause (match_logic or/tag_only) that the category clause did not match at all — not the targeted category itself, and not any nested custom category. Always zero for match_logic category_only or and, since every included row there is required to satisfy the category clause.
          format: int64
          type: integer
        total_amount:
          description: Total matching transaction amount. direct_amount + every children[].total_amount + tag_only_amount always sum to exactly this value when any of them is populated — see those fields to break the total down.
          format: double
          type: number
        transaction_count:
          description: Total matching transaction count. When the targeted category is a pfc_primary or parent custom category, this INCLUDES transactions filed under its nested custom categories — see direct_transaction_count, children, and tag_only_transaction_count to break the total down.
          format: int64
          type: integer
      required:
        - transaction_count
        - total_amount
      type: object
