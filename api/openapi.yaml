  /health:
    get:
      description: Liveness check. Returns 200 with {"status":"ok"} when critical dependencies are healthy, 503 otherwise. Carries no version, timing, or dependency detail.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    description: Liveness indicator. Always "ok" when the response is 200.
                    enum:
                      - ok
                    type: string
                required:
                  - status
                type: object
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    description: Liveness indicator. "unavailable" when a critical dependency is unhealthy.
                    enum:
                      - unavailable
                    type: string
                required:
                  - status
                type: object
          description: Service Unavailable
      summary: Health check
      tags:
        - Health
  /webhooks/paddle:
    post:
      description: Public endpoint for Paddle to send subscription and payment event notifications. Verifies HMAC-SHA256 signature, stores in database, and enqueues async processing job.
      operationId: paddle-webhook
      parameters:
        - description: HMAC-SHA256 signature from Paddle for verification
          in: header
          name: Paddle-Signature
          schema:
            description: HMAC-SHA256 signature from Paddle for verification
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaddleWebhookResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Receive Paddle webhook notifications
      tags:
        - Webhooks
        - Paddle
  /webhooks/plaid:
    post:
      description: Receives and processes webhook notifications from Plaid. Validates JWT signature and stores for async processing.
      operationId: handlePlaidWebhook
      parameters:
        - description: JWT signature from Plaid for verification
          in: header
          name: Plaid-Verification
          schema:
            description: JWT signature from Plaid for verification
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidWebhookResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Handle Plaid webhook
      tags:
        - Webhooks
