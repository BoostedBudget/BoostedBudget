  /api/v1/boost-executions:
    get:
      description: "Retrieves every boost execution for the authenticated user with an optional status filter. Unlike /boosts/{id}/executions this also returns executions whose boost has since been deleted. Every row carries boost_name and definition_snapshot, captured at execution time, so it is readable with or without its parent. Do NOT key \"deleted boost\" off boost_id being null: normal deletion TOMBSTONES the boost, so those executions keep their original non-null boost_id and the boost simply stops appearing in GET /boosts. boost_id is null only when the boost ROW itself was destroyed (the FK is ON DELETE SET NULL), which today means a purge or GDPR erasure. To mark a row as coming from a deleted boost, treat a null boost_id OR a boost_id absent from GET /boosts as deleted."
      operationId: getUserBoostExecutions
      parameters:
        - description: "Filter by status: pending, running, completed, failed"
          explode: false
          in: query
          name: status
          schema:
            description: "Filter by status: pending, running, completed, failed"
            type: string
        - description: Maximum number of results
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of results
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of results to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of results to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostExecutionsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Get account-wide boost execution history
      tags:
        - Boosts
