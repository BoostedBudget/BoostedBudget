          description: Error
      security:
        - clerk: []
      summary: Clear a linked item's error state after a successful reconnect
      tags:
        - Plaid
  /api/v1/plaid/reconnect-link-token:
    post:
      description: Mints a fresh update-mode Plaid Link token for the caller's own linked item, scoped to items in a repairable error state (login_required, error, pending_expiration). A 'revoked' item is deliberately excluded — Plaid documents revoked access as unrecoverable via update mode; see ErrLinkedItemNotRepairable in item_error_service.go. Also returns a single-use repair_nonce that the reconnect endpoint requires; it shares the link token's expiry and must be kept out of URLs and logs.
      operationId: createReconnectLinkToken
      requestBody:
        content:
          application/json:
            schema:
