          description: Error
      security:
        - clerk: []
      summary: Get deleted savings goals
      tags:
        - Savings Goals
  /api/v1/savings-goals/deleted/{goalID}/contributions:
    get:
      description: "Returns the contributions retained under a goal the user has DELETED, newest first, with their confirmed total (Issue #1569). Deleting a goal tombstones it and keeps every contribution STILL logged against it — including amounts the user entered by hand, which no provider can supply again. A contribution the user explicitly deleted earlier via DELETE /savings-goals/{goalID}/contributions/{id} was destroyed then and is not listed here. This is the only endpoint that can read the retained ones back; the live GET /savings-goals/{goalID}/contributions deliberately returns nothing for a deleted goal. Returns an empty list for a goal that is not deleted. Pair it with GET /savings-goals/deleted, and with POST /savings-goals/{id}/purge to destroy them for good."
      operationId: listDeletedSavingsGoalContributions
      parameters:
        - description: ID of a savings goal the user has already deleted
          in: path
          name: goalID
          required: true
          schema:
            description: ID of a savings goal the user has already deleted
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedGoalContributionsBody"
          description: OK
        default:
