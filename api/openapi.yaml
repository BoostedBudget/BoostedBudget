          description: Breaks the rolled-up transaction_count/total_amount down by each nested custom category that actually matched. Empty/nil when the targeted category cannot roll up (a leaf category), or no nested child matched anything.
          items:
            $ref: "#/components/schemas/CategoryPreviewBreakdownItem"
