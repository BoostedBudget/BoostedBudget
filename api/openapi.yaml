            - https://api.boostedbudget.com/schemas/BalanceHistoryResponse.json
          format: uri
          readOnly: true
          type: string
        end_date:
          description: UTC calendar day (YYYY-MM-DD) this history response ends on
          format: date
          type: string
        granularity:
          type: string
        snapshots:
          items:
            $ref: "#/components/schemas/BalanceHistorySnapshot"
          type:
            - array
            - "null"
        start_date:
          description: UTC calendar day (YYYY-MM-DD) this history response starts on
          format: date
          type: string
      required:
        - start_date
        - end_date
        - granularity
        - snapshots
      type: object
    BalanceHistorySnapshot:
      additionalProperties: false
      properties:
        balance:
          format: double
          type: number
        by_type:
          additionalProperties:
            format: double
            type: number
          type: object
        date:
          description: UTC calendar day (YYYY-MM-DD) of this snapshot
          format: date
          type: string
      required:
        - date
        - balance
      type: object
    BalanceSummaryResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/BalanceSummaryResponse.json
          format: uri
          readOnly: true
          type: string
        as_of_date:
          description: UTC calendar day (YYYY-MM-DD) this balance summary is as of
          format: date
          type: string
        by_type:
          additionalProperties:
            $ref: "#/components/schemas/AccountTypeBalance"
          description: Account type totals and individual balances use the same signed contributions as total_balance
          type: object
        period_comparison:
          $ref: "#/components/schemas/PeriodComparisonData"
          description: Comparison with the signed balance 30 days earlier; change_amount is current minus previous, and change_percent divides by the absolute previous balance (zero when previous is zero)
        total_balance:
          description: "Signed sum of snapshot balances: raw credit and loan balances are negated (negative raw debt is an overpayment); other account types retain their raw sign"
          format: double
          type: number
      required:
        - as_of_date
        - total_balance
        - by_type
      type: object
    Boost:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
