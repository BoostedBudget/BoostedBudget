  /api/v1/rule-executions:
    get:
      description: "Retrieves categorization-rule executions for the authenticated user, newest first. A row exists for each time a rule actually CHANGED a transaction's category or tags; a rule that matched but changed nothing is counted in the rule's match_count and is not recorded here. Executions whose rule has since been deleted are still returned, carrying rule_id = null plus rule_name and definition_snapshot captured at execution time. One class is withheld: an execution against a pending transaction the provider removed when it settled, whose posted twin carries its own execution — showing both would report one charge as two automation runs. Executions against a transaction the provider reversed AFTER it posted ARE returned, because that transaction has no twin and is itself still surfacable."
      operationId: getUserRuleExecutions
      parameters:
        - description: Maximum number of results
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of results
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of results to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of results to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleExecutionsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Get automation rule execution history
      tags:
        - Auto-Categorization
