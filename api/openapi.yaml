  /api/v1/transaction-annotation-history:
    get:
      description: |-
        Retrieves the before/after record of every change to a transaction's category, review state or tags for the authenticated user, newest first. A row exists for each write that actually changed a tracked value; re-writing the identical value records nothing. Changes made to a transaction that has since been removed are still returned.

        `change_source` answers *what was asked for*, and has five values. Two are the user acting on their own transaction: 'category' — a recategorisation, which ALSO rewrites `reviewed`/`reviewed_at` as a side effect, so a review timestamp can be lost by a write the user thought was only about the category; and 'review' — a review-state write, single or bulk, which leaves the category alone. 'tags' is a whole-array tag replace: every tag dropped is gone the moment it returns and the previous set survives nowhere else, so `prior_tags` here is the only record of it; category fields are unchanged on these rows by construction.

        The remaining two record changes the user did NOT ask for, which is exactly why they are not filed under 'category'. 'settlement' is written when a pending charge posts and the sync carries the manual category from the pending row onto the posted twin, replacing whatever the twin had — it explains why the twin no longer agrees with the rule_execution_history entry for the rule that categorised it moments earlier. 'erasure' is the one source whose cause is another user: when a different user exercises GDPR erasure their custom categories are hard-deleted, and a surviving user's transaction pointing at one has its override cleared. That row is the ONLY explanation anywhere for a category changing under a user who did nothing — no other record of it exists, and none is written for the erased user's own transactions, which are deleted in the same database transaction.
      operationId: getUserTransactionAnnotationHistory
      parameters:
        - description: Maximum number of results
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of results
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of results to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of results to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAnnotationHistoryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Get transaction annotation change history
      tags:
        - Transactions
  /api/v1/transactions:
    get:
      description: Retrieves transactions for the authenticated user with optional filters and pagination.
      operationId: getTransactions
      parameters:
        - description: Opaque cursor from previous page's next_cursor; omit for first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from previous page's next_cursor; omit for first page
            type: string
        - description: Number of transactions to return (1-100)
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Number of transactions to return (1-100)
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: "Filter by specific account ID (deprecated: use account_ids)"
          explode: false
          in: query
          name: account_id
          schema:
            description: "Filter by specific account ID (deprecated: use account_ids)"
            type: string
        - description: Filter by multiple account IDs (comma-separated UUIDs)
          explode: false
          in: query
          name: account_ids
          schema:
            description: Filter by multiple account IDs (comma-separated UUIDs)
            type: string
        - description: Filter transactions on or after this date (YYYY-MM-DD)
          explode: false
          in: query
          name: start_date
          schema:
            description: Filter transactions on or after this date (YYYY-MM-DD)
            type: string
        - description: Filter transactions on or before this date (YYYY-MM-DD)
          explode: false
          in: query
          name: end_date
          schema:
            description: Filter transactions on or before this date (YYYY-MM-DD)
            type: string
        - description: "Filter by effective PFC primary enum(s) (comma-separated, e.g. FOOD_AND_DRINK,TRAVEL). OR-joined with pfc_detaileds, custom_category_ids and uncategorized: a transaction matches if ANY of them matches."
          explode: false
          in: query
          name: pfc_primaries
          schema:
            description: "Filter by effective PFC primary enum(s) (comma-separated, e.g. FOOD_AND_DRINK,TRAVEL). OR-joined with pfc_detaileds, custom_category_ids and uncategorized: a transaction matches if ANY of them matches."
            type: string
        - description: Filter by effective PFC detailed sub-category enum(s) (comma-separated, e.g. FOOD_AND_DRINK_FAST_FOOD,FOOD_AND_DRINK_COFFEE). OR-joined with pfc_primaries, custom_category_ids and uncategorized.
          explode: false
          in: query
          name: pfc_detaileds
          schema:
            description: Filter by effective PFC detailed sub-category enum(s) (comma-separated, e.g. FOOD_AND_DRINK_FAST_FOOD,FOOD_AND_DRINK_COFFEE). OR-joined with pfc_primaries, custom_category_ids and uncategorized.
            type: string
        - description: Filter by custom category UUIDs (comma-separated). Each id also matches its child categories. OR-joined with pfc_primaries, pfc_detaileds and uncategorized — combining them returns the union, not the (always empty) intersection.
          explode: false
          in: query
          name: custom_category_ids
          schema:
            description: Filter by custom category UUIDs (comma-separated). Each id also matches its child categories. OR-joined with pfc_primaries, pfc_detaileds and uncategorized — combining them returns the union, not the (always empty) intersection.
            type: string
        - description: "When true, also match transactions with NO category at all — the rows analytics reports as 'Uncategorized'. OR-joined with pfc_primaries, pfc_detaileds and custom_category_ids. Omitted or false adds no filter; it never means 'exclude uncategorized'. Issue #1626."
          explode: false
          in: query
          name: uncategorized
          schema:
            description: "When true, also match transactions with NO category at all — the rows analytics reports as 'Uncategorized'. OR-joined with pfc_primaries, pfc_detaileds and custom_category_ids. Omitted or false adds no filter; it never means 'exclude uncategorized'. Issue #1626."
            type: string
        - description: Search in merchant name or transaction name
          explode: false
          in: query
          name: search
          schema:
            description: Search in merchant name or transaction name
            type: string
        - description: Filter by pending status (true/false)
          explode: false
          in: query
          name: pending
          schema:
            description: Filter by pending status (true/false)
            type: string
        - description: "Filter by review state: true (reviewed), false (unreviewed inbox), omit for both"
          explode: false
          in: query
          name: reviewed
          schema:
            description: "Filter by review state: true (reviewed), false (unreviewed inbox), omit for both"
            type: string
        - description: "Include transactions the bank REVERSED after they posted (default false). Reversed rows are returned with reversed=true and reversed_at set, and MUST be rendered distinctly — an unlabelled reversal reads as a live transaction. Transactions removed while still pending are never returned, by any value of this flag: their posted twin is already in the feed. Issue #1569."
          explode: false
          in: query
          name: include_reversed
          schema:
            description: "Include transactions the bank REVERSED after they posted (default false). Reversed rows are returned with reversed=true and reversed_at set, and MUST be rendered distinctly — an unlabelled reversal reads as a live transaction. Transactions removed while still pending are never returned, by any value of this flag: their posted twin is already in the feed. Issue #1569."
            type: string
        - description: "Filter by category origin (comma-separated): plaid, rule, manual"
          explode: false
          in: query
          name: category_source
          schema:
            description: "Filter by category origin (comma-separated): plaid, rule, manual"
