info:
  contact:
    email: support@boostedbudget.com
    name: BoostedBudget Support
    url: https://boostedbudget.com/support
  description: |
    BoostedBudget API - Global budgeting platform with user-defined automation rules and GDPR compliance.

    ## Authentication

    All protected endpoints require Clerk JWT Bearer token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```

    ## Subscription Tiers

    No free tier. New users get a 60-day Premium trial.

    | Tier        | Users | Transaction History | Price     |
    |-------------|-------|---------------------|-----------|
    | premium     | 1     | 730 days            | $8.99/mo  |
    | household_2 | 2     | 730 days            | $12.99/mo |
    | household_3 | 3     | 730 days            | $14.99/mo |
    | household_4 | 4     | 730 days            | $16.99/mo |
    | household_5 | 5+    | 730 days            | $18.99/mo |

    ## Regions

    Use the GET /api/v1/regions endpoint to discover available data residency regions.
    Multi-region support planned for Phase 7+.
  license:
    name: Proprietary
    url: https://boostedbudget.com/terms
  title: BoostedBudget API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/accounts:
    get:
      description: Retrieves all linked bank accounts for the authenticated user.
      operationId: getAccounts
      parameters:
        - description: If 'true', includes hidden accounts
          explode: false
          in: query
          name: include_hidden
          schema:
            description: If 'true', includes hidden accounts
            type: string
        - description: "Filter by account status: 'active' (default), 'replaced', 'all' (active+replaced — a misnomer inherited from history, see AccountFilterOptions.StatusFilter), or 'all_statuses' (every status: active, replaced, expired, removed — for surfaces like the closed-accounts view that need the full universe)"
          explode: false
          in: query
          name: status
          schema:
            description: "Filter by account status: 'active' (default), 'replaced', 'all' (active+replaced — a misnomer inherited from history, see AccountFilterOptions.StatusFilter), or 'all_statuses' (every status: active, replaced, expired, removed — for surfaces like the closed-accounts view that need the full universe)"
            type: string
        - description: If 'true', equivalent to status=all (backward-compat alias)
          explode: false
          in: query
          name: include_replaced
          schema:
            description: If 'true', equivalent to status=all (backward-compat alias)
            type: string
        - description: When supplied, returns all accounts in the chain (active and replaced) for the given user_account_id. Status filter defaults to 'all' when this param is set.
          explode: false
          in: query
          name: user_account_id
          schema:
            description: When supplied, returns all accounts in the chain (active and replaced) for the given user_account_id. Status filter defaults to 'all' when this param is set.
            type: string
        - description: Get accounts as of a specific date (YYYY-MM-DD) — which accounts were live that day. Cannot be combined with status=all, status=replaced, or include_replaced=true.
          explode: false
          in: query
          name: as_of_date
          schema:
            description: Get accounts as of a specific date (YYYY-MM-DD) — which accounts were live that day. Cannot be combined with status=all, status=replaced, or include_replaced=true.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Get accounts
      tags:
        - Accounts
  /api/v1/accounts/reorder:
    patch:
      description: Bulk updates display_order for multiple accounts.
      operationId: reorderAccounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAccountsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderAccountsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Reorder accounts
      tags:
        - Accounts
  /api/v1/accounts/{id}:
    delete:
      description: Permanently destroys a single account and everything derived from it — balance history, holdings, liabilities, AND investment transactions (buys, sells, dividends) for an investment account — with ownership validation. This cannot be undone. Bank transactions (from a checking/savings/credit account) are NOT destroyed; investment transactions ARE, since they have no independent existence apart from the account. Refuses if a savings goal still references this account, and refuses unless the account was already disconnected (POST .../disconnect first) — a live account cannot be purged, since the next Plaid sync would recreate it.
      operationId: purgeAccount
      parameters:
        - description: Account ID
          in: path
          name: id
          required: true
          schema:
            description: Account ID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Purge account
      tags:
        - Accounts
    patch:
      description: Updates account customization fields.
      operationId: updateAccount
      parameters:
        - description: Account ID
          in: path
          name: id
          required: true
          schema:
            description: Account ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccountOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Update account
      tags:
        - Accounts
  /api/v1/accounts/{id}/balance-history:
    get:
      description: "Returns one account's retained day-by-day balances, oldest day first, with the UTC day each balance was true on (Issue #1569). Removing a linked bank account or disconnecting a bank connection retains its balance history rather than erasing it, and this is the only endpoint that reads it back per account: getBalanceHistory answers an aggregated CURRENT-STATE question, takes account_types rather than an account id, and deliberately excludes closed accounts. An account with nothing retained returns an empty series rather than 404. ⚠ These are HISTORICAL figures. Each is inseparable from its date and none of them is what the account holds now — a closed account has no current balance at all."
      operationId: getAccountBalanceHistory
      parameters:
        - description: Account whose retained balance history to read.
          in: path
          name: id
          required: true
          schema:
            description: Account whose retained balance history to read.
            type: string
        - description: Inclusive UTC calendar day (YYYY-MM-DD) to read from. Omit for the earliest day retained.
          explode: false
          in: query
          name: start_date
          schema:
            description: Inclusive UTC calendar day (YYYY-MM-DD) to read from. Omit for the earliest day retained.
            type: string
        - description: Inclusive UTC calendar day (YYYY-MM-DD) to read to. Omit for the most recent day retained.
          explode: false
          in: query
          name: end_date
          schema:
            description: Inclusive UTC calendar day (YYYY-MM-DD) to read to. Omit for the most recent day retained.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceHistory"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - clerk: []
      summary: Get an account's retained balance history
      tags:
        - Accounts
  /api/v1/accounts/{id}/disconnect:
    post:
      description: Stops a single account from syncing and retains its financial history. Does not destroy any data — use DELETE to permanently purge an account and its history.
      operationId: disconnectAccount
      parameters:
        - description: Account ID
          in: path
          name: id
          required: true
          schema:
            description: Account ID
            type: string
