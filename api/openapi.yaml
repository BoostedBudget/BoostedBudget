          schema:
            description: Filter by security ID
            type: string
        - description: "Filter by normalized trade type (comma-separated: buy,sell,dividend,reinvest,interest,fee,transfer,cash,other)"
          explode: false
          in: query
          name: activity_types
          schema:
            description: "Filter by normalized trade type (comma-separated: buy,sell,dividend,reinvest,interest,fee,transfer,cash,other)"
            type: string
        - description: Filter transactions on or after this date (YYYY-MM-DD)
