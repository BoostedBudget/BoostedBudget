    RuleCondition:
      additionalProperties: false
      properties:
        field:
          description: Transaction attribute to match. Not every operator is legal for every field — GET /api/v1/auto-categorization/condition-schema returns the full matrix, value shapes and semantics. Note 'amount' discards the sign; 'signed_amount' is POSITIVE for money leaving the account; 'direction' takes inflow|outflow.
          enum:
            - merchant
            - effective_merchant
            - name
            - merchant_id
            - amount
            - signed_amount
            - direction
            - account_id
            - account_type
            - payment_channel
            - date
            - pfc_primary
            - pfc_detailed
          type: string
        operator:
          description: Comparison to apply. Legal operators depend on the field — see GET /api/v1/auto-categorization/condition-schema. 'between' takes an object ({min,max} for numbers, {start,end} for dates); 'in' takes an array, or a single string as a one-element shorthand.
          enum:
            - eq
            - neq
            - gt
            - gte
            - lt
            - lte
            - between
            - contains
            - starts_with
            - ends_with
            - in
          type: string
        type:
          description: Legacy fused condition name. Send this OR field+operator, not a contradicting pair. 'expression' is RESPONSE-ONLY — the server emits it for a field+operator combination that has no legacy name, and rejects it as input; send field+operator instead.
          enum:
            - merchant_contains
            - merchant_equals
            - merchant_starts_with
            - merchant_ends_with
            - amount_greater_than
            - amount_less_than
            - amount_equals
            - amount_range
            - account_id
            - account_type
            - payment_channel
            - date_range
            - existing_pfc_primary
            - existing_pfc_detailed
            - expression
          type: string
        value: {}
        value_display:
          type: string
      required:
        - value
      type: object
