components:
  schemas:
    AcceptInviteRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/AcceptInviteRequestBody.json
          format: uri
          readOnly: true
          type: string
        consent:
          description: Explicit consent to share accounts with the household
          type: boolean
        hidden_account_ids:
          description: user_account IDs (must be the caller's own) to keep private instead of sharing
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - consent
      type: object
    AcceptInviteResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/AcceptInviteResponseBody.json
          format: uri
          readOnly: true
          type: string
        household_id:
          type: string
        member:
          $ref: "#/components/schemas/HouseholdMember"
      required:
        - household_id
        - member
      type: object
    AcceptTransferSuggestionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/AcceptTransferSuggestionInputBody.json
          format: uri
          readOnly: true
          type: string
        notes:
          description: Optional notes for accepting the suggestion
          type: string
      type: object
    AcceptTransferSuggestionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/AcceptTransferSuggestionOutputBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
        suggestion:
          $ref: "#/components/schemas/TransferSuggestion"
      required:
        - message
      type: object
    Account:
      additionalProperties: false
      properties:
        available_balance:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        currency_code:
          type: string
        current_balance:
          format: double
          type: number
        custom_color:
          type: string
        custom_emoji:
          type: string
        custom_icon:
          type: string
        display_order:
          format: int64
          type: integer
        exclude_investment_sync:
          type: boolean
        expired_at:
          format: date-time
          type: string
        id:
          type: string
        institution_name:
          type: string
        is_hidden:
          type: boolean
        last_known_balance:
          format: double
          type: number
        last_known_balance_at:
          format: date-time
          type: string
        linked_item_id:
          type: string
        linked_item_status:
          type: string
        mask:
          type: string
        name:
          type: string
        nickname:
          type: string
        official_name:
          type: string
        plaid_account_id:
          type: string
        removed_at:
          format: date-time
          type: string
        replaced_at:
          format: date-time
          type: string
        replaced_by_id:
          type: string
        status:
          enum:
            - active
            - replaced
            - expired
            - removed
          type: string
        subtype:
          type: string
        type:
          type: string
        updated_at:
          format: date-time
          type: string
        user_account_id:
          type: string
        user_id:
          type: string
      required:
        - id
        - linked_item_id
        - user_id
        - plaid_account_id
        - name
        - type
        - currency_code
        - status
        - is_hidden
        - exclude_investment_sync
        - created_at
        - updated_at
      type: object
    AccountBalanceDetail:
      additionalProperties: false
      properties:
        balance:
          format: double
          type: number
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - balance
      type: object
    AccountBalanceHistory:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.boostedbudget.com/schemas/AccountBalanceHistory.json
          format: uri
          readOnly: true
          type: string
        account_id:
          type: string
        first_date:
          format: date
          type: string
        last_date:
          format: date
          type: string
        points:
          items:
            $ref: "#/components/schemas/AccountBalanceHistoryPoint"
          type: array
      required:
        - account_id
        - points
      type: object
    AccountBalanceHistoryPoint:
      additionalProperties: false
      properties:
        available_balance:
          format: double
          type: number
        currency_code:
          type: string
        current_balance:
          format: double
          type: number
        date:
          format: date
          type: string
      required:
        - date
        - currency_code
      type: object
    AccountGainLoss:
      additionalProperties: false
      properties:
        account_id:
          type: string
        cost_basis:
          format: double
          type: number
        unrealized_gain_loss:
          format: double
          type: number
        unrealized_gain_loss_pct:
          format: double
          type: number
        value:
          format: double
          type: number
      required:
        - account_id
        - unrealized_gain_loss
        - cost_basis
        - value
      type: object
    AccountOrder:
