user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # HTTP server - redirect to HTTPS (except health checks)
    server {
        listen 80;
        server_name localhost yingyues-mac-mini.tailce219d.ts.net;

        # Allow health checks over HTTP
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        # HTTPS_PORT_PLACEHOLDER will be replaced by docker-entrypoint.sh at runtime
        # Staging: 3443, Production: 443
        location / {
            return 301 https://$host:HTTPS_PORT_PLACEHOLDER$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost yingyues-mac-mini.tailce219d.ts.net;
        root /usr/share/nginx/html;
        index index.html;

        # SSL Configuration (certs provided by CI/CD from GitHub secrets)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: report-only initially to monitor violations before enforcing.
        # CSP_REPORT_URI_PLACEHOLDER is substituted at container startup by docker-entrypoint.sh
        # using SENTRY_CSP_REPORT_URI env var (empty = no reporting endpoint).
        # To enforce: change Content-Security-Policy-Report-Only → Content-Security-Policy.
        # style-src 'unsafe-inline' required: Clerk and Paddle SDKs inject inline styles.
        # NOTE: When updating this header, also update the identical copy in the static assets
        # location block below — nginx add_header does not inherit from parent blocks.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' cdn.paddle.com sandbox-cdn.paddle.com cdn.plaid.com challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: img.clerk.com; font-src 'self'; connect-src 'self' *.clerk.accounts.dev *.clerk.com *.plaid.com *.paddle.com *.ingest.sentry.io *.sentry.io; frame-src *.plaid.com checkout.paddle.com sandbox-checkout.paddle.com *.accounts.dev challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri CSP_REPORT_URI_PLACEHOLDER" always;

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for streaming responses
            proxy_buffering off;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static assets with caching
        # IMPORTANT: nginx add_header does not inherit from parent blocks — all security
        # headers must be repeated here. Keep in sync with the server-level headers above.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' cdn.paddle.com sandbox-cdn.paddle.com cdn.plaid.com challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: img.clerk.com; font-src 'self'; connect-src 'self' *.clerk.accounts.dev *.clerk.com *.plaid.com *.paddle.com *.ingest.sentry.io *.sentry.io; frame-src *.plaid.com checkout.paddle.com sandbox-checkout.paddle.com *.accounts.dev challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri CSP_REPORT_URI_PLACEHOLDER" always;
        }

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Disable access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
