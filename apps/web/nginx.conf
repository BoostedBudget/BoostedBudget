user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # HTTP server - redirect to HTTPS (except health checks)
    server {
        listen 80;
        server_name localhost yingyues-mac-mini.tailce219d.ts.net;

        # Allow health checks over HTTP
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        # HTTPS_PORT_PLACEHOLDER will be replaced by docker-entrypoint.sh at runtime
        # Staging: 3443, Production: 443
        location / {
            return 301 https://$host:HTTPS_PORT_PLACEHOLDER$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost yingyues-mac-mini.tailce219d.ts.net;
        root /usr/share/nginx/html;
        index index.html;

        # SSL Configuration (certs provided by CI/CD from GitHub secrets)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: report-only initially to monitor violations before enforcing.
        # CSP_REPORT_URI_PLACEHOLDER is substituted at container startup by docker-entrypoint.sh
        # using SENTRY_CSP_REPORT_URI env var (empty = no reporting endpoint).
        # To enforce: change Content-Security-Policy-Report-Only → Content-Security-Policy.
        # style-src 'unsafe-inline' required: Clerk and Paddle SDKs inject inline styles.
        # NOTE: When updating this header, also update the identical copy in the static assets
        # location block below — nginx add_header does not inherit from parent blocks.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' cdn.paddle.com sandbox-cdn.paddle.com cdn.plaid.com challenges.cloudflare.com us.i.posthog.com us-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: img.clerk.com; font-src 'self'; connect-src 'self' *.clerk.accounts.dev *.clerk.com *.plaid.com *.paddle.com *.ingest.sentry.io *.sentry.io us.i.posthog.com us.posthog.com; frame-src *.plaid.com checkout.paddle.com sandbox-checkout.paddle.com *.accounts.dev challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri CSP_REPORT_URI_PLACEHOLDER" always;

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for streaming responses
            proxy_buffering off;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static assets with caching
        # IMPORTANT: nginx add_header does not inherit from parent blocks — all security
        # headers must be repeated here. Keep in sync with the server-level headers above.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' cdn.paddle.com sandbox-cdn.paddle.com cdn.plaid.com challenges.cloudflare.com us.i.posthog.com us-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: img.clerk.com; font-src 'self'; connect-src 'self' *.clerk.accounts.dev *.clerk.com *.plaid.com *.paddle.com *.ingest.sentry.io *.sentry.io us.i.posthog.com us.posthog.com; frame-src *.plaid.com checkout.paddle.com sandbox-checkout.paddle.com *.accounts.dev challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri CSP_REPORT_URI_PLACEHOLDER" always;
        }

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Defense in depth: never SERVE a secret, even if one is accidentally built ────
        #
        # These rules assume the build is already correct and exist for when it is not.
        # .dockerignore keeps credential files out of the image; this is the layer that holds
        # if that ever fails, and it is the only one that does not depend on remembering a
        # pattern at build time.
        #
        # ⚠ Cloudflare's WAF is NOT this layer. Live probes on this host (2026-09-08) came from
        # a single IP rotating GPTBot / ClaudeBot / OAI-SearchBot / ChatGPT-User user agents —
        # spoofed, since real crawlers neither rotate identity per request nor fetch
        # /.env.test — so any rule that trusts a crawler UA can be walked straight through.
        # The origin must stand on its own.
        #
        # 404, not 403: a 403 confirms the path exists and is worth retrying. 404 says nothing.

        # Hidden files and directories (/.env, /.git/config, /.aws/credentials, ...).
        # A regex location beats the `location /` SPA fallback above, so this wins.
        # /.well-known/ is IETF-reserved (RFC 8615) and the dotfile rule below would swallow it,
        # silently breaking ACME HTTP-01 renewal — a failure that surfaces months after deploy,
        # not at deploy time. Found by check-nginx-secret-paths.test.sh.
        #
        # ⚠ ENUMERATED, not a prefix exemption. The first version of this used
        # `location ^~ /.well-known/`, and `^~` makes nginx skip EVERY regex location below —
        # so /.well-known/.env and /.well-known/id_rsa were served with a 200. A guard case that
        # only checked neighbouring prefixes passed while the inside was wide open.
        #
        # A regex location matching exactly the three legitimate uses cannot do that: anything else
        # under /.well-known/ falls through to the dotfile rule and 404s. Widening this means
        # naming the new file here, deliberately. Case 6 of the guard pins it.
        location ~ ^/\.well-known/(acme-challenge/[A-Za-z0-9_-]+|security\.txt|apple-app-site-association)$ {
            try_files $uri =404;
        }

        location ~ /\. {
            access_log off;
            return 404;
        }

        # Secret-shaped names that do NOT start with a dot — the gap the dotfile rule leaves,
        # and exactly what the observed scanners asked for: /keys.json, /service-account.json,
        # /awsconfiguration.json, /settings.json, /credentials.json.
        #
        # Split into two rules on purpose. Names that could plausibly become a real page one day
        # ("settings", "keys", "config") are blocked ONLY with a file extension, so adding a
        # /settings route later does not silently start 404ing. Names that are credential
        # artefacts and could never be a user-facing page are blocked with or without one —
        # which matters, because the probes for /aws-credentials and /id_rsa carry no extension
        # at all, and an extension-only rule lets those straight through. (It did: a behavioural
        # test against this very config returned 200 for /id_rsa before this split.)
        location ~* /(keys?|secrets?|tokens?|settings|config|configuration|dump|backup)\.[a-z0-9]+$ {
            access_log off;
            return 404;
        }
        location ~* /(credentials?|aws[-_]?credentials?|awsconfiguration|aws[-_]?config|service[-_]?account|serviceaccount|client[-_]?secrets?|firebase[-_]?adminsdk|gcp[-_]?keys?|gcloud|id_rsa|id_dsa|id_ed25519|npmrc|netrc|pgpass|htpasswd|htaccess|web\.config|appsettings|composer|package-lock|yarn\.lock|bun\.lock)([./]|$) {
            access_log off;
            return 404;
        }

        # Extensions that are never a legitimate part of this SPA's build output. `.js`, `.css`,
        # `.json` and `.map` are deliberately absent: Vite emits those as real assets, and
        # blanket-blocking .json here would break any future webmanifest.
        location ~* \.(env|pem|key|crt|cer|p12|pfx|jks|keystore|ppk|sql|sqlite|sqlite3|db|dump|bak|backup|old|orig|save|swp|swo|tmp|rej|log|ini|cnf|conf|cfg|tfstate|tfvars|war|jar|gz|tgz|zip|rar|7z)$ {
            access_log off;
            return 404;
        }

        # Editor and VCS leftovers: index.html~, config.php.orig, foo.php.save.1
        location ~* (~|\.(orig|save)\.[0-9]+)$ {
            access_log off;
            return 404;
        }
    }
}
