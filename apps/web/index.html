<!doctype html>
<html lang="en">
  <head>
    <script>
(function(){
  var s=localStorage.getItem('bb-theme');
  var d=window.matchMedia('(prefers-color-scheme:dark)').matches;
  if(s==='dark'||(s!=='light'&&d))document.documentElement.classList.add('dark');
})();
</script>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>BoostedBudget - Smart Budgeting & Expense Tracking | Free Trial</title>
    <meta name="title" content="BoostedBudget - Smart Budgeting & Expense Tracking | Free Trial" />
    <meta name="description" content="Take control of your finances with BoostedBudget. Connect all your bank accounts, automate your budget, and achieve your financial goals. Start your free 2-month trial today." />
    <meta name="keywords" content="budgeting app, expense tracking, personal finance, budget automation, bank account aggregation, savings goals, GDPR compliant" />
    <meta name="author" content="BoostedBudget" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://boostedbudget.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boostedbudget.com/" />
    <meta property="og:title" content="BoostedBudget - Smart Budgeting & Expense Tracking" />
    <meta property="og:description" content="Take control of your finances. Connect all your bank accounts, automate your budget, and achieve your financial goals with BoostedBudget." />
    <meta property="og:site_name" content="BoostedBudget" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://boostedbudget.com/" />
    <meta name="twitter:title" content="BoostedBudget - Smart Budgeting & Expense Tracking" />
    <meta name="twitter:description" content="Take control of your finances. Connect all your bank accounts, automate your budget, and achieve your financial goals." />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BoostedBudget",
      "url": "https://boostedbudget.com",
      "description": "GDPR-compliant budgeting platform with intelligent automation rules."
    }
    </script>

    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BoostedBudget",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "8.99",
        "priceCurrency": "USD",
        "priceValidUntil": "2026-12-31"
      }
    }
    </script>

    <!-- Runtime config MUST load before main bundle so window.ENV is available -->
    <script src="/config.js"></script>

    <!-- Paddle.js SDK -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
