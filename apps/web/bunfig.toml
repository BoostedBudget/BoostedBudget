# Bun configuration for BoostedBudget frontend
# Issue #575: Bun-native test configuration

[install]
# Don't freeze lockfile during development
frozen = false

[test]
# Preload files for bun test (order matters!)
# 1. happydom.ts - Register DOM globals first
# 2. testing-library.ts - Setup testing library matchers
# 3+. Centralized mocks (Issue #575) - prevent mock.module() pollution
#
# NOTE: dashboard-hooks.ts mocks WRAPPER hooks (useDashboardData, useCashFlowSummary, etc.)
# dashboard-api.ts and analytics-api.ts mock API hooks (useGetDashboardPreferences, etc.)
# These don't conflict because they mock different modules at different layers.
preload = [
  "./src/test/happydom.ts",
  "./src/test/testing-library.ts",
  "./src/test/mocks/registry.ts",
  "./src/test/mocks/budgets-api.ts",
  "./src/test/mocks/dashboard-hooks.ts",
  "./src/test/mocks/dashboard-wrapper-hooks.ts",
  "./src/test/mocks/dashboard-context.ts",
  "./src/test/mocks/dashboard-api.ts",
  "./src/test/mocks/analytics-api.ts",
  "./src/test/mocks/tags-api.ts",
  "./src/test/mocks/profile-api.ts",
  "./src/test/mocks/subscription-api.ts",
  "./src/test/mocks/user-api.ts",
  "./src/test/mocks/accounts-api.ts",
  "./src/test/mocks/auto-categorization-api.ts",
  "./src/test/mocks/posthog.ts",
  "./src/test/mocks/clerk.tsx",
  "./src/test/mocks/user-accounts-api.ts",
  "./src/test/mocks/transactions-api.ts",
  "./src/test/mocks/categories-api.ts",
  "./src/test/mocks/privacy-api.ts",
  "./src/test/mocks/sonner.ts",
  "./src/test/mocks/automation-rules-api.ts",
  "./src/test/mocks/react-router.ts",
  "./src/test/mocks/rule-tier-limits.ts",
  "./src/test/mocks/budgets-wrapper.ts",
  "./src/test/mocks/shared-charts.ts",
  "./src/test/mocks/net-worth-hooks.ts",
  "./src/test/mocks/react-colorful.tsx",
  "./src/test/mocks/savings-goals-api.ts",
  "./src/test/mocks/admin-api.ts",
  "./src/test/mocks/admin-subscriptions-api.ts",
  "./src/test/mocks/plaid-api.ts"
]
# NOTE: cash-flow-hooks.ts is NOT preloaded because hook implementation tests
# (useCashFlowData.test.tsx) need real hooks with API-level mocks.
# Component tests that need wrapper mocks should import cash-flow-hooks.ts directly.

# NOTE: DashboardContext.test.tsx and registry.test.ts need real implementations.
# They must be run separately with: bun test --config bunfig.real.toml <file>
# Bun doesn't support exclude patterns for test files (feature request #21395)

# Generous timeout for CI stability (Issues #180, #219, #422)
timeout = 30000

# Note: Coverage thresholds will be enforced in CI scripts
# Bun's built-in coverage is used via --coverage flag
