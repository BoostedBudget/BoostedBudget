# Bun configuration for BoostedBudget frontend
# Issue #1323: Centralized test preloads (mocks loaded for all tests)

[install]
frozen = false

[test]
# Order: DOM → Testing Library → Centralized Mocks (Issue #575)
# Note: wrapper-level mocks (dashboard-hooks, dashboard-api) don't conflict
#       because they mock different modules at different abstraction layers.
preload = [
  "./src/test/happydom.ts",
  "./src/test/testing-library.ts",
  "./src/test/mocks/registry.ts",
  "./src/test/mocks/budgets-api.ts",
  "./src/test/mocks/dashboard-hooks.ts",
  "./src/test/mocks/dashboard-wrapper-hooks.ts",
  "./src/test/mocks/dashboard-context.ts",
  "./src/test/mocks/dashboard-api.ts",
  "./src/test/mocks/analytics-api.ts",
  "./src/test/mocks/tags-api.ts",
  "./src/test/mocks/profile-api.ts",
  "./src/test/mocks/subscription-api.ts",
  "./src/test/mocks/user-api.ts",
  "./src/test/mocks/accounts-api.ts",
  "./src/test/mocks/auto-categorization-api.ts",
  "./src/test/mocks/posthog.ts",
  "./src/test/mocks/track-event.ts",
  "./src/test/mocks/clerk.tsx",
  "./src/test/mocks/user-accounts-api.ts",
  "./src/test/mocks/transactions-api.ts",
  "./src/test/mocks/categories-api.ts",
  "./src/test/mocks/privacy-api.ts",
  "./src/test/mocks/support-api.ts",
  "./src/test/mocks/sonner.ts",
  "./src/test/mocks/boosts-api.ts",
  "./src/test/mocks/budgets-wrapper.ts",
  "./src/test/mocks/shared-charts.ts",
  "./src/test/mocks/net-worth-hooks.ts",
  "./src/test/mocks/react-colorful.tsx",
  "./src/test/mocks/toggle-group.tsx",
  "./src/test/mocks/savings-goals-api.ts",
  "./src/test/mocks/admin-api.ts",
  "./src/test/mocks/admin-subscriptions-api.ts",
  "./src/test/mocks/plaid-api.ts",
  "./src/test/mocks/regions-api.ts",
  "./src/test/mocks/notifications-api.ts",
  "./src/test/mocks/transfer-suggestions-api.ts",
  "./src/test/mocks/savings-impact-api.ts",
  "./src/test/mocks/savings-impact-hooks.ts",
  "./src/test/mocks/investments-api.ts",
  "./src/test/mocks/investments-hooks.ts",
  "./src/test/mocks/merchants-api.ts",
  "./src/test/mocks/session-dismiss.ts",
  "./src/test/mocks/household-api.ts"
]
# NOTE: cash-flow-hooks.ts excluded — real hook implementation tests need API-level mocks only.
# NOTE: Tests requiring real implementations run via test-conflict-files.sh from /tmp.
#       This avoids loading these preloads (toggle-group.tsx, registry.ts, etc.).

# ⚠ NOT IN EFFECT — kept only to document intent. Verified empirically (#1537): locally
# (bun 1.4.0) a test that sleeps 6s fails at exactly 5000ms with this setting alone, and passes
# when `--timeout 30000` is given on the command line; in CI (bun 1.3.14, which CI pins) the
# frontend suite likewise reported "timed out after 5000ms". So the key is not in effect in
# EITHER environment. WHY is unestablished — 1.3.14's own docs do document `[test] timeout`, so
# "this bun version ignores the key" would be overclaiming; version behaviour, config discovery
# and a preload interaction are all still candidates. The CLI flag is the fix either way.
#
# The effective timeout comes from the CLI flag in BOTH scripts/test-regular.sh and
# scripts/test-conflict-files.sh. If you change the intended value, change it there — editing
# this line alone will silently have no effect, which is exactly how the 362-file suite ended
# up running at bun's 5s default while its sibling suite got 30s.
timeout = 30000
