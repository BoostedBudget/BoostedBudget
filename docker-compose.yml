version: '3.9'

services:
  # PostgreSQL Database (Single region for MVP: us-east-1)
  postgres:
    image: postgres:15-alpine
    container_name: boostedbudget-db
    environment:
      POSTGRES_DB: boostedbudget
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d boostedbudget"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: boostedbudget-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: boostedbudget-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: boostedbudget-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: "development"
      VERSION: "0.1.0"
      PRIMARY_REGION: "iad"
      DATABASE_URL: "postgres://devuser:devpass@postgres:5432/boostedbudget?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      PLAID_SECRET: "${PLAID_SECRET}"
      PLAID_ENV: "sandbox"
      PLAID_REDIRECT_URI: "${PLAID_REDIRECT_URI}"
      PLAID_WEBHOOK_URL: "${PLAID_WEBHOOK_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Grace period for migrations and service initialization

  # Frontend (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: boostedbudget-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY}"
      VITE_GOOGLE_ADSENSE_CLIENT: "${GOOGLE_ADSENSE_CLIENT}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules  # Don't overwrite node_modules

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
