version: '3.9'

services:
  # PostgreSQL Database (Single region for MVP: us-east-1)
  #
  # Pinned to 17 to match CI and production. This was `postgres:15-alpine` while CI's migration job
  # ran `postgres:17` and squawk lints with `--pg-version=17` — so local development validated
  # migrations and SQL behaviour against a different major version than they actually run on.
  #
  # ⚠️ UPGRADING AN EXISTING CHECKOUT DESTROYS YOUR LOCAL DEV DATABASE. A PostgreSQL 15 data
  # directory cannot be read by a 17 server; the container will refuse to start with "database files
  # are incompatible with server". Recreate the volume:
  #
  #     docker compose down -v && make dev && make migrate-up
  #
  # Local dev data is disposable (fixtures and the QA populator rebuild it), so this is the intended
  # path rather than an in-place pg_upgrade.
  #
  # Note for scripts/test-migrations.sh: pg_dump refuses to dump a server newer than itself, so a
  # host client older than 17 will not work. Either install one (brew install postgresql@17) or set
  # PG_DUMP="$PWD/scripts/pg_dump-via-docker" to use this container's own binary.
  postgres:
    image: postgres:17-alpine
    container_name: boostedbudget-db
    environment:
      POSTGRES_DB: boostedbudget
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d boostedbudget"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: boostedbudget-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: boostedbudget-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: boostedbudget-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: "development"
      VERSION: "0.1.0"
      PRIMARY_REGION: "iad"
      DATABASE_URL: "postgres://devuser:devpass@postgres:5432/boostedbudget?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      PLAID_SECRET: "${PLAID_SECRET}"
      PLAID_ENV: "sandbox"
      PLAID_REDIRECT_URI: "${PLAID_REDIRECT_URI}"
      PLAID_WEBHOOK_URL: "${PLAID_WEBHOOK_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Grace period for migrations and service initialization

  # Frontend (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: boostedbudget-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules  # Don't overwrite node_modules

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
