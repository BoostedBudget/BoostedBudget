version: '3.9'

services:
  # PostgreSQL Database (Single region for MVP: us-east-1)
  #
  # Pinned to 17 to match CI and squawk's `--pg-version=17`. This was `postgres:15-alpine` while
  # CI's migration and integration jobs both ran `postgres:17` — so local development validated
  # migrations and SQL behaviour against a different major version than CI did.
  #
  # ⚠️ Deliberately does NOT claim to match production. An earlier version of this comment said
  # "to match CI and production", which nothing in this repo substantiates: production and staging
  # are Neon, `backend/fly.toml` declares only a `DATABASE_URL` secret with no server version, and
  # **#607 ("Set up Neon Postgres database for production environment") is still OPEN with every box
  # unchecked and a "Must for Prod" label.** `.squawk.toml`'s "matches Neon production" comment has
  # the same problem and predates this change. Nobody has read a version off the production database;
  # 17 here is chosen to match CI, and aligning with production is #607's job.
  #
  # ⚠️ UPGRADING AN EXISTING CHECKOUT DESTROYS YOUR LOCAL DEV DATABASE. A PostgreSQL 15 data
  # directory cannot be read by a 17 server; the container will refuse to start with "database files
  # are incompatible with server". Recreate the volume:
  #
  #     docker compose down -v && make dev && make migrate-up
  #
  # Local dev data is disposable (fixtures and the QA populator rebuild it), so this is the intended
  # path rather than an in-place pg_upgrade.
  #
  # Note for scripts/test-migrations.sh: PG_DUMP defaults to the host's `pg_dump` on PATH, and
  # pg_dump refuses to dump a server newer than itself — so an UNMODIFIED host client older than 17
  # will fail against this 17 container. That default-invocation case is the only one this
  # requires 17 for. Either install a >= 17 host client (brew install postgresql@17) or override
  # PG_DUMP="$PWD/scripts/pg_dump-via-docker" to dump via this container's own binary instead
  # (which CI's migration-tests step already does, so CI is not affected by the host client at all).
  postgres:
    image: postgres:17-alpine
    container_name: boostedbudget-db
    environment:
      POSTGRES_DB: boostedbudget
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d boostedbudget"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Rate Limiter (Issue #1531)
  #
  # Two SEPARATE Redis instances below, never one shared instance. This one backs
  # RATE_LIMIT_REDIS_URL and is provisioned --maxmemory-policy noeviction: the limiter's
  # correctness depends on every SET it issues succeeding. If this instance were shared
  # with the cache instance, the cache filling memory would make the limiter's own SETs
  # fail with "OOM command not allowed when used memory > 'maxmemory'" — a permanent
  # limiter fallback to in-memory, per-machine limiting, with a cause that looks nothing
  # like its symptom. See backend/internal/redisclient/client.go's package doc
  # ("Two clients, never share one") for the full rationale.
  redis-ratelimit:
    image: redis:7-alpine
    container_name: boostedbudget-redis-ratelimit
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_ratelimit_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Cache (Issue #1531)
  #
  # Backs CACHE_REDIS_URL. Given an eviction policy so it can fill up under normal use
  # without ever touching the limiter's budget (see redis-ratelimit above). Production
  # (Upstash) actually runs `optimistic-volatile`, which is Upstash-specific and not
  # expressible by open-source Redis's --maxmemory-policy — `allkeys-lru` here is a
  # deliberate local approximation (closest open-source shape: evicts under memory
  # pressure without requiring TTLs on every key), not an attempt to match production
  # exactly. Because Upstash's real eviction can drop non-TTL keys at any time, cache
  # generations are minted as random tokens rather than incrementing counters.
  redis-cache:
    image: redis:7-alpine
    container_name: boostedbudget-redis-cache
    command: redis-server --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: boostedbudget-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REVENUECAT_PROJECT_ID: "${REVENUECAT_PROJECT_ID:-}"
      REVENUECAT_SECRET_API_KEY: "${REVENUECAT_SECRET_API_KEY:-}"
      REVENUECAT_GRANT_API_KEY: "${REVENUECAT_GRANT_API_KEY:-}"
      REVENUECAT_ENVIRONMENT: "${REVENUECAT_ENVIRONMENT:-}"
      REVENUECAT_WEBHOOK_AUTHORIZATION: "${REVENUECAT_WEBHOOK_AUTHORIZATION:-}"
      REVENUECAT_WEBHOOK_SIGNING_SECRET: "${REVENUECAT_WEBHOOK_SIGNING_SECRET:-}"
      ENVIRONMENT: "development"
      VERSION: "0.1.0"
      PRIMARY_REGION: "iad"
      DATABASE_URL: "postgres://devuser:devpass@postgres:5432/boostedbudget?sslmode=disable"
      RATE_LIMIT_REDIS_URL: "redis://redis-ratelimit:6379"
      CACHE_REDIS_URL: "redis://redis-cache:6379"
      CACHE_ENABLED: "true"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      PLAID_SECRET: "${PLAID_SECRET}"
      PLAID_ENV: "sandbox"
      PLAID_REDIRECT_URI: "${PLAID_REDIRECT_URI}"
      PLAID_WEBHOOK_URL: "${PLAID_WEBHOOK_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Grace period for migrations and service initialization

  # Frontend (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: boostedbudget-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY}"
      VITE_REVENUECAT_PUBLIC_API_KEY: "${VITE_REVENUECAT_PUBLIC_API_KEY:-}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules  # Don't overwrite node_modules

volumes:
  postgres_data:
  redis_ratelimit_data:
  redis_cache_data:
