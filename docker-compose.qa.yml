version: '3.9'

services:
  # PostgreSQL Database (QA)
  #
  # Pinned to 17 to match local development, CI's containers, and squawk's --pg-version=17. QA was
  # the last environment left on 15, which meant QA validated the application against a different
  # major version than everywhere else.
  #
  # ⚠️ THIS BUMP DESTROYS THE EXISTING QA DATABASE. A PostgreSQL 15 data directory cannot be read by
  # a 17 server — the container will refuse to start with "database files are incompatible with
  # server" — and `pull_policy: always` means the new image is fetched on the next deploy. The QA
  # volume must be recreated and re-seeded as part of rolling this out:
  #
  #     RESET_VOLUMES=true ./scripts/deploy-qa.sh
  #
  # Use that, NOT a bare `docker compose -f docker-compose.qa.yml down -v`. The real QA deployment
  # pins the Compose project name to "boostedbudget-qa" (scripts/deploy-qa.sh:25, passed as `-p` at
  # :176/:181), so a `-p`-less docker compose command acts on the DIRECTORY-DERIVED project instead
  # and leaves the incompatible PostgreSQL 15 volume untouched — the next real deploy then still
  # fails with "database files are incompatible with server", and may also hit occupied ports.
  # deploy-qa.sh already documents this flag at :552. Re-apply migrations and re-run the QA data
  # populator afterwards.
  #
  # This is deliberate and coordinated, not incidental to a code change — see docs/MAC_MINI_QA_SETUP.md.
  postgres:
    image: postgres:17-alpine
    pull_policy: always  # Always pull latest patches
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    environment:
      POSTGRES_DB: boostedbudget_qa
      POSTGRES_USER: ${POSTGRES_USER:-qauser}
      # #1514: no weak fallback — a missing POSTGRES_PASSWORD must fail loudly, not
      # silently start with a guessable default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no default permitted)}
    ports:
      # #1514: loopback-only. This host port is for operator/debugging access on the
      # Mac Mini itself; the backend container reaches Postgres via the Docker network
      # (service name "postgres"), so it never needs the host mapping. Binding to
      # 0.0.0.0 previously exposed an authenticated-but-often-weak Postgres to anything
      # that could route to the host, including the Tailscale interface.
      - "127.0.0.1:5433:5432"  # Different port to avoid conflict with dev
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qauser} -d boostedbudget_qa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Rate Limiter (QA) (Issue #1531)
  #
  # Two SEPARATE Redis instances, never one shared instance — see docker-compose.yml's
  # redis-ratelimit/redis-cache comments for the full noeviction-vs-eviction rationale
  # (a shared instance's cache traffic can OOM the limiter's SETs, producing a permanent
  # limiter fallback with a misleading cause). This one backs RATE_LIMIT_REDIS_URL and is
  # provisioned --maxmemory-policy noeviction.
  redis-ratelimit:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    pull_policy: always  # Always pull latest patches
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      # #1514: loopback-only — see Postgres port comment above for rationale. This
      # Redis instance also has no authentication configured, so exposure beyond the
      # host itself is not acceptable.
      - "127.0.0.1:6380:6379"  # Different port to avoid conflict with dev
    volumes:
      - redis_ratelimit_qa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Cache (QA) (Issue #1531)
  #
  # Backs CACHE_REDIS_URL. `allkeys-lru` is a deliberate local approximation of Upstash's
  # production `optimistic-volatile` policy, which is Upstash-specific and not
  # expressible by open-source Redis's --maxmemory-policy — see docker-compose.yml's
  # redis-cache comment for the full rationale.
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy allkeys-lru
    pull_policy: always  # Always pull latest patches
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      # #1514: loopback-only — see Postgres port comment above for rationale.
      - "127.0.0.1:6381:6379"  # Different port from dev AND from the QA ratelimit instance
    volumes:
      - redis_cache_qa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (QA)
  # Uses pre-built image from GHCR (GitHub Container Registry)
  # Image is built in CI/CD and pulled by deploy script
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/boostedbudget/boostedbudget-backend:qa-latest}
    pull_policy: always  # Always pull latest image to ensure we have newest version
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "8080:8080"  # QA backend port
    environment:
      PORT: "8080"
      REVENUECAT_PROJECT_ID: "${REVENUECAT_PROJECT_ID:-}"
      REVENUECAT_SECRET_API_KEY: "${REVENUECAT_SECRET_API_KEY:-}"
      REVENUECAT_GRANT_API_KEY: "${REVENUECAT_GRANT_API_KEY:-}"
      REVENUECAT_ENVIRONMENT: "${REVENUECAT_ENVIRONMENT:-}"
      REVENUECAT_WEBHOOK_AUTHORIZATION: "${REVENUECAT_WEBHOOK_AUTHORIZATION:-}"
      REVENUECAT_WEBHOOK_SIGNING_SECRET: "${REVENUECAT_WEBHOOK_SIGNING_SECRET:-}"
      ENVIRONMENT: "qa"
      VERSION: "${VERSION:-qa-dev}"
      PRIMARY_REGION: "${PRIMARY_REGION:-iad}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-qauser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no default permitted)}@postgres:5432/boostedbudget_qa?sslmode=disable"
      RATE_LIMIT_REDIS_URL: "redis://redis-ratelimit:6379"
      CACHE_REDIS_URL: "redis://redis-cache:6379"
      CACHE_ENABLED: "true"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      PLAID_SECRET: "${PLAID_SECRET}"
      PLAID_ENV: "sandbox"
      PLAID_REDIRECT_URI: "${PLAID_REDIRECT_URI}"
      PLAID_WEBHOOK_URL: "${PLAID_WEBHOOK_URL}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      # Issue #1432 (B2-1): explicit opt-in for the unauthenticated QA auth-bypass route.
      # ENVIRONMENT=qa alone no longer registers it — see backend/internal/config/qa_auth_bypass_gate.go.
      QA_AUTH_BYPASS_ENABLED: "true"
      QA_BYPASS_SECRET: "${QA_BYPASS_SECRET}"
      QA_ADMIN_CLERK_USER_ID: "${QA_ADMIN_CLERK_USER_ID}"
      QA_PREMIUM_CLERK_USER_ID: "${QA_PREMIUM_CLERK_USER_ID}"
    depends_on:
      postgres:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # Issue #472: Config is baked into Docker image - no volume mount needed
    # The previous mount shadowed the baked-in config after CI workspace cleanup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Grace period for migrations and service initialization

  # Frontend (QA)
  # Uses pre-built image from GHCR (GitHub Container Registry)
  # Image is built in CI/CD and pulled by deploy script
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/boostedbudget/boostedbudget-frontend:qa-latest}
    pull_policy: always  # Always pull latest image to ensure we have newest version
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "3000:80"   # HTTP (redirects to HTTPS)
      - "3443:443"  # HTTPS
    environment:
      DOCKER_ENV: "true"  # Tells Vite to use Docker service names for proxy
      ENVIRONMENT: "${ENVIRONMENT:-qa}"  # Critical: Enables non-fatal Clerk errors in QA
      HTTPS_PORT: "3443"  # HTTPS redirect port for QA (production uses default 443)
      API_URL: ""  # Empty = use nginx proxy with relative /api/* URLs (fixes CORS for Tailscale access)
      VITE_API_URL: ""  # Empty = use nginx proxy with relative /api/* URLs
      VITE_CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY}"
      REVENUECAT_PUBLIC_API_KEY: "${VITE_REVENUECAT_PUBLIC_API_KEY:-}"
    volumes:
      - ./apps/web/cert.pem:/etc/nginx/ssl/cert.pem:ro  # SSL cert (CI/CD restores from GitHub secrets)
      - ./apps/web/key.pem:/etc/nginx/ssl/key.pem:ro    # SSL key (CI/CD restores from GitHub secrets)
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]  # Health check uses HTTP
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s  # Grace period for Nginx startup

volumes:
  postgres_qa_data:
  redis_ratelimit_qa_data:
  redis_cache_qa_data:
