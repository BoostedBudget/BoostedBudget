        category: ["Service", "Utilities"]
        personal_finance_category:
          primary: "RENT_AND_UTILITIES"
          detailed: "RENT_AND_UTILITIES_GAS_AND_ELECTRICITY"
        payment_channel: "other"
        pending: false

  # Execution steps
  steps:
    - action: "wait"
      description: "No webhook - this is a merchant diversity validation scenario"
      wait_seconds: 1

  # Assertions
  assertions:
    database:
      # Total of 30 transactions
      transactions_count: 30

    custom:
      # CRITICAL: Unique merchant count should be ≥20
      - description: "Should have at least 20 unique merchants"
        query: |
          SELECT COUNT(DISTINCT name) as unique_merchants
          FROM transactions
          WHERE user_id = 'test-user-diversity-001'
        expected_min:
          unique_merchants: 20

      # No merchant monopoly (max 2 appearances per merchant)
      - description: "No merchant should appear more than 2 times (diversity, not concentration)"
        query: |
          SELECT MAX(merchant_count) as max_appearances
          FROM (
            SELECT name, COUNT(*) as merchant_count
            FROM transactions
            WHERE user_id = 'test-user-diversity-001'
            GROUP BY name
          ) merchant_counts
        expected_max:
          max_appearances: 2

      # Category diversity (at least 8 primary categories)
      - description: "Should have at least 8 different primary PFC categories"
        query: |
          SELECT COUNT(DISTINCT
            (personal_finance_category->>'primary')
          ) as unique_categories
          FROM transactions
          WHERE user_id = 'test-user-diversity-001'
        expected_min:
          unique_categories: 7

      # Most common merchants (Whole Foods, Chipotle, Starbucks, Amazon - each 2x)
      - description: "Should have exactly 4 merchants appearing twice (common places)"
        query: |
          SELECT COUNT(*) as repeat_merchants
          FROM (
            SELECT name, COUNT(*) as count
            FROM transactions
            WHERE user_id = 'test-user-diversity-001'
            GROUP BY name
            HAVING COUNT(*) = 2
          ) repeats
        expected:
          repeat_merchants: 4

      # Single-visit merchants (high diversity)
      - description: "Should have at least 18 merchants appearing only once (high variety)"
        query: |
          SELECT COUNT(*) as one_time_merchants
          FROM (
            SELECT name, COUNT(*) as count
            FROM transactions
            WHERE user_id = 'test-user-diversity-001'
            GROUP BY name
            HAVING COUNT(*) = 1
          ) singles
        expected_min:
          one_time_merchants: 18

      # Grocery diversity (4 different grocery stores)
      - description: "Should have 4 different grocery merchants (Whole Foods, Trader Joe's, Costco, Aldi)"
        query: |
          SELECT COUNT(DISTINCT name) as grocery_merchants
          FROM transactions
          WHERE user_id = 'test-user-diversity-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_GROCERIES'
        expected_min:
          grocery_merchants: 4

      # Restaurant diversity (6 different restaurants)
      - description: "Should have at least 5 different restaurant merchants"
        query: |
          SELECT COUNT(DISTINCT name) as restaurant_merchants
          FROM transactions
          WHERE user_id = 'test-user-diversity-001'
          AND (
            personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_RESTAURANTS'
            OR personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_FAST_FOOD'
          )
        expected_min:
          restaurant_merchants: 5

      # Coffee shop diversity (3 different coffee shops - not just Starbucks!)
      - description: "Should have at least 2 different coffee shop merchants (not just Starbucks)"
        query: |
          SELECT COUNT(DISTINCT name) as coffee_merchants
          FROM transactions
          WHERE user_id = 'test-user-diversity-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_COFFEE'
        expected_min:
          coffee_merchants: 2

      # Gas station diversity (3 different gas stations)
      - description: "Should have exactly 3 different gas station merchants"
        query: |
          SELECT COUNT(DISTINCT name) as gas_merchants
          FROM transactions
          WHERE user_id = 'test-user-diversity-001'
          AND personal_finance_category->>'detailed' = 'TRANSPORTATION_GAS'
        expected:
          gas_merchants: 3

      # Total spending distribution (no merchant >20% of total)
      - description: "No single merchant should represent >20% of total spending"
        query: |
          WITH merchant_totals AS (
            SELECT
              name,
              SUM(ABS(amount)) as merchant_total,
              SUM(SUM(ABS(amount))) OVER () as grand_total
            FROM transactions
            WHERE user_id = 'test-user-diversity-001'
            GROUP BY name
          )
          SELECT MAX((merchant_total / grand_total) * 100) as max_merchant_percentage
          FROM merchant_totals
        expected_max:
          max_merchant_percentage: 20.00

# Expected Outcomes:
# 1. 30 transactions across 20+ unique merchants
# 2. 4 merchants appear twice (Whole Foods, Chipotle, Starbucks, Amazon)
# 3. 18+ merchants appear only once (high variety)
# 4. No merchant appears >2 times (diversity, not concentration)
# 5. 7+ primary categories (groceries, dining, gas, subscriptions, etc.)
# 6. 4 different grocery stores
# 7. 5+ different restaurants
# 8. 2+ coffee shops (not just Starbucks)
# 9. 3 different gas stations
# 10. No merchant represents >20% of total spending

# Real-World Business Value:
# - Merchant diversity insights reveal spending patterns:
#   1. **Merchant loyalty**: "You shop at 4 different grocery stores"
#   2. **Savings opportunities**: "Switch to Aldi from Whole Foods = 50% savings"
#   3. **Rewards optimization**: "Starbucks card = 2 stars per $1 spent"
#   4. **Spending habits**: "18 one-time merchants = exploratory shopper"
#   5. **Brand concentration**: "Amazon 2x = 13% of spending"
#   6. **Category diversity**: "7 categories = balanced lifestyle"
#   7. **Convenience vs cost**: "3 gas stations = price shopper, not loyalty"

# Merchant Concentration Analysis:
# - **High concentration** (3-4 merchants, 70%+ of spending):
#   - Indicates strong merchant loyalty
#   - May miss out on competitor rewards/promotions
#   - Example: "90% of groceries at Whole Foods"
# - **Medium concentration** (8-12 merchants, 40-60% of spending):
#   - Balanced approach
#   - Some loyalty, some exploration
#   - Example: "60% split between Whole Foods + Trader Joe's"
# - **High diversity** (20+ merchants, <30% concentration):
#   - Exploratory shopper
#   - Maximizes variety, may miss loyalty rewards
#   - Example: "30 merchants, no single merchant >10%"

