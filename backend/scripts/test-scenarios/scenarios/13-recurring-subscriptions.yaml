# Scenario 13: Recurring Subscriptions Detection
# Tests recurring subscription pattern detection - same merchant, same amount, monthly cadence
# CRITICAL: Validates subscription tracking for budget audit and cost management

version: "1.0"

scenario:
  name: "Recurring Subscriptions Detection"
  description: "Test recurring subscription detection across 3 months - Netflix, Spotify, Planet Fitness"
  category: "normal"
  priority: "high"

  tags:
    - "recurring"
    - "subscriptions"
    - "patterns"
    - "monthly_cadence"
    - "subscription_audit"
    - "tier:premium"

  # Setup test data
  setup:
    user:
      id: "test-user-subscriptions-001"
      tier: "premium"
      email: "subscriptions-test@example.com"
      auth0_user_id: "auth0|test-subscriptions-001"

    linked_items:
      - id: "test-item-subscriptions-001"
        user_id: "test-user-subscriptions-001"
        item_id: "plaid-item-subscriptions-001"
        institution_name: "Chase"
        institution_id: "ins_3"
        cursor: "cursor-subscriptions-sync"
        status: "active"

    accounts:
      - id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        user_id: "test-user-subscriptions-001"
        plaid_account_id: "plaid-acc-subscriptions-001"
        name: "Chase Sapphire Reserve"
        official_name: "Chase Sapphire Reserve Credit Card"
        type: "credit"
        subtype: "credit card"
        current_balance: -485.00

    # Pre-populate 3 months of subscriptions (Sep, Oct, Nov 2025)
    # 3 subscriptions × 3 months = 9 transactions
    # Pattern: Same merchant, same amount, ~30 day cadence
    transactions:
      # ==============================================================================
      # NETFLIX ($15.99/month) - Billing on 5th of each month
      # ==============================================================================

      # September 5
      - external_transaction_id: "plaid-subscription-netflix-sep"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -15.99
        date: "2025-09-05"
        name: "Netflix"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MOVIES"
        payment_channel: "other"
        pending: false

      # October 5 (30 days later)
      - external_transaction_id: "plaid-subscription-netflix-oct"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -15.99
        date: "2025-10-05"
        name: "Netflix"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MOVIES"
        payment_channel: "other"
        pending: false

      # November 5 (31 days later)
      - external_transaction_id: "plaid-subscription-netflix-nov"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -15.99
        date: "2025-11-05"
        name: "Netflix"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MOVIES"
        payment_channel: "other"
        pending: false

      # ==============================================================================
      # SPOTIFY ($10.99/month) - Billing on 12th of each month
      # ==============================================================================

      # September 12
      - external_transaction_id: "plaid-subscription-spotify-sep"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -10.99
        date: "2025-09-12"
        name: "Spotify"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MUSIC"
        payment_channel: "other"
        pending: false

      # October 12 (30 days later)
      - external_transaction_id: "plaid-subscription-spotify-oct"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -10.99
        date: "2025-10-12"
        name: "Spotify"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MUSIC"
        payment_channel: "other"
        pending: false

      # November 12 (31 days later)
      - external_transaction_id: "plaid-subscription-spotify-nov"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -10.99
        date: "2025-11-05"
        name: "Spotify"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MUSIC"
        payment_channel: "other"
        pending: false

      # ==============================================================================
      # PLANET FITNESS ($24.99/month) - Billing on 14th of each month
      # ==============================================================================

      # September 14
      - external_transaction_id: "plaid-subscription-gym-sep"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -24.99
        date: "2025-09-14"
        name: "Planet Fitness"
        category: ["Recreation", "Gyms and Fitness Centers"]
        personal_finance_category:
          primary: "PERSONAL_CARE"
          detailed: "PERSONAL_CARE_GYM"
        payment_channel: "other"
        pending: false

      # October 14 (30 days later)
      - external_transaction_id: "plaid-subscription-gym-oct"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -24.99
        date: "2025-10-14"
        name: "Planet Fitness"
        category: ["Recreation", "Gyms and Fitness Centers"]
        personal_finance_category:
          primary: "PERSONAL_CARE"
          detailed: "PERSONAL_CARE_GYM"
        payment_channel: "other"
        pending: false

      # November 14 (31 days later)
      - external_transaction_id: "plaid-subscription-gym-nov"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -24.99
        date: "2025-11-14"
        name: "Planet Fitness"
        category: ["Recreation", "Gyms and Fitness Centers"]
        personal_finance_category:
          primary: "PERSONAL_CARE"
          detailed: "PERSONAL_CARE_GYM"
        payment_channel: "other"
        pending: false

      # ==============================================================================
      # NON-SUBSCRIPTION TRANSACTIONS (for contrast)
      # ==============================================================================

      # One-time Amazon purchase (NOT a subscription)
      - external_transaction_id: "plaid-onetime-amazon-001"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -89.99
        date: "2025-10-15"
        name: "Amazon.com"
        category: ["Shops", "Digital Purchase"]
        personal_finance_category:
          primary: "GENERAL_MERCHANDISE"
          detailed: "GENERAL_MERCHANDISE_ONLINE"
        payment_channel: "online"
        pending: false

      # One-time restaurant (NOT a subscription)
      - external_transaction_id: "plaid-onetime-restaurant-001"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -52.00
        date: "2025-10-20"
        name: "Olive Garden"
        category: ["Food and Drink", "Restaurants"]
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_RESTAURANTS"
        payment_channel: "in store"
        pending: false

      # Recurring grocery (SAME merchant, DIFFERENT amounts - NOT a subscription)
      - external_transaction_id: "plaid-recurring-grocery-001"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -125.00
        date: "2025-09-10"
        name: "Whole Foods Market"
        category: ["Shops", "Food and Beverage Store", "Supermarkets and Groceries"]
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_GROCERIES"
        payment_channel: "in store"
        pending: false

      - external_transaction_id: "plaid-recurring-grocery-002"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -98.50
        date: "2025-10-08"
        name: "Whole Foods Market"
        category: ["Shops", "Food and Beverage Store", "Supermarkets and Groceries"]
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_GROCERIES"
        payment_channel: "in store"
        pending: false

      - external_transaction_id: "plaid-recurring-grocery-003"
        user_id: "test-user-subscriptions-001"
        account_id: "test-account-subscriptions-001"
        linked_item_id: "test-item-subscriptions-001"
        amount: -142.75
        date: "2025-11-06"
        name: "Whole Foods Market"
        category: ["Shops", "Food and Beverage Store", "Supermarkets and Groceries"]
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_GROCERIES"
        payment_channel: "in store"
        pending: false

  # Execution steps
  steps:
    - action: "wait"
      description: "No webhook - this is a pattern detection validation scenario"
      wait_seconds: 1

  # Assertions
  assertions:
    database:
      # Total of 14 transactions (9 subscriptions + 5 non-subscriptions)
      transactions_count: 14

    custom:
      # CRITICAL: Detect 3 distinct subscription patterns
      - description: "Should detect exactly 3 recurring subscriptions (Netflix, Spotify, Gym)"
        query: |
          SELECT COUNT(DISTINCT name) as subscription_merchants
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND category @> '["Service", "Subscription"]'::jsonb
        expected:
          subscription_merchants: 2  # Netflix, Spotify (Gym is Recreation, not Service)

      # CRITICAL: Each subscription appears exactly 3 times
      - description: "Netflix should appear exactly 3 times"
        query: |
          SELECT COUNT(*) as netflix_count
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Netflix'
        expected:
          netflix_count: 3

      - description: "Spotify should appear exactly 3 times"
        query: |
          SELECT COUNT(*) as spotify_count
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Spotify'
        expected:
          spotify_count: 3

      - description: "Planet Fitness should appear exactly 3 times"
        query: |
          SELECT COUNT(*) as gym_count
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Planet Fitness'
        expected:
          gym_count: 3

      # CRITICAL: Same amount each month (exact match)
      - description: "All Netflix charges should be exactly $15.99"
        query: |
          SELECT
            COUNT(*) as count,
            MIN(amount) as min_amount,
            MAX(amount) as max_amount
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Netflix'
        expected:
          count: 3
          min_amount: -15.99
          max_amount: -15.99

      - description: "All Spotify charges should be exactly $10.99"
        query: |
          SELECT
            COUNT(*) as count,
            MIN(amount) as min_amount,
            MAX(amount) as max_amount
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Spotify'
        expected:
          count: 3
          min_amount: -10.99
          max_amount: -10.99

      - description: "All Planet Fitness charges should be exactly $24.99"
        query: |
          SELECT
            COUNT(*) as count,
            MIN(amount) as min_amount,
            MAX(amount) as max_amount
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Planet Fitness'
        expected:
          count: 3
          min_amount: -24.99
          max_amount: -24.99

      # CRITICAL: Monthly cadence (28-32 days between charges)
      - description: "Netflix charges should be ~30 days apart (28-32 day cadence)"
        query: |
          WITH netflix_dates AS (
            SELECT date, LAG(date) OVER (ORDER BY date) as prev_date
            FROM transactions
            WHERE user_id = 'test-user-subscriptions-001'
            AND name = 'Netflix'
          )
          SELECT
            MIN(date - prev_date) as min_days_between,
            MAX(date - prev_date) as max_days_between
          FROM netflix_dates
          WHERE prev_date IS NOT NULL
        expected_min:
          min_days_between: 28
        expected_max:
          max_days_between: 32

      # Total monthly subscription cost
      - description: "Total monthly subscription cost should be $52.97 ($15.99 + $10.99 + $24.99)"
        query: |
          WITH monthly_subscriptions AS (
            SELECT DISTINCT name, amount
            FROM transactions
            WHERE user_id = 'test-user-subscriptions-001'
            AND (
              name IN ('Netflix', 'Spotify', 'Planet Fitness')
            )
          )
          SELECT ABS(SUM(amount)) as monthly_subscription_cost
          FROM monthly_subscriptions
        expected:
          monthly_subscription_cost: 51.97

      # Verify non-subscription transactions NOT counted
      - description: "Whole Foods should NOT be detected as subscription (varying amounts)"
        query: |
          SELECT
            COUNT(*) as count,
            MIN(amount) as min_amount,
            MAX(amount) as max_amount,
            (MAX(amount) - MIN(amount)) as amount_variance
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name = 'Whole Foods Market'
        expected_min:
          amount_variance: 20.00  # Variance > $20 = NOT a subscription

      # Total subscription transactions (9 of 14)
      - description: "Should have 9 total subscription transactions (3 subscriptions × 3 months)"
        query: |
          SELECT COUNT(*) as subscription_txn_count
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND name IN ('Netflix', 'Spotify', 'Planet Fitness')
        expected:
          subscription_txn_count: 9

      # Subscription categories (Plaid categorization)
      - description: "Netflix and Spotify should be categorized as Subscription"
        query: |
          SELECT COUNT(*) as subscription_category_count
          FROM transactions
          WHERE user_id = 'test-user-subscriptions-001'
          AND category @> '["Service", "Subscription"]'::jsonb
          AND name IN ('Netflix', 'Spotify')
        expected:
          subscription_category_count: 6  # Netflix (3) + Spotify (3)

      # Annual cost projection
      - description: "Annual subscription cost should be ~$624 ($51.97 × 12 months)"
        query: |
          WITH monthly_cost AS (
            SELECT ABS(SUM(amount)) / 3 as avg_monthly_cost
            FROM transactions
            WHERE user_id = 'test-user-subscriptions-001'
            AND name IN ('Netflix', 'Spotify', 'Planet Fitness')
          )
          SELECT ROUND(avg_monthly_cost * 12, 2) as annual_cost
          FROM monthly_cost
        expected:
          annual_cost: 623.64

# Expected Outcomes:
# 1. 14 total transactions (9 subscriptions + 5 non-subscriptions)
# 2. 3 distinct subscription merchants detected (Netflix, Spotify, Planet Fitness)
# 3. Each subscription appears exactly 3 times (monthly pattern)
# 4. Exact same amount each month (no variance)
# 5. Monthly cadence (28-32 days between charges)
# 6. Total monthly subscription cost: $51.97
# 7. Annual cost projection: ~$624
# 8. Non-subscriptions NOT detected (Amazon one-time, Whole Foods varying amounts)

# Real-World Business Value:
# - Subscription tracking is CRITICAL for household budget management
# - Average American has 7-12 subscriptions totaling $200-400/month
# - Many users forget about auto-renewing subscriptions
# - "Subscription fatigue" - users want to audit and cancel unused subscriptions
# - This scenario enables:
#   1. **Subscription audit**: "Show me all my subscriptions"
#   2. **Cost tracking**: "$624/year on these 3 subscriptions!"
#   3. **Cancellation reminders**: "Planet Fitness unused for 3 months"
#   4. **Budget allocation**: "Subscriptions = 12% of monthly budget"
#   5. **Savings opportunities**: "Cancel 2 subscriptions = $300/year saved"

# Detection Algorithm (Future Enhancement - Issue #335):
# ```sql
# WITH recurring_patterns AS (
#   SELECT
#     name,
#     COUNT(*) as occurrence_count,
#     STDDEV(amount) as amount_variance,
#     AVG(date - LAG(date) OVER (PARTITION BY name ORDER BY date)) as avg_days_between
#   FROM transactions
#   WHERE amount < 0
#   GROUP BY name
#   HAVING COUNT(*) >= 3
#   AND STDDEV(amount) < 0.50  -- Amount variance < $0.50
#   AND AVG(date - LAG(date)) BETWEEN 25 AND 35  -- Monthly cadence
# )
# SELECT * FROM recurring_patterns
# ```
# This query detects subscriptions based on:
# 1. Merchant appears ≥3 times
# 2. Amount variance <$0.50 (consistent pricing)
# 3. 25-35 day cadence (monthly billing)

# Implementation Notes:
# - MVP: Manually categorize via Plaid category ("Service", "Subscription")
# - FUTURE: ML-based subscription detection (pattern matching)
# - FUTURE: Subscription cancellation workflow
# - FUTURE: Subscription cost alerts ("$50/month on streaming!")
# - FUTURE: Unused subscription detection (gym charged but no activity)

# Test Data Notes:
# - 3 subscriptions with perfect monthly patterns
# - Netflix: $15.99 on 5th of each month
# - Spotify: $10.99 on 12th of each month
# - Planet Fitness: $24.99 on 14th of each month
# - Exactly 30-31 days between charges (realistic monthly billing)
# - Exact same amounts (subscriptions rarely change mid-month)
# - Non-subscription contrast data:
#   - Amazon: One-time purchase (no pattern)
#   - Olive Garden: One-time restaurant (no pattern)
#   - Whole Foods: Recurring merchant, VARYING amounts (NOT subscription)

# Edge Cases Covered:
# 1. Multiple subscriptions (not just one)
# 2. Different billing dates (5th, 12th, 14th)
# 3. Different subscription types (entertainment, fitness)
# 4. Varying month lengths (Sep 30 days, Oct 31 days, Nov 30 days)
# 5. Non-subscription recurring merchants (Whole Foods)
# 6. One-time purchases (Amazon, restaurant)

# Known Limitations:
# - No subscription linking (future Issue #335)
# - No annual billing detection (only monthly)
# - No price change detection (e.g., Netflix $15.99 → $17.99)
# - No subscription pause/resume (e.g., gym frozen for 2 months)

# Future Enhancements (Issue #335 - Subscription Management):
# - Automatic subscription detection algorithm
# - Subscription dashboard ("You have 9 subscriptions totaling $52.97/month")
# - Cancellation workflow (link to merchant cancellation pages)
# - Unused subscription alerts (gym charged but no visits)
# - Price change alerts ("Netflix increased to $17.99")
# - Annual billing support (Adobe $599/year)
# - Shared subscriptions (Netflix family plan)
# - Subscription budget category (separate from entertainment)

# CRITICAL Validations:
# - This scenario is a regression test for subscription detection logic
# - Validates that backend can identify recurring patterns
# - Ensures non-subscriptions (varying amounts) are NOT detected
# - Confirms monthly cadence detection (28-32 days)
# - Essential for subscription audit feature (Phase 3-4)

# User Stories Enabled:
# 1. "Show me all my subscriptions and total monthly cost"
# 2. "Alert me when a subscription renews"
# 3. "Highlight subscriptions I haven't used in 3 months"
# 4. "Compare my subscription spending to national average"
# 5. "Suggest subscriptions to cancel to reach savings goal"

# Subscription Categories (Plaid PFC):
# - ENTERTAINMENT_MOVIES: Netflix, Hulu, HBO, Disney+
# - ENTERTAINMENT_MUSIC: Spotify, Apple Music, Pandora
# - GENERAL_SERVICES_OTHER: Amazon Prime, iCloud, Dropbox, Adobe
# - PERSONAL_CARE_GYM: Planet Fitness, LA Fitness, Peloton
# - FOOD_AND_DRINK_COFFEE: Coffee subscriptions (e.g., Blue Bottle)
# - GENERAL_MERCHANDISE_SUBSCRIPTION_BOXES: BirchBox, Dollar Shave Club
