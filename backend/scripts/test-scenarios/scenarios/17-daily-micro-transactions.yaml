  # Execution steps
  steps:
    - action: "wait"
      description: "No webhook - this is a micro-transaction pattern validation scenario"
      wait_seconds: 1

  # Assertions
  assertions:
    database:
      # Total of 20 micro-transactions
      transactions_count: 20

    custom:
      # CRITICAL: All transactions should be <$5
      - description: "All transactions should be under $5.00 (micro-transactions)"
        query: |
          SELECT COUNT(*) as over_five_count
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
          AND ABS(amount) >= 5.00
        expected:
          over_five_count: 0

      # Verify maximum amount is <$5.25
      - description: "Maximum transaction should be ≤$5.25"
        query: |
          SELECT MAX(ABS(amount)) as max_amount
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
        expected_max:
          max_amount: 5.25

      # Verify minimum amount (parking meter $2)
      - description: "Minimum transaction should be $2.00 (parking meter)"
        query: |
          SELECT MIN(ABS(amount)) as min_amount
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
        expected:
          min_amount: 2.00

      # Average micro-transaction amount
      - description: "Average micro-transaction should be ~$3.85"
        query: |
          SELECT ROUND(AVG(ABS(amount)), 2) as avg_amount
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
        expected_min:
          avg_amount: 3.50
        expected_max:
          avg_amount: 4.20

      # Total micro-spending (should add up!)
      - description: "Total micro-spending should be ~$77 (20 transactions × $3.85 avg)"
        query: |
          SELECT SUM(ABS(amount)) as total_micro_spending
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
        expected_min:
          total_micro_spending: 70.00
        expected_max:
          total_micro_spending: 85.00

      # Coffee transactions (should be 10 - daily habit)
      - description: "Should have 10 coffee purchases (daily habit)"
        query: |
          SELECT COUNT(*) as coffee_count
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_COFFEE'
        expected:
          coffee_count: 10

      # Transit transactions (should be 6)
      - description: "Should have 6 transit purchases (CTA Ventra)"
        query: |
          SELECT COUNT(*) as transit_count
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
          AND personal_finance_category->>'detailed' = 'TRANSPORTATION_PUBLIC_TRANSIT'
        expected:
          transit_count: 6

      # Snack transactions (should be 4)
      - description: "Should have 4 snack/fast food purchases"
        query: |
          SELECT COUNT(*) as snack_count
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_FAST_FOOD'
        expected:
          snack_count: 4

      # High frequency (multiple transactions on same day)
      - description: "Should have at least 3 days with multiple transactions (high frequency)"
        query: |
          SELECT COUNT(*) as multi_txn_days
          FROM (
            SELECT date, COUNT(*) as txn_count
            FROM transactions
            WHERE user_id = 'test-user-micro-001'
            GROUP BY date
            HAVING COUNT(*) > 1
          ) daily_counts
        expected_min:
          multi_txn_days: 3

      # Total coffee spending (10 coffees × ~$4.85 avg)
      - description: "Total coffee spending should be ~$48.50"
        query: |
          SELECT SUM(ABS(amount)) as total_coffee
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_COFFEE'
        expected_min:
          total_coffee: 45.00
        expected_max:
          total_coffee: 52.00

      # Total transit spending (6 rides × $3.00)
      - description: "Total transit spending should be exactly $18.00"
        query: |
          SELECT SUM(ABS(amount)) as total_transit
          FROM transactions
          WHERE user_id = 'test-user-micro-001'
          AND personal_finance_category->>'detailed' = 'TRANSPORTATION_PUBLIC_TRANSIT'
        expected:
          total_transit: 18.00

      # Latte Factor calculation (monthly projection)
      - description: "Monthly coffee projection (10 coffees × 2 weeks × 2 = ~$194/month)"
        query: |
          WITH coffee_spending AS (
            SELECT SUM(ABS(amount)) / 10 * 20 as monthly_projection
            FROM transactions
            WHERE user_id = 'test-user-micro-001'
            AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_COFFEE'
          )
          SELECT ROUND(monthly_projection, 2) as monthly_coffee
          FROM coffee_spending
        expected_min:
          monthly_coffee: 90.00
        expected_max:
          monthly_coffee: 105.00

# Expected Outcomes:
# 1. 20 transactions, ALL <$5.00
# 2. Maximum transaction: ≤$5.25
# 3. Minimum transaction: $2.00
# 4. Average: ~$3.85
# 5. Total micro-spending: ~$77
# 6. Coffee: 10 transactions (~$48.50)
# 7. Transit: 6 transactions ($18.00)
# 8. Snacks: 4 transactions (~$10.50)
# 9. High frequency: 3+ days with multiple transactions
# 10. Monthly coffee projection: ~$97 (the "latte factor"!)

# Real-World Business Value:
# - The "Latte Factor" concept popularized by David Bach:
#   - Small daily purchases seem insignificant ($4.85 coffee)
#   - But accumulate to substantial monthly/yearly totals
#   - Example: $4.85 coffee × 20 workdays = $97/month = $1,164/year!
#   - Users often underestimate micro-spending by 50-70%
# - This scenario enables:
#   1. **Spending awareness**: "You spent $77 on micro-purchases in 10 days!"
#   2. **Monthly projection**: "At this rate, $154/month on small purchases"
#   3. **Savings opportunities**: "Skip 5 coffees/month = $25 saved = $300/year"
#   4. **Habit tracking**: "Daily coffee habit costs $1,164/year"
#   5. **Category insights**: "63% of micro-spending is coffee"
#   6. **Budget impact**: "Micro-purchases = 15% of monthly budget"

# Latte Factor Insights:
# - **Daily**: $3.85 average × 2 transactions = $7.70/day
# - **Weekly**: $7.70 × 5 workdays = $38.50/week
# - **Monthly**: $38.50 × 4 weeks = $154/month
# - **Yearly**: $154 × 12 months = $1,848/year!
# - Savings potential: Skip 1 coffee/day = $1,164/year saved

# Micro-transaction Categories:
# 1. **Coffee** ($3-5): Daily habit, largest micro-spending category
# 2. **Transit** ($3): Regular commute, fixed cost
# 3. **Snacks** ($2-4): Impulse purchases, vending machines, fast food
# 4. **Parking** ($2): Meters, short-term parking
# 5. **Digital purchases** ($1-5): Apps, in-app purchases
# 6. **Tips** ($1-3): Small tips for delivery, coffee

# Implementation Notes:
# - MVP: Simple <$5 threshold
# - FUTURE: Daily micro-spending dashboard
# - FUTURE: Monthly projection calculator
# - FUTURE: Savings goal integration ("Save $100/month → skip 20 coffees")
# - FUTURE: Habit tracking ("Coffee 5x/week for 12 weeks")
# - FUTURE: Budget alerts ("Micro-spending >$150/month")

