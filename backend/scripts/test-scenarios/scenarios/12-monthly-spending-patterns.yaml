  # Execution steps
  steps:
    - action: "wait"
      description: "No webhook - this is a data quality validation scenario"
      wait_seconds: 1

  # Assertions
  assertions:
    database:
      # Exactly 60 transactions
      transactions_count: 60

    custom:
      # CRITICAL: Transaction distribution across days (not clustered)
      - description: "Transactions should span at least 25 of 30 days (realistic distribution)"
        query: |
          SELECT COUNT(DISTINCT date) as unique_days
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
        expected_min:
          unique_days: 25

      # Category diversity (at least 8 primary categories)
      - description: "Should have at least 8 different primary PFC categories"
        query: |
          SELECT COUNT(DISTINCT
            (personal_finance_category->>'primary')
          ) as unique_categories
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
        expected_min:
          unique_categories: 8

      # Groceries (should be ~12 transactions, weekly pattern)
      - description: "Should have 10-15 grocery transactions (weekly shopping)"
        query: |
          SELECT COUNT(*) as grocery_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_GROCERIES'
        expected_range:
          grocery_count: [10, 15]

      # Restaurants (should be ~10 transactions)
      - description: "Should have 8-12 restaurant transactions"
        query: |
          SELECT COUNT(*) as restaurant_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND (
            personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_RESTAURANTS'
            OR personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_FAST_FOOD'
          )
        expected_range:
          restaurant_count: [8, 12]

      # Gas (should be ~8 transactions, twice per week)
      - description: "Should have 6-10 gas station transactions"
        query: |
          SELECT COUNT(*) as gas_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND personal_finance_category->>'detailed' = 'TRANSPORTATION_GAS'
        expected_range:
          gas_count: [6, 10]

      # Subscriptions (should be ~9 transactions)
      - description: "Should have 8-10 subscription transactions"
        query: |
          SELECT COUNT(*) as subscription_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND category @> '["Service", "Subscription"]'::jsonb
        expected_range:
          subscription_count: [8, 10]

      # Coffee (should be ~6 transactions)
      - description: "Should have 5-8 coffee shop transactions"
        query: |
          SELECT COUNT(*) as coffee_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_COFFEE'
        expected_range:
          coffee_count: [5, 8]

      # Income (should be 2 paychecks)
      - description: "Should have exactly 2 income transactions (bi-weekly paychecks)"
        query: |
          SELECT COUNT(*) as income_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND amount > 0
          AND personal_finance_category->>'primary' = 'INCOME'
        expected:
          income_count: 2

      # Pending transactions (should be 2-4 pending)
      - description: "Should have 2-4 pending transactions"
        query: |
          SELECT COUNT(*) as pending_count
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
          AND pending = true
        expected_range:
          pending_count: [2, 4]

      # Amount ranges (groceries $30-$220)
      - description: "Grocery amounts should be in realistic range ($30-$250)"
        query: |
          SELECT
            MIN(ABS(amount)) as min_grocery,
            MAX(ABS(amount)) as max_grocery
          FROM transactions
          WHERE user_id = 'test-user-monthly-001'
