# Scenario 16: Category Override & Manual Edits
# Tests user manual category changes - override Plaid's auto-categorization with custom categories
# CRITICAL: Validates user customization preservation across DEFAULT_UPDATE syncs

version: "1.0"

scenario:
  name: "Category Override & Manual Edits"
  description: "Test user manual category overrides - preserve custom categories and user notes across sync updates"
  category: "edge_case"
  priority: "low"

  tags:
    - "category_override"
    - "manual_edits"
    - "user_customization"
    - "data_preservation"
    - "update_sync"
    - "tier:premium"

  # Setup test data
  setup:
    user:
      id: "test-user-category-001"
      tier: "premium"
      email: "category-test@example.com"
      auth0_user_id: "auth0|test-category-001"

    linked_items:
      - id: "test-item-category-001"
        user_id: "test-user-category-001"
        item_id: "plaid-item-category-001"
        institution_name: "Chase"
        institution_id: "ins_3"
        cursor: "cursor-category-sync"
        status: "active"

    accounts:
      - id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        user_id: "test-user-category-001"
        plaid_account_id: "plaid-acc-category-001"
        name: "Chase Sapphire Reserve"
        official_name: "Chase Sapphire Reserve Credit Card"
        type: "credit"
        subtype: "credit card"
        current_balance: -1250.00

    # Pre-populate 8 transactions with various category scenarios:
    # 1. User overrode Plaid category (should preserve override)
    # 2. User added notes (should preserve notes - tested in Scenario 03)
    # 3. User overrode category + added notes (both should preserve)
    # 4. Plaid category unchanged (should allow Plaid updates)
    transactions:
      # ==============================================================================
      # CATEGORY OVERRIDES (user manually changed from Plaid default)
      # ==============================================================================

      # Transaction 1: Costco - Plaid says "FOOD_AND_DRINK_GROCERIES", user changed to "GENERAL_MERCHANDISE"
      # User thinks: "I bought electronics at Costco, not groceries"
      - external_transaction_id: "plaid-category-override-001"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -285.00
        date: "2025-11-10"
        name: "Costco Wholesale"
        # Plaid's original category (will be in DEFAULT_UPDATE):
        category: ["Shops", "Warehouses and Wholesale Stores"]
        # User's override (stored in database):
        personal_finance_category:
          primary: "GENERAL_MERCHANDISE"
          detailed: "GENERAL_MERCHANDISE_ELECTRONICS"
        user_category_override: true  # Flag indicating user manually changed this
        payment_channel: "in store"
        pending: false

      # Transaction 2: Amazon - Plaid says "GENERAL_MERCHANDISE_ONLINE", user changed to "ENTERTAINMENT"
      # User thinks: "I bought books and streaming device, it's entertainment"
      - external_transaction_id: "plaid-category-override-002"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -129.99
        date: "2025-11-12"
        name: "Amazon.com"
        category: ["Shops", "Digital Purchase"]
        # User's override:
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_OTHER"
        user_category_override: true
        payment_channel: "online"
        pending: false

      # Transaction 3: Target - Plaid says "GENERAL_MERCHANDISE", user changed to "FOOD_AND_DRINK_GROCERIES"
      # User thinks: "I only bought groceries at Target this time"
      - external_transaction_id: "plaid-category-override-003"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -87.50
        date: "2025-11-15"
        name: "Target"
        category: ["Shops", "Department Stores"]
        # User's override:
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_GROCERIES"
        user_category_override: true
        payment_channel: "in store"
        pending: false

      # ==============================================================================
      # CATEGORY OVERRIDE + USER NOTES (both should be preserved)
      # ==============================================================================

      # Transaction 4: Shell Gas - Plaid correct, but user added note + custom subcategory
      - external_transaction_id: "plaid-category-override-004"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -42.00
        date: "2025-11-08"
        name: "Shell Gas Station"
        category: ["Travel", "Gas Stations"]
        # User kept primary, changed detailed:
        personal_finance_category:
          primary: "TRANSPORTATION"
          detailed: "TRANSPORTATION_GAS"
        user_category_override: false  # Agrees with Plaid
        user_notes: "Road trip to Chicago - deductible business travel"
        payment_channel: "in store"
        pending: false

      # Transaction 5: Whole Foods - User override + notes
      # Plaid: "FOOD_AND_DRINK_GROCERIES", User: "MEDICAL" (vitamins/supplements)
      - external_transaction_id: "plaid-category-override-005"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -67.50
        date: "2025-11-14"
        name: "Whole Foods Market"
        category: ["Shops", "Food and Beverage Store", "Supermarkets and Groceries"]
        # User's override (bought vitamins/supplements):
        personal_finance_category:
          primary: "MEDICAL"
          detailed: "MEDICAL_HEALTHCARE_SERVICES"
        user_category_override: true
        user_notes: "Vitamins and supplements - HSA reimbursable"
        payment_channel: "in store"
        pending: false

      # ==============================================================================
      # NO USER OVERRIDE (Plaid category accepted, should allow updates)
      # ==============================================================================

      # Transaction 6: Starbucks - User accepts Plaid category
      - external_transaction_id: "plaid-category-no-override-001"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -5.45
        date: "2025-11-16"
        name: "Starbucks"
        category: ["Food and Drink", "Restaurants", "Coffee Shop"]
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_COFFEE"
        user_category_override: false
        payment_channel: "in store"
        pending: false

      # Transaction 7: Chipotle - User accepts Plaid category (no override)
      - external_transaction_id: "plaid-category-no-override-002"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -12.50
        date: "2025-11-18"
        name: "Chipotle Mexican Grill"
        category: ["Food and Drink", "Restaurants", "Fast Food"]
        personal_finance_category:
          primary: "FOOD_AND_DRINK"
          detailed: "FOOD_AND_DRINK_RESTAURANTS"
        user_category_override: false
        payment_channel: "in store"
        pending: false

      # Transaction 8: Netflix - User accepts Plaid category
      - external_transaction_id: "plaid-category-no-override-003"
        user_id: "test-user-category-001"
        account_id: "test-account-category-001"
        linked_item_id: "test-item-category-001"
        amount: -15.99
        date: "2025-11-05"
        name: "Netflix"
        category: ["Service", "Subscription"]
        personal_finance_category:
          primary: "ENTERTAINMENT"
          detailed: "ENTERTAINMENT_MOVIES"
        user_category_override: false
        payment_channel: "other"
        pending: false

  # Execution steps
  steps:
    - action: "fire_webhook"
      description: "Trigger DEFAULT_UPDATE - Plaid sends MODIFIED transactions (amounts/dates may change)"
      webhook_code: "DEFAULT_UPDATE"
      item_id: "plaid-item-category-001"
      # Plaid may send category updates, but user overrides should be preserved

    - action: "wait"
      description: "Wait for sync to process updates while preserving user customizations"
      wait_seconds: 8

  # Assertions
  assertions:
    database:
      # Should still have 8 transactions (no duplicates)
      transactions_count: 8

    webhook_status:
      processed: true
      error: null

    custom:
      # ==============================================================================
      # CRITICAL: Verify user category overrides are PRESERVED (not overwritten by Plaid)
      # ==============================================================================

      # Transaction 1: Costco override preserved (user: GENERAL_MERCHANDISE, Plaid: FOOD_AND_DRINK)
      - description: "Costco user override should be preserved (GENERAL_MERCHANDISE, not FOOD_AND_DRINK)"
        query: |
          SELECT
            personal_finance_category->>'primary' as primary_category,
            personal_finance_category->>'detailed' as detailed_category,
            user_category_override
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND name = 'Costco Wholesale'
        expected:
          primary_category: "GENERAL_MERCHANDISE"
          detailed_category: "GENERAL_MERCHANDISE_ELECTRONICS"
          user_category_override: true

      # Transaction 2: Amazon override preserved (user: ENTERTAINMENT, Plaid: GENERAL_MERCHANDISE)
      - description: "Amazon user override should be preserved (ENTERTAINMENT, not GENERAL_MERCHANDISE)"
        query: |
          SELECT
            personal_finance_category->>'primary' as primary_category,
            user_category_override
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND name = 'Amazon.com'
        expected:
          primary_category: "ENTERTAINMENT"
          user_category_override: true

      # Transaction 3: Target override preserved (user: FOOD_AND_DRINK, Plaid: GENERAL_MERCHANDISE)
      - description: "Target user override should be preserved (FOOD_AND_DRINK_GROCERIES)"
        query: |
          SELECT
            personal_finance_category->>'primary' as primary_category,
            personal_finance_category->>'detailed' as detailed_category
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND name = 'Target'
        expected:
          primary_category: "FOOD_AND_DRINK"
          detailed_category: "FOOD_AND_DRINK_GROCERIES"

      # Transaction 5: Whole Foods override + notes both preserved
      - description: "Whole Foods override (MEDICAL) and notes should both be preserved"
        query: |
          SELECT
            personal_finance_category->>'primary' as primary_category,
            user_notes,
            user_category_override
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND name = 'Whole Foods Market'
        expected:
          primary_category: "MEDICAL"
          user_notes: "Vitamins and supplements - HSA reimbursable"
          user_category_override: true

      # ==============================================================================
      # Verify user notes preserved (builds on Scenario 03)
      # ==============================================================================

      # Transaction 4: Shell Gas notes preserved
      - description: "Shell Gas user notes should be preserved across sync"
        query: |
          SELECT user_notes
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND name = 'Shell Gas Station'
        expected:
          user_notes: "Road trip to Chicago - deductible business travel"

      # ==============================================================================
      # Verify non-override transactions (Plaid categories accepted)
      # ==============================================================================

      # Transaction 6: Starbucks - Plaid category unchanged
      - description: "Starbucks should keep Plaid category (FOOD_AND_DRINK_COFFEE)"
        query: |
          SELECT
            personal_finance_category->>'primary' as primary_category,
            personal_finance_category->>'detailed' as detailed_category,
            user_category_override
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND name = 'Starbucks'
        expected:
          primary_category: "FOOD_AND_DRINK"
          detailed_category: "FOOD_AND_DRINK_COFFEE"
          user_category_override: false

      # ==============================================================================
      # Count overrides vs Plaid-default
      # ==============================================================================

      # Should have exactly 3 user category overrides
      - description: "Should have exactly 3 transactions with user category overrides"
        query: |
          SELECT COUNT(*) as override_count
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND user_category_override = true
        expected:
          override_count: 3

      # Should have 5 transactions with Plaid categories (no override)
      - description: "Should have 5 transactions accepting Plaid categories"
        query: |
          SELECT COUNT(*) as plaid_category_count
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND user_category_override = false
        expected:
          plaid_category_count: 5

      # Verify no null categories
      - description: "All transactions should have valid categories (no nulls)"
        query: |
          SELECT COUNT(*) as null_category_count
          FROM transactions
          WHERE user_id = 'test-user-category-001'
          AND (
            personal_finance_category IS NULL
            OR personal_finance_category->>'primary' IS NULL
          )
        expected:
          null_category_count: 0

# Expected Outcomes:
# 1. Webhook processed successfully without errors
# 2. All 8 transactions preserved (no duplicates)
# 3. 3 user category overrides PRESERVED (Costco, Amazon, Target)
# 4. User notes preserved (Shell Gas, Whole Foods)
# 5. Both category override + notes preserved together (Whole Foods)
# 6. 5 Plaid-default categories unchanged (Starbucks, Chipotle, Netflix, etc.)
# 7. No null categories
# 8. user_category_override flag correctly maintained

# Real-World Business Value:
# - Users often disagree with Plaid's auto-categorization:
#   1. **Multi-purpose merchants**: Costco sells groceries AND electronics AND clothing
#   2. **Context matters**: Target trip for groceries vs clothing vs home goods
#   3. **Personal interpretation**: Amazon books = entertainment OR education?
#   4. **Tax purposes**: Vitamins at Whole Foods = medical expense (HSA eligible)
#   5. **Business expenses**: Gas for work trip = transportation vs business expense
# - This scenario enables:
#   1. **User control**: "I know this better than AI"
#   2. **Budget accuracy**: Groceries vs entertainment vs medical (tax deductions)
#   3. **Reporting flexibility**: Year-end tax prep, expense reports
#   4. **Data preservation**: Updates don't overwrite user customizations
#   5. **Hybrid approach**: Accept Plaid for most, override when needed

# Category Override Use Cases:
# 1. **Costco electronics**: Plaid sees "Warehouses" → groceries, user corrects to electronics
# 2. **Amazon books**: Plaid sees "Online shopping" → general, user sets to entertainment/education
# 3. **Whole Foods supplements**: Plaid sees groceries, user sets to medical (HSA reimbursable)
# 4. **Target groceries**: Plaid sees department store, user narrows to groceries
# 5. **Business travel gas**: Plaid sees transportation, user sets to business expense

# Implementation Notes:
# - **Database schema** needs:
#   - `user_category_override` BOOLEAN (flag indicating manual change)
#   - UPDATE query must check this flag: IF user_category_override = false THEN update category
#   - user_notes already preserved (Scenario 03)
# - **Backend logic** (processModified()):
#   ```go
#   if !existingTxn.UserCategoryOverride {
#       // User hasn't overridden, safe to update with Plaid's category
#       txn.PersonalFinanceCategory = plaidTxn.PersonalFinanceCategory
#   } else {
#       // User overrode, preserve their choice, ignore Plaid update
#       log.Info("Preserving user category override", "txn_id", txn.ID)
#   }
#   // Always preserve user_notes (tested in Scenario 03)
#   txn.UserNotes = existingTxn.UserNotes
#   ```
# - **UI** needs:
#   - Category dropdown (Plaid taxonomy + custom categories)
#   - "Override Plaid Category" button
#   - Visual indicator (e.g., pencil icon) for overridden categories
#   - Tooltip: "You manually changed this category"

# Test Data Notes:
# - 8 transactions with mix of scenarios
# - 3 with user category overrides (Costco, Amazon, Target)
# - 1 with user notes only (Shell Gas)
# - 1 with both override + notes (Whole Foods)
# - 3 with Plaid categories accepted (Starbucks, Chipotle, Netflix)
# - Realistic override reasons (multi-purpose merchant, tax categorization)

# Edge Cases Covered:
# 1. User override primary category (Costco: FOOD → GENERAL_MERCHANDISE)
# 2. User override detailed category (Amazon: ONLINE → ENTERTAINMENT)
# 3. User override + notes together (Whole Foods)
# 4. User accepts Plaid category (no override)
# 5. Mixed transactions (some overridden, some not)

# Database Schema Requirements:
# ```sql
# ALTER TABLE transactions
# ADD COLUMN user_category_override BOOLEAN DEFAULT false;
#
# -- Index for fast filtering
# CREATE INDEX idx_transactions_category_override
# ON transactions(user_id, user_category_override);
# ```

# Future Enhancements (Issue #340 - Category Management):
# - Custom category creation (not just Plaid taxonomy)
# - Category rules ("Always categorize Costco as groceries")
# - Bulk category updates ("Change all Amazon to entertainment")
# - Category suggestions ("You often override this merchant to X")
# - Machine learning ("Learn user's category preferences")
# - Category hierarchy (custom subcategories under Plaid primary)

# Known Limitations:
# - MVP: Only override within Plaid taxonomy
# - FUTURE: Custom categories outside Plaid (user-defined)
# - Current: No category rules ("always categorize X as Y")
# - Current: Manual override per transaction (no bulk updates)

# CRITICAL Validations:
# - This scenario is a regression test for data preservation bugs
# - Validates that UPDATE queries respect user_category_override flag
# - Ensures category overrides + user notes both preserved (combined test)
# - Confirms Plaid categories still update when not overridden
# - Essential for user trust ("my edits won't be lost")

# User Stories Enabled:
# 1. "I bought electronics at Costco, not groceries - let me fix the category"
# 2. "Amazon books should be entertainment, not general shopping"
# 3. "My Whole Foods vitamins are medical expenses (HSA eligible)"
# 4. "This gas purchase was for a business trip, not personal transportation"
# 5. "Don't overwrite my category changes when Plaid syncs updates"

# Backend UPDATE Query Pattern:
# ```go
# // In processModified()
# updates := map[string]interface{}{
#     "amount":         plaidTxn.Amount,
#     "date":           plaidTxn.Date,
#     "pending":        plaidTxn.Pending,
# }
#
# // Only update category if user hasn't overridden
# if !existingTxn.UserCategoryOverride {
#     updates["personal_finance_category"] = plaidTxn.PersonalFinanceCategory
# }
#
# // ALWAYS preserve user_notes (Scenario 03)
# // Don't include user_notes in updates map (leave as-is)
#
# db.Model(&Transaction{}).Where("id = ?", existingTxn.ID).Updates(updates)
# ```
