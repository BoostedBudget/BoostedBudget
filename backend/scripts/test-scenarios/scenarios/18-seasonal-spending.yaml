  # Execution steps
  steps:
    - action: "wait"
      description: "No webhook - this is a seasonal pattern validation scenario"
      wait_seconds: 1

  # Assertions
  assertions:
    database:
      # Total of 18 transactions
      transactions_count: 18

    custom:
      # CRITICAL: Thanksgiving week spending should be >$500 (spike)
      - description: "Thanksgiving week (Nov 22-27) spending should exceed $500"
        query: |
          SELECT SUM(ABS(amount)) as thanksgiving_week_spending
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND date BETWEEN '2025-11-22' AND '2025-11-27'
        expected_min:
          thanksgiving_week_spending: 500.00

      # CRITICAL: Black Friday weekend should have large purchases (>$700)
      - description: "Black Friday weekend (Nov 28-30) spending should exceed $700"
        query: |
          SELECT SUM(ABS(amount)) as black_friday_spending
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND date BETWEEN '2025-11-28' AND '2025-11-30'
        expected_min:
          black_friday_spending: 700.00

      # Normal week (Nov 1-7) baseline spending
      - description: "Normal week 1 (Nov 1-7) baseline should be $200-300"
        query: |
          SELECT SUM(ABS(amount)) as week1_spending
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND date BETWEEN '2025-11-01' AND '2025-11-07'
        expected_range:
          week1_spending: [200.00, 300.00]

      # Thanksgiving grocery spike (Costco $285)
      - description: "Largest single Thanksgiving grocery purchase should be >$250 (Costco)"
        query: |
          SELECT MAX(ABS(amount)) as max_grocery
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_GROCERIES'
          AND date BETWEEN '2025-11-22' AND '2025-11-27'
        expected_min:
          max_grocery: 250.00

      # Black Friday largest purchase (laptop $799)
      - description: "Largest Black Friday purchase should be >$700 (electronics)"
        query: |
          SELECT MAX(ABS(amount)) as max_black_friday
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND date = '2025-11-28'
        expected_min:
          max_black_friday: 700.00

      # Category shift: More shopping, less dining during holidays
      - description: "Shopping transactions should increase in second half of month"
        query: |
          WITH first_half AS (
            SELECT COUNT(*) as count
            FROM transactions
            WHERE user_id = 'test-user-seasonal-001'
            AND date BETWEEN '2025-11-01' AND '2025-15'
            AND personal_finance_category->>'primary' = 'GENERAL_MERCHANDISE'
          ),
          second_half AS (
            SELECT COUNT(*) as count
            FROM transactions
            WHERE user_id = 'test-user-seasonal-001'
            AND date BETWEEN '2025-11-16' AND '2025-11-30'
            AND personal_finance_category->>'primary' = 'GENERAL_MERCHANDISE'
          )
          SELECT
            (SELECT count FROM second_half) as second_half_shopping,
            (SELECT count FROM first_half) as first_half_shopping
        expected_min:
          second_half_shopping: 4

      # Total grocery spending (Thanksgiving prep drives increase)
      - description: "Total November grocery spending should exceed $600"
        query: |
          SELECT SUM(ABS(amount)) as total_grocery
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND personal_finance_category->>'detailed' = 'FOOD_AND_DRINK_GROCERIES'
        expected_min:
          total_grocery: 600.00

      # Online shopping concentration during Black Friday weekend
      - description: "Should have 3+ online shopping transactions during Black Friday weekend"
        query: |
          SELECT COUNT(*) as online_shopping_count
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
          AND date BETWEEN '2025-11-28' AND '2025-11-30'
          AND payment_channel = 'online'
        expected_min:
          online_shopping_count: 3

      # Total monthly spending (November should be higher than typical month)
      - description: "Total November spending should exceed $2500 (holiday impact)"
        query: |
          SELECT SUM(ABS(amount)) as total_november
          FROM transactions
          WHERE user_id = 'test-user-seasonal-001'
        expected_min:
          total_november: 2500.00

      # Week-over-week spending increase
      - description: "Week 4 spending should be 2× week 1 spending (holiday spike)"
        query: |
          WITH week1 AS (
            SELECT SUM(ABS(amount)) as spending
            FROM transactions
            WHERE user_id = 'test-user-seasonal-001'
            AND date BETWEEN '2025-11-01' AND '2025-11-07'
          ),
          week4 AS (
            SELECT SUM(ABS(amount)) as spending
            FROM transactions
            WHERE user_id = 'test-user-seasonal-001'
            AND date BETWEEN '2025-11-22' AND '2025-11-27'
          )
          SELECT
            (SELECT spending FROM week4) / (SELECT spending FROM week1) as multiplier
        expected_min:
          multiplier: 2.0

# Expected Outcomes:
# 1. 18 transactions across November with clear seasonal patterns
# 2. Week 1-2: Normal spending (~$400/week baseline)
# 3. Week 3: Pre-holiday increase (~$650 - gift shopping starts)
# 4. Thanksgiving week: SPIKE (~$900 - groceries $441, travel $96)
# 5. Black Friday weekend: SURGE (~$850 in 3 days - shopping deals)
# 6. Total November: >$2500 (vs ~$1600 typical month = 56% increase!)
# 7. Category shift: More shopping (GENERAL_MERCHANDISE), groceries spike
# 8. Largest purchases: Costco $285 (Thanksgiving), Best Buy $799 (Black Friday)
# 9. Week 4 spending 2× week 1 (holiday multiplier effect)
# 10. Online shopping concentration during Black Friday weekend

# Real-World Business Value:
# - Holiday spending patterns are CRITICAL for budget planning:
#   1. **Thanksgiving**: Groceries spike 200-300% ($285 vs $98 typical)
#   2. **Black Friday**: Largest shopping day of year ($1,050+ in deals)
#   3. **November total**: 56% higher than typical month
#   4. **Year-over-year**: Compare Nov 2024 vs Nov 2025 (inflation, lifestyle)
#   5. **Budget warnings**: "On track to spend $2,800 in November (40% over budget)"
#   6. **Savings goals**: "Save $500 in Oct → spend extra in Nov without guilt"
#   7. **Category insights**: "Groceries $600 (vs $400 typical) = Thanksgiving prep"

# Seasonal Patterns:
# - **January**: Gym memberships spike (New Year's resolutions)
# - **February**: Valentine's Day (restaurants, gifts)
# - **April**: Tax preparation (H&R Block, TurboTax)
# - **May**: Mother's Day, graduation gifts
# - **July**: Summer travel peak
# - **August**: Back-to-school shopping
# - **November**: Thanksgiving + Black Friday
# - **December**: Christmas shopping spike (highest spending month)

# Holiday Spending Multipliers:
# - **Normal week**: $400 (baseline)
# - **Pre-holiday week**: $650 (1.6× baseline, gift shopping)
# - **Thanksgiving week**: $900 (2.25× baseline, groceries + travel)
# - **Black Friday weekend**: $850 in 3 days (2.8× weekly baseline!)
# - **November total**: $2,500+ (vs $1,600 typical = 1.56× multiplier)

