# BoostedBudget Test Scenarios - YAML Schema Definition
# This file documents the structure and format of scenario YAML files

# Schema version
schema_version: "1.0"

# ==============================================================================
# Scenario File Structure
# ==============================================================================
#
# Every scenario file must follow this structure:
#
# version: "1.0"                    # Schema version (required)
#
# scenario:
#   name: string                    # Scenario identifier (required)
#   description: string             # What this scenario tests (required)
#   category: string                # Category (required)
#   tags: [string]                  # Tags for filtering (optional)
#
#   setup:                          # Test data setup (required)
#     user: object                  # User configuration (required)
#     linked_items: [object]        # Linked items (required)
#     accounts: [object]            # Accounts (required)
#     transactions: [object]        # Pre-existing transactions (optional)
#
#   steps: [object]                 # Test execution steps (required)
#
#   assertions:                     # Validation checks (required)
#     database: object              # Database assertions (optional)
#     webhook_status: object        # Webhook status assertions (optional)
#     custom: [object]              # Custom assertions (optional)
#
# ==============================================================================

# Field Definitions

# ------------------------------------------------------------------------------
# scenario.category
# ------------------------------------------------------------------------------
# Valid values:
#   - "normal"       - Normal flow scenarios (happy path)
#   - "edge_case"    - Edge cases and boundary conditions
#   - "error"        - Error scenarios (expected failures)
#   - "tier_limit"   - Subscription tier limit testing
#   - "special"      - Special cases (complex, multi-step)

category_values:
  - "normal"
  - "edge_case"
  - "error"
  - "tier_limit"
  - "special"

# ------------------------------------------------------------------------------
# scenario.tags
# ------------------------------------------------------------------------------
# Example tags:
#   - "tier:free"           - Tests free tier
#   - "tier:premium"        - Tests premium tier
#   - "sync:first"          - First sync (INITIAL_UPDATE)
#   - "sync:incremental"    - Incremental sync (DEFAULT_UPDATE)
#   - "sync:historical"     - Historical sync (HISTORICAL_UPDATE)
#   - "pagination"          - Tests pagination (>500 transactions)
#   - "user_notes"          - Tests user notes preservation
#   - "error:login"         - Tests LOGIN_REQUIRED error
#   - "pending"             - Tests pending transactions

example_tags:
  tier:
    - "tier:free"
    - "tier:premium_lite"
    - "tier:premium"
    - "tier:premium_plus"

  sync_type:
    - "sync:first"
    - "sync:incremental"
    - "sync:historical"
    - "sync:removed"

  features:
    - "pagination"
    - "user_notes"
    - "pending_transactions"
    - "foreign_currency"
    - "refunds"

  errors:
    - "error:login"
    - "error:item_error"
    - "error:rate_limit"

# ------------------------------------------------------------------------------
# setup.user
# ------------------------------------------------------------------------------
# User object structure:

user_schema:
  id: "d57532c8-8b02-5908-a5c4-fd482076f242"
  tier: "string (required) - free|premium_lite|premium|premium_plus"
  email: "string (required) - User email"
  auth0_user_id: "string (optional) - Auth0 user ID (defaults to 'auth0|{id}')"
  created_at: "string (optional) - ISO timestamp"

  # Can reference templates:
  # <<: *free_user

# ------------------------------------------------------------------------------
# setup.linked_items
# ------------------------------------------------------------------------------
# Linked item object structure:

linked_item_schema:
  id: "8af8c036-9268-5fbf-a647-278bfbe6b432"
  user_id: "4b3473b2-59f7-5ebf-934c-bdd1472f430e"
  item_id: "603dd3c7-c68b-5583-ad83-d257bdf154cc"
  institution_name: "string (required) - Institution name"
  institution_id: "string (optional) - Plaid institution ID (default: 'ins_3')"
  cursor: "string|null (optional) - Sync cursor (default: null)"
  status: "string (optional) - active|error|login_required (default: 'active')"
  access_token_encrypted: "string (optional) - Encrypted token (generated if not provided)"

# ------------------------------------------------------------------------------
# setup.accounts
# ------------------------------------------------------------------------------
# Account object structure:

account_schema:
  id: "6f055170-eb66-54d0-82d2-cfb4e706d3c9"
  linked_item_id: "3b477653-12ba-5149-b25d-09360ac80af1"
  user_id: "4b3473b2-59f7-5ebf-934c-bdd1472f430e"
  plaid_account_id: "string (required) - Plaid account ID"
  name: "string (required) - Account name"
  official_name: "string (optional) - Official account name"
  type: "string (required) - depository|credit|loan|investment"
  subtype: "string (required) - checking|savings|credit card|etc"
  mask: "string (optional) - Last 4 digits (default: '0000')"
  current_balance: "number (required) - Current balance"
  available_balance: "number (optional) - Available balance (defaults to current_balance)"
  currency_code: "string (optional) - Currency code (default: 'USD')"

  # Can reference templates:
  # <<: *checking_account

# ------------------------------------------------------------------------------
# setup.transactions (optional)
# ------------------------------------------------------------------------------
# Pre-existing transaction object structure (for update/modify scenarios):

transaction_schema:
  user_id: "d57532c8-8b02-5908-a5c4-fd482076f242"
  account_id: "6f055170-eb66-54d0-82d2-cfb4e706d3c9"
  linked_item_id: "8af8c036-9268-5fbf-a647-278bfbe6b432"
  external_transaction_id: "string (required) - Plaid transaction ID"
  amount: "number (required) - Transaction amount (negative=debit, positive=credit)"
  date: "string (required) - Transaction date (YYYY-MM-DD)"
  name: "string (required) - Transaction name"
  payment_channel: "string (optional) - online|in store|other"
  pending: "boolean (optional) - Is pending (default: false)"
  user_notes: "string (optional) - User notes (for preservation testing)"

# ------------------------------------------------------------------------------
# steps
# ------------------------------------------------------------------------------
# Test execution steps array:

steps_schema:
  # Fire webhook action
  - action: "fire_webhook"
    webhook_code: "string (required) - INITIAL_UPDATE|DEFAULT_UPDATE|HISTORICAL_UPDATE|TRANSACTIONS_REMOVED"
    item_id: "1c93772c-0d78-58c6-9385-fb760d6fa4c4"

  # Wait action
  - action: "wait"
    wait_seconds: "number (required) - Seconds to wait"

  # Query database action (advanced)
  - action: "query_db"
    query: "string (required) - SQL query to execute"
    store_result_as: "string (optional) - Variable name to store result"

  # Custom bash command (advanced)
  - action: "run_command"
    command: "string (required) - Bash command to execute"
    expect_exit_code: "number (optional) - Expected exit code (default: 0)"

# ------------------------------------------------------------------------------
# assertions.database
# ------------------------------------------------------------------------------
# Database assertion object structure:

database_assertions_schema:
  transactions_count: "string|number - Expected count or comparison (e.g., '>= 1', '10')"
  sync_audits_count: "string|number - Expected sync audit count"
  user_notes: "string - Expected user notes value"
  cursor_updated: "boolean - Whether cursor should be updated"
  linked_item_status: "string - Expected linked item status"
  notifications_count: "string|number - Expected notification count"

# ------------------------------------------------------------------------------
# assertions.webhook_status
# ------------------------------------------------------------------------------
# Webhook status assertion object structure:

webhook_status_assertions_schema:
  processed: "boolean (required) - Should webhook be processed"
  error: "string|null - Expected error message (null if no error expected)"
  retry_count: "number (optional) - Expected retry count"

# ------------------------------------------------------------------------------
# assertions.custom
# ------------------------------------------------------------------------------
# Custom assertion array (advanced):

custom_assertions_schema:
  - type: "string (required) - Assertion type (sql_query|bash_command|function)"
    description: "string (required) - What this assertion checks"

    # For sql_query type:
    query: "string - SQL query to execute"
    expected_result: "string - Expected result"

    # For bash_command type:
    command: "string - Bash command to execute"
    expected_output: "string - Expected output"
    expected_exit_code: "number - Expected exit code"

    # For function type:
    function_name: "string - Assertion function to call (from assertions.sh)"
    arguments: "[string] - Function arguments"

# ==============================================================================
# Complete Example Scenario
# ==============================================================================

example_scenario:
  version: "1.0"

  scenario:
    name: "free-tier-first-sync"
    description: "Test first transaction sync for free tier user with 25 transactions"
    category: "normal"
    tags:
      - "tier:free"
      - "sync:first"

    setup:
      user:
        id: "ede25ef3-778f-5191-8ad8-f3e73e32457f"
        tier: "free"
        email: "freeuser001@test.com"

      linked_items:
        - id: "9e8024c6-098d-5540-b348-54fbd2ac71a7"
          user_id: "ede25ef3-778f-5191-8ad8-f3e73e32457f"
          item_id: "34628385-87e5-5067-97a5-248df6d6f1d0"
          institution_name: "Chase"
          cursor: null
          status: "active"

      accounts:
        - id: "a85c5981-3190-5718-b769-5cdc96249832"
          linked_item_id: "9e8024c6-098d-5540-b348-54fbd2ac71a7"
          user_id: "ede25ef3-778f-5191-8ad8-f3e73e32457f"
          plaid_account_id: "plaid-acc-checking-001"
          name: "Chase Checking"
          type: "depository"
          subtype: "checking"
          current_balance: 2500.00

    steps:
      - action: "fire_webhook"
        webhook_code: "INITIAL_UPDATE"
        item_id: "34628385-87e5-5067-97a5-248df6d6f1d0"

      - action: "wait"
        wait_seconds: 5

    assertions:
      database:
        transactions_count: ">= 1"
        sync_audits_count: 1

      webhook_status:
        processed: true
        error: null

# ==============================================================================
# Notes
# ==============================================================================
#
# - All paths are relative to backend/scripts/test-scenarios/
# - Scenarios can reference templates using YAML anchors (<<: *template_name)
# - Template files are in templates/ directory
# - See templates/users.yaml, templates/accounts.yaml, templates/transactions.yaml
# - Run scenarios with: ./run-scenario.sh scenarios/<filename>.yaml
# - Generate reports in reports/ directory (HTML and JSON)
#
# ==============================================================================
