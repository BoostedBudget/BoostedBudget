# Scenario 02: Pagination Multi-Page Sync
# Tests transaction sync with pagination (multiple pages of transactions)

version: "1.0"

scenario:
  name: "Pagination Multi-Page Sync"
  description: "Verify that transaction sync handles pagination correctly across multiple API calls"
  category: "pagination"
  priority: "critical"

  tags:
    - "transaction_sync"
    - "pagination"
    - "cursor"
    - "premium_tier"

  # Setup test data
  setup:
    user:
      id: "d4a00ee2-0f35-5d34-96e6-41887a223c20"
      tier: "premium"  # Premium for 2-year history (more transactions)
      email: "test-pagination@example.com"
      auth0_user_id: "auth0|test-pagination-001"

    linked_items:
      - id: "a38fba72-a0f0-5b27-9405-88a85fbd0f8b"
        user_id: "d4a00ee2-0f35-5d34-96e6-41887a223c20"
        item_id: "aca79736-0ee8-54ed-9767-ec6b2af8ce30"
        institution_name: "Bank of America"
        institution_id: "ins_4"
        cursor: null  # No cursor for first sync
        status: "active"

    accounts:
      - id: "7d50b914-75ae-5167-a80f-6fb673c6ed8f"
        linked_item_id: "a38fba72-a0f0-5b27-9405-88a85fbd0f8b"
        user_id: "d4a00ee2-0f35-5d34-96e6-41887a223c20"
        plaid_account_id: "plaid-acc-pagination-001"
        name: "BofA Advantage Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 5000.00

  # Execution steps
  steps:
    - action: "fire_webhook"
      description: "Trigger DEFAULT_UPDATE webhook (incremental sync with pagination)"
      webhook_code: "DEFAULT_UPDATE"
      item_id: "a38fba72-a0f0-5b27-9405-88a85fbd0f8b"

    - action: "wait"
      description: "Wait for paginated sync to complete (multiple API calls)"
      wait_seconds: 15

  # Assertions
  assertions:
    database:
      # Should have many transactions (Plaid returns lots of data for premium)
      transactions_count: ">= 10"

    webhook_status:
      processed: true
      error: null

    custom:
      # Verify cursor updated after pagination
      - description: "Cursor should be updated after paginated sync"
        query: |
          SELECT
            cursor IS NOT NULL as cursor_exists,
            LENGTH(cursor) > 10 as cursor_valid
          FROM linked_items
          WHERE id = 'test-item-pagination-001'
        expected:
          cursor_exists: true
          cursor_valid: true

      # Verify no duplicate transactions (pagination shouldn't double-insert)
      - description: "No duplicate transactions should exist (by external_transaction_id)"
        query: |
          SELECT COUNT(*) as duplicate_count
          FROM (
            SELECT external_transaction_id, COUNT(*) as cnt
            FROM transactions
            WHERE user_id = 'test-user-pagination-001'
            GROUP BY external_transaction_id
            HAVING COUNT(*) > 1
          ) duplicates
        expected:
          duplicate_count: 0

      # Verify transactions span reasonable date range
      - description: "Transactions should span multiple months (paginated data)"
        query: |
          SELECT
            COUNT(DISTINCT DATE_TRUNC('month', date)) as month_count
          FROM transactions
          WHERE user_id = 'test-user-pagination-001'
        expected_min:
          month_count: 2  # At least 2 different months

      # Verify all transactions have required fields
      - description: "All transactions should have valid data (no nulls in critical fields)"
        query: |
          SELECT COUNT(*) as invalid_count
          FROM transactions
          WHERE user_id = 'test-user-pagination-001'
          AND (
            amount IS NULL
            OR date IS NULL
            OR name IS NULL
            OR external_transaction_id IS NULL
          )
        expected:
          invalid_count: 0

# Expected Outcomes:
# 1. Webhook processed successfully
# 2. At least 10 transactions synced (demonstrating pagination)
# 3. Cursor updated to reflect latest position
# 4. No duplicate transactions (idempotency across pages)
# 5. Transactions span multiple months (paginated historical data)
# 6. All transactions have valid required fields
# 7. Pagination loop completes without errors

# Test Data Notes:
# - Plaid sandbox returns paginated results (default 100/page)
# - Premium tier allows 730-day history (2 years)
# - Cursor is updated after EACH page, but final cursor is what matters
# - Transaction sync should handle has_more=true correctly
# - Should not create duplicates if webhook fired multiple times

# Pagination Flow:
# 1. First call: cursor=null, returns page 1 + new cursor
# 2. Second call: cursor=page1_cursor, returns page 2 + new cursor
# 3. Continues until has_more=false
# 4. Final cursor saved to linked_items table
