# Scenario 04: Tier Limit Enforcement
# Tests that free tier monthly sync limits are enforced (max 3 accounts per month)
# CRITICAL: Revenue protection - prevents free tier abuse

version: "1.0"

scenario:
  name: "Tier Limit Enforcement"
  description: "Verify that free tier users cannot exceed monthly sync limit of 3 accounts"
  category: "tier_limit"
  priority: "critical"

  tags:
    - "tier_limits"
    - "free_tier"
    - "revenue_protection"
    - "sync_limits"

  # Setup test data
  setup:
    user:
      id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
      tier: "free"  # Free tier = 3 accounts per month max
      email: "test-tier-limit@example.com"
      auth0_user_id: "auth0|test-tier-limit-001"

    linked_items:
      # Linked item 1 (will sync successfully)
      - id: "b3aed8b5-804d-56e6-b6e8-ad29b7935e1e"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        item_id: "74777fa2-b9c7-54d0-bd2e-397d3b814c48"
        institution_name: "Chase"
        institution_id: "ins_3"
        cursor: null
        status: "active"

      # Linked item 2 (will sync successfully)
      - id: "b5954c31-9ea9-5970-8418-954eecbaa2c8"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        item_id: "ccc9bbee-8922-525d-b53f-294294dce9fd"
        institution_name: "Bank of America"
        institution_id: "ins_4"
        cursor: null
        status: "active"

      # Linked item 3 (will sync successfully - reaches limit)
      - id: "e6c31dc3-8ea6-54ae-a343-9b8632c35b63"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        item_id: "b04540d1-cc48-5957-8b36-c5203e042683"
        institution_name: "Wells Fargo"
        institution_id: "ins_6"
        cursor: null
        status: "active"

      # Linked item 4 (should FAIL due to limit)
      - id: "dd122a2e-2bf5-59bb-b73b-a448ab69b442"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        item_id: "dc25ce2e-17b9-5262-ac06-f4a1eeb17f51"
        institution_name: "Capital One"
        institution_id: "ins_5"
        cursor: null
        status: "active"

    accounts:
      # Account 1 for item 1
      - id: "61efbde7-d6e9-56d0-bb7a-22e4f9bf7614"
        linked_item_id: "b3aed8b5-804d-56e6-b6e8-ad29b7935e1e"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        plaid_account_id: "plaid-acc-limit-001"
        name: "Chase Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 1000.00

      # Account 2 for item 2
      - id: "60075838-1e41-54f0-96df-1f391ad1359d"
        linked_item_id: "b5954c31-9ea9-5970-8418-954eecbaa2c8"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        plaid_account_id: "plaid-acc-limit-002"
        name: "BofA Savings"
        type: "depository"
        subtype: "savings"
        current_balance: 5000.00

      # Account 3 for item 3
      - id: "f10d2313-61d8-55b3-992d-7f182ac33304"
        linked_item_id: "e6c31dc3-8ea6-54ae-a343-9b8632c35b63"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        plaid_account_id: "plaid-acc-limit-003"
        name: "Wells Fargo Checking"
        type: "depository"
        subtype: "checking"
        current_balance: 2000.00

      # Account 4 for item 4 (should not sync due to limit)
      - id: "aa623555-43ad-5a9d-8737-3c59ef856bde"
        linked_item_id: "dd122a2e-2bf5-59bb-b73b-a448ab69b442"
        user_id: "b2769227-8818-5728-9f34-82ffc5bb1ee1"
        plaid_account_id: "plaid-acc-limit-004"
        name: "Capital One Credit Card"
        type: "credit"
        subtype: "credit card"
        current_balance: -500.00

  # Execution steps
  steps:
    # Sync account 1 (success - 1/3)
    - action: "fire_webhook"
      description: "Sync account 1 (should succeed - 1/3 limit)"
      webhook_code: "INITIAL_UPDATE"
      item_id: "b3aed8b5-804d-56e6-b6e8-ad29b7935e1e"

    - action: "wait"
      wait_seconds: 5

    # Sync account 2 (success - 2/3)
    - action: "fire_webhook"
      description: "Sync account 2 (should succeed - 2/3 limit)"
      webhook_code: "INITIAL_UPDATE"
      item_id: "b5954c31-9ea9-5970-8418-954eecbaa2c8"

    - action: "wait"
      wait_seconds: 5

    # Sync account 3 (success - 3/3 - reaches limit)
    - action: "fire_webhook"
      description: "Sync account 3 (should succeed - 3/3 limit reached)"
      webhook_code: "INITIAL_UPDATE"
      item_id: "e6c31dc3-8ea6-54ae-a343-9b8632c35b63"

    - action: "wait"
      wait_seconds: 5

    # Sync account 4 (SHOULD FAIL - exceeds limit)
    - action: "fire_webhook"
      description: "Sync account 4 (should FAIL - exceeds 3/month limit)"
      webhook_code: "INITIAL_UPDATE"
      item_id: "dd122a2e-2bf5-59bb-b73b-a448ab69b442"

    - action: "wait"
      wait_seconds: 5

  # Assertions
  assertions:
    database:
      # Should have 3 sync audit records (not 4)
      sync_audits_count: 3

    custom:
      # Verify exactly 3 accounts synced this month
      - description: "Free tier should sync exactly 3 accounts this month"
        query: |
          SELECT COUNT(DISTINCT account_id) as accounts_synced
          FROM account_sync_audit
          WHERE user_id = 'test-user-tier-limit-001'
          AND sync_month = TO_CHAR(NOW(), 'YYYY-MM')
        expected:
          accounts_synced: 3

      # Verify item 4 webhook has error
      - description: "4th webhook should have sync limit error"
        query: |
          SELECT
            processed,
            error_message LIKE '%sync limit%' OR error_message LIKE '%tier limit%' as has_limit_error
          FROM webhook_events
          WHERE item_id = 'plaid-item-limit-004'
          ORDER BY created_at DESC
          LIMIT 1
        expected:
          processed: true
          has_limit_error: true

      # Verify account 4 has no transactions (sync blocked)
      - description: "Account 4 should have 0 transactions (sync blocked)"
        query: |
          SELECT COUNT(*) as txn_count
          FROM transactions
          WHERE account_id = 'test-account-limit-004'
        expected:
          txn_count: 0

      # Verify accounts 1-3 DO have transactions
      - description: "Accounts 1-3 should have transactions (sync succeeded)"
        query: |
          SELECT
            SUM(CASE WHEN account_id = 'test-account-limit-001' THEN 1 ELSE 0 END) as acc1_count,
            SUM(CASE WHEN account_id = 'test-account-limit-002' THEN 1 ELSE 0 END) as acc2_count,
            SUM(CASE WHEN account_id = 'test-account-limit-003' THEN 1 ELSE 0 END) as acc3_count
          FROM transactions
          WHERE user_id = 'test-user-tier-limit-001'
        expected_min:
          acc1_count: 1
          acc2_count: 1
          acc3_count: 1

      # Verify tier recorded in audit
      - description: "Sync audit should record tier='free' for all 3 syncs"
        query: |
          SELECT COUNT(*) as free_tier_count
          FROM account_sync_audit
          WHERE user_id = 'test-user-tier-limit-001'
          AND tier_at_sync = 'free'
          AND sync_month = TO_CHAR(NOW(), 'YYYY-MM')
        expected:
          free_tier_count: 3

# Expected Outcomes:
# 1. First 3 account syncs succeed
# 2. 4th account sync fails with tier limit error
# 3. Exactly 3 sync audit records created
# 4. Account 4 has 0 transactions (sync was blocked)
# 5. Accounts 1-3 have transactions (sync succeeded)
# 6. Error message indicates sync limit exceeded
# 7. Tier enforcement prevents revenue loss

# Test Data Notes:
# - Free tier = 3 accounts synced per month (per tier config)
# - account_sync_audit table tracks monthly sync count
# - SyncLimitService checks count before allowing sync
# - Should return user-friendly error message
# - User should be prompted to upgrade to Premium

# Edge Cases:
# - What if user downgrades mid-month? (Already synced > 3)
# - What if sync fails and retries? (Should not count multiple times)
# - What if user upgrades after hitting limit? (Should allow more syncs)

# Revenue Protection:
# This test ensures free tier users can't abuse the system by:
# - Syncing unlimited accounts
# - Syncing same account multiple times
# - Gaming the monthly reset
# - Prevents ~$10/month revenue loss per free user abusing system
