# Scenario 05: Item Error - Login Required
# Tests error handling when Plaid item requires user re-authentication
# CRITICAL: User experience - must notify user to re-link account

version: "1.0"

scenario:
  name: "Item Error - Login Required"
  description: "Verify that LOGIN_REQUIRED errors are properly handled and item status updated"
  category: "error"
  priority: "high"

  tags:
    - "error_handling"
    - "item_status"
    - "login_required"
    - "user_notification"

  # Setup test data
  setup:
    user:
      id: "3d6709a9-4e9a-5724-9cf6-ab25fdb0d302"
      tier: "premium"
      email: "test-error@example.com"
      auth0_user_id: "auth0|test-error-001"

    linked_items:
      - id: "eee713a4-6fd1-57aa-acf3-e93c831bd118"
        user_id: "3d6709a9-4e9a-5724-9cf6-ab25fdb0d302"
        item_id: "761f26d2-7a74-557e-aa73-8f0a92c14d1e"
        institution_name: "Discover"
        institution_id: "ins_7"
        cursor: "previous-cursor-before-error"
        status: "active"  # Initially active, will change to login_required

    accounts:
      - id: "be9377b5-3df9-5155-b871-d52a15292bd8"
        linked_item_id: "eee713a4-6fd1-57aa-acf3-e93c831bd118"
        user_id: "3d6709a9-4e9a-5724-9cf6-ab25fdb0d302"
        plaid_account_id: "plaid-acc-error-001"
        name: "Discover it Cash Back"
        type: "credit"
        subtype: "credit card"
        current_balance: -1250.00

    # Pre-existing transactions (from before error occurred)
    transactions:
      - user_id: "3d6709a9-4e9a-5724-9cf6-ab25fdb0d302"
        account_id: "be9377b5-3df9-5155-b871-d52a15292bd8"
        linked_item_id: "eee713a4-6fd1-57aa-acf3-e93c831bd118"
        external_transaction_id: "plaid-txn-before-error-001"
        amount: -50.00
        date: "2025-11-01"
        name: "Target"
        user_notes: null

      - user_id: "3d6709a9-4e9a-5724-9cf6-ab25fdb0d302"
        account_id: "be9377b5-3df9-5155-b871-d52a15292bd8"
        linked_item_id: "eee713a4-6fd1-57aa-acf3-e93c831bd118"
        external_transaction_id: "plaid-txn-before-error-002"
        amount: -25.00
        date: "2025-11-02"
        name: "Starbucks"
        user_notes: null

  # Execution steps
  steps:
    - action: "fire_webhook"
      description: "Trigger webhook that will return LOGIN_REQUIRED error from Plaid"
      webhook_code: "DEFAULT_UPDATE"
      item_id: "eee713a4-6fd1-57aa-acf3-e93c831bd118"
      # NOTE: Plaid sandbox can simulate errors, or we may need to manually
      # set up item to return this error

    - action: "wait"
      description: "Wait for error handling to complete"
      wait_seconds: 10

  # Assertions
  assertions:
    webhook_status:
      processed: true  # Webhook processed (even if sync failed)
      # Error should be logged but webhook marked as processed

    custom:
      # Verify linked_item status changed to login_required
      - description: "Linked item status should be updated to 'login_required'"
        query: |
          SELECT status
          FROM linked_items
          WHERE id = 'test-item-error-001'
        expected:
          status: "login_required"

      # Verify error logged in webhook_events
      - description: "Webhook should have error logged"
        query: |
          SELECT
            error_message IS NOT NULL as has_error,
            error_message LIKE '%LOGIN_REQUIRED%' OR error_message LIKE '%authentication%' as is_login_error
          FROM webhook_events
          WHERE item_id = 'plaid-item-error-001'
          ORDER BY created_at DESC
          LIMIT 1
        expected:
          has_error: true
          is_login_error: true

      # Verify cursor NOT updated (sync failed)
      - description: "Cursor should NOT be updated when sync fails"
        query: |
          SELECT cursor
          FROM linked_items
          WHERE id = 'test-item-error-001'
        expected:
          cursor: "previous-cursor-before-error"

      # Verify no NEW transactions added (sync failed)
      - description: "No new transactions should be added when sync fails"
        query: |
          SELECT COUNT(*) as txn_count
          FROM transactions
          WHERE account_id = 'test-account-error-001'
        expected:
          txn_count: 2  # Only the 2 pre-existing ones

      # Verify user notification created
      - description: "User notification should be created for login required"
        query: |
          SELECT COUNT(*) as notification_count
          FROM user_notifications
          WHERE user_id = 'test-user-error-001'
          AND notification_type = 'item_login_required'
          AND linked_item_id = 'test-item-error-001'
        expected_min:
          notification_count: 1

      # Verify existing data preserved
      - description: "Existing transactions should be preserved (not deleted)"
        query: |
          SELECT
            COUNT(*) as txn_count,
            COUNT(DISTINCT external_transaction_id) as unique_count
          FROM transactions
          WHERE account_id = 'test-account-error-001'
        expected:
          txn_count: 2
          unique_count: 2

# Expected Outcomes:
# 1. Webhook processed (even though sync failed)
# 2. Linked item status updated to 'login_required'
# 3. Error message logged in webhook_events
# 4. Cursor NOT updated (preserve last good cursor)
# 5. No new transactions added (sync failed gracefully)
# 6. User notification created (prompt user to re-link)
# 7. Existing transactions preserved (no data loss)

# Test Data Notes:
# - LOGIN_REQUIRED is a common Plaid error
# - Occurs when:
#   - User changed password
#   - Bank requires MFA re-auth
#   - Session expired
#   - Security challenge from bank
# - User must go through Plaid Link flow again to fix

# Error Handling Flow:
# 1. fire_webhook() → Plaid API call
# 2. Plaid returns { error: { error_code: 'ITEM_LOGIN_REQUIRED' } }
# 3. ItemErrorHandler catches error
# 4. Updates linked_items.status = 'login_required'
# 5. Creates user notification
# 6. Logs error in webhook_events
# 7. Does NOT update cursor (preserve last good state)
# 8. Does NOT delete existing data

# User Experience:
# - User sees notification in app: "Account needs re-linking"
# - User clicks "Re-link Account"
# - Plaid Link flow opens
# - User re-authenticates with bank
# - Item status changes back to 'active'
# - Future syncs resume normally

# Other Error Types to Test (future scenarios):
# - PENDING_EXPIRATION (bank requires re-auth soon)
# - INVALID_CREDENTIALS (permanent failure)
# - INSTITUTION_ERROR (temporary bank outage)
# - RATE_LIMIT_EXCEEDED (too many API calls)
# - INSUFFICIENT_CREDENTIALS (need additional MFA)
