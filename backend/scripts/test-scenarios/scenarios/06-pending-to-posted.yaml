# Scenario 06: Pending-to-Posted Transition
# Tests the most common transaction lifecycle - credit card pre-authorization becomes final posted charge
# CRITICAL: Validates amount changes during pending→posted transition

version: "1.0"

scenario:
  name: "Pending-to-Posted Transition"
  description: "Test pending authorization becoming final posted transaction with amount changes (gas pre-auth, restaurant tip)"
  category: "transaction_lifecycle"
  priority: "critical"

  tags:
    - "transaction_lifecycle"
    - "pending"
    - "posted"
    - "state_transition"
    - "amount_modification"
    - "tier:premium"

  # Setup test data
  setup:
    user:
      id: "6e01a89a-6ddc-5c18-bcac-1eeab5367aa4"
      tier: "premium"
      email: "pending-test@example.com"
      auth0_user_id: "auth0|test-pending-001"

    linked_items:
      - id: "72db6cf3-76bb-546f-bb1c-7139c122320a"
        user_id: "6e01a89a-6ddc-5c18-bcac-1eeab5367aa4"
        item_id: "76a1cac5-5e39-5c8a-ad4f-bfc45d948af7"
        institution_name: "Chase"
        institution_id: "ins_3"
        cursor: "initial-cursor-pending"  # Has cursor (not first sync)
        status: "active"

    accounts:
      - id: "efa4e29e-d380-52db-9d03-c318d385a54d"
        linked_item_id: "72db6cf3-76bb-546f-bb1c-7139c122320a"
        user_id: "6e01a89a-6ddc-5c18-bcac-1eeab5367aa4"
        plaid_account_id: "plaid-acc-pending-001"
        name: "Chase Sapphire Reserve"
        official_name: "Chase Sapphire Reserve Credit Card"
        type: "credit"
        subtype: "credit card"
        current_balance: -1250.00
        available_balance: -1250.00

    # Pre-populate 3 PENDING transactions
    # These simulate transactions that were synced in a previous DEFAULT_UPDATE
    # and are now transitioning to posted status
    transactions:
      # Gas station: Pre-auth $45.00 → Final $42.18 (pump reduced pre-authorization)
      - external_transaction_id: "plaid-pending-gas-001"
        user_id: "6e01a89a-6ddc-5c18-bcac-1eeab5367aa4"
        account_id: "efa4e29e-d380-52db-9d03-c318d385a54d"
        linked_item_id: "72db6cf3-76bb-546f-bb1c-7139c122320a"
        amount: -45.00
        date: "2025-11-05"
        name: "Shell Gas Station"
        payment_channel: "in store"
        pending: true

      # Restaurant: Pre-auth $67.50 → Final $75.00 (tip added after meal)
      - external_transaction_id: "plaid-pending-restaurant-001"
        user_id: "6e01a89a-6ddc-5c18-bcac-1eeab5367aa4"
        account_id: "efa4e29e-d380-52db-9d03-c318d385a54d"
        linked_item_id: "72db6cf3-76bb-546f-bb1c-7139c122320a"
        amount: -67.50
        date: "2025-11-05"
        name: "Olive Garden"
        payment_channel: "in store"
        pending: true

      # Online order: Remains pending (not yet shipped)
      - external_transaction_id: "plaid-pending-online-001"
        user_id: "6e01a89a-6ddc-5c18-bcac-1eeab5367aa4"
        account_id: "efa4e29e-d380-52db-9d03-c318d385a54d"
        linked_item_id: "72db6cf3-76bb-546f-bb1c-7139c122320a"
        amount: -129.99
        date: "2025-11-04"
        name: "Amazon.com"
        payment_channel: "online"
        pending: true

  # Execution steps
  steps:
    - action: "fire_webhook"
      description: "Trigger DEFAULT_UPDATE - Plaid sends MODIFIED transactions (2 pending→posted with amount changes)"
      webhook_code: "DEFAULT_UPDATE"
      item_id: "76a1cac5-5e39-5c8a-ad4f-bfc45d948af7"

    - action: "wait"
      description: "Wait for sync to process state transitions and amount modifications"
      wait_seconds: 10

  # Assertions
  assertions:
    database:
      # Should still have exactly 3 transactions (no duplicates created during transition)
      transactions_count: 3

    webhook_status:
      processed: true
      error: null

    custom:
      # CRITICAL: Verify pending count decreased (2 posted, 1 still pending)
      - description: "Exactly 1 pending transaction should remain (Amazon not shipped yet)"
        query: |
          SELECT COUNT(*) as pending_count
          FROM transactions
          WHERE user_id = 'test-user-pending-001'
          AND pending = true
        expected:
          pending_count: 1

      # CRITICAL: Verify posted count increased
      - description: "Exactly 2 posted transactions (gas + restaurant finalized)"
        query: |
          SELECT COUNT(*) as posted_count
          FROM transactions
          WHERE user_id = 'test-user-pending-001'
          AND pending = false
        expected:
          posted_count: 2

      # CRITICAL: Verify gas station amount DECREASED (pump reduced pre-auth)
      - description: "Gas transaction final amount should be $42.18 (reduced from $45.00 pre-auth)"
        query: |
          SELECT amount
          FROM transactions
          WHERE name LIKE '%Shell%'
          AND pending = false
          AND user_id = 'test-user-pending-001'
        expected:
          amount: -42.18

      # CRITICAL: Verify restaurant amount INCREASED (tip added)
      - description: "Restaurant amount should be $75.00 (increased from $67.50 pre-auth due to tip)"
        query: |
          SELECT amount
          FROM transactions
          WHERE name LIKE '%Olive Garden%'
          AND pending = false
          AND user_id = 'test-user-pending-001'
        expected:
          amount: -75.00

      # Verify Amazon still pending (unchanged)
      - description: "Amazon transaction should remain pending with original amount"
        query: |
          SELECT amount, pending
          FROM transactions
          WHERE name LIKE '%Amazon%'
          AND user_id = 'test-user-pending-001'
        expected:
          amount: -129.99
          pending: true

      # Verify no duplicate transactions created
      - description: "No duplicate transactions (each external_transaction_id unique)"
        query: |
          SELECT COUNT(*) as duplicate_count
          FROM (
            SELECT external_transaction_id, COUNT(*) as cnt
            FROM transactions
            WHERE user_id = 'test-user-pending-001'
            GROUP BY external_transaction_id
            HAVING COUNT(*) > 1
          ) duplicates
        expected:
          duplicate_count: 0

# Expected Outcomes:
# 1. Webhook processed successfully without errors
# 2. 2 pending transactions transition to posted (gas, restaurant)
# 3. Amounts change during transition:
#    - Gas: -$45.00 → -$42.18 (DOWN - pump reduced pre-authorization)
#    - Restaurant: -$67.50 → -$75.00 (UP - tip added after meal)
# 4. Amazon remains pending (not yet shipped/finalized)
# 5. No duplicate transactions created (UPDATE, not INSERT)
# 6. Transaction count remains 3 (no new rows, just state changes)
# 7. Date may change from authorized_date to final settlement date

# Real-World Business Value:
# - This is the MOST COMMON transaction lifecycle for credit cards
# - Gas stations: Pre-authorize $50-100, final amount based on actual pump
# - Restaurants: Pre-authorize check amount, final includes tip
# - Online orders: Authorize at checkout, finalize at shipment
# - Hotels: Pre-authorize estimated total, adjust for actual charges
# - Critical for accurate balance tracking and budgeting

# Implementation Notes:
# - Plaid sends MODIFIED transactions in DEFAULT_UPDATE webhook
# - Backend processModified() should:
#   1. Lookup existing transaction by external_transaction_id
#   2. UPDATE (not INSERT) with new amount, pending=false
#   3. Preserve user_notes field (see Scenario 03)
#   4. Update cursor after processing
# - pending=true → pending=false is the key state transition
# - amount field can change UP or DOWN
# - This scenario validates the UPDATE query works correctly

# Test Data Notes:
# - Pre-existing transactions simulate previous sync
# - Webhook simulation will update these transactions
# - Framework should handle MODIFIED transactions array
# - Admin API may have limitations (see workaround in comments)

# Known Limitations (Admin API Issue #308):
# - Admin webhook endpoint may not support custom "modified" transactions payload
# - Workaround: Rely on Plaid sandbox default behavior
# - Future enhancement: Issue #333 for advanced admin API features
