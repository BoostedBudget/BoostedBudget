# Automation Rules Templates for BoostedBudget Test Scenarios
# Provides reusable rule configurations for testing automation features (Phase 4)
# NOTE: Rules framework not yet implemented - these templates are future-ready

# Anchor definitions (reusable templates)
templates:
  # Basic notification rule template
  notification_rule: &notification_rule
    enabled: true
    priority: 5  # 1-10, higher = executes first
    condition_logic: "AND"  # AND|OR
    actions:
      - type: "send_notification"
        params:
          channel: "push"  # email|push|in_app
    retry_on_failure: true
    max_retries: 3

  # Auto-categorization rule template
  categorization_rule: &categorization_rule
    enabled: true
    priority: 8  # High priority (categorize before other actions)
    condition_logic: "AND"
    actions:
      - type: "auto_categorize"
        params:
          # category specified per rule instance
    retry_on_failure: true
    max_retries: 3

  # Multi-action rule template
  multi_action_rule: &multi_action_rule
    enabled: true
    priority: 5
    condition_logic: "AND"
    actions:
      - type: "send_notification"
      - type: "add_tag"
      - type: "create_budget_alert"  # If spending triggers budget threshold
    retry_on_failure: true
    max_retries: 3

  # Complex condition rule template (multiple conditions)
  complex_rule: &complex_rule
    enabled: true
    priority: 5
    condition_logic: "AND"  # All conditions must match
    # conditions specified per rule instance
    retry_on_failure: true
    max_retries: 3

# Condition operators
condition_operators:
  # Numeric comparisons
  - eq    # equals
  - ne    # not equals
  - gt    # greater than
  - gte   # greater than or equal
  - lt    # less than
  - lte   # less than or equal

  # String matching
  - contains       # substring match
  - not_contains   # does not contain substring
  - starts_with    # prefix match
  - ends_with      # suffix match
  - regex          # regex pattern match

  # Set operations
  - in             # value in list
  - not_in         # value not in list

# Rule examples by use case
rule_examples:
  # 1. Large transaction alert
  large_transaction_alert:
    <<: *notification_rule
    id: "test-rule-large-txn-001"
    user_id: "test-user-001"
    name: "Large Transaction Alert"
    description: "Notify when transaction exceeds $100"
    conditions:
      - field: "amount"
        operator: "gt"
        value: 100.00
    actions:
      - type: "send_notification"
        params:
          channel: "push"
          message: "Large transaction detected: ${amount} at ${merchant}"

  # 2. Specific merchant categorization
  starbucks_auto_categorize:
    <<: *categorization_rule
    id: "test-rule-starbucks-001"
    user_id: "test-user-001"
    name: "Auto-Categorize Starbucks"
    description: "Automatically categorize Starbucks as Coffee Shops"
    conditions:
      - field: "merchant"
        operator: "contains"
        value: "Starbucks"
    actions:
      - type: "auto_categorize"
        params:
          category: "Food and Drink"
          subcategory: "Coffee Shops"

  # 3. Weekend dining tracker
  weekend_dining:
    <<: *multi_action_rule
    id: "test-rule-weekend-dining-001"
    user_id: "test-user-001"
    name: "Weekend Dining Tracker"
    description: "Tag and notify for restaurant spending on weekends"
    conditions:
      - field: "category"
        operator: "eq"
        value: "Restaurants"
      - field: "day_of_week"
        operator: "in"
        value: ["Saturday", "Sunday"]
    condition_logic: "AND"
    actions:
      - type: "add_tag"
        params:
          tag: "weekend-splurge"
      - type: "send_notification"
        params:
          channel: "in_app"
          message: "Weekend dining: ${amount} at ${merchant}"

  # 4. Subscription detection
  subscription_detector:
    <<: *multi_action_rule
    id: "test-rule-subscription-001"
    user_id: "test-user-001"
    name: "Subscription Detector"
    description: "Detect recurring monthly charges"
    conditions:
      - field: "amount"
        operator: "gt"
        value: 0.00  # Positive amounts only (subscriptions are debits)
      - field: "merchant"
        operator: "in"
        value: ["Netflix", "Spotify", "Amazon Prime", "Adobe", "Microsoft"]
    condition_logic: "AND"
    actions:
      - type: "auto_categorize"
        params:
          category: "Subscriptions"
      - type: "add_tag"
        params:
          tag: "recurring"

  # 5. High-value purchase review
  high_value_review:
    <<: *multi_action_rule
    id: "test-rule-high-value-001"
    user_id: "test-user-001"
    name: "High-Value Purchase Review"
    description: "Flag purchases over $500 for review"
    conditions:
      - field: "amount"
        operator: "gt"
        value: 500.00
    actions:
      - type: "add_tag"
        params:
          tag: "review-needed"
      - type: "send_notification"
        params:
          channel: "email"
          message: "High-value purchase: ${amount} at ${merchant} - Please review"
      - type: "create_budget_alert"
        params:
          alert_type: "manual_review_required"

  # 6. Gas station rewards tracking
  gas_rewards:
    <<: *categorization_rule
    id: "test-rule-gas-rewards-001"
    user_id: "test-user-001"
    name: "Gas Rewards Tracker"
    description: "Track gas purchases for rewards program"
    conditions:
      - field: "merchant"
        operator: "in"
        value: ["Shell", "Chevron", "BP", "Exxon"]
    actions:
      - type: "auto_categorize"
        params:
          category: "Transportation"
          subcategory: "Gas"
      - type: "add_tag"
        params:
          tag: "rewards-eligible"

  # 7. International transaction alert
  international_alert:
    <<: *notification_rule
    id: "test-rule-international-001"
    user_id: "test-user-001"
    name: "International Transaction Alert"
    description: "Alert on foreign currency transactions"
    conditions:
      - field: "currency_code"
        operator: "ne"
        value: "USD"
    actions:
      - type: "send_notification"
        params:
          channel: "push"
          message: "International transaction: ${amount} ${currency_code}"
      - type: "add_tag"
        params:
          tag: "international"

  # 8. Refund notification
  refund_notification:
    <<: *notification_rule
    id: "test-rule-refund-001"
    user_id: "test-user-001"
    name: "Refund Notification"
    description: "Notify when refunds are received"
    conditions:
      - field: "amount"
        operator: "gt"
        value: 0.00  # Positive = credit
      - field: "name"
        operator: "contains"
        value: "REFUND"
    condition_logic: "AND"
    actions:
      - type: "send_notification"
        params:
          channel: "in_app"
          message: "Refund received: ${amount} from ${merchant}"

  # 9. Budget overspend prevention
  budget_overspend_prevention:
    <<: *multi_action_rule
    id: "test-rule-overspend-001"
    user_id: "test-user-001"
    name: "Budget Overspend Prevention"
    description: "Alert when transaction would exceed budget"
    conditions:
      - field: "category"
        operator: "eq"
        value: "Groceries"
      - field: "amount"
        operator: "gt"
        value: 50.00  # Individual transaction > $50
    condition_logic: "AND"
    actions:
      - type: "send_notification"
        params:
          channel: "push"
          message: "Large grocery purchase: ${amount}. Check budget status!"
      - type: "create_budget_alert"
        params:
          budget_category: "Groceries"
          alert_type: "large_transaction"

  # 10. Paycheck categorization
  paycheck_auto_categorize:
    <<: *categorization_rule
    id: "test-rule-paycheck-001"
    user_id: "test-user-001"
    name: "Auto-Categorize Paycheck"
    description: "Automatically categorize direct deposits as Income"
    conditions:
      - field: "amount"
        operator: "gt"
        value: 1000.00  # Assume paychecks > $1000
      - field: "name"
        operator: "contains"
        value: "Direct Deposit"
    condition_logic: "AND"
    actions:
      - type: "auto_categorize"
        params:
          category: "Income"
          subcategory: "Salary"
      - type: "add_tag"
        params:
          tag: "paycheck"

# Rule testing scenarios - transaction patterns to trigger rules
rule_test_scenarios:
  # Scenario 1: Simple threshold trigger
  simple_threshold:
    description: "Transaction exceeds amount threshold"
    rule_id: "test-rule-large-txn-001"
    transaction:
      amount: -125.00  # Exceeds $100 threshold
      merchant: "Best Buy"
      category: "Shopping"
    should_trigger: true
    expected_actions: ["send_notification"]

  # Scenario 2: Merchant matching
  merchant_match:
    description: "Merchant name contains trigger keyword"
    rule_id: "test-rule-starbucks-001"
    transaction:
      amount: -5.50
      merchant: "Starbucks - Downtown"
      category: "Food and Drink"  # Will be recategorized
    should_trigger: true
    expected_actions: ["auto_categorize"]
    expected_category: "Food and Drink"
    expected_subcategory: "Coffee Shops"

  # Scenario 3: Multiple conditions (AND logic)
  multiple_conditions_and:
    description: "All conditions must match (AND)"
    rule_id: "test-rule-weekend-dining-001"
    transaction:
      amount: -75.00
      merchant: "Olive Garden"
      category: "Restaurants"
      date: "2025-11-09"  # Saturday
      day_of_week: "Saturday"
    should_trigger: true
    expected_actions: ["add_tag", "send_notification"]
    expected_tags: ["weekend-splurge"]

  # Scenario 4: Condition not met
  condition_not_met:
    description: "Transaction does not meet rule conditions"
    rule_id: "test-rule-large-txn-001"
    transaction:
      amount: -45.00  # Below $100 threshold
      merchant: "Walmart"
    should_trigger: false
    expected_actions: []

  # Scenario 5: Disabled rule (should not execute)
  disabled_rule:
    description: "Rule is disabled, should not execute"
    rule_id: "test-rule-disabled-001"
    rule_enabled: false
    transaction:
      amount: -500.00  # Would normally trigger
      merchant: "Apple Store"
    should_trigger: false
    expected_actions: []

  # Scenario 6: Rule priority ordering
  rule_priority:
    description: "Higher priority rules execute first"
    rules:
      - id: "test-rule-low-priority"
        priority: 1
        name: "Low Priority Rule"
      - id: "test-rule-high-priority"
        priority: 10
        name: "High Priority Rule"
      - id: "test-rule-medium-priority"
        priority: 5
        name: "Medium Priority Rule"
    transaction:
      amount: -100.00
      merchant: "Generic Store"
    expected_execution_order:
      - "test-rule-high-priority"    # Priority 10
      - "test-rule-medium-priority"  # Priority 5
      - "test-rule-low-priority"     # Priority 1

  # Scenario 7: Idempotency test
  idempotency:
    description: "Rule executes only once per transaction"
    rule_id: "test-rule-large-txn-001"
    transaction:
      id: "test-txn-001"
      amount: -150.00
      merchant: "Best Buy"
    execution_attempts: 3  # Try to execute 3 times
    expected_executions: 1  # Should only execute once
    expected_audit_logs: 1  # Only one audit log entry

  # Scenario 8: Retry on transient failure
  retry_on_failure:
    description: "Rule retries on transient action failure"
    rule_id: "test-rule-large-txn-001"
    transaction:
      amount: -200.00
      merchant: "Target"
    action_failure_scenario:
      failure_type: "transient"  # Network timeout, etc.
      failures_before_success: 2  # Fail 2 times, succeed on 3rd
    expected_retry_count: 2
    expected_final_status: "success"

# Multi-rule scenarios (testing multiple rules for same user)
multi_rule_scenarios:
  # Free tier: 1 rule max (tier limit)
  free_tier_rules:
    user_id: "test-user-free-001"
    user_tier: "free"
    rules:
      - <<: *notification_rule
        id: "test-rule-free-1"
        name: "Large Transaction Alert"
        conditions:
          - field: "amount"
            operator: "gt"
            value: 100.00
    # Attempting to create 2nd rule should fail (tier limit)
    should_allow_second_rule: false

  # Premium tier: Multiple rules
  premium_tier_rules:
    user_id: "test-user-premium-001"
    user_tier: "premium"
    rules:
      - name: "Large Transaction"
      - name: "Starbucks Auto-Categorize"
      - name: "Weekend Dining"
      - name: "Subscription Detector"
      - name: "High-Value Review"
    # Premium can create up to 15 rules
    max_rules: 15

  # Premium+ tier: Unlimited rules
  premium_plus_tier_rules:
    user_id: "test-user-premium-plus-001"
    user_tier: "premium_plus"
    max_rules: -1  # Unlimited

# Transaction flows to trigger specific rules
transaction_flows:
  # Generate transaction to trigger amount threshold rule
  trigger_amount_threshold:
    type: "rule_trigger"
    rule_id: "test-rule-large-txn-001"
    condition_to_match:
      field: "amount"
      operator: "gt"
      value: 100.00
    generated_transaction:
      amount: -125.00  # Exceeds threshold
      merchant: "Best Buy"
      category: "Shopping"

  # Generate transaction to trigger merchant matching rule
  trigger_merchant_match:
    type: "rule_trigger"
    rule_id: "test-rule-starbucks-001"
    condition_to_match:
      field: "merchant"
      operator: "contains"
      value: "Starbucks"
    generated_transaction:
      amount: -5.50
      merchant: "Starbucks - Main St"
      category: "Food and Drink"

  # Generate transaction to trigger complex multi-condition rule
  trigger_complex_rule:
    type: "rule_trigger"
    rule_id: "test-rule-weekend-dining-001"
    conditions_to_match:
      - field: "category"
        value: "Restaurants"
      - field: "day_of_week"
        value: "Saturday"
    generated_transaction:
      amount: -85.00
      merchant: "Cheesecake Factory"
      category: "Restaurants"
      date: "2025-11-09"  # Saturday

  # Generate series of transactions to test rule execution performance
  performance_test:
    type: "rule_performance"
    rule_count: 15  # Test with 15 active rules
    transaction_count: 100  # 100 transactions to process
    expected_evaluation_time: "< 1s"  # All 100 txns evaluated in < 1s

