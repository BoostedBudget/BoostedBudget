# Account Templates for BoostedBudget Test Scenarios
# Provides reusable account configurations for different account types

# Anchor definitions (reusable templates)
templates:
  # Checking account template
  checking_account: &checking_account
    type: "depository"
    subtype: "checking"
    official_name_suffix: "Checking Account"
    mask: "0000"
    currency_code: "USD"
    typical_balance_range:
      min: 500
      max: 5000
    transaction_patterns:
      - "groceries"
      - "restaurants"
      - "gas"
      - "utilities"
      - "retail"
      - "paychecks"
    sync_enabled: true

  # Savings account template
  savings_account: &savings_account
    type: "depository"
    subtype: "savings"
    official_name_suffix: "Savings Account"
    mask: "1111"
    currency_code: "USD"
    typical_balance_range:
      min: 1000
      max: 20000
    transaction_patterns:
      - "transfers"
      - "interest"
      - "deposits"
    sync_enabled: true

  # Credit card account template
  credit_card: &credit_card
    type: "credit"
    subtype: "credit card"
    official_name_suffix: "Credit Card"
    mask: "9999"
    currency_code: "USD"
    typical_balance_range:
      min: -3000  # Negative indicates owed
      max: 0
    transaction_patterns:
      - "groceries"
      - "restaurants"
      - "gas"
      - "retail"
      - "online_shopping"
      - "subscriptions"
    sync_enabled: true
    credit_limit: 5000

  # Money market account template
  money_market: &money_market
    type: "depository"
    subtype: "money market"
    official_name_suffix: "Money Market Account"
    mask: "2222"
    currency_code: "USD"
    typical_balance_range:
      min: 5000
      max: 50000
    transaction_patterns:
      - "transfers"
      - "interest"
      - "deposits"
    sync_enabled: true

  # Investment account template (brokerage)
  investment_account: &investment_account
    type: "investment"
    subtype: "brokerage"
    official_name_suffix: "Brokerage Account"
    mask: "3333"
    currency_code: "USD"
    typical_balance_range:
      min: 10000
      max: 100000
    transaction_patterns:
      - "trades"
      - "dividends"
      - "transfers"
    sync_enabled: false  # May not support transaction sync

  # Loan account template
  loan_account: &loan_account
    type: "loan"
    subtype: "personal"
    official_name_suffix: "Personal Loan"
    mask: "4444"
    currency_code: "USD"
    typical_balance_range:
      min: -25000  # Negative indicates owed
      max: -1000
    transaction_patterns:
      - "payments"
      - "interest_charges"
    sync_enabled: true

