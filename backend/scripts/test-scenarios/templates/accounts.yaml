# Multi-account sets for testing tier limits
account_sets:
  # Free tier (max 3 accounts)
  free_tier_set:
    - <<: *checking_account
      id: "test-acc-free-set-1"
      plaid_account_id: "plaid-acc-free-1"
      name: "Checking"
    - <<: *savings_account
      id: "test-acc-free-set-2"
      plaid_account_id: "plaid-acc-free-2"
      name: "Savings"
    - <<: *credit_card
      id: "test-acc-free-set-3"
      plaid_account_id: "plaid-acc-free-3"
      name: "Credit Card"

  # Premium tier (30 accounts) - template for generating many accounts
  premium_tier_template:
    base_prefix: "test-acc-premium"
    plaid_prefix: "plaid-acc-premium"
    count: 30
    distribution:
      checking: 10
      savings: 8
      credit: 8
      money_market: 2
      investment: 2

