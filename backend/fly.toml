# Fly.io configuration for BoostedBudget Backend API
# Deploy with: fly deploy --config backend/fly.toml

app = "boostedbudget-api"
primary_region = "iad"  # US East (Virginia) - Single region for MVP
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # Build Docker image from backend/Dockerfile
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  ENABLE_METRICS = "true"

  # Plaid configuration
  PLAID_ENV = "production"

  # Paddle configuration (selects the live API and production tier catalog)
  PADDLE_ENVIRONMENT = "production"

  # NOTE: Sensitive values set via `fly secrets set`:
  # - DATABASE_URL (PostgreSQL connection string)
  # - CLERK_SECRET_KEY (Clerk authentication)
  # - PLAID_CLIENT_ID
  # - PLAID_SECRET
  # - PADDLE_API_KEY
  # - PADDLE_WEBHOOK_SECRET
  # - RATE_LIMIT_REDIS_URL (Issue #1531: Upstash Redis, NO-EVICTION instance — the
  #   fleet-wide rate limiter's correctness depends on every SET succeeding)
  # - CACHE_REDIS_URL (Issue #1531: a DIFFERENT Upstash Redis instance from
  #   RATE_LIMIT_REDIS_URL above — never share one instance between the two, or the
  #   cache's eviction traffic will OOM the limiter's SETs. Upstash's own eviction
  #   policy is `optimistic-volatile`, is not configurable, and can evict keys
  #   without a TTL — see backend/internal/redisclient/client.go's package doc)

[experimental]
  auto_rollback = true

# Issue #1514: /metrics moved off the public listener (port 8080, mapped to the public
# 80/443 service below) onto its own internal-only listener on port 9091. 9091 is NOT
# listed in any [[services.ports]] entry, so it is never reachable from the public
# internet — only Fly's own metrics scraper reaches it, over the private 6PN network,
# the same way health-check probes reach the app without going through fly-proxy's
# public HTTP layer. Must match INTERNAL_METRICS_PORT / defaultInternalMetricsPort in
# backend/cmd/server/internal_metrics.go (defaults to 9091 if unset).
[metrics]
  port = 9091
  path = "/metrics"

# Intended machine count: 2 (production, once #607/deployment work brings this app to
# having any machines at all — `fly machines list` currently returns none for this app).
# This is a statement of INTENT, not current state, and it matters more now than it used
# to: `min_machines_running` below is a FLOOR (the minimum Fly will scale up to keep
# running), never a ceiling, and it is inert here anyway since auto_stop_machines = false
# means machines aren't stopped/started based on load in the first place. Nothing in this
# file caps machine count at 1. Multi-machine correctness for the rate limiter (Issue
# #1531) now depends on RATE_LIMIT_REDIS_URL being a real, shared, noeviction Redis
# instance — NOT on how many machines happen to be running — because each machine's
# in-memory fallback limiter only sees that machine's own traffic.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"  # Increased to allow time for database migrations

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"  # Increased to allow time for database migrations on startup
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[deploy]
  strategy = "rolling"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
