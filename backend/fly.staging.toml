# Fly.io configuration for BoostedBudget Backend API - STAGING
# Deploy with: fly deploy --config backend/fly.staging.toml

app = "staging-boostedbudget-api"
primary_region = "iad"  # US East (Virginia) - Single region for MVP
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # Build Docker image from backend/Dockerfile
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "staging"
  LOG_LEVEL = "debug"
  ENABLE_METRICS = "true"

  # Issue #1531 Task 8 (gap round 2): divides the per-machine in-memory rate-limit fallback so that
  # N machines independently falling back to memory-only limiting during a Redis outage don't
  # multiply the intended fleet-wide budget by N — see rateLimitFallbackLimit's doc comment in
  # cmd/server/main.go. MUST match this file's own "Intended machine count: N" comment (below, near
  # [[services]]) — cmd/server/issue1531_fallback_divisor_wiring_test.go enforces that the two agree.
  # With only 1 machine actually running today, divisor 2 halves the fallback limit (e.g. 50/min
  # instead of 100/min) rather than doubling it — a deliberate trade-off: during an outage, slightly
  # tight beats 2x loose, and this only affects the degraded fallback path, never normal operation.
  # This coupling assumes a STATIC machine count. Autoscaling breaks it in both directions — tracked
  # as follow-up Issue #1535.
  RATE_LIMIT_FALLBACK_DIVISOR = "2"

  # Plaid configuration (sandbox for staging)
  PLAID_ENV = "sandbox"

  # Paddle configuration (sandbox API + sandbox tier catalog). Explicit rather than relying on
  # config.go's PaddleEnvironment default of "sandbox": that default only governs which Paddle
  # API mode the client uses. tier_config.go's getConfigPath() reads this SAME env var
  # independently and, until this line existed, treated it being unset as "no environment
  # specified — use config/subscription_tiers.yaml (the default/template catalogue)", NOT
  # "sandbox". Same unset variable, two different effective meanings on this exact deploy
  # target. Setting it explicitly collapses that to one meaning everywhere it's read.
  PADDLE_ENVIRONMENT = "sandbox"

  # Issue #1432 (B2-1): explicit opt-in for the QA auth-bypass route
  # (POST /api/v1/qa/auth/bypass), which is UNAUTHENTICATED and mints five-minute Clerk
  # admin sign-in tokens. ENVIRONMENT = "staging" alone no longer registers it; the gate in
  # backend/internal/config/qa_auth_bypass_gate.go also refuses whenever a production-only
  # signal is present (a Clerk sk_live_ key, or PADDLE_ENVIRONMENT = "production" above).
  # This line MUST NOT be copied into backend/fly.toml.
  QA_AUTH_BYPASS_ENABLED = "true"

  # NOTE: Sensitive values set via `fly secrets set`:
  # - DATABASE_URL (Neon staging - pooled connection)
  # - MIGRATION_DATABASE_URL (Neon staging - direct connection for migrations)
  # - CLERK_SECRET_KEY (Clerk staging instance)
  # - PLAID_CLIENT_ID
  # - PLAID_SECRET
  # - PADDLE_API_KEY
  # - PADDLE_WEBHOOK_SECRET
  # - ENCRYPTION_KEY
  # - POSTHOG_API_KEY (PostHog Cloud US - project 357017)
  # - POSTHOG_SECRET_API_TOKEN (server-only Support identity-verification HMAC key)
  # - POSTHOG_PERSONAL_API_KEY (server-only, person:write/person:read; durable GDPR erasure)
  # - POSTHOG_PROJECT_ID (staging project only; never share production's target)
  # - POSTHOG_PRIVATE_HOST (https://us.posthog.com or https://eu.posthog.com)
  # - POSTHOG_SYNC_COMPLETION_CUTOVER_AT (RFC3339; set only after pre-cutover pods drain)
  # - SENTRY_DSN (Issue #1531 gap round 2: if unset, Error-level logs — including the rate-limiter
  #   fallback-activation log, "the metric that actually matters" per Issue #1531 — never reach
  #   Sentry and nothing pages. main.go logs a startup ERROR when this is unset in
  #   production/staging; see sentryDSNWarning in cmd/server/sentry_dsn_warning.go)
  # - RATE_LIMIT_REDIS_URL (Issue #1531: Upstash Redis, NO-EVICTION instance — the
  #   fleet-wide rate limiter's correctness depends on every SET succeeding)
  # - CACHE_REDIS_URL (Issue #1531: a DIFFERENT Upstash Redis instance from
  #   RATE_LIMIT_REDIS_URL above — never share one instance between the two, or the
  #   cache's eviction traffic will OOM the limiter's SETs. Upstash's own eviction
  #   policy is `optimistic-volatile`, is not configurable, and can evict keys
  #   without a TTL — see backend/internal/redisclient/client.go's package doc)

[experimental]
  auto_rollback = true

# Issue #1514: /metrics moved off the public listener (port 8080, mapped to the public
# 80/443 service below) onto its own internal-only listener on port 9091. 9091 is NOT
# listed in any [[services.ports]] entry, so it is never reachable from the public
# internet — only Fly's own metrics scraper reaches it, over the private 6PN network,
# the same way health-check probes reach the app without going through fly-proxy's
# public HTTP layer. Must match INTERNAL_METRICS_PORT / defaultInternalMetricsPort in
# backend/cmd/server/internal_metrics.go (defaults to 9091 if unset).
[metrics]
  port = 9091
  path = "/metrics"

# Intended machine count: 2 (staging, once this app has any machines at all —
# `fly machines list` currently returns none for this app). This is a statement of
# INTENT, not current state. `min_machines_running` below is a FLOOR (the minimum Fly
# will scale up to keep running), never a ceiling, and it is inert here anyway since
# auto_stop_machines = false means machines aren't stopped/started based on load in the
# first place. Nothing in this file caps machine count at 1. Deliberately matches
# production's intended count of 2 (not 1): with two staging machines, staging genuinely
# exercises the multi-machine code path the Redis-backed limiter exists to fix — a
# shared-budget regression (two machines each enforcing their own in-memory limit, giving
# ~2x the configured budget) would surface here rather than first appearing in
# production. Multi-machine correctness for the rate limiter (Issue #1531) depends on
# RATE_LIMIT_REDIS_URL being a real, shared, noeviction Redis instance — NOT on how many
# machines happen to be running — because each machine's in-memory fallback limiter
# only sees that machine's own traffic.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"  # Increased to allow time for database migrations

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"  # Increased to allow time for database migrations on startup
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[deploy]
  strategy = "rolling"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
