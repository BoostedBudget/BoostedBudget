# Hardcoded admin emails - these users always have admin access
# regardless of their Clerk privateMetadata.roles setting.
#
# ⚠️ THIS FILE IS A PRODUCTION ACCESS CONTROL LIST. ⚠️
# It is git-tracked and copied into the runtime image (backend/Dockerfile). An address
# listed here is granted admin access WITHOUT any database or Clerk role check — the
# admin middleware returns before HasRole is ever consulted
# (backend/internal/huma/middleware/admin.go). Since Issue #1499 removed the admin
# middleware's environment gate, that applies in production too.
#
# Note: Email matching is case-insensitive.

# admin_emails: granted admin access in EVERY environment, PRODUCTION INCLUDED.
# Add an address here only if a real human platform owner must have permanent,
# role-check-free admin access to live customer data. Never put a test, CI, QA, seeded,
# or shared-credential account in this list.
admin_emails:
  - "owner-1@example.com"
  - "owner-2@example.com"
  - "owner-3@example.com"

# non_production_admin_emails: granted admin access ONLY in a recognised non-production
# environment (development, qa, staging — see domain.IsNonProductionEnvironment). These
# entries are IGNORED in production, and also ignored whenever ENVIRONMENT is unset or
# holds an unrecognised value, so the fail-safe direction is "no test admins".
# This is the list for test/CI/QA accounts (Issue #1498).
non_production_admin_emails:
  - "e2e+clerk_test@boostedbudget.com"  # E2E test user for CI (backend runs as ENVIRONMENT=qa)
  - "qa-admin@boostedbudget.com"        # QA test admin user (Issue #821)
