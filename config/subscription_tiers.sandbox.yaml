# BoostedBudget Subscription Tiers Configuration - SANDBOX ENVIRONMENT
# Last updated: 2026-01-26
#
# ⚠️ ENVIRONMENT-SPECIFIC CONFIG FILE ⚠️
# This file is automatically loaded when PADDLE_ENVIRONMENT=sandbox
# Use this file for SANDBOX Paddle Price IDs only
#
# Workflow:
# 1. Create products/prices in Paddle Sandbox Dashboard (https://sandbox-vendors.paddle.com)
# 2. Copy the SANDBOX price IDs to paddle_price_id_monthly and paddle_price_id_yearly below
# 3. Keep production IDs in subscription_tiers.production.yaml
# 4. Set PADDLE_ENVIRONMENT=sandbox in your .env file
#
# Automatic Config Selection Priority:
# 1. SUBSCRIPTION_TIERS_CONFIG env var (explicit override)
# 2. config/subscription_tiers.{PADDLE_ENVIRONMENT}.yaml (this file when PADDLE_ENVIRONMENT=sandbox)
# 3. config/subscription_tiers.yaml (default fallback)
#
# Subscription System Simplification (Issues #674-#678):
# - Removed free tier entirely (users get 60-day premium trial with ads instead)
# - Switched from Stripe to Paddle for payment processing
# - Rules, categories, tags, API calls are now UNLIMITED for all tiers
# - Only 3 configurable limits remain: accounts, transaction_history_days, executions_per_day
#
# Tiers: premium, household_2, household_3, household_4, household_5
#
# Special Values:
#   - Use -1 for "unlimited" resources

