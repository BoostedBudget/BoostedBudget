  - {contract_id: frontend_admin_revenuecat_retry_queued, name: admin_revenuecat_retry_queued, kind: custom, symbols: {typescript: [ADMIN_REVENUECAT_RETRY_QUEUED], go: []}, producers: [frontend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an admin queues a retry of a pending RevenueCat operation; carries no properties because the operation id is a per-customer identifier.", properties: {}}
  - {contract_id: frontend_admin_revenuecat_grant_queued, name: admin_revenuecat_grant_queued, kind: custom, symbols: {typescript: [ADMIN_REVENUECAT_GRANT_QUEUED], go: []}, producers: [frontend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an admin queues a RevenueCat grant or revoke; properties are the bounded grant class, target tier, and revoke flag only, never the reason or the target user id.", properties: {grant_class: {type: string, required: true, cardinality: bounded, values: [comp, trial]}, tier: {type: string, required: true, cardinality: bounded, values: [premium, household_2, household_3, household_4, household_5]}, revoke: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: frontend_admin_subscription_change_queued, name: admin_subscription_change_queued, kind: custom, symbols: {typescript: [ADMIN_SUBSCRIPTION_CHANGE_QUEUED], go: []}, producers: [frontend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an admin-initiated subscription change is queued through the RevenueCat path; properties are the bounded action and the target tier only, never the reason or the target user id.", properties: {action: {type: string, required: true, cardinality: bounded, values: [grant, revoke]}, tier: {type: string, required: false, cardinality: bounded, values: [premium, household_2, household_3, household_4, household_5]}}}
  - {contract_id: frontend_checkout_cancelled, name: checkout_cancelled, kind: custom, symbols: {typescript: [CHECKOUT_CANCELLED], go: []}, producers: [frontend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when the RevenueCat checkout returns to the cancelled state; carries no properties.", properties: {}}
  - {contract_id: frontend_checkout_confirmation_pending, name: checkout_confirmation_pending, kind: custom, symbols: {typescript: [CHECKOUT_CONFIRMATION_PENDING], go: []}, producers: [frontend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when the RevenueCat checkout is awaiting provider confirmation; carries no properties.", properties: {}}
