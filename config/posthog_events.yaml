  - {contract_id: backend_revenuecat_operation_queued, name: revenuecat_operation_queued, kind: custom, symbols: {typescript: [], go: [EventRevenueCatOperationQueued]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an admin-initiated RevenueCat grant or revoke is queued for the target user; properties are the bounded grant class, entitlement key, and revoke flag only, never the reason or the acting admin.", properties: {class: {type: string, required: true, cardinality: bounded, values: [comp, trial]}, entitlement: {type: string, required: true, cardinality: bounded, values: [comp_premium, comp_household_2, comp_household_3, comp_household_4, comp_household_5, trial_premium]}, revoke: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_operation_applied, name: revenuecat_operation_applied, kind: custom, symbols: {typescript: [], go: [EventRevenueCatOperationApplied]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires after a queued RevenueCat operation is applied to the target user's access; properties are the bounded grant class, entitlement key, and revoke flag only.", properties: {class: {type: string, required: true, cardinality: bounded, values: [comp, trial]}, entitlement: {type: string, required: true, cardinality: bounded, values: [comp_premium, comp_household_2, comp_household_3, comp_household_4, comp_household_5, trial_premium]}, revoke: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_operation_failed, name: revenuecat_operation_failed, kind: custom, symbols: {typescript: [], go: [EventRevenueCatOperationFailed]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when a queued RevenueCat operation fails and remains pending for retry; properties are the bounded grant class, entitlement key, and revoke flag only.", properties: {class: {type: string, required: true, cardinality: bounded, values: [comp, trial]}, entitlement: {type: string, required: true, cardinality: bounded, values: [comp_premium, comp_household_2, comp_household_3, comp_household_4, comp_household_5, trial_premium]}, revoke: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_webhook_access_changed, name: revenuecat_webhook_access_changed, kind: custom, symbols: {typescript: [], go: [EventRevenueCatWebhookAccessChanged]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when a newly accepted RevenueCat webhook delivery's event type indicates the target user's entitlement state changed: a grant was applied or access was revoked. Carries only the bounded RevenueCat event type and the grant/revoke direction, never the webhook body, a customer id or an email; duplicates and non-entitlement deliveries emit nothing.", properties: {event_type: {type: string, required: true, cardinality: bounded, values: [INITIAL_PURCHASE, RENEWAL, NON_RENEWING_PURCHASE, PRODUCT_CHANGE, SUBSCRIPTION_EXTENDED, TEMPORARY_ENTITLEMENT_GRANT, EXPIRATION, SUBSCRIPTION_PAUSED]}, revoked: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_access_inactive, name: revenuecat_access_inactive, kind: custom, symbols: {typescript: [], go: [EventRevenueCatAccessInactive]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when a RevenueCat access-resolution refresh flips a previously granting user (active/trial/trialing) to an inactive projection. pending_operations is the count of queued RevenueCat operations at resolution; a non-zero value means the inactive projection was not persisted because a pending operation deferred it. Never carries the reason, the acting admin, or any Plaid/customer identifier.", properties: {pending_operations: {type: integer, required: true, cardinality: low, minimum: 0}}}
  - {contract_id: backend_revenuecat_retention_armed, name: revenuecat_retention_armed, kind: custom, symbols: {typescript: [], go: [EventRevenueCatRetentionArmed]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires alongside revenuecat_access_inactive when that transition arms the retention/Plaid-cleanup safety net (retention clock + plaid_cleanup_pending_at stamped). deferred_for_pending_operations is true when a pending RevenueCat operation prevented the arming write from persisting. Carries no reason, actor, or identifier.", properties: {deferred_for_pending_operations: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_plaid_cleanup_disconnected, name: revenuecat_plaid_cleanup_disconnected, kind: custom, symbols: {typescript: [], go: [EventRevenueCatPlaidCleanupDisconnected]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires from the retention-cleanup disconnect pass when the safety net actually disconnects a read-only user's Plaid items after the grace window. marker_cleared reports whether the plaid_cleanup_pending_at episode marker was cleared afterwards; false means the items are disconnected but the marker is stuck. Never carries a Plaid item id or any other identifier.", properties: {marker_cleared: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_comp_expired, name: revenuecat_comp_expired, kind: custom, symbols: {typescript: [], go: [EventRevenueCatCompExpired]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an access-resolution refresh persists an inactive projection for a user whose previous projection was comp-backed — the comp grant lapsed on its own, without any admin-initiated operation (an admin revoke is the admin queue's revenuecat_operation_* stream). entitlement is the bounded comp key that ended; never carries the reason, the acting admin, or any identifier.", properties: {entitlement: {type: string, required: true, cardinality: bounded, values: [comp_premium, comp_household_2, comp_household_3, comp_household_4, comp_household_5]}}}
  - {contract_id: backend_revenuecat_paid_grant_lapsed, name: revenuecat_paid_grant_lapsed, kind: custom, symbols: {typescript: [], go: [EventRevenueCatPaidGrantLapsed]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an access-resolution refresh persists an inactive projection for a user whose previous projection was paid-backed — the paid grant's expiry passed and the fresh provider read dropped it, whether the refresh was scheduled or webhook-triggered. entitlement is the bounded paid key that lapsed; never carries the reason, an amount, or any identifier.", properties: {entitlement: {type: string, required: true, cardinality: bounded, values: [paid_premium, paid_household_2, paid_household_3, paid_household_4, paid_household_5]}}}
  - {contract_id: backend_revenuecat_trial_started, name: revenuecat_trial_started, kind: custom, symbols: {typescript: [], go: [EventRevenueCatTrialStarted]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when a trial-class RevenueCat operation is applied and the user's access becomes trial-backed. This is a system-initiated grant (registration, or bootstrap import) rather than an admin operation, so it is not covered by the admin queue's revenuecat_operation_* stream. entitlement is the fixed trial key; never carries the reason, the actor, or any identifier.", properties: {entitlement: {type: string, required: true, cardinality: bounded, values: [trial_premium]}}}
  - {contract_id: backend_revenuecat_trial_ended, name: revenuecat_trial_ended, kind: custom, symbols: {typescript: [], go: [EventRevenueCatTrialEnded]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an access-resolution refresh finds a previously trial-backed projection is no longer trial — the trial either expired (converted false) or converted to a paid grant (converted true). entitlement is the fixed trial key; never carries the reason, the acting admin, or any identifier.", properties: {entitlement: {type: string, required: true, cardinality: bounded, values: [trial_premium]}, converted: {type: boolean, required: true, cardinality: bounded}}}
  - {contract_id: backend_revenuecat_access_revoked, name: revenuecat_access_revoked, kind: custom, symbols: {typescript: [], go: [EventRevenueCatAccessRevoked]}, producers: [backend], subject: target_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when a RevenueCat access-resolution refresh flips a previously granting user to an inactive projection, or when an applied admin revoke ends access, naming the entitlement that was revoked and the bounded source of the revocation: refund (a paid entitlement removed by the provider), webhook (a non-paid entitlement removed by a provider state change), or admin (an applied admin revoke). One event per revocation, never one per imported record; never carries the reason, the acting admin, or any identifier.", properties: {entitlement: {type: string, required: true, cardinality: bounded, values: [paid_premium, paid_household_2, paid_household_3, paid_household_4, paid_household_5, comp_premium, comp_household_2, comp_household_3, comp_household_4, comp_household_5, trial_premium]}, source: {type: string, required: true, cardinality: bounded, values: [refund, webhook, admin]}}}
  - {contract_id: backend_household_entitlement_projected, name: household_entitlement_projected, kind: custom, symbols: {typescript: [], go: [EventHouseholdEntitlementProjected]}, producers: [backend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when a RevenueCat-driven household entitlement projection is materialized for a joining member: the household's resolved tier, the occupied seat count after the join, and the tier's included seat limit. Emitted only after the membership transaction commits, so a rejected or rolled-back join emits nothing. Never carries a member id, household id, email, or amount.", properties: {tier: {type: string, required: true, cardinality: bounded, values: [premium, household_2, household_3, household_4, household_5]}, seat_count: {type: integer, required: true, cardinality: low, minimum: 1, maximum: 5}, seats_included: {type: integer, required: true, cardinality: low, minimum: 1, maximum: 5}}}
  - {contract_id: frontend_admin_revenuecat_replay_queued, name: admin_revenuecat_replay_queued, kind: custom, symbols: {typescript: [ADMIN_REVENUECAT_REPLAY_QUEUED], go: []}, producers: [frontend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1652', description: "Fires when an admin queues a replay of a RevenueCat webhook receipt; carries no properties because the receipt id is a per-customer identifier.", properties: {}}
