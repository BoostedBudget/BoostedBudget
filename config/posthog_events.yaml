  - {contract_id: backend_financial_data_sync_completed, name: financial_data_sync_completed, kind: custom, symbols: {typescript: [], go: [EventFinancialDataSyncCompleted]}, producers: [backend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: '#1650', description: "Fires best-effort only after a fully paginated Plaid transaction sync atomically commits its durable completion latch and final cursor; the per-linked-item latch classifies the first full catch-up as initial and every later completion or invalid-cursor recovery as refresh, while a one-time rollout-ambiguous legacy completion is conservatively suppressed.", properties: {sync_kind: {type: string, required: true, cardinality: bounded, values: [initial, refresh]}}}
