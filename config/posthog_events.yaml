  - {contract_id: backend_household_over_capacity_entered, name: household_over_capacity_entered, kind: custom, symbols: {typescript: [], go: [EventHouseholdOverCapacityEntered]}, producers: [backend], subject: actor_user, consent: analytics_required, privacy: pseudonymous, status: active, introduced: pre_1650, description: "Fires when a household first enters over-capacity grace — active members exceed the owner's seat limit. Emitted from the subscription-webhook fast path and, reusing the same event, from the authoritative daily backstop when it discovers an entry the fast path missed. active_count and seat_limit are the occupied seats and the owner's included seat limit at entry; never a household or member identifier.", properties: {active_count: {type: integer, required: true, cardinality: low, minimum: 0}, seat_limit: {type: integer, required: true, cardinality: low, minimum: 0}}}
