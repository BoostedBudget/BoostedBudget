# BoostedBudget Subscription Tiers Configuration
# Last updated: 2026-01-13
#
# Subscription System Simplification (Issues #674-#678):
# - Removed free tier entirely (users get a 60-day premium trial instead)
# - Switched from Stripe to Paddle for payment processing
# - Rules, categories, tags, API calls are now UNLIMITED for all tiers
# - Only 1 configurable limit remains: transaction_history_days
#
# Tiers: premium, household_2, household_3, household_4, household_5
#
# Special Values:
#   - Use -1 for "unlimited" resources

# Default features for all paid tiers (can be overridden per-tier if needed)
default_features: &default_features
  api_access: true
  priority_support: true
  custom_categories: true
  custom_tags: true
  advanced_reports: true

tiers:
  premium:
    display_name: "Premium"
    description: "Full features for power users"
    price_monthly: 8.99
    price_yearly: 79.00
    mobile_price_yearly: 89.99
    paddle_price_id_monthly: "pri_01jmwgcb66fqp57epz7abzcpym"
    paddle_price_id_yearly: "pri_01jmwgcyc80s12t63w4nt2c4jy"
    users_included: 1
    limits:
      transaction_history_days: 730
    features: *default_features

