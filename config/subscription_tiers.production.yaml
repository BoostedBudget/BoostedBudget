# BoostedBudget Subscription Tiers Configuration - PRODUCTION ENVIRONMENT
# Last updated: 2026-08-02
#
# ⚠️ ENVIRONMENT-SPECIFIC CONFIG FILE ⚠️
# This file is automatically loaded when PADDLE_ENVIRONMENT=production
# Use this file for PRODUCTION Paddle Price IDs only
#
# Workflow:
# 1. Create products/prices in Paddle Production Dashboard (https://vendors.paddle.com)
# 2. Copy the PRODUCTION price IDs to paddle_price_id_monthly and paddle_price_id_yearly below
# 3. Keep sandbox IDs in subscription_tiers.sandbox.yaml
# 4. Set PADDLE_ENVIRONMENT=production in your production .env file
#
# Automatic Config Selection Priority:
# 1. SUBSCRIPTION_TIERS_CONFIG env var (explicit override)
# 2. config/subscription_tiers.{PADDLE_ENVIRONMENT}.yaml (this file when PADDLE_ENVIRONMENT=production)
# 3. config/subscription_tiers.yaml (default fallback)
#
# ⚠️ WARNING: Double-check all price IDs before deploying to production!
# Using sandbox IDs in production or vice versa will cause checkout failures.
#
# Subscription System Simplification (Issues #674-#678):
# - Removed free tier entirely (users get a 60-day premium trial instead)
# - Switched from Stripe to Paddle for payment processing
# - Rules, categories, tags, API calls are now UNLIMITED for all tiers
# - Only 1 configurable limit remains: transaction_history_days
#
# Tiers: premium, household_2, household_3, household_4, household_5
#
# Special Values:
#   - Use -1 for "unlimited" resources

