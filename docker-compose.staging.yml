version: '3.9'

services:
  # PostgreSQL Database (Staging)
  postgres:
    image: postgres:15-alpine
    pull_policy: always  # Always pull latest patches
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    environment:
      POSTGRES_DB: boostedbudget_staging
      POSTGRES_USER: ${POSTGRES_USER:-staginguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stagingpass}
    ports:
      - "5433:5432"  # Different port to avoid conflict with dev
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staginguser} -d boostedbudget_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Staging)
  redis:
    image: redis:7-alpine
    pull_policy: always  # Always pull latest patches
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "6380:6379"  # Different port to avoid conflict with dev
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue (Staging)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    pull_policy: always  # Always pull latest patches
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "5673:5672"   # AMQP - different port
      - "15673:15672" # Management UI - different port
    volumes:
      - rabbitmq_staging_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Staging)
  # Uses pre-built image from GHCR (GitHub Container Registry)
  # Image is built in CI/CD and pulled by deploy script
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/boostedbudget/boostedbudget-backend:staging-latest}
    pull_policy: always  # Always pull latest image to ensure we have newest version
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "8080:8080"  # Staging backend port
    environment:
      PORT: "8080"
      ENVIRONMENT: "staging"
      VERSION: "${VERSION:-staging-dev}"
      PRIMARY_REGION: "${PRIMARY_REGION:-iad}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-staginguser}:${POSTGRES_PASSWORD:-stagingpass}@postgres:5432/boostedbudget_staging?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_CLIENT_SECRET: "${AUTH0_CLIENT_SECRET}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      PLAID_SECRET: "${PLAID_SECRET}"
      PLAID_ENV: "sandbox"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config  # Mount config directory from project root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Grace period for migrations and service initialization

  # Frontend (Staging)
  # Uses pre-built image from GHCR (GitHub Container Registry)
  # Image is built in CI/CD and pulled by deploy script
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/boostedbudget/boostedbudget-frontend:staging-latest}
    pull_policy: always  # Always pull latest image to ensure we have newest version
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "3000:80"  # Map host 3000 to container port 80 (Nginx)
    environment:
      DOCKER_ENV: "true"  # Tells Vite to use Docker service names for proxy
      VITE_API_URL: "http://localhost:8080"
      VITE_AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      VITE_AUTH0_CLIENT_ID: "${VITE_AUTH0_CLIENT_ID}"
      VITE_AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      VITE_GOOGLE_ADSENSE_CLIENT: "${GOOGLE_ADSENSE_CLIENT:-}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s  # Grace period for Nginx startup

volumes:
  postgres_staging_data:
  redis_staging_data:
  rabbitmq_staging_data:
