version: '3.9'

services:
  # PostgreSQL Database (Staging)
  postgres:
    image: postgres:15-alpine
    container_name: boostedbudget-db-staging
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    environment:
      POSTGRES_DB: boostedbudget_staging
      POSTGRES_USER: ${POSTGRES_USER:-staginguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stagingpass}
    ports:
      - "5433:5432"  # Different port to avoid conflict with dev
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staginguser} -d boostedbudget_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Staging)
  redis:
    image: redis:7-alpine
    container_name: boostedbudget-redis-staging
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "6380:6379"  # Different port to avoid conflict with dev
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue (Staging)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: boostedbudget-rabbitmq-staging
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "5673:5672"   # AMQP - different port
      - "15673:15672" # Management UI - different port
    volumes:
      - rabbitmq_staging_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Staging)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: boostedbudget-api-staging
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "8080:8080"  # Staging backend port
    environment:
      PORT: "8080"
      ENVIRONMENT: "staging"
      VERSION: "${VERSION:-staging-dev}"
      PRIMARY_REGION: "iad"
      DATABASE_URL: "postgres://${POSTGRES_USER:-staginguser}:${POSTGRES_PASSWORD:-stagingpass}@postgres:5432/boostedbudget_staging?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_CLIENT_SECRET: "${AUTH0_CLIENT_SECRET}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      PLAID_SECRET: "${PLAID_SECRET}"
      PLAID_ENV: "sandbox"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./config:/app/config  # Mount config directory from project root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (Staging - Vite Dev Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: boostedbudget-web-staging
    restart: unless-stopped  # Auto-restart on Mac Mini boot
    ports:
      - "3000:3000"  # Staging frontend port
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      VITE_AUTH0_CLIENT_ID: "${VITE_AUTH0_CLIENT_ID}"
      VITE_AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      VITE_GOOGLE_ADSENSE_CLIENT: "${GOOGLE_ADSENSE_CLIENT:-}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Don't overwrite node_modules

volumes:
  postgres_staging_data:
  redis_staging_data:
  rabbitmq_staging_data:
