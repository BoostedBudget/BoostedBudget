name: Sync Staging with Main

# Syncs staging←main on any main push (human hotfixes, reverts) or on-demand dispatch.
# Note: promote-to-production handles its own inline back-sync (GITHUB_TOKEN pushes
# don't trigger this push-based workflow); this is the safety net for direct human pushes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent syncs (queue them instead)
concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync-staging:
    name: Sync staging branch with main
    if: github.repository == 'BoostedBudget/BoostedBudget'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Authorize actor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`Unauthorized actor '${context.actor}' (permission: ${data.permission})`);
            }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0  # Full history needed for merge

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge main into staging
        run: |
          echo "📥 Fetching latest staging..."
          for i in 1 2 3; do
            git fetch origin staging && break || {
              [ $i -eq 3 ] && echo "::error::Failed to fetch after 3 attempts" && exit 1
              echo "⚠️ Fetch attempt $i/3 failed, retrying..."
              sleep 5
            }
          done

          git checkout staging
          echo "🔀 Merging main into staging..."
          git merge origin/main --no-edit -m "chore: Sync staging with main"

          echo "📤 Pushing to staging..."
          for i in 1 2 3; do
            git push origin staging && break || {
              [ $i -eq 3 ] && echo "::error::Failed to push after 3 attempts" && exit 1
              echo "⚠️ Push attempt $i/3 failed, retrying..."
              sleep 5
            }
          done

      - name: Verify sync
        run: |
          DIVERGENCE=$(git rev-list --left-right --count staging...origin/main)
          echo "Branch divergence: $DIVERGENCE"
          if [[ "$DIVERGENCE" == "0	0" ]]; then
            echo "✅ Branches are in sync"
          else
            echo "⚠️  Branches still divergent (may be expected if new commits arrived)"
          fi

      - name: Summary
        run: |
          echo "### ✅ Staging Synced with Main" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** Staging branch updated to match main" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both branches are now at the same commit. New feature branches from staging will be up-to-date." >> $GITHUB_STEP_SUMMARY

      - name: Failure notification
        if: failure()
        run: |
          echo "### ❌ Staging Sync Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manual sync required:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "git checkout staging" >> $GITHUB_STEP_SUMMARY
          echo "git pull origin staging" >> $GITHUB_STEP_SUMMARY
          echo "git merge origin/main --no-edit" >> $GITHUB_STEP_SUMMARY
          echo "git push origin staging" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
