name: Promote Staging to Production

# Manual promotion: merges staging→main and syncs main back to staging.
# Production deployment is separate; dispatch "Deploy to Production" workflow after reviewing this promotion.
on:
  workflow_dispatch:

# Prevent concurrent promotions
concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote-staging-to-main:
    name: Promote Staging to Production
    if: github.repository == 'BoostedBudget/BoostedBudget'
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
      actions: read

    steps:
      - name: Authorize actor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`Unauthorized actor '${context.actor}' (permission: ${data.permission})`);
            }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          fetch-depth: 0  # Full history needed for validation and merge

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate staging branch state
        id: validate
        run: |
          echo "🔍 Validating staging branch..."

          # Fetch latest refs with retry
          echo "📥 Fetching latest refs..."
          for i in 1 2 3; do
            git fetch origin main staging && break || {
              [ $i -eq 3 ] && echo "::error::Failed to fetch after 3 attempts" && exit 1
              echo "⚠️ Fetch attempt $i/3 failed, retrying..."
              sleep 5
            }
          done

          # Check if staging is ahead of main
          COMMITS_AHEAD=$(git rev-list --count origin/main..origin/staging)
          echo "commits-ahead=$COMMITS_AHEAD" >> $GITHUB_OUTPUT

          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "::error::Staging is not ahead of main - nothing to promote"
            exit 1
          fi

          echo "✅ Staging is $COMMITS_AHEAD commits ahead of main"

          # Check for merge conflicts
          git checkout staging
          if ! git merge-base --is-ancestor origin/main origin/staging; then
            echo "::warning::Main and staging have diverged - merge may have conflicts"
          fi

          # Check if main is ahead of staging (indicates a pending or failed sync)
          MAIN_AHEAD=$(git rev-list --count origin/staging..origin/main)
          if [ "$MAIN_AHEAD" -gt 0 ]; then
            echo "::error::Main is ahead of staging by $MAIN_AHEAD commits - unexpected state!"
            echo "::error::Run the 'Sync Staging with Main' workflow (workflow_dispatch) or manually:"
            echo "::error::  git checkout staging && git merge origin/main && git push origin staging"
            echo "::error::Then re-run this promotion."
            exit 1
          fi

      - name: Merge staging into main
        run: |
          echo "🔀 Merging staging into main..."

          git checkout main

          # Pull latest main with retry
          echo "📥 Pulling latest main..."
          for i in 1 2 3; do
            git pull origin main && break || {
              [ $i -eq 3 ] && echo "::error::Failed to pull main after 3 attempts" && exit 1
              echo "⚠️ Pull attempt $i/3 failed, retrying..."
              sleep 5
            }
          done

          # Merge staging with no-ff to preserve history
          git merge origin/staging --no-ff -m "chore: Promote staging to production

          Commits promoted: ${{ steps.validate.outputs.commits-ahead }}

          🤖 Automated promotion via workflow_dispatch"

          echo "✅ Merge successful"

      - name: Push to main
        run: |
          echo "📤 Pushing to main..."
          for i in 1 2 3; do
            git push origin main && break || {
              [ $i -eq 3 ] && echo "::error::Failed to push to main after 3 attempts" && exit 1
              echo "⚠️ Push attempt $i/3 failed, retrying..."
              sleep 5
            }
          done

      - name: Sync staging with main (inline)
        run: |
          echo "🔄 Syncing staging with main (inline back-sync)..."
          # Inline back-sync avoids GITHUB_TOKEN push→workflow trigger limitation.
          # Retry loop re-fetches and re-merges before each push to handle concurrent staging advances.

          for i in 1 2 3; do
            echo "🔁 Sync attempt $i/3..."
            git fetch origin main staging || {
              [ $i -eq 3 ] && echo "::error::Failed to fetch after 3 attempts" && exit 1
              echo "⚠️ Fetch attempt $i/3 failed, retrying..."
              sleep 5 && continue
            }
            git checkout -B staging origin/staging
            if ! git merge origin/main --no-edit -m "chore: Sync staging with main after promotion"; then
              echo "::error::Merge conflict during staging sync - manual resolution required"
              exit 1
            fi
            if git push origin staging; then
              echo "✅ Staging synced with main"
              break
            fi
            [ $i -eq 3 ] && echo "::error::Failed to sync staging after 3 attempts" && exit 1
            echo "⚠️ Push attempt $i/3 failed (origin/staging may have advanced)"
            sleep 5
          done

      - name: Verify sync
        run: |
          git fetch origin main staging
          DIVERGENCE=$(git rev-list --left-right --count staging...origin/main)
          echo "Branch divergence: $DIVERGENCE"
          if [[ "$DIVERGENCE" == "0	0" ]]; then
            echo "✅ Branches are in sync"
          else
            echo "⚠️  Branches still divergent (may be expected if new commits arrived)"
          fi

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Staging Promoted to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commits Promoted:** ${{ steps.validate.outputs.commits-ahead }}" >> $GITHUB_STEP_SUMMARY
          echo "**Promoted At:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Main branch updated" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Staging synced with main" >> $GITHUB_STEP_SUMMARY
          echo "3. ⏳ **Manually dispatch** the [Deploy to Production](https://github.com/${{ github.repository }}/actions/workflows/deploy-production.yml) workflow when ready" >> $GITHUB_STEP_SUMMARY

      - name: Failure notification
        if: failure()
        run: |
          echo "### ❌ Promotion Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- Staging not ahead of main (nothing to promote)" >> $GITHUB_STEP_SUMMARY
          echo "- Main ahead of staging: run [Sync Staging with Main](https://github.com/${{ github.repository }}/actions/workflows/sync-staging.yml) workflow first" >> $GITHUB_STEP_SUMMARY
          echo "- Merge conflicts between main and staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manual promotion (if needed):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "git checkout main && git pull origin main" >> $GITHUB_STEP_SUMMARY
          echo "git merge origin/staging --no-ff" >> $GITHUB_STEP_SUMMARY
          echo "git push origin main" >> $GITHUB_STEP_SUMMARY
          echo "git checkout staging && git merge origin/main && git push origin staging" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
