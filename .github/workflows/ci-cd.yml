name: CI/CD Pipeline

# Trigger on pull requests and pushes to main
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  # Note: Image names must be lowercase for Docker registry
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/boostedbudget-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/boostedbudget-frontend

jobs:
  # =============================================================================
  # JOB 1: Backend Tests (runs in parallel with frontend)
  # =============================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Skip tests on main pushes (already tested in PR)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go tests with coverage
        working-directory: ./backend
        run: |
          echo "::group::Running Go tests with race detection and coverage"
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "::endgroup::"

      - name: Check Go coverage threshold (≥60%)
        working-directory: ./backend
        run: |
          echo "::group::Checking coverage threshold"
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Convert to integer for comparison
          COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)

          if [ "$COVERAGE_INT" -lt 60 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold 60%"
            exit 1
          else
            echo "::notice::✅ Coverage ${COVERAGE}% meets threshold 60%"
          fi
          echo "::endgroup::"

      - name: Generate Go coverage HTML report
        working-directory: ./backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Build backend binary (for E2E tests)
        working-directory: ./backend
        run: |
          echo "::group::Building backend binary"
          go build -o bin/server ./cmd/server
          echo "::endgroup::"

      - name: Upload backend binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/server
          retention-days: 1

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 30

  # =============================================================================
  # JOB 2: Frontend Tests (runs in parallel with backend)
  # =============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    # Skip tests on main pushes (already tested in PR)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint (fail on warnings)
        working-directory: ./frontend
        run: |
          echo "::group::Running ESLint"
          npm run lint
          echo "::endgroup::"

      - name: Run frontend unit tests with coverage
        working-directory: ./frontend
        run: |
          echo "::group::Running Vitest with coverage"
          npm run test:ci
          echo "::endgroup::"

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
          retention-days: 30

  # =============================================================================
  # JOB 3: E2E Tests (depends on backend-test for binary)
  # =============================================================================
  e2e-test:
    name: E2E Tests
    needs: backend-test
    runs-on: ubuntu-latest
    # Skip tests on main pushes (already tested in PR)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/bin

      - name: Make backend binary executable
        run: chmod +x backend/bin/server

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          CI: true
        run: |
          echo "::group::Running Playwright E2E tests"
          npm run test:e2e
          echo "::endgroup::"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: frontend/test-results/
          retention-days: 7

  # =============================================================================
  # JOB 4: Migration Integration Tests
  # =============================================================================
  migration-tests:
    name: Migration Tests
    runs-on: ubuntu-latest
    # Only run on PRs to catch migration issues before merge
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          echo "::group::Installing golang-migrate"
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
          sudo chmod +x /usr/local/bin/migrate
          migrate -version
          echo "::endgroup::"

      - name: Run migrations up
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Running migrations"
          migrate -path backend/migrations -database "$DATABASE_URL" -verbose up
          echo "::endgroup::"

      - name: Validate schema
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Validating database schema"

          # Check all expected tables exist
          echo "Checking tables..."
          psql "$DATABASE_URL" -c "\dt" | grep users || { echo "::error::users table missing"; exit 1; }
          psql "$DATABASE_URL" -c "\dt" | grep privacy_settings || { echo "::error::privacy_settings table missing"; exit 1; }
          psql "$DATABASE_URL" -c "\dt" | grep audit_logs || { echo "::error::audit_logs table missing"; exit 1; }
          psql "$DATABASE_URL" -c "\dt" | grep user_subscription_overrides || { echo "::error::user_subscription_overrides table missing"; exit 1; }

          # Validate users table columns
          echo "Validating users table..."
          psql "$DATABASE_URL" -c "\d users" | grep "id.*uuid" || { echo "::error::users.id should be UUID"; exit 1; }
          psql "$DATABASE_URL" -c "\d users" | grep "email.*character varying" || { echo "::error::users.email should be VARCHAR"; exit 1; }

          # Validate foreign keys
          echo "Validating foreign keys..."
          psql "$DATABASE_URL" -c "\d user_subscription_overrides" | grep "FOREIGN KEY" || { echo "::error::Missing foreign key"; exit 1; }
          psql "$DATABASE_URL" -c "\d user_subscription_overrides" | grep "user_id.*uuid" || { echo "::error::user_id should be UUID"; exit 1; }

          echo "::notice::✅ Schema validation passed"
          echo "::endgroup::"

      - name: Test migration rollback
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Testing migration rollback"

          # Rollback last migration
          echo "Rolling back last migration..."
          migrate -path backend/migrations -database "$DATABASE_URL" down 1

          # Verify table was removed
          if psql "$DATABASE_URL" -c "\dt" | grep -q user_subscription_overrides; then
            echo "::error::Table should have been removed by rollback"
            exit 1
          fi
          echo "✅ Table removed successfully"

          # Re-apply migration
          echo "Re-applying migration..."
          migrate -path backend/migrations -database "$DATABASE_URL" up

          # Verify table exists again
          psql "$DATABASE_URL" -c "\dt" | grep user_subscription_overrides || { echo "::error::Table should exist after re-applying"; exit 1; }
          echo "✅ Migration re-applied successfully"

          echo "::notice::✅ Rollback test passed"
          echo "::endgroup::"

      - name: Test constraints
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Testing database constraints"

          # Test that we can't insert invalid UUID (should fail)
          echo "Testing invalid UUID rejection..."
          if psql "$DATABASE_URL" -c "
            INSERT INTO user_subscription_overrides
            (user_id, resource_type, limit_value)
            VALUES ('invalid-uuid', 'rules', 10)
          " 2>&1; then
            echo "::error::Should have rejected invalid UUID"
            exit 1
          fi
          echo "✅ Invalid UUID rejected as expected"

          echo "::notice::✅ Constraint tests passed"
          echo "::endgroup::"

      - name: Check migration state
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Checking final migration state"

          # Verify no dirty migrations
          DIRTY=$(psql "$DATABASE_URL" -t -c "SELECT dirty FROM schema_migrations" | tr -d ' ')
          echo "Dirty state: $DIRTY"

          if [ "$DIRTY" = "t" ]; then
            echo "::error::Migration state is dirty"
            exit 1
          fi

          # Show final version
          psql "$DATABASE_URL" -c "SELECT version, dirty FROM schema_migrations"

          echo "::notice::✅ Migration state is clean"
          echo "::endgroup::"

      - name: Migration test summary
        if: always()
        run: |
          echo "### 🗄️ Migration Tests Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All migrations tested against PostgreSQL 15:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Migrations run successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Schema validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rollback tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Constraint tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Clean migration state" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 5: Security Scan - Dependencies & Dockerfiles (Fast - No Build Required)
  # =============================================================================
  pr-security-scan:
    name: Security Scan (Dependencies & Config)
    runs-on: ubuntu-latest
    # Only run on PRs to catch vulnerabilities before merge
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan backend Go dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          scanners: 'vuln'  # Only vulnerabilities, not misconfig/secrets
          format: 'sarif'
          output: 'trivy-backend-deps.sarif'
          severity: 'CRITICAL,HIGH'  # Only block on CRITICAL/HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload backend dependency scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-backend-deps.sarif'
          category: 'trivy-backend-dependencies'

      - name: Scan frontend npm dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          scanners: 'vuln'  # Only vulnerabilities, not misconfig/secrets
          format: 'sarif'
          output: 'trivy-frontend-deps.sarif'
          severity: 'CRITICAL,HIGH'  # Only block on CRITICAL/HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload frontend dependency scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-frontend-deps.sarif'
          category: 'trivy-frontend-dependencies'

      - name: Scan backend Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './backend/Dockerfile'
          format: 'sarif'
          output: 'trivy-backend-dockerfile.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on Dockerfile issues, just report

      - name: Upload backend Dockerfile scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-backend-dockerfile.sarif'
          category: 'trivy-backend-dockerfile'

      - name: Scan frontend Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './frontend/Dockerfile'
          format: 'sarif'
          output: 'trivy-frontend-dockerfile.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on Dockerfile issues, just report

      - name: Upload frontend Dockerfile scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-frontend-dockerfile.sarif'
          category: 'trivy-frontend-dockerfile'

      - name: Security scan summary
        if: always()
        run: |
          echo "### 🔒 PR Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned:**" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Go dependencies (go.mod/go.sum)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend npm dependencies (package.json/package-lock.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Dockerfile configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Dockerfile configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 5: Build and push Docker images to GHCR
  # =============================================================================
  build-images:
    name: Build Docker Images
    # Only depend on tests if they run (PRs), otherwise no dependencies (main)
    needs: [backend-test, frontend-test, e2e-test, migration-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only build images on main branch push (after PR merge)
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.meta.outputs.backend-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for images
        id: meta
        run: |
          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}"

          echo "backend-image=${BACKEND_IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend-image=${FRONTEND_IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT

          echo "Backend image: ${BACKEND_IMAGE}:${{ github.sha }}"
          echo "Frontend image: ${FRONTEND_IMAGE}:${{ github.sha }}"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image build summary
        run: |
          echo "### 🐳 Docker Images Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 6: Security Scan - Docker Images (Comprehensive - After Build on Main)
  # =============================================================================
  image-security-scan:
    name: Security Scan (Docker Images)
    needs: build-images
    runs-on: ubuntu-latest
    # Only run on main - PRs use faster filesystem scan
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read  # Required for workflow run information
      contents: read
      packages: read  # Required to pull images from GHCR
      security-events: write  # Required to upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .trivyignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-images.outputs.backend-image }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Informational only - Debian base images have unfixable CVEs (Issue #96)
          ignore-unfixed: true

      - name: Upload Trivy results (Backend) to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Run Trivy vulnerability scanner - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-images.outputs.frontend-image }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Informational only - Debian base images have unfixable CVEs (Issue #96)
          ignore-unfixed: true

      - name: Upload Trivy results (Frontend) to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      - name: Security scan summary
        if: always()
        run: |
          echo "### 🔒 Docker Image Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned:**" >> $GITHUB_STEP_SUMMARY
          echo "- Complete backend Docker image" >> $GITHUB_STEP_SUMMARY
          echo "- Complete frontend Docker image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is the final comprehensive scan before deployment." >> $GITHUB_STEP_SUMMARY
          echo "Results uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 7: Push images to Fly.io registry
  # =============================================================================
  push-to-fly-registry:
    name: Push Images to Fly.io Registry
    needs: [build-images, image-security-scan]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build-images.result == 'success' &&
      (needs.image-security-scan.result == 'success' || needs.image-security-scan.result == 'skipped')

    steps:
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with Fly.io Docker Registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Pull and push backend image to Fly.io registry
        run: |
          # Pull from GHCR
          docker pull ${{ needs.build-images.outputs.backend-image }}

          # Tag for Fly.io registry
          docker tag ${{ needs.build-images.outputs.backend-image }} registry.fly.io/boostedbudget-api:${{ github.sha }}
          docker tag ${{ needs.build-images.outputs.backend-image }} registry.fly.io/boostedbudget-api:latest

          # Push to Fly.io
          docker push registry.fly.io/boostedbudget-api:${{ github.sha }}
          docker push registry.fly.io/boostedbudget-api:latest

      - name: Pull and push frontend image to Fly.io registry
        run: |
          # Pull from GHCR
          docker pull ${{ needs.build-images.outputs.frontend-image }}

          # Tag for Fly.io registry
          docker tag ${{ needs.build-images.outputs.frontend-image }} registry.fly.io/boostedbudget-web:${{ github.sha }}
          docker tag ${{ needs.build-images.outputs.frontend-image }} registry.fly.io/boostedbudget-web:latest

          # Push to Fly.io
          docker push registry.fly.io/boostedbudget-web:${{ github.sha }}
          docker push registry.fly.io/boostedbudget-web:latest

      - name: Summary
        run: |
          echo "### 📦 Images Pushed to Fly.io Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** \`registry.fly.io/boostedbudget-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** \`registry.fly.io/boostedbudget-web:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 8: Run database migrations (before deployment)
  # =============================================================================
  migrate-database:
    name: Run Database Migrations
    needs: [push-to-fly-registry]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.push-to-fly-registry.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install golang-migrate
        run: |
          echo "Installing golang-migrate..."
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
          sudo chmod +x /usr/local/bin/migrate
          migrate -version

      - name: Check for dirty migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking database migration state..."

          # Query schema_migrations table for dirty state
          RESULT=$(flyctl postgres connect -a boostedbudget-db -C \
            "SELECT dirty FROM schema_migrations" 2>&1 || echo "query_failed")

          echo "Migration state query result:"
          echo "$RESULT"

          # Check if we got "t" (true) which means dirty
          if echo "$RESULT" | grep -q " t$"; then
            echo "::error::Database has dirty migrations! Cannot proceed with deployment."
            echo "::error::Manual intervention required. See Issue #106 for recovery steps."
            exit 1
          fi

          echo "✅ Migration state is clean, proceeding..."

      - name: Run migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Running database migrations on existing infrastructure..."
          echo "This runs BEFORE deploying new containers to prevent crash loops"

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set in GitHub Actions"
            echo "::error::Please add DATABASE_URL to repository secrets"
            echo "::error::Get it from: fly postgres connect -a boostedbudget-db"
            exit 1
          fi

          echo "Running migrations..."
          migrate -path backend/migrations -database "$DATABASE_URL" -verbose up

          echo "✅ Migrations completed successfully"

      - name: Verify migration success
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Verifying migration completed successfully..."

          # Check final migration state
          flyctl postgres connect -a boostedbudget-db -C \
            "SELECT version, dirty FROM schema_migrations"

          echo ""
          echo "✅ Migrations verified, ready for deployment"

      - name: Migration summary
        run: |
          echo "### 🗄️ Database Migrations Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Migrations run successfully on existing infrastructure." >> $GITHUB_STEP_SUMMARY
          echo "Ready to deploy new containers." >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 9: Deploy to production (manual approval required)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-images, push-to-fly-registry, migrate-database]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build-images.result == 'success' &&
      needs.push-to-fly-registry.result == 'success' &&
      needs.migrate-database.result == 'success'
    environment:
      name: production
      url: https://boostedbudget.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deploying backend from Fly.io registry: registry.fly.io/boostedbudget-api:${{ github.sha }}"
          echo "Note: Database migrations already completed in previous job"
          flyctl deploy \
            --app boostedbudget-api \
            --image registry.fly.io/boostedbudget-api:${{ github.sha }} \
            --config ./backend/fly.toml \
            --strategy rolling

      - name: Deploy frontend to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deploying frontend from Fly.io registry: registry.fly.io/boostedbudget-web:${{ github.sha }}"
          flyctl deploy \
            --app boostedbudget-web \
            --image registry.fly.io/boostedbudget-web:${{ github.sha }} \
            --config ./frontend/fly.toml \
            --strategy rolling

      - name: Verify deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking backend status..."
          flyctl status --app boostedbudget-api

          echo "Checking frontend status..."
          flyctl status --app boostedbudget-web

      - name: Verify containers started successfully
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking backend deployment logs..."
          flyctl logs -a boostedbudget-api -n 2>&1 | head -20 || true

          echo ""
          echo "Note: Migrations were completed in CI/CD before deployment"
          echo "      Containers start directly with the server (no migration step)"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          if [ -f ./scripts/smoke-test.sh ]; then
            chmod +x ./scripts/smoke-test.sh
            ./scripts/smoke-test.sh production
          else
            echo "Smoke test script not found, skipping..."
          fi

      - name: Deployment summary
        run: |
          echo "### 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** https://api.boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** https://boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Database Migrations:** ✅ Completed in CI/CD before deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Migrations run separately from container startup to prevent crash loops." >> $GITHUB_STEP_SUMMARY

