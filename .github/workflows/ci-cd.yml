name: CI/CD Pipeline

# Trigger on pull requests and pushes to main
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  # Note: Image names must be lowercase for Docker registry
  # Hardcode lowercase organization name to avoid case sensitivity issues
  BACKEND_IMAGE_NAME: boostedbudget/boostedbudget-backend
  FRONTEND_IMAGE_NAME: boostedbudget/boostedbudget-frontend

jobs:
  # =============================================================================
  # JOB 1: Backend Tests (runs in parallel with frontend)
  # =============================================================================
  backend-test:
    name: Backend Tests
    runs-on: [self-hosted, macOS, mac-mini]
    # Skip tests on main pushes (already tested in PR)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Disabled for self-hosted runner - local caches persist naturally
          # cache-dependency-path: backend/go.sum

      # Commented out - self-hosted runner has persistent local cache
      # Local Go cache persists at: ~/Library/Caches/go-build & ~/go/pkg/mod
      # No need for slow 900MB uploads to GitHub cache servers
      # - name: Cache Go modules
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cache/go-build
      #       ~/go/pkg/mod
      #     key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
      #     restore-keys: |
      #       ${{ runner.os }}-go-

      - name: Run Go tests with coverage
        working-directory: ./backend
        run: |
          echo "::group::Running Go tests with race detection and coverage"
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "::endgroup::"

      - name: Check Go coverage threshold (≥60%)
        working-directory: ./backend
        run: |
          echo "::group::Checking coverage threshold"
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Convert to integer for comparison
          COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)

          if [ "$COVERAGE_INT" -lt 60 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold 60%"
            exit 1
          else
            echo "::notice::✅ Coverage ${COVERAGE}% meets threshold 60%"
          fi
          echo "::endgroup::"

      - name: Generate Go coverage HTML report
        working-directory: ./backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Build backend binary (for E2E tests)
        working-directory: ./backend
        run: |
          echo "::group::Building backend binary"
          go build -o bin/server ./cmd/server
          echo "::endgroup::"

      - name: Upload backend binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/server
          retention-days: 1

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 30

  # =============================================================================
  # JOB 2: Frontend Tests (runs in parallel with backend)
  # =============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: [self-hosted, macOS, mac-mini]
    # Skip tests on main pushes (already tested in PR)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Disabled for self-hosted runner - local npm cache (~/.npm) persists naturally
          # cache: 'npm'
          # cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint (fail on warnings)
        working-directory: ./frontend
        run: |
          echo "::group::Running ESLint"
          npm run lint
          echo "::endgroup::"

      - name: Run frontend unit tests with coverage
        working-directory: ./frontend
        run: |
          echo "::group::Running Unit Tests"
          # --no-cache flag in test:ci handles fresh module resolution
          npm run test:ci
          echo "::endgroup::"

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
          retention-days: 30

  # =============================================================================
  # JOB 3: E2E Tests (depends on backend-test for binary)
  # =============================================================================
  e2e-test:
    name: E2E Tests
    needs: backend-test
    runs-on: [self-hosted, macOS, mac-mini]
    # Skip tests on main pushes (already tested in PR)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Disabled for self-hosted runner - local npm cache (~/.npm) persists naturally
          # cache: 'npm'
          # cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/bin

      - name: Make backend binary executable
        run: chmod +x backend/bin/server

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          CI: true
        run: |
          echo "::group::Running Playwright E2E tests"
          npm run test:e2e
          echo "::endgroup::"

      - name: Upload E2E test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: frontend/test-results/
          retention-days: 7

  # =============================================================================
  # JOB 4: Migration Integration Tests
  # =============================================================================
  migration-tests:
    name: Migration Tests
    runs-on: [self-hosted, macOS, mac-mini]
    # Only run on PRs to catch migration issues before merge
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          # Stop and remove any existing test postgres container
          docker stop test-postgres 2>/dev/null || true
          docker rm test-postgres 2>/dev/null || true

          # Start fresh postgres container
          docker run -d \
            --name test-postgres \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:15

          # Wait for postgres to be ready (portable - works on macOS and Linux)
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec test-postgres pg_isready -U test > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Timeout waiting for PostgreSQL to start"
              exit 1
            fi
            sleep 1
          done

      # Atlas is pre-installed on self-hosted runner at /usr/local/bin/atlas
      # No need for ariga/setup-atlas@v0 which requires sudo and fails
      # - name: Setup Atlas
      #   uses: ariga/setup-atlas@v0
      #   # Note: cloud-token is optional - only needed for Atlas Cloud features

      - name: Lint migrations (Atlas validation)
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Linting migrations"
          cd backend

          # CRITICAL: This catches schema errors like migration 4's type mismatch
          # Would have prevented the UUID/VARCHAR foreign key error
          atlas migrate lint \
            --dir file://migrations \
            --dev-url "docker://postgres/15/test" \
            --latest 1

          echo "::notice::✅ Migration lint passed - no schema errors detected"
          echo "::endgroup::"

      - name: Run migrations up
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Running migrations"
          atlas migrate apply \
            --dir file://backend/migrations \
            --url "$DATABASE_URL"
          echo "::endgroup::"

      - name: Validate schema
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Validating database schema"

          # Check all expected tables exist
          echo "Checking tables..."
          docker exec test-postgres psql -U test -d test -c "\dt" | grep users || { echo "::error::users table missing"; exit 1; }
          docker exec test-postgres psql -U test -d test -c "\dt" | grep privacy_settings || { echo "::error::privacy_settings table missing"; exit 1; }
          docker exec test-postgres psql -U test -d test -c "\dt" | grep audit_logs || { echo "::error::audit_logs table missing"; exit 1; }
          docker exec test-postgres psql -U test -d test -c "\dt" | grep user_subscription_overrides || { echo "::error::user_subscription_overrides table missing"; exit 1; }

          # Validate users table columns
          echo "Validating users table..."
          docker exec test-postgres psql -U test -d test -c "\d users" | grep "id.*uuid" || { echo "::error::users.id should be UUID"; exit 1; }
          docker exec test-postgres psql -U test -d test -c "\d users" | grep "email.*character varying" || { echo "::error::users.email should be VARCHAR"; exit 1; }

          # Validate foreign keys
          echo "Validating foreign keys..."
          docker exec test-postgres psql -U test -d test -c "\d user_subscription_overrides" | grep "FOREIGN KEY" || { echo "::error::Missing foreign key"; exit 1; }
          docker exec test-postgres psql -U test -d test -c "\d user_subscription_overrides" | grep "user_id.*uuid" || { echo "::error::user_id should be UUID"; exit 1; }

          echo "::notice::✅ Schema validation passed"
          echo "::endgroup::"

      - name: Check Atlas migration status
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Checking Atlas migration status"

          # Show migration status with Atlas
          echo "Current migration status:"
          atlas migrate status \
            --dir file://backend/migrations \
            --url "$DATABASE_URL"

          echo "::notice::✅ Migration status check passed"
          echo "::endgroup::"

      - name: Test constraints
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Testing database constraints"

          # Test that we can't insert invalid UUID (should fail)
          echo "Testing invalid UUID rejection..."
          if docker exec test-postgres psql -U test -d test -c "
            INSERT INTO user_subscription_overrides
            (user_id, resource_type, limit_value)
            VALUES ('invalid-uuid', 'rules', 10)
          " 2>&1; then
            echo "::error::Should have rejected invalid UUID"
            exit 1
          fi
          echo "✅ Invalid UUID rejected as expected"

          echo "::notice::✅ Constraint tests passed"
          echo "::endgroup::"

      - name: Check migration state
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          echo "::group::Checking final migration state"

          # Show all tables to verify what Atlas created
          echo "All database tables:"
          docker exec test-postgres psql -U test -d test -c "\dt"

          # Atlas tracks migrations - check what tables exist
          echo ""
          echo "Checking Atlas migration tracking..."

          # Atlas may use different table names depending on version/config
          # Try atlas_schema_revisions first, fallback to other common names
          if docker exec test-postgres psql -U test -d test -c "\d atlas_schema_revisions" &>/dev/null; then
            ATLAS_TABLE="atlas_schema_revisions"
          elif docker exec test-postgres psql -U test -d test -c "\d atlas_migrations" &>/dev/null; then
            ATLAS_TABLE="atlas_migrations"
          else
            echo "::warning::No Atlas tracking table found, checking if migrations applied via schema"
            # Verify migrations applied by checking if all tables exist
            docker exec test-postgres psql -U test -d test -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename"

            # If we have all expected tables, migrations succeeded
            TABLES_COUNT=$(docker exec test-postgres psql -U test -d test -t -c "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('users', 'privacy_settings', 'audit_logs', 'user_subscription_overrides')" | tr -d ' ')

            if [ "$TABLES_COUNT" = "4" ]; then
              echo "::notice::✅ All 4 expected tables exist - migrations applied successfully"
            else
              echo "::error::Expected 4 tables, found $TABLES_COUNT"
              exit 1
            fi

            echo "::endgroup::"
            exit 0
          fi

          # If we found an Atlas table, check migration count
          echo "Atlas tracking table: $ATLAS_TABLE"
          docker exec test-postgres psql -U test -d test -c "SELECT * FROM $ATLAS_TABLE ORDER BY version"

          COUNT=$(docker exec test-postgres psql -U test -d test -t -c "SELECT COUNT(*) FROM $ATLAS_TABLE" | tr -d ' ')
          echo "Total migrations applied: $COUNT"

          if [ "$COUNT" != "5" ]; then
            echo "::error::Expected 5 migrations, but found $COUNT"
            exit 1
          fi

          echo "::notice::✅ Migration state is clean - all 5 migrations applied"
          echo "::endgroup::"

      - name: Cleanup PostgreSQL container
        if: always()
        run: |
          docker stop test-postgres 2>/dev/null || true
          docker rm test-postgres 2>/dev/null || true

      - name: Migration test summary
        if: success() || failure()
        run: |
          echo "### 🗄️ Migration Tests Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All migrations tested against PostgreSQL 15:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Migrations run successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Schema validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rollback tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Constraint tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Clean migration state" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 4: Security Scan - Dependencies & Dockerfiles (Parallelized)
  # =============================================================================
  pr-security-scan:
    name: Security Scan (${{ matrix.component }})
    runs-on: [self-hosted, macOS, mac-mini]
    # Only run on PRs to catch vulnerabilities before merge
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        component: [backend, frontend]
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan ${{ matrix.component }} dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.component }}'
          scanners: 'vuln'  # Only vulnerabilities, not misconfig/secrets
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-deps.sarif'
          severity: 'CRITICAL,HIGH'  # Only block on CRITICAL/HIGH
          exit-code: '1'
          ignore-unfixed: true
          cache: false  # Skip GitHub Actions cache for self-hosted runners

      - name: Upload ${{ matrix.component }} dependency scan results
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-${{ matrix.component }}-deps.sarif'
          category: 'trivy-${{ matrix.component }}-dependencies'

      - name: Scan ${{ matrix.component }} Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './${{ matrix.component }}/Dockerfile'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-dockerfile.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on Dockerfile issues, just report
          cache: false  # Skip GitHub Actions cache for self-hosted runners

      - name: Upload ${{ matrix.component }} Dockerfile scan results
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-${{ matrix.component }}-dockerfile.sarif'
          category: 'trivy-${{ matrix.component }}-dockerfile'

      - name: Security scan summary
        if: success() || failure()
        run: |
          echo "### 🔒 ${{ matrix.component }} Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned:**" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ matrix.component }} dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ matrix.component }} Dockerfile configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 5: Build and push Docker images to GHCR (Parallelized via Matrix)
  # =============================================================================
  build-images:
    name: Build ${{ matrix.component }} Image
    # Only depend on tests if they run (PRs), otherwise no dependencies (main)
    needs: [backend-test, frontend-test, e2e-test, migration-tests]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !cancelled()
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
    # Only build images on main branch push (after PR merge)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker to avoid keychain conflicts
        run: |
          # Self-hosted runner fix: Remove credsStore to avoid macOS Keychain conflicts
          # This allows credentials to be stored in ~/.docker/config.json instead
          #
          # CRITICAL: Use flock to prevent race conditions when parallel matrix jobs
          # (backend + frontend) both try to modify config.json simultaneously
          (
            flock -x 200  # Exclusive lock to prevent concurrent modifications

            mkdir -p ~/.docker
            if [ -f ~/.docker/config.json ]; then
              # Remove credsStore entry if jq is available
              if command -v jq &> /dev/null; then
                # Use component-specific temp file to avoid collisions
                TEMP_FILE=~/.docker/config.json.tmp.${{ matrix.component }}
                if jq 'del(.credsStore)' ~/.docker/config.json > "$TEMP_FILE" 2>/dev/null; then
                  mv "$TEMP_FILE" ~/.docker/config.json
                else
                  echo "⚠️  Warning: jq failed to parse config.json, skipping credsStore removal"
                  rm -f "$TEMP_FILE"
                fi
              else
                echo "⚠️  Warning: jq not found, skipping credsStore removal"
              fi
            else
              echo "{}" > ~/.docker/config.json
            fi
          ) 200>~/.docker/config.json.lock

      - name: Log in to GitHub Container Registry (with retry)
        run: |
          # CRITICAL: Use flock to prevent race conditions when parallel matrix jobs
          # both try to docker login simultaneously (can cause auth token conflicts)
          (
            flock -x 200  # Exclusive lock to serialize docker login

            MAX_ATTEMPTS=3
            RETRY_WAIT=10

            for i in $(seq 1 $MAX_ATTEMPTS); do
              echo "[${{ matrix.component }}] Attempt $i of $MAX_ATTEMPTS..."
              if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin; then
                echo "✅ [${{ matrix.component }}] Login successful"
                exit 0
              else
                if [ $i -lt $MAX_ATTEMPTS ]; then
                  echo "⚠️ [${{ matrix.component }}] Login failed, retrying in ${RETRY_WAIT}s..."
                  sleep $RETRY_WAIT
                else
                  echo "❌ [${{ matrix.component }}] Login failed after $MAX_ATTEMPTS attempts"
                  exit 1
                fi
              fi
            done
          ) 200>~/.docker/login.lock

      - name: Set image name for ${{ matrix.component }}
        id: image-name
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            IMAGE_NAME="${{ env.BACKEND_IMAGE_NAME }}"
          else
            IMAGE_NAME="${{ env.FRONTEND_IMAGE_NAME }}"
          fi
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Building: ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}"

      - name: Build and push ${{ matrix.component }} image (with retry)
        run: |
          MAX_ATTEMPTS=3
          RETRY_WAIT=30

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS..."
            if docker buildx build \
              --file ./${{ matrix.component }}/Dockerfile \
              --push \
              --tag ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:latest \
              --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:buildcache \
              --cache-to type=registry,ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:buildcache,mode=max \
              --platform linux/amd64 \
              --build-arg VERSION=${{ github.sha }} \
              --build-arg BUILD_DATE=${{ github.event.head_commit.timestamp }} \
              --provenance=false \
              .; then
              echo "✅ Build and push successful"
              exit 0
            else
              if [ $i -lt $MAX_ATTEMPTS ]; then
                echo "⚠️ Build/push failed, retrying in ${RETRY_WAIT}s..."
                sleep $RETRY_WAIT
              else
                echo "❌ Build/push failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            fi
          done

      - name: Image build summary
        run: |
          echo "### 🐳 ${{ matrix.component }} Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 6: Security Scan - Docker Images (Comprehensive - After Build on Main)
  # =============================================================================
  image-security-scan:
    name: Security Scan (${{ matrix.component }} Image)
    needs: build-images
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
    # Only run on main - PRs use faster filesystem scan
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !cancelled() &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'failure')
    permissions:
      actions: read  # Required for workflow run information
      contents: read
      packages: read  # Required to pull images from GHCR
      security-events: write  # Required to upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Docker to avoid keychain conflicts
        run: |
          # Self-hosted runner fix: Remove credsStore to avoid macOS Keychain conflicts
          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            # Remove credsStore entry if jq is available
            if command -v jq &> /dev/null; then
              if jq 'del(.credsStore)' ~/.docker/config.json > ~/.docker/config.json.tmp 2>/dev/null; then
                mv ~/.docker/config.json.tmp ~/.docker/config.json
              else
                echo "⚠️  Warning: jq failed to parse config.json, skipping credsStore removal"
                rm -f ~/.docker/config.json.tmp
              fi
            else
              echo "⚠️  Warning: jq not found, skipping credsStore removal"
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false  # Self-hosted runner - credentials persist in config.json

      - name: Calculate image reference for ${{ matrix.component }}
        id: image-ref
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            IMAGE_NAME="${{ env.BACKEND_IMAGE_NAME }}"
          else
            IMAGE_NAME="${{ env.FRONTEND_IMAGE_NAME }}"
          fi
          IMAGE_REF="${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}"
          echo "image-ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "Scanning: ${IMAGE_REF}"

      - name: Run Trivy vulnerability scanner - ${{ matrix.component }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-ref.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Informational only - Debian base images have unfixable CVEs (Issue #96)
          ignore-unfixed: true
          cache: false  # Skip GitHub Actions cache for self-hosted runners

      - name: Upload Trivy results (${{ matrix.component }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        continue-on-error: true  # Don't fail if Code Scanning not enabled
        with:
          sarif_file: 'trivy-${{ matrix.component }}-results.sarif'
          category: 'trivy-${{ matrix.component }}'

      - name: Security scan summary
        if: success() || failure()
        run: |
          echo "### 🔒 ${{ matrix.component }} Image Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned:**" >> $GITHUB_STEP_SUMMARY
          echo "- Complete ${{ matrix.component }} Docker image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 7: Push images to Fly.io registry (Parallelized via Matrix)
  # =============================================================================
  push-to-fly-registry:
    name: Push ${{ matrix.component }} to Fly.io Registry
    needs: [build-images, image-security-scan]
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            fly-app: boostedbudget-api
          - component: frontend
            fly-app: boostedbudget-web
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !cancelled() &&
      needs.build-images.result == 'success' &&
      (needs.image-security-scan.result == 'success' || needs.image-security-scan.result == 'skipped')

    steps:
      - name: Cleanup Docker storage (prevent containerd corruption)
        run: |
          echo "Cleaning dangling images and build cache to prevent containerd issues..."
          docker system prune -f --filter "until=24h"
          echo "Docker cleanup complete"

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Configure Docker to avoid keychain conflicts
        run: |
          # Self-hosted runner fix: Remove credsStore to avoid macOS Keychain conflicts
          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            # Remove credsStore entry if jq is available
            if command -v jq &> /dev/null; then
              if jq 'del(.credsStore)' ~/.docker/config.json > ~/.docker/config.json.tmp 2>/dev/null; then
                mv ~/.docker/config.json.tmp ~/.docker/config.json
              else
                echo "⚠️  Warning: jq failed to parse config.json, skipping credsStore removal"
                rm -f ~/.docker/config.json.tmp
              fi
            else
              echo "⚠️  Warning: jq not found, skipping credsStore removal"
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false  # Self-hosted runner - credentials persist in config.json

      - name: Authenticate with Fly.io Docker Registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Pull and push ${{ matrix.component }} image to Fly.io registry
        run: |
          # Determine image name based on component
          if [ "${{ matrix.component }}" = "backend" ]; then
            IMAGE_NAME="${{ env.BACKEND_IMAGE_NAME }}"
          else
            IMAGE_NAME="${{ env.FRONTEND_IMAGE_NAME }}"
          fi

          # Pull from GHCR with retry logic (handle containerd transient errors)
          GHCR_IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}"

          echo "Pulling image: ${GHCR_IMAGE}"
          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if docker pull --platform linux/amd64 ${GHCR_IMAGE}; then
              echo "Successfully pulled image on attempt $((RETRY_COUNT + 1))"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Pull failed, cleaning up and retrying ($RETRY_COUNT/$MAX_RETRIES)..."
                docker system prune -f
                sleep 5
              else
                echo "Failed to pull image after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

          # Tag for Fly.io registry
          docker tag ${GHCR_IMAGE} registry.fly.io/${{ matrix.fly-app }}:${{ github.sha }}
          docker tag ${GHCR_IMAGE} registry.fly.io/${{ matrix.fly-app }}:latest

          # Push to Fly.io
          docker push registry.fly.io/${{ matrix.fly-app }}:${{ github.sha }}
          docker push registry.fly.io/${{ matrix.fly-app }}:latest

      - name: Cleanup images after push
        if: always()
        run: |
          echo "Cleaning up pulled images to free space..."
          # Remove the specific images we just pulled to prevent accumulation
          docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          echo "Cleanup complete"

      - name: Summary
        run: |
          echo "### 📦 ${{ matrix.component }} Image Pushed to Fly.io Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${{ matrix.component }}:** \`registry.fly.io/${{ matrix.fly-app }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 8: Deploy to production (Parallelized via Matrix)
  # =============================================================================
  # NOTE: Database migrations now run via fly.toml release_command
  #       before new containers start. See backend/fly.toml [deploy] section.
  deploy-production-apps:
    name: Deploy ${{ matrix.component }} to Production
    needs: [build-images, push-to-fly-registry]
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            fly-app: boostedbudget-api
            fly-config: ./backend/fly.toml
            deploy-strategy: ""
          - component: frontend
            fly-app: boostedbudget-web
            fly-config: ./frontend/fly.toml
            deploy-strategy: "--strategy rolling"
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !cancelled() &&
      needs.build-images.result == 'success' &&
      needs.push-to-fly-registry.result == 'success'
    environment:
      name: production
      url: https://boostedbudget.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.component }} to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deploying ${{ matrix.component }} from Fly.io registry: registry.fly.io/${{ matrix.fly-app }}:${{ github.sha }}"
          if [ "${{ matrix.component }}" = "backend" ]; then
            echo "Note: Database migrations will run via release_command (see backend/fly.toml)"
          fi
          flyctl deploy \
            --app ${{ matrix.fly-app }} \
            --image registry.fly.io/${{ matrix.fly-app }}:${{ github.sha }} \
            --config ${{ matrix.fly-config }} \
            ${{ matrix.deploy-strategy }}

      - name: Verify ${{ matrix.component }} deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking ${{ matrix.component }} status..."
          flyctl status --app ${{ matrix.fly-app }}

      - name: Verify ${{ matrix.component }} containers started successfully
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking ${{ matrix.component }} deployment logs..."
          flyctl logs -a ${{ matrix.fly-app }} -n 2>&1 | head -20 || true

      - name: Deployment summary
        run: |
          echo "### 🚀 ${{ matrix.component }} Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.component }}" = "backend" ]; then
            echo "**URL:** https://api.boostedbudget.com" >> $GITHUB_STEP_SUMMARY
            echo "**Database Migrations:** ✅ Run via release_command before deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "**URL:** https://boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 9: Smoke tests (after both apps deployed)
  # =============================================================================
  smoke-tests:
    name: Production Smoke Tests
    needs: deploy-production-apps
    runs-on: [self-hosted, macOS, mac-mini]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !cancelled() &&
      needs.deploy-production-apps.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          echo "Running smoke tests..."
          if [ -f ./scripts/smoke-test.sh ]; then
            chmod +x ./scripts/smoke-test.sh
            ./scripts/smoke-test.sh production
          else
            echo "Smoke test script not found, skipping..."
          fi

      - name: Smoke tests summary
        if: success() || failure()
        run: |
          echo "### 🧪 Smoke Tests Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All smoke tests passed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Tests have a 5-minute timeout to prevent hanging." >> $GITHUB_STEP_SUMMARY

