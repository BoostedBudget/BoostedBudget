name: Deploy to Staging

# Trigger on pushes to staging branch (after PR merge or direct push)
# Also allow manual triggering to deploy a specific PR branch
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (leave empty to deploy staging branch)'
        required: false
        type: string
      skip_security_scan:
        description: 'Skip security scan (not recommended)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Only allow one staging deployment at a time
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: boostedbudget/boostedbudget-backend
  FRONTEND_IMAGE_NAME: boostedbudget/boostedbudget-frontend

jobs:
  # =============================================================================
  # Fetch PR Metadata (only for manual PR deployments)
  # =============================================================================
  pr-metadata:
    name: Fetch PR Metadata
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
    runs-on: [self-hosted, macOS, mac-mini]
    outputs:
      head_sha: ${{ steps.pr-info.outputs.head_sha }}
      head_ref: ${{ steps.pr-info.outputs.head_ref }}
      pr_title: ${{ steps.pr-info.outputs.pr_title }}
      pr_author: ${{ steps.pr-info.outputs.pr_author }}
      tag_prefix: ${{ steps.pr-info.outputs.tag_prefix }}

    steps:
      - name: Fetch PR information
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching metadata for PR #${{ github.event.inputs.pr_number }}..."

          PR_DATA=$(gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} --json headRefOid,headRefName,title,author,state)

          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "::error::PR #${{ github.event.inputs.pr_number }} is $PR_STATE. Can only deploy open PRs."
            exit 1
          fi

          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')

          echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
          echo "head_ref=${HEAD_REF}" >> $GITHUB_OUTPUT
          echo "pr_title=${PR_TITLE}" >> $GITHUB_OUTPUT
          echo "pr_author=${PR_AUTHOR}" >> $GITHUB_OUTPUT
          echo "tag_prefix=pr-${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT

          echo "::notice::PR #${{ github.event.inputs.pr_number }}: ${PR_TITLE}"
          echo "::notice::Branch: ${HEAD_REF} (${HEAD_SHA})"
          echo "::notice::Author: @${PR_AUTHOR}"

      - name: PR metadata summary
        run: |
          echo "### 📋 PR Metadata" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.inputs.pr_number }} - ${{ steps.pr-info.outputs.pr_title }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** @${{ steps.pr-info.outputs.pr_author }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.pr-info.outputs.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.pr-info.outputs.head_sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Build and Push Images to GHCR (Parallelized via Matrix)
  # =============================================================================
  build-images:
    name: Build ${{ matrix.component }} Image
    needs: [pr-metadata]
    # Run if pr-metadata succeeded (PR deploy) or was skipped (staging branch deploy)
    if: ${{ always() && (needs.pr-metadata.result == 'success' || needs.pr-metadata.result == 'skipped') }}
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      # Pass through the build target info to downstream jobs
      tag_prefix: ${{ steps.build-target.outputs.tag_prefix }}
      sha: ${{ steps.build-target.outputs.sha }}
      ref: ${{ steps.build-target.outputs.ref }}
    env:
      UNIQUE_WORKSPACE: workspace-build-images-${{ matrix.component }}-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          # Remove any root-owned files created by Docker volumes
          # This prevents "permission denied" errors during checkout cleanup
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Determine build target
        id: build-target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "ref=${{ needs.pr-metadata.outputs.head_ref }}" >> $GITHUB_OUTPUT
            echo "sha=${{ needs.pr-metadata.outputs.head_sha }}" >> $GITHUB_OUTPUT
            echo "tag_prefix=${{ needs.pr-metadata.outputs.tag_prefix }}" >> $GITHUB_OUTPUT
            echo "::notice::Building PR #${{ github.event.inputs.pr_number }} branch: ${{ needs.pr-metadata.outputs.head_ref }}"
          else
            echo "ref=staging" >> $GITHUB_OUTPUT
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "tag_prefix=staging" >> $GITHUB_OUTPUT
            echo "::notice::Building staging branch"
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          ref: ${{ steps.build-target.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker to avoid keychain conflicts
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for config.json lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            if command -v jq &> /dev/null; then
              TEMP_FILE=~/.docker/config.json.tmp.${{ matrix.component }}
              if jq 'del(.credsStore)' ~/.docker/config.json > "$TEMP_FILE" 2>/dev/null; then
                mv "$TEMP_FILE" ~/.docker/config.json
              else
                rm -f "$TEMP_FILE"
              fi
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GitHub Container Registry
        run: |
          LOCKDIR=~/.docker/login.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for docker login lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin; then
              echo "✅ Login successful"
              exit 0
            else
              if [ $i -lt $MAX_ATTEMPTS ]; then
                sleep 10
              else
                exit 1
              fi
            fi
          done

      - name: Set image name for ${{ matrix.component }}
        id: image-name
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            IMAGE_NAME="${{ env.BACKEND_IMAGE_NAME }}"
          else
            IMAGE_NAME="${{ env.FRONTEND_IMAGE_NAME }}"
          fi
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Building: ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}"

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.UNIQUE_WORKSPACE }}
          file: ${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ steps.build-target.outputs.tag_prefix }}-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:buildcache,mode=max
          build-args: |
            VERSION=${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: false

      - name: Image build summary
        run: |
          echo "### 🐳 ${{ matrix.component }} Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Security Scan - Docker Images (Parallelized)
  # =============================================================================
  image-security-scan:
    name: Security Scan (${{ matrix.component }} Image)
    needs: [pr-metadata, build-images]
    # Skip if security scan disabled (manual trigger only) or build failed
    if: ${{ github.event.inputs.skip_security_scan != 'true' && needs.build-images.result == 'success' }}
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      UNIQUE_WORKSPACE: workspace-security-scan-${{ matrix.component }}-${{ github.run_id }}
      # Isolated Trivy installation per component (fixes race condition)
      TRIVY_TEMP_DIR: /tmp/trivy-${{ matrix.component }}-${{ github.run_id }}
      TRIVY_CACHE_DIR: /tmp/trivy-cache-${{ matrix.component }}-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Configure Docker
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            [ $ELAPSED -ge $TIMEOUT ] && exit 1
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ] && command -v jq &> /dev/null; then
            TEMP_FILE=~/.docker/config.json.tmp.${{ matrix.component }}
            if jq 'del(.credsStore)' ~/.docker/config.json > "$TEMP_FILE" 2>/dev/null; then
              mv "$TEMP_FILE" ~/.docker/config.json
            else
              rm -f "$TEMP_FILE"
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Calculate image reference
        id: image-ref
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            IMAGE_NAME="${{ env.BACKEND_IMAGE_NAME }}"
          else
            IMAGE_NAME="${{ env.FRONTEND_IMAGE_NAME }}"
          fi

          # Use outputs from build-images job
          TAG_PREFIX="${{ needs.build-images.outputs.tag_prefix }}"
          SHA="${{ needs.build-images.outputs.sha }}"

          IMAGE_REF="${{ env.REGISTRY }}/${IMAGE_NAME}:${TAG_PREFIX}-${SHA}"
          echo "image-ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "Scanning image: ${IMAGE_REF}"

      - name: Run Trivy vulnerability scanner (with retry)
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-ref.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-staging.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Wait before retry (exponential backoff)
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "::warning::First scan attempt failed, waiting 10s before retry..."
          sleep 10

      - name: Retry Trivy scan (attempt 2)
        if: steps.trivy-scan.outcome == 'failure'
        id: trivy-scan-retry1
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-ref.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-staging.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Wait before final retry (exponential backoff)
        if: steps.trivy-scan-retry1.outcome == 'failure'
        run: |
          echo "::warning::Second scan attempt failed, waiting 20s before final retry..."
          sleep 20

      - name: Retry Trivy scan (attempt 3)
        if: steps.trivy-scan-retry1.outcome == 'failure'
        id: trivy-scan-retry2
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-ref.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-staging.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Scan error diagnostics
        if: failure()
        run: |
          echo "::group::Scan Diagnostics"
          echo "::error::All image scan attempts failed for ${{ matrix.component }}"
          echo "Image: ${{ steps.image-ref.outputs.image-ref }}"
          echo ""
          echo "Troubleshooting steps:"
          echo "1. Verify image exists in registry: docker pull ${{ steps.image-ref.outputs.image-ref }}"
          echo "2. Check Trivy cache: rm -rf ${{ env.TRIVY_CACHE_DIR }}"
          echo "3. Verify network connectivity to vulnerability databases"
          echo "4. Check Mac Mini disk space: df -h"
          echo ""
          echo "System diagnostics:"
          echo "Disk space: $(df -h / | tail -1)"
          echo "Temp dir: $(ls -la ${{ env.TRIVY_TEMP_DIR }} 2>&1 || echo 'not created')"
          echo "Cache dir: $(ls -la ${{ env.TRIVY_CACHE_DIR }} 2>&1 || echo 'not created')"
          echo "::endgroup::"

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.component }}-staging.sarif'
          category: 'trivy-staging-${{ matrix.component }}'

      - name: Cleanup Trivy temporary files
        if: always()
        run: |
          echo "::group::Cleanup Trivy Files"
          echo "Removing temporary Trivy directories for ${{ matrix.component }}..."
          rm -rf "${{ env.TRIVY_TEMP_DIR }}" 2>/dev/null || true
          rm -rf "${{ env.TRIVY_CACHE_DIR }}" 2>/dev/null || true
          echo "::notice::✅ Cleanup complete"
          echo "::endgroup::"

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deploy to Mac Mini Staging
  # =============================================================================
  deploy-to-mac-mini:
    name: Deploy to Mac Mini
    needs: [pr-metadata, build-images, image-security-scan]
    # Run if build succeeded and either security scan passed OR was skipped
    if: ${{ always() && needs.build-images.result == 'success' && (needs.image-security-scan.result == 'success' || needs.image-security-scan.result == 'skipped') }}
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: staging
      url: https://localhost:3000
    env:
      UNIQUE_WORKSPACE: workspace-deploy-mac-mini-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          ref: ${{ needs.build-images.outputs.ref }}

      - name: Restore SSL certificates from secrets
        run: |
          mkdir -p ${{ env.UNIQUE_WORKSPACE }}/frontend
          echo "${{ secrets.STAGING_SSL_CERT }}" | base64 -d > ${{ env.UNIQUE_WORKSPACE }}/frontend/cert.pem
          echo "${{ secrets.STAGING_SSL_KEY }}" | base64 -d > ${{ env.UNIQUE_WORKSPACE }}/frontend/key.pem
          chmod 600 ${{ env.UNIQUE_WORKSPACE }}/frontend/*.pem
          echo "✓ SSL certificates restored for HTTPS staging access"

      - name: Create .env.staging from secrets
        run: |
          # Use outputs from build-images job for image tags
          TAG_PREFIX="${{ needs.build-images.outputs.tag_prefix }}"
          SHA="${{ needs.build-images.outputs.sha }}"

          cat > ${{ env.UNIQUE_WORKSPACE }}/.env.staging << EOF
          # Application Settings
          COMPOSE_PROJECT_NAME=boostedbudget-staging
          NODE_ENV=staging
          GO_ENV=staging
          ENVIRONMENT=staging
          VERSION=${TAG_PREFIX}-${SHA}
          PRIMARY_REGION=iad

          # CORS Configuration
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_STAGING || 'https://yingyues-mac-mini.tailce219d.ts.net:3443,https://localhost:3443' }}

          # Docker Image Configuration (pull from GHCR)
          PULL_FROM_GHCR=true
          BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${TAG_PREFIX}-${SHA}
          FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${TAG_PREFIX}-${SHA}

          # URLs
          BACKEND_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:3000

          # Database (Staging)
          POSTGRES_USER=staginguser
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_STAGING || 'stagingpass' }}
          DATABASE_URL=postgresql://staginguser:${{ secrets.POSTGRES_PASSWORD_STAGING || 'stagingpass' }}@localhost:5433/boostedbudget_staging?sslmode=disable

          # Redis (Staging)
          REDIS_URL=redis://localhost:6380/0

          # RabbitMQ (Staging)
          RABBITMQ_URL=amqp://guest:guest@localhost:5673/

          # Auth0 (Dev Tenant)
          AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN_STAGING || 'dev-changeme.us.auth0.com' }}
          AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE_STAGING || 'https://api-staging.boostedbudget.com' }}
          AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID_STAGING || 'changeme' }}
          AUTH0_CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET_STAGING || 'changeme' }}
          VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN_STAGING || 'dev-changeme.us.auth0.com' }}
          VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID_STAGING || 'changeme' }}
          VITE_AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE_STAGING || 'https://api-staging.boostedbudget.com' }}

          # Plaid (Sandbox)
          PLAID_ENV=sandbox
          PLAID_CLIENT_ID=${{ secrets.PLAID_CLIENT_ID_STAGING || 'changeme' }}
          PLAID_SECRET=${{ secrets.PLAID_SECRET_STAGING || 'changeme' }}
          PLAID_PRODUCTS=auth,transactions,balance
          PLAID_COUNTRY_CODES=US,CA,GB
          PLAID_REDIRECT_URI=${{ secrets.PLAID_REDIRECT_URI_STAGING || 'https://localhost:3443/oauth-callback' }}
          PLAID_WEBHOOK_URL=${{ secrets.PLAID_WEBHOOK_URL_STAGING || 'http://localhost:8080/webhooks/plaid' }}

          # Stripe (Test Mode)
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_TEST || 'sk_test_changeme' }}

          # Security
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY_STAGING || '12345678901234567890123456789012' }}

          # Logging
          LOG_LEVEL=debug
          LOG_FORMAT=json

          # Feature Flags
          FEATURE_RULES_ENGINE=true
          FEATURE_AI_INSIGHTS=false
          FEATURE_MULTI_REGION=false
          EOF

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Deploy to staging (pull from GHCR)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          chmod +x ./scripts/deploy-staging.sh
          # Environment variables are set in .env.staging
          # Script will read PULL_FROM_GHCR, BACKEND_IMAGE, FRONTEND_IMAGE from there
          ./scripts/deploy-staging.sh

      - name: Show container status
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        if: always()
        run: |
          docker-compose -f docker-compose.staging.yml --env-file .env.staging ps

      - name: Show logs on failure
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        if: failure()
        run: |
          echo "::group::Backend Logs"
          docker-compose -f docker-compose.staging.yml --env-file .env.staging logs --tail=50 backend
          echo "::endgroup::"

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Smoke Tests
  # =============================================================================
  smoke-tests:
    name: Staging Smoke Tests
    needs: [pr-metadata, build-images, deploy-to-mac-mini]
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-smoke-tests-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          echo "Running smoke tests against staging..."

          # Backend health check
          if curl -f http://localhost:8080/health; then
            echo "✅ Backend health check passed"
          else
            echo "::error::Backend health check failed"
            exit 1
          fi

          # Frontend accessibility
          if curl -f http://localhost:3000; then
            echo "✅ Frontend is accessible"
          else
            echo "::error::Frontend is not accessible"
            exit 1
          fi

          # Database connectivity (via backend)
          echo "Database connectivity verified via backend health check"

          echo "::notice::✅ All smoke tests passed"

      - name: Smoke tests summary
        if: success()
        run: |
          echo "### ✅ Staging Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend health check" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend accessibility" >> $GITHUB_STEP_SUMMARY
          echo "- Database connectivity" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deployment Summary
  # =============================================================================
  deployment-summary:
    name: Deployment Summary
    needs: [pr-metadata, build-images, deploy-to-mac-mini, smoke-tests]
    runs-on: [self-hosted, macOS, mac-mini]
    if: success()

    steps:
      - name: Create deployment summary
        run: |
          TAG_PREFIX="${{ needs.build-images.outputs.tag_prefix }}"
          SHA="${{ needs.build-images.outputs.sha }}"

          # Different summary for PR deployments vs staging deployments
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "### 🚀 PR #${{ github.event.inputs.pr_number }} Deployed to Staging" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #${{ github.event.inputs.pr_number }} - ${{ needs.pr-metadata.outputs.pr_title }}" >> $GITHUB_STEP_SUMMARY
            echo "**Author:** @${{ needs.pr-metadata.outputs.pr_author }}" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** \`${{ needs.pr-metadata.outputs.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging (Mac Mini)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${TAG_PREFIX}-${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${TAG_PREFIX}-${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${TAG_PREFIX}-${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access (Local Network):**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://localhost:3000" >> $GITHUB_STEP_SUMMARY
          echo "- Backend API: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "- RabbitMQ UI: http://localhost:15673" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access (Tailscale VPN):**" >> $GITHUB_STEP_SUMMARY
          echo "- Update with your Tailscale hostname after setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-Restart:** ✅ All containers configured with \`restart: unless-stopped\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tests:** ✅ Security scans passed, smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Notify PR (only for PR deployments)
  # =============================================================================
  notify-pr:
    name: Comment on PR
    needs: [pr-metadata, build-images, smoke-tests]
    # Only run for PR deployments and when smoke tests pass
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' && needs.smoke-tests.result == 'success' }}
    runs-on: [self-hosted, macOS, mac-mini]

    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_PREFIX="${{ needs.build-images.outputs.tag_prefix }}"
          SHA="${{ needs.build-images.outputs.sha }}"

          gh pr comment ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} --body "## 🚀 Staging Deployment Successful

          This PR has been deployed to the staging environment for testing.

          | Field | Value |
          |-------|-------|
          | **Version** | \`${TAG_PREFIX}-${SHA}\` |
          | **Branch** | \`${{ needs.pr-metadata.outputs.head_ref }}\` |
          | **Commit** | \`${SHA}\` |
          | **Triggered by** | @${{ github.actor }} |

          ### Access URLs
          - **Frontend:** https://localhost:3000 (or via Tailscale)
          - **Backend API:** http://localhost:8080

          ### Workflow Run
          [View deployment logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          *This is an automated comment from the staging deployment workflow.*"

          echo "::notice::✅ Comment added to PR #${{ github.event.inputs.pr_number }}"
