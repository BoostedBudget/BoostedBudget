name: Deploy to Production

# Trigger on pushes to main branch (after PR merge or staging→main merge)
# Also allow manual triggering for emergency deployments or retries
# Note: Rotating VITE_* secrets requires force_rebuild=true (VITE_* vars are baked at build time)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests are failing (use with extreme caution)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_rebuild:
        description: 'Force rebuild of both components (use after rotating baked secrets or debugging)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      allow_rollback:
        description: 'Allow deploying a commit that is not a descendant of the last released commit'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Only allow one production deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.3'
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: boostedbudget/boostedbudget-backend

jobs:
  # =============================================================================
  # Detect Component Changes
  # Resolves deploy_sha once and diffs against per-component release tags.
  # All downstream jobs pin to deploy_sha — never github.sha.
  # =============================================================================
  detect-changes:
    name: Detect Component Changes
    runs-on: [self-hosted, macOS, mac-mini]
    permissions:
      contents: read
    outputs:
      deploy_sha:         ${{ steps.resolve-sha.outputs.deploy_sha }}
      backend_changed:    ${{ steps.compute.outputs.backend_changed }}
      frontend_changed:   ${{ steps.compute.outputs.frontend_changed }}
      backend_prior_sha:  ${{ steps.resolve-tags.outputs.backend_prior_sha }}
      frontend_prior_sha: ${{ steps.resolve-tags.outputs.frontend_prior_sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - id: resolve-sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          # push: github.sha is the pushed commit — that's exactly what triggered the deploy.
          # workflow_dispatch: pin to origin/main tip so the operator deploys current main.
          if [ "$EVENT_NAME" = "push" ]; then
            DEPLOY_SHA="$GITHUB_SHA_VALUE"
          else
            DEPLOY_SHA="$(git rev-parse origin/main)"
          fi
          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pinned deploy_sha=${DEPLOY_SHA}"

      - id: resolve-tags
        run: |
          set -euo pipefail
          # Belt-and-suspenders fetch in case fetch-tags: true missed them
          git fetch --force origin \
            'refs/tags/backend-prod-latest:refs/tags/backend-prod-latest' \
            'refs/tags/frontend-prod-latest:refs/tags/frontend-prod-latest' 2>/dev/null || true

          resolve() {
            local tag="$1"
            if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
              git rev-parse "refs/tags/${tag}^{commit}"
            else
              echo ""
            fi
          }
          BACKEND_PRIOR="$(resolve backend-prod-latest)"
          FRONTEND_PRIOR="$(resolve frontend-prod-latest)"
          echo "backend_prior_sha=${BACKEND_PRIOR}"   >> "$GITHUB_OUTPUT"
          echo "frontend_prior_sha=${FRONTEND_PRIOR}" >> "$GITHUB_OUTPUT"
          echo "bootstrap_backend=$([ -z "$BACKEND_PRIOR" ] && echo true || echo false)"   >> "$GITHUB_OUTPUT"
          echo "bootstrap_frontend=$([ -z "$FRONTEND_PRIOR" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: rollback-guard
        env:
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
          BACKEND_PRIOR: ${{ steps.resolve-tags.outputs.backend_prior_sha }}
          FRONTEND_PRIOR: ${{ steps.resolve-tags.outputs.frontend_prior_sha }}
        run: |
          set -euo pipefail
          # On push events, allow_rollback is not available as an input — default to false.
          ALLOW="${ALLOW_ROLLBACK:-false}"
          check() {
            local prior="$1" tag="$2"
            if [ -n "$prior" ] && ! git merge-base --is-ancestor "$prior" "$DEPLOY_SHA"; then
              if [ "$ALLOW" = "true" ]; then
                echo "::warning::deploy_sha ($DEPLOY_SHA) is not a descendant of $tag ($prior). allow_rollback=true; proceeding."
              else
                echo "::error::deploy_sha ($DEPLOY_SHA) is not a descendant of $tag ($prior)."
                echo "::error::Re-run with allow_rollback=true to override."
                exit 1
              fi
            fi
          }
          check "$BACKEND_PRIOR"  backend-prod-latest
          check "$FRONTEND_PRIOR" frontend-prod-latest

      - id: filter-backend
        if: steps.resolve-tags.outputs.bootstrap_backend == 'false'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.resolve-tags.outputs.backend_prior_sha }}
          ref:  ${{ steps.resolve-sha.outputs.deploy_sha }}
          filters: |
            backend:  ['backend/**', 'go.mod', 'go.sum', 'config/**', '.dockerignore']
            api:      ['api/**', 'api/openapi.yaml']
            workflow: ['.github/workflows/**']

      - id: filter-frontend
        if: steps.resolve-tags.outputs.bootstrap_frontend == 'false'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.resolve-tags.outputs.frontend_prior_sha }}
          ref:  ${{ steps.resolve-sha.outputs.deploy_sha }}
          filters: |
            frontend: ['apps/web/**', 'packages/**', 'package.json', 'bun.lock']
            api:      ['api/**', 'api/openapi.yaml']
            workflow: ['.github/workflows/**']

      - id: compute
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          BOOT_BE: ${{ steps.resolve-tags.outputs.bootstrap_backend }}
          BOOT_FE: ${{ steps.resolve-tags.outputs.bootstrap_frontend }}
          BE_BACKEND: ${{ steps.filter-backend.outputs.backend }}
          BE_API: ${{ steps.filter-backend.outputs.api }}
          BE_WORKFLOW: ${{ steps.filter-backend.outputs.workflow }}
          FE_FRONTEND: ${{ steps.filter-frontend.outputs.frontend }}
          FE_API: ${{ steps.filter-frontend.outputs.api }}
          FE_WORKFLOW: ${{ steps.filter-frontend.outputs.workflow }}
        run: |
          set -euo pipefail
          # On push events, force_rebuild is not available as an input — default to false.
          FORCE="${FORCE_REBUILD:-false}"

          backend_changed=false
          if [ "$FORCE" = "true" ] || [ "$BOOT_BE" = "true" ] || \
             [ "$BE_BACKEND" = "true" ] || [ "$BE_API" = "true" ] || [ "$BE_WORKFLOW" = "true" ]; then
            backend_changed=true
          fi

          frontend_changed=false
          if [ "$FORCE" = "true" ] || [ "$BOOT_FE" = "true" ] || \
             [ "$FE_FRONTEND" = "true" ] || [ "$FE_API" = "true" ] || [ "$FE_WORKFLOW" = "true" ]; then
            frontend_changed=true
          fi

          echo "backend_changed=${backend_changed}"   >> "$GITHUB_OUTPUT"
          echo "frontend_changed=${frontend_changed}" >> "$GITHUB_OUTPUT"
          echo "Backend changed: ${backend_changed}, Frontend changed: ${frontend_changed}"

  # =============================================================================
  # Build and Push Backend Image to GHCR
  # =============================================================================
  build-images:
    name: Build backend Image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend]
    permissions:
      contents: read
      packages: write
    env:
      UNIQUE_WORKSPACE: workspace-build-images-${{ matrix.component }}-${{ github.run_id }}
      DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure Docker to avoid keychain conflicts
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for config.json lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            if command -v jq &> /dev/null; then
              TEMP_FILE=~/.docker/config.json.tmp.${{ matrix.component }}
              if jq 'del(.credsStore)' ~/.docker/config.json > "$TEMP_FILE" 2>/dev/null; then
                mv "$TEMP_FILE" ~/.docker/config.json
              else
                rm -f "$TEMP_FILE"
              fi
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GitHub Container Registry (with retry)
        run: |
          LOCKDIR=~/.docker/login.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for docker login lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin; then
              exit 0
            else
              if [ $i -lt $MAX_ATTEMPTS ]; then
                sleep 10
              else
                exit 1
              fi
            fi
          done

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.UNIQUE_WORKSPACE }}
          file: ${{ env.UNIQUE_WORKSPACE }}/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache-go${{ env.GO_VERSION }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache-go${{ env.GO_VERSION }},mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.DEPLOY_SHA }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: false

      - name: Image build summary
        run: |
          echo "### backend Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Push Backend Image to Fly.io Registry
  # =============================================================================
  push-to-fly-registry:
    name: Push backend to Fly.io
    needs: [detect-changes, build-images]
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' && needs.build-images.result == 'success' }}
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
    env:
      DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}

    steps:
      - name: Cleanup Docker storage
        run: |
          LOCKDIR=~/.docker/prune.lock
          TIMEOUT=60
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            [ $ELAPSED -ge $TIMEOUT ] && exit 1
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          docker system prune -f --filter "until=24h"

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Configure Docker
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            [ $ELAPSED -ge $TIMEOUT ] && exit 1
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          [ -f ~/.docker/config.json ] || echo "{}" > ~/.docker/config.json

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Authenticate with Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker

      - name: Pull and push to Fly.io registry
        run: |
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DEPLOY_SHA}"

          for i in 1 2 3; do
            docker pull --platform linux/amd64 ${GHCR_IMAGE} && break
            [ $i -lt 3 ] && sleep 15
          done

          docker tag ${GHCR_IMAGE} "registry.fly.io/boostedbudget-api:${DEPLOY_SHA}"
          docker tag ${GHCR_IMAGE} registry.fly.io/boostedbudget-api:latest

          for i in 1 2 3; do
            docker push "registry.fly.io/boostedbudget-api:${DEPLOY_SHA}" && break
            [ $i -lt 3 ] && sleep 15
          done

          for i in 1 2 3; do
            docker push registry.fly.io/boostedbudget-api:latest && break
            [ $i -lt 3 ] && sleep 15
          done

      - name: Cleanup images
        if: always()
        run: |
          docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"

  # =============================================================================
  # Deploy Backend to Fly.io Production
  # Always runs (even when backend unchanged) so machines roll and health-check.
  # Uses prior image when backend hasn't changed.
  # =============================================================================
  deploy-to-fly:
    name: Deploy backend to Fly.io
    needs: [detect-changes, build-images, push-to-fly-registry]
    if: always() && !cancelled() && needs.detect-changes.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') && (needs.push-to-fly-registry.result == 'success' || needs.push-to-fly-registry.result == 'skipped')
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
      url: https://api.boostedbudget.com
    env:
      UNIQUE_WORKSPACE: workspace-deploy-fly-backend-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Select image and preflight check
        id: image-select
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          PRIOR_SHA: ${{ needs.detect-changes.outputs.backend_prior_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
        run: |
          set -euo pipefail
          if [ "$BACKEND_CHANGED" = "true" ]; then
            IMAGE_TAG="${DEPLOY_SHA}"
          else
            IMAGE_TAG="${PRIOR_SHA}"
          fi

          flyctl auth docker
          if ! docker manifest inspect "registry.fly.io/boostedbudget-api:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error::Image registry.fly.io/boostedbudget-api:${IMAGE_TAG} not found in Fly registry."
            echo "::error::Re-run this workflow with force_rebuild=true to rebuild from source."
            exit 1
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image selected: registry.fly.io/boostedbudget-api:${IMAGE_TAG}"

      - name: Deploy to Fly.io
        id: deploy
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_TAG: ${{ steps.image-select.outputs.image_tag }}
        run: |
          # Migrations run automatically on app startup (no release_command configured)
          for attempt in 1 2 3; do
            flyctl deploy \
              --app boostedbudget-api \
              --image "registry.fly.io/boostedbudget-api:${IMAGE_TAG}" \
              --config backend/fly.toml && {
              echo "deploy-attempts=$attempt" >> $GITHUB_OUTPUT
              break
            } || {
              if [ $attempt -eq 3 ]; then
                exit 1
              else
                sleep 30
              fi
            }
          done

      - name: Verify deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app boostedbudget-api
          flyctl logs -a boostedbudget-api -n 2>&1 | head -20 || true

      - name: Record deployed image digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_TAG: ${{ steps.image-select.outputs.image_tag }}
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
        run: |
          DIGEST=$(flyctl status --app boostedbudget-api --json 2>/dev/null | \
            jq -r '.ImageDetails.Digest // "unknown"' 2>/dev/null || echo "unknown")
          echo "### Backend Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`registry.fly.io/boostedbudget-api:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy SHA:** \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend rebuilt:** ${BACKEND_CHANGED}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://api.boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend_changed == 'true' }}
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
      url: https://boostedbudget.com
    env:
      UNIQUE_WORKSPACE: workspace-deploy-frontend-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        # Install at root level - Bun handles workspace:* protocol
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        env:
          VITE_API_URL: https://api.boostedbudget.com
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_ENVIRONMENT: production
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.UNIQUE_WORKSPACE }}
          packageManager: bun
          command: pages deploy apps/web/dist --project-name=boostedbudget --branch=main

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          echo "### Frontend Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy SHA:** \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Production Smoke Tests
  # =============================================================================
  smoke-tests:
    name: Production Smoke Tests
    needs: [detect-changes, deploy-to-fly, deploy-frontend]
    if: always() && !cancelled() && needs.deploy-to-fly.result == 'success' && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-smoke-tests-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Run smoke tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        timeout-minutes: 5
        run: |
          if [ -f ./scripts/smoke-test.sh ]; then
            chmod +x ./scripts/smoke-test.sh
            ./scripts/smoke-test.sh production
          else
            echo "Running basic smoke tests..."
            curl -f https://api.boostedbudget.com/health || exit 1
            curl -f https://boostedbudget.com || exit 1
          fi

      - name: Smoke tests summary
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          echo "### Production Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend health check" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend accessibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "**Deployment Trigger:** Manual workflow_dispatch" >> $GITHUB_STEP_SUMMARY
            echo "**Force Deploy:** ${FORCE_DEPLOY:-false}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Deployment Trigger:** Automatic (push to main)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Update Release Tags
  # Advances per-component moving tags only after a fully successful deploy + smoke tests.
  # Tags are NOT updated when a component was skipped (no-change run).
  # =============================================================================
  update-release-tags:
    name: Update Release Tags
    needs: [detect-changes, build-images, deploy-to-fly, deploy-frontend, smoke-tests]
    if: always() && !cancelled() && needs.smoke-tests.result == 'success' && needs.deploy-to-fly.result == 'success'
    runs-on: [self-hosted, macOS, mac-mini]
    permissions:
      contents: write
    env:
      UNIQUE_WORKSPACE: workspace-release-tags-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          fetch-depth: 0
          fetch-tags: true
          path: ${{ env.UNIQUE_WORKSPACE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update backend release tags
        if: needs.detect-changes.outputs.backend_changed == 'true' && needs.build-images.result == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/backend-prod-${SHA}" >/dev/null 2>&1; then
            git tag "backend-prod-${SHA}" "${SHA}"
            git push origin "refs/tags/backend-prod-${SHA}"
          fi
          git tag -f backend-prod-latest "${SHA}"
          git push origin refs/tags/backend-prod-latest --force

      - name: Update frontend release tags
        if: needs.detect-changes.outputs.frontend_changed == 'true' && needs.deploy-frontend.result == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/frontend-prod-${SHA}" >/dev/null 2>&1; then
            git tag "frontend-prod-${SHA}" "${SHA}"
            git push origin "refs/tags/frontend-prod-${SHA}"
          fi
          git tag -f frontend-prod-latest "${SHA}"
          git push origin refs/tags/frontend-prod-latest --force

      - name: Tag update summary
        env:
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
        run: |
          echo "### Release Tags Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BACKEND_CHANGED" = "true" ]; then
            echo "- \`backend-prod-latest\` → \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`backend-prod-${DEPLOY_SHA}\` (immutable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- backend tags unchanged (no backend change)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            echo "- \`frontend-prod-latest\` → \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`frontend-prod-${DEPLOY_SHA}\` (immutable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- frontend tags unchanged (no frontend change)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true
