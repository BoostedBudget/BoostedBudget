name: Deploy to Production

# Manual deployment: dispatch from 'main' only after promoting staging→main.
# Note: Rotating VITE_* secrets requires force_rebuild=true (baked at build time).
on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests are failing (use with extreme caution)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_rebuild:
        description: 'Force rebuild of both components (use after rotating baked secrets or debugging)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      allow_rollback:
        description: 'Allow deploying a commit that is not a descendant of the last released commit'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Only allow one production deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.11'
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: boostedbudget/boostedbudget-backend

jobs:
  # =============================================================================
  # Detect Component Changes
  # Resolves deploy_sha once and diffs against per-component release tags.
  # All downstream jobs pin to deploy_sha — never github.sha.
  # =============================================================================
  detect-changes:
    name: Detect Component Changes
    if: github.repository == 'BoostedBudget/BoostedBudget'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_sha:           ${{ steps.resolve-sha.outputs.deploy_sha }}
      backend_changed:      ${{ steps.compute.outputs.backend_changed }}
      fly_config_changed:   ${{ steps.compute.outputs.fly_config_changed }}
      frontend_changed:     ${{ steps.compute.outputs.frontend_changed }}
      mcp_changed:          ${{ steps.compute.outputs.mcp_changed }}
      backend_prior_sha:    ${{ steps.resolve-tags.outputs.backend_prior_sha }}
      frontend_prior_sha:   ${{ steps.resolve-tags.outputs.frontend_prior_sha }}
      mcp_prior_sha:        ${{ steps.resolve-tags.outputs.mcp_prior_sha }}

    steps:
      - name: Authorize actor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`Unauthorized actor '${context.actor}' (permission: ${data.permission})`);
            }
      # Guard: production workflow must be dispatched from 'main'.
      # Prevents accidentally running a stale/diverged workflow file from staging.
      # (The workflow always deploys main's *code* regardless, but the *workflow definition*
      # itself comes from the dispatched branch — so we enforce dispatch-from-main here.)
      - name: Guard — production deploy must run from main
        if: github.ref_name != 'main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Production deploy must be dispatched from 'main'. In the 'Run workflow' dialog, set 'Use workflow from' → 'Branch: main'. Got '${REF_NAME}'."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - id: resolve-sha
        run: |
          set -euo pipefail
          # Always workflow_dispatch — pin to origin/main tip so the operator deploys current main.
          DEPLOY_SHA="$(git rev-parse origin/main)"
          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pinned deploy_sha=${DEPLOY_SHA}"

      - id: resolve-tags
        run: |
          set -euo pipefail
          # Belt-and-suspenders fetch in case fetch-tags: true missed them
          git fetch --force origin \
            'refs/tags/backend-prod-latest:refs/tags/backend-prod-latest' \
            'refs/tags/frontend-prod-latest:refs/tags/frontend-prod-latest' \
            'refs/tags/mcp-prod-latest:refs/tags/mcp-prod-latest' 2>/dev/null || true

          resolve() {
            local tag="$1"
            if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
              git rev-parse "refs/tags/${tag}^{commit}"
            else
              echo ""
            fi
          }
          BACKEND_PRIOR="$(resolve backend-prod-latest)"
          FRONTEND_PRIOR="$(resolve frontend-prod-latest)"
          MCP_PRIOR="$(resolve mcp-prod-latest)"
          echo "backend_prior_sha=${BACKEND_PRIOR}"   >> "$GITHUB_OUTPUT"
          echo "frontend_prior_sha=${FRONTEND_PRIOR}" >> "$GITHUB_OUTPUT"
          echo "mcp_prior_sha=${MCP_PRIOR}"           >> "$GITHUB_OUTPUT"
          echo "bootstrap_backend=$([ -z "$BACKEND_PRIOR" ] && echo true || echo false)"   >> "$GITHUB_OUTPUT"
          echo "bootstrap_frontend=$([ -z "$FRONTEND_PRIOR" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "bootstrap_mcp=$([ -z "$MCP_PRIOR" ] && echo true || echo false)"           >> "$GITHUB_OUTPUT"

      - id: rollback-guard
        env:
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
          BACKEND_PRIOR: ${{ steps.resolve-tags.outputs.backend_prior_sha }}
          FRONTEND_PRIOR: ${{ steps.resolve-tags.outputs.frontend_prior_sha }}
          MCP_PRIOR: ${{ steps.resolve-tags.outputs.mcp_prior_sha }}
        run: |
          set -euo pipefail
          # inputs.allow_rollback is always available (workflow_dispatch-only); :-false is a defensive fallback.
          ALLOW="${ALLOW_ROLLBACK:-false}"
          check() {
            local prior="$1" tag="$2"
            if [ -n "$prior" ] && ! git merge-base --is-ancestor "$prior" "$DEPLOY_SHA"; then
              if [ "$ALLOW" = "true" ]; then
                echo "::warning::deploy_sha ($DEPLOY_SHA) is not a descendant of $tag ($prior). allow_rollback=true; proceeding."
              else
                echo "::error::deploy_sha ($DEPLOY_SHA) is not a descendant of $tag ($prior)."
                echo "::error::Re-run with allow_rollback=true to override."
                exit 1
              fi
            fi
          }
          check "$BACKEND_PRIOR"  backend-prod-latest
          check "$FRONTEND_PRIOR" frontend-prod-latest
          check "$MCP_PRIOR"      mcp-prod-latest

      - id: filter-backend
        if: steps.resolve-tags.outputs.bootstrap_backend == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ steps.resolve-tags.outputs.backend_prior_sha }}
          ref:  ${{ steps.resolve-sha.outputs.deploy_sha }}
          filters: |
            backend:  ['backend/**', 'go.mod', 'go.sum', 'config/**', '.dockerignore']
            api:      ['api/**', 'api/openapi.yaml']
            workflow: ['.github/workflows/**']

      - id: filter-frontend
        if: steps.resolve-tags.outputs.bootstrap_frontend == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ steps.resolve-tags.outputs.frontend_prior_sha }}
          ref:  ${{ steps.resolve-sha.outputs.deploy_sha }}
          filters: |
            frontend: ['apps/web/**', 'packages/**', 'package.json', 'bun.lock']
            api:      ['api/**', 'api/openapi.yaml']
            workflow: ['.github/workflows/**']

      - id: filter-mcp
        # Skipped on first run (bootstrap_mcp=true): compute's BOOT_MCP OR-branch covers that case.
        # Note: .github/workflows/** is intentionally excluded — workflow-only MCP deploy changes
        # do not retrigger an MCP deploy; use force_rebuild=true for those.
        #
        # Issue #1484: 'packages/api-client/**', 'package.json' and 'bun.lock' are here because
        # apps/mcp-server/package.json depends on @boostedbudget/api-client ("workspace:*"), and
        # the workspace shares ONE root lockfile. Without them an api-client-only (or root
        # dependency) change redeployed the frontend and left the deployed MCP worker on a stale
        # api-client. The `frontend` filter above already carried all three, which is what makes
        # their absence here an omission rather than a decision. Keep the package path exact:
        # unrelated workspace packages do not affect the MCP worker and must not redeploy it.
        # Enforced by scripts/check-mcp-job-triggers.py --deploy.
        if: steps.resolve-tags.outputs.bootstrap_mcp == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ steps.resolve-tags.outputs.mcp_prior_sha }}
          ref:  ${{ steps.resolve-sha.outputs.deploy_sha }}
          filters: |
            mcp: ['apps/mcp-server/**', 'packages/api-client/**', 'package.json', 'bun.lock', 'api/openapi.yaml']

      - id: filter-fly-config
        if: steps.resolve-tags.outputs.bootstrap_backend == 'false'
        env:
          PRIOR: ${{ steps.resolve-tags.outputs.backend_prior_sha }}
          DEPLOY: ${{ steps.resolve-sha.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          # Did either fly config file change? (Neither affects the Docker image.)
          fly_count=$(git diff --name-only "${PRIOR}" "${DEPLOY}" \
            -- 'backend/fly.staging.toml' 'backend/fly.toml' \
            | wc -l | tr -d ' ')
          echo "fly_config=$([ "$fly_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Did any image-affecting file change, excluding both fly config files?
          # Covers: backend/ code, config/ (copied into image by Dockerfile), .dockerignore.
          # Uses grep -Fxv (fixed-string exact-line) to avoid regex issues with dots in filenames.
          # { grep ... || true; } prevents set -e from aborting when grep returns 1 (no matches).
          code_count=$(git diff --name-only "${PRIOR}" "${DEPLOY}" \
            -- 'backend/' 'config/' '.dockerignore' 'go.mod' 'go.sum' \
            | { grep -Fxv "backend/fly.staging.toml" || true; } \
            | { grep -Fxv "backend/fly.toml" || true; } \
            | wc -l | tr -d ' ')
          echo "backend_code=$([ "$code_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: compute
        env:
          FORCE_REBUILD:    ${{ inputs.force_rebuild }}
          BOOT_BE:          ${{ steps.resolve-tags.outputs.bootstrap_backend }}
          BOOT_FE:          ${{ steps.resolve-tags.outputs.bootstrap_frontend }}
          BOOT_MCP:         ${{ steps.resolve-tags.outputs.bootstrap_mcp }}
          BE_BACKEND_CODE:  ${{ steps.filter-fly-config.outputs.backend_code }}
          BE_FLY_CONFIG:    ${{ steps.filter-fly-config.outputs.fly_config }}
          MCP_CHANGED:      ${{ steps.filter-mcp.outputs.mcp }}
          BE_API:           ${{ steps.filter-backend.outputs.api }}
          BE_WORKFLOW:      ${{ steps.filter-backend.outputs.workflow }}
          FE_FRONTEND:      ${{ steps.filter-frontend.outputs.frontend }}
          FE_API:           ${{ steps.filter-frontend.outputs.api }}
          FE_WORKFLOW:      ${{ steps.filter-frontend.outputs.workflow }}
        run: |
          set -euo pipefail
          # inputs.force_rebuild is always available (workflow_dispatch-only); :-false is a defensive fallback.
          FORCE="${FORCE_REBUILD:-false}"

          # backend_changed: triggers Docker image rebuild + push.
          # Uses BE_BACKEND_CODE (excludes both fly configs) instead of dorny's BE_BACKEND.
          # During bootstrap (BOOT_BE=true), filter-fly-config is skipped, so
          # BE_BACKEND_CODE is empty — BOOT_BE=true handles that case.
          backend_changed=false
          if [ "$FORCE" = "true" ] || [ "$BOOT_BE" = "true" ] || \
             [ "${BE_BACKEND_CODE:-}" = "true" ] || [ "$BE_API" = "true" ] || [ "$BE_WORKFLOW" = "true" ]; then
            backend_changed=true
          fi

          # fly_config_changed: either fly config file changed; no image rebuild needed.
          # deploy-to-fly always runs and picks up new config from repo checkout at deploy_sha.
          fly_config_changed=false
          if [ "${BE_FLY_CONFIG:-}" = "true" ]; then
            fly_config_changed=true
          fi

          frontend_changed=false
          if [ "$FORCE" = "true" ] || [ "$BOOT_FE" = "true" ] || \
             [ "$FE_FRONTEND" = "true" ] || [ "$FE_API" = "true" ] || [ "$FE_WORKFLOW" = "true" ]; then
            frontend_changed=true
          fi

          # mcp_changed: triggers Cloudflare Workers MCP deploy.
          # BOOT_MCP=true on first run (no mcp-prod-latest tag yet); filter-mcp is skipped
          # in that case so MCP_CHANGED is '' — BOOT_MCP covers bootstrap.
          # Workflow-only changes are excluded from filter-mcp; use force_rebuild=true for those.
          mcp_changed=false
          if [ "$FORCE" = "true" ] || [ "$BOOT_MCP" = "true" ] || [ "${MCP_CHANGED:-}" = "true" ]; then
            mcp_changed=true
          fi

          echo "backend_changed=${backend_changed}"       >> "$GITHUB_OUTPUT"
          echo "fly_config_changed=${fly_config_changed}" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=${frontend_changed}"     >> "$GITHUB_OUTPUT"
          echo "mcp_changed=${mcp_changed}"               >> "$GITHUB_OUTPUT"
          echo "Backend changed: ${backend_changed}, Fly config changed: ${fly_config_changed}, Frontend changed: ${frontend_changed}, MCP changed: ${mcp_changed}"

  # =============================================================================
  # Build and Push Backend Image to GHCR
  # =============================================================================
  build-images:
    name: Build backend Image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend]
    permissions:
      contents: read
      packages: write
    env:
      UNIQUE_WORKSPACE: workspace-build-images-${{ matrix.component }}-${{ github.run_id }}
      DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Resolve BUILD_DATE
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Configure Docker to avoid keychain conflicts
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for config.json lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            if command -v jq &> /dev/null; then
              TEMP_FILE=~/.docker/config.json.tmp.${{ matrix.component }}
              if jq 'del(.credsStore)' ~/.docker/config.json > "$TEMP_FILE" 2>/dev/null; then
                mv "$TEMP_FILE" ~/.docker/config.json
              else
                rm -f "$TEMP_FILE"
              fi
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GitHub Container Registry (with retry)
        run: |
          LOCKDIR=~/.docker/login.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for docker login lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin; then
              exit 0
            else
              if [ $i -lt $MAX_ATTEMPTS ]; then
                sleep 10
              else
                exit 1
              fi
            fi
          done

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.UNIQUE_WORKSPACE }}
          file: ${{ env.UNIQUE_WORKSPACE }}/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache-go${{ env.GO_VERSION }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache-go${{ env.GO_VERSION }},mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.DEPLOY_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: false

      - name: Image build summary
        run: |
          echo "### backend Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Push Backend Image to Fly.io Registry
  # =============================================================================
  push-to-fly-registry:
    name: Push backend to Fly.io
    needs: [detect-changes, build-images]
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' && needs.build-images.result == 'success' }}
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
    env:
      DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}

    steps:
      - name: Cleanup Docker storage
        run: |
          LOCKDIR=~/.docker/prune.lock
          TIMEOUT=60
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            [ $ELAPSED -ge $TIMEOUT ] && exit 1
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          docker system prune -f --filter "until=24h"

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          # Pinned so this step installs a known-good flyctl build, not whatever
          # setup-flyctl treats as "latest" at run time. Confirmed release exists:
          # https://github.com/superfly/flyctl/releases/tag/v0.4.82
          version: 0.4.82

      - name: Configure Docker
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            [ $ELAPSED -ge $TIMEOUT ] && exit 1
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          [ -f ~/.docker/config.json ] || echo "{}" > ~/.docker/config.json

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Authenticate with Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker

      - name: Pull and push to Fly.io registry
        run: |
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${DEPLOY_SHA}"

          for i in 1 2 3; do
            docker pull --platform linux/amd64 ${GHCR_IMAGE} && break
            [ $i -lt 3 ] && sleep 15
          done

          docker tag ${GHCR_IMAGE} "registry.fly.io/boostedbudget-api:${DEPLOY_SHA}"
          docker tag ${GHCR_IMAGE} registry.fly.io/boostedbudget-api:latest

          for i in 1 2 3; do
            docker push "registry.fly.io/boostedbudget-api:${DEPLOY_SHA}" && break
            [ $i -lt 3 ] && sleep 15
          done

          for i in 1 2 3; do
            docker push registry.fly.io/boostedbudget-api:latest && break
            [ $i -lt 3 ] && sleep 15
          done

      - name: Cleanup images
        if: always()
        run: |
          docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"

  # =============================================================================
  # Deploy Backend to Fly.io Production
  # Always runs (even when backend unchanged) so machines roll and health-check.
  # Uses prior image when backend hasn't changed.
  # =============================================================================
  deploy-to-fly:
    name: Deploy backend to Fly.io
    needs: [detect-changes, build-images, push-to-fly-registry]
    if: always() && !cancelled() && needs.detect-changes.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') && (needs.push-to-fly-registry.result == 'success' || needs.push-to-fly-registry.result == 'skipped')
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
      url: https://api.boostedbudget.com
    env:
      UNIQUE_WORKSPACE: workspace-deploy-fly-backend-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          # Pinned so this step installs a known-good flyctl build, not whatever
          # setup-flyctl treats as "latest" at run time. Confirmed release exists:
          # https://github.com/superfly/flyctl/releases/tag/v0.4.82
          version: 0.4.82

      - name: Select image and preflight check
        id: image-select
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          PRIOR_SHA: ${{ needs.detect-changes.outputs.backend_prior_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
        run: |
          set -euo pipefail
          if [ "$BACKEND_CHANGED" = "true" ]; then
            IMAGE_TAG="${DEPLOY_SHA}"
          else
            IMAGE_TAG="${PRIOR_SHA}"
          fi

          flyctl auth docker
          if ! docker manifest inspect "registry.fly.io/boostedbudget-api:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error::Image registry.fly.io/boostedbudget-api:${IMAGE_TAG} not found in Fly registry."
            echo "::error::Re-run this workflow with force_rebuild=true to rebuild from source."
            exit 1
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image selected: registry.fly.io/boostedbudget-api:${IMAGE_TAG}"

      - name: Deploy to Fly.io
        id: deploy
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_TAG: ${{ steps.image-select.outputs.image_tag }}
        run: |
          # Migrations run automatically on app startup (no release_command configured)
          for attempt in 1 2 3; do
            flyctl deploy \
              --app boostedbudget-api \
              --image "registry.fly.io/boostedbudget-api:${IMAGE_TAG}" \
              --config backend/fly.toml && {
              echo "deploy-attempts=$attempt" >> $GITHUB_OUTPUT
              break
            } || {
              if [ $attempt -eq 3 ]; then
                exit 1
              else
                sleep 30
              fi
            }
          done

      - name: Verify deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app boostedbudget-api
          flyctl logs -a boostedbudget-api -n 2>&1 | head -20 || true

      - name: Record deployed image digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_TAG: ${{ steps.image-select.outputs.image_tag }}
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          FLY_CONFIG_CHANGED: ${{ needs.detect-changes.outputs.fly_config_changed }}
        run: |
          DIGEST=$(flyctl status --app boostedbudget-api --json 2>/dev/null | \
            jq -r '.ImageDetails.Digest // "unknown"' 2>/dev/null || echo "unknown")
          echo "### Backend Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`registry.fly.io/boostedbudget-api:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy SHA:** \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend rebuilt:** ${BACKEND_CHANGED}" >> $GITHUB_STEP_SUMMARY
          echo "**Fly config changed:** ${FLY_CONFIG_CHANGED}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://api.boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend_changed == 'true' }}
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
      url: https://boostedbudget.com
    env:
      UNIQUE_WORKSPACE: workspace-deploy-frontend-${{ github.run_id }}
      # #1514 (G6 fix-round-2): `secrets` is not a valid context in a step-level `if:`
      # (actionlint: context "secrets" is not allowed there). `secrets` IS available in
      # job-level `env:`, so compute a non-secret boolean gate here instead of mirroring
      # the token itself — the actual token is injected only into the one step that
      # needs it (Upload source maps to Sentry), not the whole job (install/build steps
      # never see it).
      HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        # Install at root level - Bun handles workspace:* protocol
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        env:
          VITE_API_URL: https://api.boostedbudget.com
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_ENVIRONMENT: production
          VITE_MCP_URL: https://mcp.boostedbudget.com
          VITE_REVENUECAT_PUBLIC_API_KEY: ${{ secrets.VITE_REVENUECAT_PUBLIC_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          test -n "$VITE_REVENUECAT_PUBLIC_API_KEY" || { echo "RevenueCat public SDK key is required for this environment" >&2; exit 1; }
          bun run build

      # Issue #1514 (G6): vite.config.ts uses sourcemap: 'hidden', so dist/**/*.map is
      # produced but not referenced by the built .js. Upload those maps to Sentry so
      # production symbolication works, then unconditionally delete them below — deletion
      # does not depend on this step running or succeeding (continue-on-error: true here,
      # plus `if: always()` on the delete step), so a missing/invalid SENTRY_AUTH_TOKEN or
      # a Sentry API failure can never cause maps to ship.
      - name: Install sentry-cli
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true'
        continue-on-error: true
        env:
          # Pin + verify, per the golang-migrate pattern in test.yml (#1514 F13).
          SENTRY_CLI_VERSION: '3.6.2'
          SENTRY_CLI_SHA256: 5a497deb1e388cc6445c09ddd6d2da4fc2aae8295405d6393c2e0ee635ca3687
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          # Assumes this job runs on the [self-hosted, macOS, mac-mini] Apple Silicon
          # runner (see runs-on: above). If that runner pool ever changes architecture
          # or OS, this asset name must change too, or the curl below will 404 —
          # a loud, understandable failure (caught by continue-on-error, not silent).
          curl -sSfL -o "$HOME/bin/sentry-cli" "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-arm64"
          echo "${SENTRY_CLI_SHA256}  $HOME/bin/sentry-cli" | shasum -a 256 -c -
          chmod +x "$HOME/bin/sentry-cli"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/sentry-cli" --version

      - name: Upload source maps to Sentry
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true'
        continue-on-error: true
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        env:
          # Token is injected only here, not at job scope, so it's never present in the
          # environment of the install/build steps (which don't need it).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          sentry-cli sourcemaps inject ./dist
          sentry-cli sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" ./dist

      # Unconditional: runs whether the upload step above was skipped (no token),
      # failed, or succeeded. This is the only step in this job responsible for
      # guaranteeing maps never ship, so it does not gate on anything upstream.
      - name: Delete source maps before deploy
        if: always()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        run: |
          set -euo pipefail
          find dist -type f -name '*.map' -delete
          remaining=$(find dist -type f -name '*.map' | wc -l | tr -d ' ')
          if [ "$remaining" -ne 0 ]; then
            echo "::error::${remaining} .map file(s) still present in dist/ after deletion."
            exit 1
          fi
          echo "Confirmed: no .map files remain in dist/."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.UNIQUE_WORKSPACE }}
          packageManager: bun
          command: pages deploy apps/web/dist --project-name=boostedbudget --branch=main

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          echo "### Frontend Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy SHA:** \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deploy MCP Worker to Cloudflare Workers (Production)
  # Issue #1087: MCP server — change-gated via mcp-prod-latest tag, bypassable with force_rebuild=true.
  # Diffs apps/mcp-server/** and api/openapi.yaml vs. last MCP deploy (mcp-prod-latest).
  # NOTE: CLOUDFLARE_API_TOKEN must have Workers Scripts:Edit permission
  # (same token as Pages deploy; add Workers Scripts:Edit if missing)
  # =============================================================================
  deploy-mcp-worker:
    name: Deploy MCP Worker (Production)
    # #1634: recipe call `detail` requires backend support before the new worker is released.
    # The backend deploy reuses its prior image when the build is skipped on MCP-only changes.
    needs: [detect-changes, deploy-to-fly]
    if: ${{ always() && !cancelled() && needs.detect-changes.result == 'success' && needs.deploy-to-fly.result == 'success' && needs.detect-changes.outputs.mcp_changed == 'true' }}
    runs-on: [self-hosted, macOS, mac-mini]
    environment:
      name: production
      url: https://mcp.boostedbudget.com
    env:
      UNIQUE_WORKSPACE: workspace-deploy-mcp-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout deploy SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install MCP server dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun install --frozen-lockfile

      - name: Run MCP server tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run test   # timeout lives in apps/mcp-server/package.json — single source of truth

      - name: Typecheck MCP server
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: NODE_OPTIONS=--max-old-space-size=2048 bun run typecheck

      - name: Lint MCP server
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run lint

      - name: Check manifest completeness
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run scripts/check-manifest-completeness.ts

      - name: Check no direct API calls
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run scripts/check-no-direct-api-calls.ts

      - name: Rebuild spec index and check for drift
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: |
          bun run src/spec/index-builder.ts
          git diff --exit-code src/spec/generated/spec-index.json || \
            (echo "::error::MCP spec index is outdated. Run 'bun run src/spec/index-builder.ts' and commit." && exit 1)

      - name: Rebuild facade and check for drift
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: |
          bun run scripts/generate-facade.ts
          git diff --exit-code src/client/generated/facade.ts || \
            (echo "::error::MCP facade is outdated. Run 'bun run scripts/generate-facade.ts' and commit." && exit 1)

      - name: Deploy MCP Worker to production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
          packageManager: bun
          command: deploy

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          echo "### MCP Worker Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy SHA:** \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://mcp.boostedbudget.com" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Production Smoke Tests
  # =============================================================================
  smoke-tests:
    name: Production Smoke Tests
    needs: [detect-changes, deploy-to-fly, deploy-frontend, deploy-mcp-worker]
    if: always() && !cancelled() && needs.deploy-to-fly.result == 'success' && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') && (needs.deploy-mcp-worker.result == 'success' || needs.deploy-mcp-worker.result == 'skipped')
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-smoke-tests-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          path: ${{ env.UNIQUE_WORKSPACE }}

      - name: Run smoke tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        timeout-minutes: 5
        run: |
          if [ -f ./scripts/smoke-test.sh ]; then
            chmod +x ./scripts/smoke-test.sh
            ./scripts/smoke-test.sh production
          else
            echo "Running basic smoke tests..."
            curl -f https://api.boostedbudget.com/health || exit 1
            curl -f https://boostedbudget.com || exit 1
          fi

      - name: Smoke tests summary
        if: success()
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          echo "### Production Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend health check" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend accessibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Trigger:** Manual workflow_dispatch" >> $GITHUB_STEP_SUMMARY
          echo "**Force Deploy:** ${FORCE_DEPLOY:-false}" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Update Release Tags
  # Advances per-component moving tags only after a fully successful deploy + smoke tests.
  # Tags are NOT updated when a component was skipped (no-change run).
  # =============================================================================
  update-release-tags:
    name: Update Release Tags
    needs: [detect-changes, build-images, deploy-to-fly, deploy-frontend, deploy-mcp-worker, smoke-tests]
    if: always() && !cancelled() && needs.smoke-tests.result == 'success' && needs.deploy-to-fly.result == 'success'
    runs-on: [self-hosted, macOS, mac-mini]
    permissions:
      contents: write
    env:
      UNIQUE_WORKSPACE: workspace-release-tags-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          fetch-depth: 0
          fetch-tags: true
          path: ${{ env.UNIQUE_WORKSPACE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update backend release tags
        if: needs.detect-changes.outputs.backend_changed == 'true' && needs.build-images.result == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/backend-prod-${SHA}" >/dev/null 2>&1; then
            git tag "backend-prod-${SHA}" "${SHA}"
            git push origin "refs/tags/backend-prod-${SHA}"
          fi
          git tag -f backend-prod-latest "${SHA}"
          git push origin refs/tags/backend-prod-latest --force

      - name: Update frontend release tags
        if: needs.detect-changes.outputs.frontend_changed == 'true' && needs.deploy-frontend.result == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/frontend-prod-${SHA}" >/dev/null 2>&1; then
            git tag "frontend-prod-${SHA}" "${SHA}"
            git push origin "refs/tags/frontend-prod-${SHA}"
          fi
          git tag -f frontend-prod-latest "${SHA}"
          git push origin refs/tags/frontend-prod-latest --force

      - name: Update MCP release tags
        # mcp_changed && deploy-mcp-worker success → advance mcp-prod-latest.
        # If MCP deployed but smoke/backend gating later fails, this step is skipped and
        # mcp-prod-latest is not written — identical to backend/frontend tag behavior; MCP
        # will redeploy next run. This is intentional for consistency.
        if: needs.detect-changes.outputs.mcp_changed == 'true' && needs.deploy-mcp-worker.result == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/mcp-prod-${SHA}" >/dev/null 2>&1; then
            git tag "mcp-prod-${SHA}" "${SHA}"
            git push origin "refs/tags/mcp-prod-${SHA}"
          fi
          git tag -f mcp-prod-latest "${SHA}"
          git push origin refs/tags/mcp-prod-latest --force

      - name: Tag update summary
        env:
          DEPLOY_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
          MCP_CHANGED: ${{ needs.detect-changes.outputs.mcp_changed }}
        run: |
          echo "### Release Tags Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BACKEND_CHANGED" = "true" ]; then
            echo "- \`backend-prod-latest\` → \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`backend-prod-${DEPLOY_SHA}\` (immutable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- backend tags unchanged (no backend change)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            echo "- \`frontend-prod-latest\` → \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`frontend-prod-${DEPLOY_SHA}\` (immutable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- frontend tags unchanged (no frontend change)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$MCP_CHANGED" = "true" ]; then
            echo "- \`mcp-prod-latest\` → \`${DEPLOY_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`mcp-prod-${DEPLOY_SHA}\` (immutable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- mcp tags unchanged (no MCP change)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true
