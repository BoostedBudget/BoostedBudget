name: Deploy to QA

# Manual-only workflow for deploying PRs or branches to QA environment (Mac Mini)
# NOTE: This workflow requires manual triggering - there is no automatic deployment
# Supports two deployment modes:
#   - PR mode: Deploy from an open PR (for testing PRs before merge)
#   - Branch mode: Deploy from a branch directly (e.g., staging after PR merge)
on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Deployment mode'
        required: true
        type: choice
        options:
          - 'pr'        # Deploy from a PR
          - 'branch'    # Deploy from a branch directly
      pr_number:
        description: 'PR number to deploy (required if mode=pr)'
        required: false
        type: string
      branch_name:
        description: 'Branch name to deploy (required if mode=branch)'
        required: false
        type: string
        default: 'staging'
# Only allow one QA deployment at a time
concurrency:
  group: deploy-qa
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: boostedbudget/boostedbudget-backend
  FRONTEND_IMAGE_NAME: boostedbudget/boostedbudget-frontend

jobs:
  # =============================================================================
  # Fetch Deployment Metadata (PR or Branch)
  # =============================================================================
  deployment-metadata:
    name: Fetch Deployment Metadata
    if: github.repository == 'BoostedBudget/BoostedBudget'
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.deploy-info.outputs.head_sha }}
      head_ref: ${{ steps.deploy-info.outputs.head_ref }}
      deploy_title: ${{ steps.deploy-info.outputs.deploy_title }}
      deploy_author: ${{ steps.deploy-info.outputs.deploy_author }}
      tag_prefix: ${{ steps.deploy-info.outputs.tag_prefix }}
      deployment_mode: ${{ github.event.inputs.deployment_mode }}

    steps:
      - name: Authorize actor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`Unauthorized actor '${context.actor}' (permission: ${data.permission})`);
            }
      - name: Validate inputs
        env:
          MODE: ${{ github.event.inputs.deployment_mode }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
        run: |
          if [ "$MODE" = "pr" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::PR number is required when deployment_mode=pr"
              exit 1
            fi
            echo "::notice::Deployment mode: PR #${PR_NUMBER}"
          elif [ "$MODE" = "branch" ]; then
            if [ -z "$BRANCH_NAME" ]; then
              echo "::error::Branch name is required when deployment_mode=branch"
              exit 1
            fi
            echo "::notice::Deployment mode: Branch '${BRANCH_NAME}'"
          else
            echo "::error::Invalid deployment mode: $MODE"
            exit 1
          fi

      - name: Fetch deployment information
        id: deploy-info
        env:
          MODE: ${{ github.event.inputs.deployment_mode }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$MODE" = "pr" ]; then
            echo "Fetching metadata for PR #${PR_NUMBER}..."

            # Use curl + GitHub API instead of gh CLI (gh not available on self-hosted runners)
            PR_DATA=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}")

            # Check for API errors
            if echo "$PR_DATA" | jq -e '.message' > /dev/null 2>&1; then
              echo "::error::Failed to fetch PR: $(echo "$PR_DATA" | jq -r '.message')"
              exit 1
            fi

            # GitHub API returns state as lowercase: "open", "closed"
            # and merged as boolean
            PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
            PR_MERGED=$(echo "$PR_DATA" | jq -r '.merged')
            if [ "$PR_MERGED" = "true" ]; then
              echo "::error::PR #${PR_NUMBER} is merged. Can only deploy open PRs in PR mode."
              echo "::notice::Tip: Use 'branch' deployment mode to deploy the merged branch instead."
              exit 1
            fi
            if [ "$PR_STATE" = "closed" ]; then
              echo "::error::PR #${PR_NUMBER} is closed. Can only deploy open PRs in PR mode."
              exit 1
            fi

            # GitHub API field names differ from gh CLI:
            # .head.sha (not .headRefOid), .head.ref (not .headRefName), .user.login (not .author.login)
            HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
            DEPLOY_TITLE=$(echo "$PR_DATA" | jq -r '.title')
            DEPLOY_AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')
            TAG_PREFIX="pr-${PR_NUMBER}"

            echo "::notice::PR #${PR_NUMBER}: ${DEPLOY_TITLE}"
            echo "::notice::Branch: ${HEAD_REF} (${HEAD_SHA})"
            echo "::notice::Author: @${DEPLOY_AUTHOR}"

          else
            # Branch mode
            echo "Fetching metadata for branch '${BRANCH_NAME}'..."

            # Fetch branch info from GitHub API
            BRANCH_DATA=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GH_REPOSITORY}/branches/${BRANCH_NAME}")

            # Check for API errors
            if echo "$BRANCH_DATA" | jq -e '.message' > /dev/null 2>&1; then
              echo "::error::Failed to fetch branch: $(echo "$BRANCH_DATA" | jq -r '.message')"
              exit 1
            fi

            HEAD_SHA=$(echo "$BRANCH_DATA" | jq -r '.commit.sha')
            HEAD_REF="${BRANCH_NAME}"
            DEPLOY_TITLE="Branch deployment: ${BRANCH_NAME}"
            DEPLOY_AUTHOR="${GH_ACTOR}"
            # Sanitize branch name for tag (replace / with -)
            SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
            TAG_PREFIX="branch-${SANITIZED_BRANCH}"

            echo "::notice::Branch: ${HEAD_REF} (${HEAD_SHA})"
            echo "::notice::Triggered by: @${DEPLOY_AUTHOR}"
          fi

          # #1514: fail loudly instead of letting a blank/unresolved HEAD_SHA flow
          # downstream, where an empty `ref:` on a checkout step silently falls back
          # to the default branch instead of erroring — a worse failure than today.
          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "::error::Failed to resolve an immutable commit SHA for this deployment (got '${HEAD_SHA}'). Refusing to proceed with an unpinned ref."
            exit 1
          fi

          # Use randomized heredoc delimiters for $GITHUB_OUTPUT: DEPLOY_TITLE and
          # HEAD_REF originate from PR-controlled data (title/branch name) and may
          # contain newlines or content that collides with a fixed delimiter.
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "head_sha=${HEAD_SHA}"
            echo "head_ref<<${DELIM}"
            echo "${HEAD_REF}"
            echo "${DELIM}"
            echo "deploy_title<<${DELIM}"
            echo "${DEPLOY_TITLE}"
            echo "${DELIM}"
            echo "deploy_author<<${DELIM}"
            echo "${DEPLOY_AUTHOR}"
            echo "${DELIM}"
            echo "tag_prefix=${TAG_PREFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Deployment metadata summary
        env:
          MODE: ${{ github.event.inputs.deployment_mode }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          DEPLOY_TITLE: ${{ steps.deploy-info.outputs.deploy_title }}
          DEPLOY_AUTHOR: ${{ steps.deploy-info.outputs.deploy_author }}
          HEAD_REF: ${{ steps.deploy-info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.deploy-info.outputs.head_sha }}
        run: |
          if [ "$MODE" = "pr" ]; then
            echo "### 📋 PR Deployment Metadata" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Mode:** PR Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #${PR_NUMBER} - ${DEPLOY_TITLE}" >> $GITHUB_STEP_SUMMARY
            echo "**Author:** @${DEPLOY_AUTHOR}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📋 Branch Deployment Metadata" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Mode:** Branch Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** \`${BRANCH_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Triggered by:** @${DEPLOY_AUTHOR}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Ref:** \`${HEAD_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${HEAD_SHA}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Build and Push Images to GHCR (Parallelized via Matrix)
  # =============================================================================
  build-images:
    name: Build ${{ matrix.component }} Image
    needs: [deployment-metadata]
    if: ${{ needs.deployment-metadata.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      # Pass through the build target info to downstream jobs.
      # #1514: `sha` is the immutable commit checked out and built — it is the
      # ONLY value downstream jobs may use as a checkout `ref:`. There is
      # intentionally no `ref` (mutable branch name) output here; passing that
      # around invited a TOCTOU where a later push to the branch could deploy
      # unreviewed code under QA secrets while the summary still named the
      # originally-reviewed commit.
      tag_prefix: ${{ steps.build-target.outputs.tag_prefix }}
      sha: ${{ steps.build-target.outputs.sha }}
    env:
      UNIQUE_WORKSPACE: workspace-build-images-${{ matrix.component }}-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          # Remove any root-owned files created by Docker volumes
          # This prevents "permission denied" errors during checkout cleanup
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Determine build target
        id: build-target
        env:
          MODE: ${{ github.event.inputs.deployment_mode }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HEAD_REF: ${{ needs.deployment-metadata.outputs.head_ref }}
          HEAD_SHA: ${{ needs.deployment-metadata.outputs.head_sha }}
          TAG_PREFIX: ${{ needs.deployment-metadata.outputs.tag_prefix }}
        run: |
          # #1514: HEAD_REF (mutable branch name) is logged for humans only and
          # MUST NOT be used as a checkout ref — see job outputs comment above.
          # Guard against an empty/unresolved SHA rather than letting a blank
          # `ref:` on a later checkout step silently fall back to the default
          # branch (also checked at the point HEAD_SHA is first produced, in
          # the deployment-metadata job, but re-checked here defensively since
          # this is the value that actually becomes the checkout target).
          if [ -z "$HEAD_SHA" ] || ! echo "$HEAD_SHA" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::HEAD_SHA is empty or not a valid commit SHA ('${HEAD_SHA}'). Refusing to check out an unpinned ref."
            exit 1
          fi
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=${TAG_PREFIX}" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "pr" ]; then
            echo "::notice::Building PR #${PR_NUMBER} branch: ${HEAD_REF} @ ${HEAD_SHA}"
          else
            echo "::notice::Building branch: ${HEAD_REF} @ ${HEAD_SHA}"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          # #1514: pin to the immutable SHA, not a mutable branch ref — see
          # note on the build-images job `outputs:` block above.
          ref: ${{ steps.build-target.outputs.sha }}

      - name: Resolve BUILD_DATE
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Configure Docker to avoid keychain conflicts
        run: |
          LOCKDIR=~/.docker/config.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for config.json lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            if command -v jq &> /dev/null; then
              TEMP_FILE=~/.docker/config.json.tmp.${{ matrix.component }}
              if jq 'del(.credsStore)' ~/.docker/config.json > "$TEMP_FILE" 2>/dev/null; then
                mv "$TEMP_FILE" ~/.docker/config.json
              else
                rm -f "$TEMP_FILE"
              fi
            fi
          else
            echo "{}" > ~/.docker/config.json
          fi

      - name: Log in to GitHub Container Registry
        run: |
          LOCKDIR=~/.docker/login.lock
          TIMEOUT=30
          ELAPSED=0

          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "[${{ matrix.component }}] Waiting for docker login lock..."
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout waiting for lock"
              exit 1
            fi
          done

          trap "rmdir '$LOCKDIR' 2>/dev/null || true" EXIT

          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin; then
              echo "✅ Login successful"
              exit 0
            else
              if [ $i -lt $MAX_ATTEMPTS ]; then
                sleep 10
              else
                exit 1
              fi
            fi
          done

      - name: Set image name for ${{ matrix.component }}
        id: image-name
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            IMAGE_NAME="${{ env.BACKEND_IMAGE_NAME }}"
          else
            IMAGE_NAME="${{ env.FRONTEND_IMAGE_NAME }}"
          fi
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Building: ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}"

      - name: Set Dockerfile path
        id: dockerfile
        run: |
          if [ "${{ matrix.component }}" = "frontend" ]; then
            echo "path=apps/web/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=${{ matrix.component }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.UNIQUE_WORKSPACE }}
          file: ${{ env.UNIQUE_WORKSPACE }}/${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ steps.build-target.outputs.tag_prefix }}-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:buildcache-go${{ env.GO_VERSION }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:buildcache-go${{ env.GO_VERSION }},mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: false

      - name: Image build summary
        run: |
          echo "### 🐳 ${{ matrix.component }} Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ steps.image-name.outputs.image-name }}:${{ steps.build-target.outputs.tag_prefix }}-${{ steps.build-target.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deploy to Mac Mini QA
  # =============================================================================
  deploy-to-mac-mini:
    name: Deploy to Mac Mini QA
    needs: [deployment-metadata, build-images]
    if: ${{ needs.build-images.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://localhost:3000
    env:
      UNIQUE_WORKSPACE: workspace-deploy-mac-mini-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          # #1514: pin to the immutable SHA that was actually built, not a
          # mutable branch ref. A push between metadata capture and this
          # checkout must not change what gets deployed with live QA secrets.
          ref: ${{ needs.build-images.outputs.sha }}

      # #1514: fail loudly if a required QA secret is missing/renamed/typo'd, instead of
      # letting the .env.qa heredoc silently substitute a weak, repo-committed default
      # (e.g. the old ENCRYPTION_KEY fallback, a real usable AES-256 key checked into git).
      - name: Validate required QA secrets are set
        env:
          QA_SSL_CERT: ${{ secrets.QA_SSL_CERT }}
          QA_SSL_KEY: ${{ secrets.QA_SSL_KEY }}
          CORS_ALLOWED_ORIGINS_QA: ${{ secrets.CORS_ALLOWED_ORIGINS_QA }}
          POSTGRES_PASSWORD_QA: ${{ secrets.POSTGRES_PASSWORD_QA }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          PLAID_CLIENT_ID_QA: ${{ secrets.PLAID_CLIENT_ID_QA }}
          PLAID_SECRET_QA: ${{ secrets.PLAID_SECRET_QA }}
          PLAID_REDIRECT_URI_QA: ${{ secrets.PLAID_REDIRECT_URI_QA }}
          PLAID_WEBHOOK_URL_QA: ${{ secrets.PLAID_WEBHOOK_URL_QA }}
          ENCRYPTION_KEY_QA: ${{ secrets.ENCRYPTION_KEY_QA }}
          QA_BYPASS_SECRET: ${{ secrets.QA_BYPASS_SECRET }}
          QA_ADMIN_CLERK_USER_ID: ${{ secrets.QA_ADMIN_CLERK_USER_ID }}
          QA_PREMIUM_CLERK_USER_ID: ${{ secrets.QA_PREMIUM_CLERK_USER_ID }}
        run: |
          required_secrets=(
            QA_SSL_CERT
            QA_SSL_KEY
            CORS_ALLOWED_ORIGINS_QA
            POSTGRES_PASSWORD_QA
            CLERK_SECRET_KEY
            CLERK_PUBLISHABLE_KEY
            PLAID_CLIENT_ID_QA
            PLAID_SECRET_QA
            PLAID_REDIRECT_URI_QA
            PLAID_WEBHOOK_URL_QA
            ENCRYPTION_KEY_QA
            QA_BYPASS_SECRET
            QA_ADMIN_CLERK_USER_ID
            QA_PREMIUM_CLERK_USER_ID
          )
          missing=()
          for name in "${required_secrets[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required QA secret(s): ${missing[*]}. Set them in the 'qa' GitHub Environment before deploying."
            exit 1
          fi
          echo "✓ All required QA secrets are set (${#required_secrets[@]} checked)"

      - name: Restore SSL certificates from secrets
        run: |
          mkdir -p ${{ env.UNIQUE_WORKSPACE }}/apps/web
          echo "${{ secrets.QA_SSL_CERT }}" | base64 -d > ${{ env.UNIQUE_WORKSPACE }}/apps/web/cert.pem
          echo "${{ secrets.QA_SSL_KEY }}" | base64 -d > ${{ env.UNIQUE_WORKSPACE }}/apps/web/key.pem
          chmod 600 ${{ env.UNIQUE_WORKSPACE }}/apps/web/*.pem
          echo "✓ SSL certificates restored for HTTPS QA access"

      - name: Create .env.qa from secrets
        run: |
          # #1514: the heredoc delimiter below is quoted ('EOF') so bash writes
          # the body byte-for-byte with NO shell expansion of its contents.
          # NOTE: do not write a literal empty GitHub expression in this block, even
          # inside a shell comment — expressions are templated anywhere in a `run:`
          # script, and an empty one is a workflow-compile error (actionlint:
          # "unexpected end of input while parsing variable access"). That is why the
          # mechanism is described in words below rather than shown in syntax.
          #
          # Every secret is substituted by GitHub Actions expression templating at
          # workflow-compile time, before bash ever sees this script — that
          # substitution is unaffected by heredoc quoting either way. Quoting
          # matters for what bash itself would otherwise do at runtime: a
          # secret containing literal `$$`, `` `cmd` ``, or `$(cmd)` would
          # silently be expanded/command-substituted by an UNQUOTED heredoc
          # (e.g. a password with `$$` becomes bash's PID, corrupting both the
          # password and any DATABASE_URL built from it, with no error). We
          # previously used real bash variables (${TAG_PREFIX}, ${SHA}) here,
          # which needed runtime expansion and would have broken under quoting
          # — they are now inlined directly as GitHub Actions expressions instead
          # (also GH-Actions-substituted pre-bash), so quoting the delimiter is
          # safe and every line below still produces the same output as before.
          cat > ${{ env.UNIQUE_WORKSPACE }}/.env.qa << 'EOF'
          # Application Settings
          COMPOSE_PROJECT_NAME=boostedbudget-qa
          NODE_ENV=qa
          GO_ENV=qa
          ENVIRONMENT=qa
          VERSION=${{ needs.build-images.outputs.tag_prefix }}-${{ needs.build-images.outputs.sha }}
          PRIMARY_REGION=iad

          # CORS Configuration
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_QA }}

          # Docker Image Configuration (pull from GHCR)
          PULL_FROM_GHCR=true
          BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.build-images.outputs.tag_prefix }}-${{ needs.build-images.outputs.sha }}
          FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-images.outputs.tag_prefix }}-${{ needs.build-images.outputs.sha }}

          # URLs
          BACKEND_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:3000

          # Database (QA)
          POSTGRES_USER=qauser
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_QA }}
          DATABASE_URL=postgresql://qauser:${{ secrets.POSTGRES_PASSWORD_QA }}@localhost:5433/boostedbudget_qa?sslmode=disable

          # Redis (QA) — Issue #1531: two SEPARATE instances, never shared (see
          # docker-compose.qa.yml's redis-ratelimit/redis-cache comments).
          RATE_LIMIT_REDIS_URL=redis://localhost:6380/0
          CACHE_REDIS_URL=redis://localhost:6381/0

          # Clerk Authentication
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}

          # RevenueCat nonproduction project (all connectivity values together)
          REVENUECAT_PROJECT_ID=${{ secrets.REVENUECAT_PROJECT_ID }}
          REVENUECAT_SECRET_API_KEY=${{ secrets.REVENUECAT_SECRET_API_KEY }}
          REVENUECAT_GRANT_API_KEY=${{ secrets.REVENUECAT_GRANT_API_KEY }}
          REVENUECAT_ENVIRONMENT=${{ secrets.REVENUECAT_ENVIRONMENT }}
          REVENUECAT_WEBHOOK_AUTHORIZATION=${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET=${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET }}
          VITE_REVENUECAT_PUBLIC_API_KEY=${{ secrets.VITE_REVENUECAT_PUBLIC_API_KEY }}

          # Plaid (Sandbox)
          PLAID_ENV=sandbox
          PLAID_CLIENT_ID=${{ secrets.PLAID_CLIENT_ID_QA }}
          PLAID_SECRET=${{ secrets.PLAID_SECRET_QA }}
          PLAID_PRODUCTS=auth,transactions,balance
          PLAID_COUNTRY_CODES=US,CA,GB
          PLAID_REDIRECT_URI=${{ secrets.PLAID_REDIRECT_URI_QA }}
          PLAID_WEBHOOK_URL=${{ secrets.PLAID_WEBHOOK_URL_QA }}

          # Security
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY_QA }}

          # QA Auth Bypass (Issue #821). QA_AUTH_BYPASS_ENABLED is the explicit opt-in added
          # by #1432 (B2-1): ENVIRONMENT=qa alone no longer registers the route.
          QA_AUTH_BYPASS_ENABLED=true
          QA_BYPASS_SECRET=${{ secrets.QA_BYPASS_SECRET }}
          QA_ADMIN_CLERK_USER_ID=${{ secrets.QA_ADMIN_CLERK_USER_ID }}
          QA_PREMIUM_CLERK_USER_ID=${{ secrets.QA_PREMIUM_CLERK_USER_ID }}

          # Logging
          LOG_LEVEL=debug
          LOG_FORMAT=json

          # Feature Flags
          FEATURE_RULES_ENGINE=true
          FEATURE_AI_INSIGHTS=false
          FEATURE_MULTI_REGION=false
          EOF

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Deploy to QA (pull from GHCR)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          chmod +x ./scripts/deploy-qa.sh
          # Environment variables are set in .env.qa
          # Script will read PULL_FROM_GHCR, BACKEND_IMAGE, FRONTEND_IMAGE from there
          ./scripts/deploy-qa.sh

      - name: Show container status
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        if: always()
        run: |
          docker-compose -f docker-compose.qa.yml --env-file .env.qa ps

      - name: Show logs on failure
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        if: failure()
        run: |
          echo "::group::Backend Logs"
          docker-compose -f docker-compose.qa.yml --env-file .env.qa logs --tail=50 backend
          echo "::endgroup::"

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Smoke Tests
  # =============================================================================
  smoke-tests:
    name: QA Smoke Tests
    needs: [deployment-metadata, build-images, deploy-to-mac-mini]
    if: ${{ needs.deploy-to-mac-mini.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-smoke-tests-${{ github.run_id }}

    steps:
      - name: Clean up Docker-created files (sudo)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          # #1514: without an explicit ref this defaults to the ref that
          # triggered the workflow_dispatch, not the commit that was actually
          # built/deployed above. Pin to the same immutable SHA for consistency.
          ref: ${{ needs.build-images.outputs.sha }}

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          echo "Running smoke tests against QA..."

          # Backend health check
          if curl -f http://localhost:8080/health; then
            echo "✅ Backend health check passed"
          else
            echo "::error::Backend health check failed"
            exit 1
          fi

          # Frontend accessibility
          if curl -f http://localhost:3000; then
            echo "✅ Frontend is accessible"
          else
            echo "::error::Frontend is not accessible"
            exit 1
          fi

          # Database connectivity (via backend)
          echo "Database connectivity verified via backend health check"

          echo "::notice::✅ All smoke tests passed"

      - name: Smoke tests summary
        if: success()
        run: |
          echo "### ✅ QA Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend health check" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend accessibility" >> $GITHUB_STEP_SUMMARY
          echo "- Database connectivity" >> $GITHUB_STEP_SUMMARY

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Deployment Summary
  # =============================================================================
  deployment-summary:
    name: Deployment Summary
    needs: [deployment-metadata, build-images, deploy-to-mac-mini, smoke-tests]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.smoke-tests.result == 'success' }}

    steps:
      - name: Create deployment summary
        env:
          TAG_PREFIX: ${{ needs.build-images.outputs.tag_prefix }}
          SHA: ${{ needs.build-images.outputs.sha }}
          MODE: ${{ github.event.inputs.deployment_mode }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          DEPLOY_TITLE: ${{ needs.deployment-metadata.outputs.deploy_title }}
          DEPLOY_AUTHOR: ${{ needs.deployment-metadata.outputs.deploy_author }}
          HEAD_REF: ${{ needs.deployment-metadata.outputs.head_ref }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          if [ "$MODE" = "pr" ]; then
            echo "### 🚀 PR #${PR_NUMBER} Deployed to QA" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Mode:** PR Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #${PR_NUMBER} - ${DEPLOY_TITLE}" >> $GITHUB_STEP_SUMMARY
            echo "**Author:** @${DEPLOY_AUTHOR}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Branch '${BRANCH_NAME}' Deployed to QA" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Mode:** Branch Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** \`${BRANCH_NAME}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Ref:** \`${HEAD_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${GH_ACTOR}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** QA (Mac Mini)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${TAG_PREFIX}-${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${TAG_PREFIX}-${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${TAG_PREFIX}-${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access (Local Network):**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://localhost:3000" >> $GITHUB_STEP_SUMMARY
          echo "- Backend API: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access (Tailscale VPN):**" >> $GITHUB_STEP_SUMMARY
          echo "- Update with your Tailscale hostname after setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-Restart:** ✅ All containers configured with \`restart: unless-stopped\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tests:** ✅ Smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Notify PR
  # =============================================================================
  notify-pr:
    name: Comment on PR
    needs: [deployment-metadata, build-images, smoke-tests]
    # Only run when deployment_mode=pr AND smoke tests pass
    # Branch deployments don't need PR comments
    if: ${{ needs.smoke-tests.result == 'success' && github.event.inputs.deployment_mode == 'pr' }}
    runs-on: ubuntu-latest

    steps:
      - name: Comment on PR
        env:
          TAG_PREFIX: ${{ needs.build-images.outputs.tag_prefix }}
          SHA: ${{ needs.build-images.outputs.sha }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HEAD_REF: ${{ needs.deployment-metadata.outputs.head_ref }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          # Use curl + GitHub API instead of gh CLI (gh not available on self-hosted runners)
          # GitHub API uses /issues/{number}/comments endpoint for PR comments (PRs are a type of issue)
          # NOTE: HEAD_REF is PR-controlled (branch name) so it is injected as a
          # placeholder below and substituted via a shell variable, never directly
          # into the heredoc text.
          COMMENT_BODY=$(cat << 'EOF'
          ## 🚀 QA Deployment Successful

          This PR has been deployed to the QA environment for testing.

          | Field | Value |
          |-------|-------|
          | **Version** | `TAG_PREFIX_PLACEHOLDER-SHA_PLACEHOLDER` |
          | **Branch** | `HEAD_REF_PLACEHOLDER` |
          | **Commit** | `SHA_PLACEHOLDER` |
          | **Triggered by** | @GH_ACTOR_PLACEHOLDER |

          ### Access URLs
          - **Frontend:** https://localhost:3000 (or via Tailscale)
          - **Backend API:** http://localhost:8080

          ### Workflow Run
          [View deployment logs](GH_SERVER_URL_PLACEHOLDER/GH_REPOSITORY_PLACEHOLDER/actions/runs/GH_RUN_ID_PLACEHOLDER)

          ---
          *This is an automated comment from the QA deployment workflow.*
          EOF
          )

          # Replace placeholders with actual values
          COMMENT_BODY="${COMMENT_BODY//TAG_PREFIX_PLACEHOLDER/$TAG_PREFIX}"
          COMMENT_BODY="${COMMENT_BODY//SHA_PLACEHOLDER/$SHA}"
          COMMENT_BODY="${COMMENT_BODY//HEAD_REF_PLACEHOLDER/$HEAD_REF}"
          COMMENT_BODY="${COMMENT_BODY//GH_ACTOR_PLACEHOLDER/$GH_ACTOR}"
          COMMENT_BODY="${COMMENT_BODY//GH_SERVER_URL_PLACEHOLDER/$GH_SERVER_URL}"
          COMMENT_BODY="${COMMENT_BODY//GH_REPOSITORY_PLACEHOLDER/$GH_REPOSITORY}"
          COMMENT_BODY="${COMMENT_BODY//GH_RUN_ID_PLACEHOLDER/$GH_RUN_ID}"

          # Post comment via GitHub API
          HTTP_STATUS=$(curl -s -o /tmp/comment_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "::notice::✅ Comment added to PR #${PR_NUMBER}"
          else
            echo "::error::Failed to post comment. HTTP status: $HTTP_STATUS"
            cat /tmp/comment_response.json
            exit 1
          fi
