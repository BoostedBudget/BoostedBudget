name: Test Suite

# Trigger on pull requests only - quality gates before merge
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Detect Changes (determines which jobs to run based on file changes)
  # =============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      migrations: ${{ steps.filter.outputs.migrations }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
              - 'frontend/bun.lock'
            api:
              - 'api/**'
              - 'api/openapi.yaml'
            migrations:
              - 'backend/migrations/**'
            workflow:
              - '.github/workflows/**'

  # =============================================================================
  # OpenAPI Spec Validation (ensures spec is committed when backend changes)
  # =============================================================================
  openapi-validate:
    name: OpenAPI Spec Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-openapi-validate-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-modules-${{ runner.os }}-

      - name: Download Go dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go mod download

      - name: Generate OpenAPI spec
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go run scripts/generate-openapi/main.go

      - name: Check if spec is up to date
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          if git diff --exit-code api/openapi.yaml; then
            echo "::notice::OpenAPI spec is up to date"
          else
            echo "::error::OpenAPI spec is outdated!"
            echo "The generated spec differs from the committed version."
            echo "Run 'make generate-openapi' locally and commit the changes."
            echo ""
            echo "Diff (first 100 lines):"
            git diff api/openapi.yaml | head -100
            exit 1
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # TypeScript Client Validation (ensures generated client is committed)
  # =============================================================================
  typescript-client-validate:
    name: TypeScript Client Validation
    needs: [detect-changes, openapi-validate]
    if: |
      always() &&
      (needs.detect-changes.outputs.api == 'true' ||
       needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.workflow == 'true')
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-ts-client-validate-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        id: cache-bun
        uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: |
          for i in 1 2 3; do
            echo "📦 bun install attempt $i/3..."
            bun install --frozen-lockfile && {
              echo "✅ Dependencies installed"
              break
            } || {
              echo "⚠️ Install failed, cleaning bun cache..."
              rm -rf ~/.bun/install/cache
              [ $i -lt 3 ] && sleep 5
            }
          done

      - name: Generate TypeScript client
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: bun run generate:api

      - name: Check if generated client is up to date
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          if git diff --exit-code frontend/src/api/generated; then
            echo "::notice::Generated TypeScript client is up to date"
          else
            echo "::error::Generated TypeScript client is outdated!"
            echo "The generated client differs from the committed version."
            echo "Run 'cd frontend && bun run generate:api' locally and commit the changes."
            echo ""
            echo "Diff (first 100 lines):"
            git diff frontend/src/api/generated | head -100
            exit 1
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Backend Tests (runs in parallel with frontend)
  # =============================================================================
  backend-test:
    name: Backend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-backend-test-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-modules-${{ runner.os }}-

      - name: Download Go dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          if [ "${{ steps.cache-go-modules.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Go modules restored from cache"
          else
            echo "📦 Cache miss, downloading Go modules..."
          fi
          go mod download

      - name: Run Go tests with coverage
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          echo "::group::Running Go tests with race detection and coverage"
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "::endgroup::"

      - name: Check Go coverage threshold (≥60%)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          echo "::group::Checking coverage threshold"
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)

          if [ "$COVERAGE_INT" -lt 60 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold 60%"
            exit 1
          else
            echo "::notice::✅ Coverage ${COVERAGE}% meets threshold 60%"
          fi
          echo "::endgroup::"

      - name: Generate Go coverage HTML report
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Restore backend binary cache
        id: cache-backend-binary
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}/backend/bin/server
          key: backend-binary-${{ runner.os }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', 'backend/go.sum') }}

      - name: Build backend binary (for E2E tests)
        if: steps.cache-backend-binary.outputs.cache-hit != 'true'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          echo "::group::Building backend binary"
          mkdir -p bin
          go build -o bin/server ./cmd/server
          echo "::endgroup::"

      - name: Upload backend binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-binary
          path: ${{ env.UNIQUE_WORKSPACE }}/backend/bin/server
          retention-days: 1

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: |
            ${{ env.UNIQUE_WORKSPACE }}/backend/coverage.out
            ${{ env.UNIQUE_WORKSPACE }}/backend/coverage.html
          retention-days: 30

      - name: Save Go modules cache
        if: always() && steps.cache-go-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Save backend binary cache
        if: always() && steps.cache-backend-binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}/backend/bin/server
          key: backend-binary-${{ runner.os }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', 'backend/go.sum') }}

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Frontend Tests (Single job - no sharding)
  # =============================================================================
  frontend-test:
    name: Frontend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-frontend-test-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        id: cache-bun
        uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: |
          for i in 1 2 3; do
            echo "📦 bun install attempt $i/3..."
            bun install --frozen-lockfile && {
              echo "✅ Dependencies installed"
              break
            } || {
              echo "⚠️ Install failed, cleaning bun cache..."
              rm -rf ~/.bun/install/cache
              [ $i -lt 3 ] && sleep 5
            }
          done

      - name: Run ESLint
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: |
          echo "::group::Running ESLint"
          bun run lint
          echo "::endgroup::"

      - name: Run frontend unit tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: |
          echo "::group::Running Unit Tests"
          bun run test:ci
          echo "::endgroup::"

      - name: Save Bun cache
        if: always() && steps.cache-bun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: ${{ env.UNIQUE_WORKSPACE }}/frontend/coverage/
          retention-days: 30

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # E2E Tests (depends on backend-test for binary)
  # =============================================================================
  e2e-test:
    name: E2E Tests
    needs: [detect-changes, backend-test]
    # Run if backend-test succeeded OR was skipped (frontend-only changes)
    if: always() && !cancelled() && (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-e2e-test-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        id: cache-bun
        uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: |
          for i in 1 2 3; do
            echo "📦 bun install attempt $i/3..."
            bun install --frozen-lockfile && {
              echo "✅ Dependencies installed"
              break
            } || {
              echo "⚠️ Install failed, cleaning bun cache..."
              rm -rf ~/.bun/install/cache
              [ $i -lt 3 ] && sleep 5
            }
          done

      - name: Install Playwright browsers
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        run: |
          echo "Installing Playwright browsers..."
          for i in 1 2 3; do
            bunx playwright install --with-deps chromium && {
              echo "Browsers installed"
              break
            } || {
              echo "Install attempt $i/3 failed"
              [ $i -lt 3 ] && sleep 15
            }
          done

      - name: Restore backend binary from cache
        id: cache-backend-binary
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}/backend/bin/server
          key: backend-binary-${{ runner.os }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', 'backend/go.sum') }}
          restore-keys: |
            backend-binary-${{ runner.os }}-

      - name: Set up Go (for building backend if needed)
        if: steps.cache-backend-binary.outputs.cache-hit != 'true' && needs.backend-test.result == 'skipped'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build backend binary (cache miss fallback)
        if: steps.cache-backend-binary.outputs.cache-hit != 'true' && needs.backend-test.result == 'skipped'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          echo "📦 Building backend binary (cache miss, backend-test skipped)..."
          mkdir -p bin
          go build -o bin/server ./cmd/server
          echo "✅ Backend binary built successfully"

      - name: Download backend binary artifact (fallback)
        if: steps.cache-backend-binary.outputs.cache-hit != 'true' && needs.backend-test.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: backend-binary
          path: ${{ env.UNIQUE_WORKSPACE }}/backend/bin

      - name: Verify backend binary exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}/backend/bin/server" ]; then
            echo "::error::Backend binary not found. Run backend tests first to populate cache."
            exit 1
          fi
          echo "✅ Backend binary found"

      - name: Make backend binary executable
        run: chmod +x $GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}/backend/bin/server

      - name: Run E2E tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/frontend
        env:
          CI: true
        run: |
          echo "::group::Running Playwright E2E tests"
          bun run test:e2e
          echo "::endgroup::"

      - name: Upload E2E test results
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ${{ env.UNIQUE_WORKSPACE }}/frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-videos
          path: ${{ env.UNIQUE_WORKSPACE }}/frontend/test-results/
          retention-days: 7

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Migration Integration Tests
  # =============================================================================
  migration-tests:
    name: Migration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: [self-hosted, macOS, mac-mini]
    env:
      UNIQUE_WORKSPACE: workspace-migration-tests-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Configure PostgreSQL client tools
        run: |
          echo "::group::Configuring PostgreSQL client"

          # Check if psql already in PATH (avoid redundant setup)
          if command -v psql &> /dev/null && command -v pg_dump &> /dev/null; then
            echo "✅ PostgreSQL client tools already in PATH"
            psql --version
            pg_dump --version
            echo "::endgroup::"
            exit 0
          fi

          # Locate PostgreSQL@15 installation
          # Try standard Homebrew paths (Apple Silicon first, then Intel)
          POSTGRES_BIN=""
          SEARCH_PATHS=(
            "/opt/homebrew/opt/postgresql@15/bin"
            "/usr/local/opt/postgresql@15/bin"
          )

          for path in "${SEARCH_PATHS[@]}"; do
            if [ -d "$path" ] && [ -f "$path/psql" ]; then
              POSTGRES_BIN="$path"
              echo "Found PostgreSQL@15 at: $path"
              break
            fi
          done

          if [ -z "$POSTGRES_BIN" ]; then
            echo "::error::PostgreSQL@15 not found in Homebrew locations"
            echo "::error::Searched: ${SEARCH_PATHS[*]}"
            echo "::error::Please ensure postgresql@15 is installed via Homebrew"
            exit 1
          fi

          # Add to PATH for all subsequent steps in this job
          echo "$POSTGRES_BIN" >> $GITHUB_PATH

          # Verify binaries are executable
          if ! "$POSTGRES_BIN/psql" --version; then
            echo "::error::psql found but not executable"
            exit 1
          fi

          if ! "$POSTGRES_BIN/pg_dump" --version; then
            echo "::error::pg_dump found but not executable"
            exit 1
          fi

          echo "::notice::✅ PostgreSQL client tools configured successfully"
          echo "  Location: $POSTGRES_BIN"
          echo "  psql version: $("$POSTGRES_BIN/psql" --version)"
          echo "  pg_dump version: $("$POSTGRES_BIN/pg_dump" --version)"
          echo "::endgroup::"

      - name: Start PostgreSQL container
        run: |
          docker stop test-postgres-${{ github.run_id }} 2>/dev/null || true
          docker rm test-postgres-${{ github.run_id }} 2>/dev/null || true

          echo "🐘 Pulling PostgreSQL image..."
          for i in 1 2 3; do
            docker pull postgres:15 && break || {
              echo "⚠️ Pull attempt $i/3 failed"
              [ $i -lt 3 ] && sleep 10
            }
          done

          docker run -d \
            --name test-postgres-${{ github.run_id }} \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -p 5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:15

          # Get the dynamically assigned port
          sleep 2
          POSTGRES_PORT=$(docker port test-postgres-${{ github.run_id }} 5432 | cut -d: -f2)
          echo "PostgreSQL running on dynamically assigned port: $POSTGRES_PORT"

          # Export for use in subsequent steps
          echo "POSTGRES_PORT=$POSTGRES_PORT" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://test:test@localhost:$POSTGRES_PORT/test?sslmode=disable" >> $GITHUB_ENV

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec test-postgres-${{ github.run_id }} pg_isready -U test > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Timeout waiting for PostgreSQL to start"
              exit 1
            fi
            sleep 1
          done

      - name: Debug migration files
        run: |
          echo "::group::Migration Files Debug"
          cd ${{ env.UNIQUE_WORKSPACE }}/backend
          echo "Working directory: $(pwd)"
          echo ""
          echo "Migration files count:"
          ls -1 migrations/*.sql 2>/dev/null | wc -l || echo "No migration files found"
          echo ""
          echo ".down.sql files count:"
          ls -1 migrations/*.down.sql 2>/dev/null | wc -l || echo "No .down.sql files found"
          echo ""
          echo "atlas.sum line count:"
          wc -l migrations/atlas.sum || echo "atlas.sum not found"
          echo "::endgroup::"

      - name: Lint migrations (Atlas validation)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          echo "::group::Linting migrations"
          cd ${{ env.UNIQUE_WORKSPACE }}/backend

          # NOTE: Must include format=golang-migrate in --dir URL for .up/.down file support
          # Validates migration file integrity (checksums), SQL syntax, schema conflicts
          # Using absolute path ($PWD) to ensure proper resolution in unique workspace
          atlas migrate lint \
            --config file://atlas.hcl \
            --env local \
            --dir "file://$PWD/migrations?format=golang-migrate" \
            --latest 1

          echo "::notice::✅ Migration lint passed - no schema errors detected"
          echo "::endgroup::"

      - name: Run comprehensive migration tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          echo "::group::Comprehensive Migration Testing"
          cd ${{ env.UNIQUE_WORKSPACE }}

          # Make script executable
          chmod +x scripts/test-migrations.sh

          # Run comprehensive tests (idempotency, performance, data integrity, schema validation, rollback testing)
          ./scripts/test-migrations.sh

          if [ $? -ne 0 ]; then
            echo "::error::Migration tests failed - see output above for details"
            exit 1
          fi

          echo "::notice::✅ All migration tests passed (idempotency, performance, data integrity, schema constraints, rollback testing)"
          echo "::endgroup::"

      - name: Upload performance benchmarks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-performance-${{ github.run_id }}
          path: ${{ env.UNIQUE_WORKSPACE }}/migration-performance.json
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup PostgreSQL container
        if: always()
        run: |
          docker stop test-postgres-${{ github.run_id }} 2>/dev/null || true
          docker rm test-postgres-${{ github.run_id }} 2>/dev/null || true

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Security Scan - Dependencies & Dockerfiles (Parallelized)
  # =============================================================================
  security-scan:
    name: Security Scan (${{ matrix.component }})
    runs-on: [self-hosted, macOS, mac-mini]
    strategy:
      matrix:
        component: [backend, frontend]
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      UNIQUE_WORKSPACE: workspace-security-scan-${{ matrix.component }}-${{ github.run_id }}
      # Isolated Trivy installation per component (fixes race condition)
      TRIVY_TEMP_DIR: /tmp/trivy-${{ matrix.component }}-${{ github.run_id }}
      TRIVY_CACHE_DIR: /tmp/trivy-cache-${{ matrix.component }}-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Scan ${{ matrix.component }} dependencies (with retry)
        id: scan-deps
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-deps.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Wait before retry (exponential backoff)
        if: steps.scan-deps.outcome == 'failure'
        run: |
          echo "::warning::First scan attempt failed, waiting 10s before retry..."
          sleep 10

      - name: Retry dependency scan (attempt 2)
        if: steps.scan-deps.outcome == 'failure'
        id: scan-deps-retry1
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-deps.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Wait before final retry (exponential backoff)
        if: steps.scan-deps-retry1.outcome == 'failure'
        run: |
          echo "::warning::Second scan attempt failed, waiting 20s before final retry..."
          sleep 20

      - name: Retry dependency scan (attempt 3)
        if: steps.scan-deps-retry1.outcome == 'failure'
        id: scan-deps-retry2
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-deps.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Dependency scan error diagnostics
        if: failure()
        run: |
          echo "::group::Scan Diagnostics"
          echo "::error::All dependency scan attempts failed for ${{ matrix.component }}"
          echo "Troubleshooting steps:"
          echo "1. Check if Trivy cache is corrupted: rm -rf ${{ env.TRIVY_CACHE_DIR }}"
          echo "2. Verify network connectivity to vulnerability databases"
          echo "3. Check Mac Mini disk space: df -h"
          echo "4. Review Trivy logs above for specific errors"

          # Show system info
          echo ""
          echo "System diagnostics:"
          echo "Disk space: $(df -h / | tail -1)"
          echo "Temp dir: $(ls -la ${{ env.TRIVY_TEMP_DIR }} 2>&1 || echo 'not created')"
          echo "Cache dir: $(ls -la ${{ env.TRIVY_CACHE_DIR }} 2>&1 || echo 'not created')"
          echo "::endgroup::"

      - name: Upload ${{ matrix.component }} dependency scan results
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.component }}-deps.sarif'
          category: 'trivy-${{ matrix.component }}-dependencies'

      - name: Scan ${{ matrix.component }} Dockerfile (with retry)
        id: scan-dockerfile
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}/Dockerfile'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-dockerfile.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Wait before Dockerfile retry (exponential backoff)
        if: steps.scan-dockerfile.outcome == 'failure'
        run: |
          echo "::warning::First Dockerfile scan failed, waiting 10s before retry..."
          sleep 10

      - name: Retry Dockerfile scan (attempt 2)
        if: steps.scan-dockerfile.outcome == 'failure'
        id: scan-dockerfile-retry1
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}/Dockerfile'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-dockerfile.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Wait before final Dockerfile retry (exponential backoff)
        if: steps.scan-dockerfile-retry1.outcome == 'failure'
        run: |
          echo "::warning::Second Dockerfile scan failed, waiting 20s before final retry..."
          sleep 20

      - name: Retry Dockerfile scan (attempt 3)
        if: steps.scan-dockerfile-retry1.outcome == 'failure'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '${{ env.UNIQUE_WORKSPACE }}/${{ matrix.component }}/Dockerfile'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-dockerfile.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          cache: false
        env:
          TRIVY_TEMP_DIR: ${{ env.TRIVY_TEMP_DIR }}
          TRIVY_CACHE_DIR: ${{ env.TRIVY_CACHE_DIR }}

      - name: Upload ${{ matrix.component }} Dockerfile scan results
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.component }}-dockerfile.sarif'
          category: 'trivy-${{ matrix.component }}-dockerfile'

      - name: Cleanup Trivy temporary files
        if: always()
        run: |
          echo "::group::Cleanup Trivy Files"
          echo "Removing temporary Trivy directories for ${{ matrix.component }}..."
          rm -rf "${{ env.TRIVY_TEMP_DIR }}" 2>/dev/null || true
          rm -rf "${{ env.TRIVY_CACHE_DIR }}" 2>/dev/null || true
          echo "::notice::✅ Cleanup complete"
          echo "::endgroup::"

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true
