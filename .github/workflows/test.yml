name: Test Suite

# Trigger on pull requests only - quality gates before merge
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Detect Changes (determines which jobs to run based on file changes)
  # =============================================================================
  detect-changes:
    name: Detect Changes
    if: github.repository == 'BoostedBudget/BoostedBudget' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      migrations: ${{ steps.filter.outputs.migrations }}
      workflow: ${{ steps.filter.outputs.workflow }}
      mcp: ${{ steps.filter.outputs.mcp }}
      config: ${{ steps.filter.outputs.config }}
      deps: ${{ steps.filter.outputs.deps }}
      scanconfig: ${{ steps.filter.outputs.scanconfig }}
      posthog_contract: ${{ steps.filter.outputs.posthog_contract }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # NOTE: Workspace cleanup (used across all jobs):
      # Each job cleans before checkout to prevent permission issues on self-hosted runners.
      # This is critical for macOS runners where sudo access is required for cleanup.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
            frontend:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'scripts/**'
              - '.lighthouserc.js'
              - '.size-limit.json'
            api:
              - 'api/**'
              - 'api/openapi.yaml'
            migrations:
              - 'backend/migrations/**'
            workflow:
              - '.github/workflows/**'
            # The full source surface apps/mcp-server is built from. The API-client path is here,
            # not in `deps` below, because it is not a dependency-pin risk: apps/mcp-server/package.json
            # declares "@boostedbudget/api-client": "workspace:*", so packages/api-client IS MCP
            # source. Omitting it (#1464 U1a) meant a change confined to packages/api-client/ that
            # touched neither api/openapi.yaml nor bun.lock ran neither the MCP typecheck nor the
            # MCP integration tests. Keep this dependency-exact: unrelated workspace packages do
            # not affect the MCP build and must not consume the MCP runners.
            # Enforced row-by-row by scripts/check-mcp-job-triggers.py.
            mcp:
              - 'apps/mcp-server/**'
              - 'api/openapi.yaml'
              - 'packages/api-client/**'
            # Dedicated filter for the undici-pin risk (G5-11/#1464 review): the `frontend`
            # filter also matches apps/web/**, scripts/**, and packages/**, so wiring the MCP jobs to it (see
            # mcp-server-validate/mcp-server-integration below) made both run on essentially
            # every frontend PR — two extra jobs on the same 4-runner Mac Mini that hit ENOSPC
            # on 2026-08-04. The dependency-pin risk is narrow: only a change to root
            # package.json/bun.lock can move the undici version miniflare and the root
            # `overrides` both pin. This filter targets exactly that. It deliberately does NOT
            # carry workspace package paths — API-client source is matched by `mcp` above, and folding it
            # in here would make this filter's name and this comment describe less than it
            # matches (the same defect class #1464 U1a fixed in the conditions below).
            deps:
              - 'package.json'
              - 'bun.lock'
            # Dedicated filter rather than folding 'config/**' into `backend` above: the
            # `backend` filter fans out to OpenAPI/client generation, MCP validation,
            # integration tests, migration tests, and Docker scans — none of which a
            # tier-catalogue YAML edit needs. Routed only to the checks that actually load
            # config/*.yaml (currently: Backend Tests, which runs tier_config_test.go).
            config:
              - 'config/**'
            # The Grype scan below reads .grype.yaml, but until #1514's Phase 16 that file
            # matched no filter — so a PR that only edited it (adding an `ignore:` entry, say)
            # would skip the very job that consumes it. Not caught earlier because every PR
            # that has touched .grype.yaml so far also touched backend/**, which triggers the
            # job anyway. Kept separate from `backend` so a scan-config edit does not fan out
            # to OpenAPI generation, migrations and integration tests.
            scanconfig:
              - '.grype.yaml'
            posthog_contract:
              - 'config/posthog_events.yaml'
              - 'config/product_metrics.yaml'
              - 'config/posthog_rollout.yaml'
              - 'scripts/generate-posthog-events.ts'
              - 'scripts/generate-posthog-events.test.ts'
              - 'scripts/validate-posthog-rollout.ts'
              - 'scripts/validate-posthog-rollout.test.ts'
              - 'scripts/fixtures/posthog-events-v1.json'
              # The static raw-capture guard scans these complete production surfaces.
              - 'apps/web/src/**'
              - 'apps/mcp-server/src/**'
              - 'backend/internal/**'
              - 'backend/cmd/**'
              - 'package.json'
              - 'bun.lock'
              - 'Makefile'
              - '.github/workflows/test.yml'
            # Universal Expo application inputs. Keep this list dependency-exact: backend source
            # changes do not rebuild a client unless the generated OpenAPI contract changes, and
            # desktop-web/shared-types changes are outside the mobile workspace graph.
            # Root TypeScript configuration is included because API-client and design-token
            # workspace configs inherit from it.
            # scripts/check-mobile-ci.py evaluates the positive and negative path matrix and
            # rejects broad packages/**, backend/**, apps/web/**, api/**, or scripts/** globs.
            mobile:
              - 'apps/mobile/**'
              - 'packages/api-client/**'
              - 'packages/design-tokens/**'
              - 'api/openapi.yaml'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/workflows/test.yml'
              - '.github/dependabot.yml'
              - 'scripts/check-mobile-ci.py'
              - 'scripts/__tests__/check-mobile-ci.test.sh'

  posthog-contract-validate:
    name: PostHog Contract Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.posthog_contract == 'true'
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-posthog-contract-${{ github.run_id }}
    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install workspace dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bun install --frozen-lockfile
      - name: Validate PostHog contracts
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bun run validate:posthog
      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # E2E Tests (starts immediately — no needs — so it gets runner priority over
  # jobs that wait for detect-changes. Builds its own backend binary.)
  # =============================================================================
  e2e-test:
    name: E2E Tests
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # Least-privilege token, scoped to this job rather than the whole workflow (#1598). This is
    # one of only two jobs that now run on an ephemeral cloud VM, which is the entire reason the
    # restriction is worth stating -- and neither writes with GITHUB_TOKEN.
    #
    # ⚠ Declared PER JOB on purpose. A workflow-level block was tried first and broke
    # `detect-changes`: setting any `permissions:` drops every scope not listed, and
    # dorny/paths-filter calls the PR Files API, which needs `pull-requests: read`. It failed with
    # the generic "Resource not accessible by integration" -- naming neither the scope nor the
    # action -- and because 11 jobs are gated on detect-changes' outputs, that one failure cascaded
    # into skipping most of the matrix. Job-level scoping keeps a hardening change to the jobs it
    # was justified for, and matches this repo's existing convention (deploy-production.yml,
    # deploy-to-staging.yaml, cleanup-artifacts.yml all declare permissions per job).
    permissions:
      contents: read
    # ⚠⚠ READ THIS FIRST (#1598). Everything below was written about the self-hosted Mac Mini pool,
    # which this job NO LONGER RUNS ON. It is retained verbatim as history, not deleted, for two
    # reasons: the 45 was set by an explicit user authorisation that should not be quietly undone,
    # and there is not yet a single completed Ubicloud run to derive a replacement from. Deleting
    # the reasoning before its replacement exists would leave a bare number with no provenance at
    # all, which is worse than a number with stale provenance.
    #
    # What survives the move: nothing here is a MEASUREMENT of this job on Ubicloud. The 4.6-17.7
    # minute range, the 35 -> 45 override, the "quarter of the capacity" argument and the
    # #1489 host-load framing all describe a machine with four concurrent runners and 15GB of 16GB
    # used at idle. This job now gets a dedicated 2-vCPU VM to itself.
    #
    # What to do about it: after ~10 completed Ubicloud runs, re-derive this from the observed
    # maximum and REPLACE the block below, citing those runs. Until then 45 stands as an upper
    # bound that is certainly generous rather than a bound that is right. Tracked in #1598's
    # follow-up.
    #
    # ── History (Mac Mini pool, pre-#1598) ──────────────────────────────────────────────────────
    # Bound a wedged run. Without this the job inherits GitHub's 360-minute default, and this is a
    # SELF-HOSTED pool of four runners on one Mac Mini -- so one stuck E2E job can hold a quarter of
    # the capacity for six hours, slowing every sibling job and making the load-induced timeouts of
    # #1489 worse. That is not hypothetical: run 31137080868 sat in "Run E2E tests" for 47.6 minutes
    # before something killed it, while the same suite completes locally in 5.0 minutes.
    #
    # 35 is derived, not picked: across the last twelve runs on this branch, every E2E job that ran
    # its test step to completion took 4.6-17.7 minutes (the other entries are truncated by
    # superseding pushes, not natural durations). 35 is roughly 2x the observed maximum, so a
    # legitimately slow run still finishes while a wedge fails in well under an hour.
    #
    # ⚠⚠ RAISED 35 -> 45 ON 2026-09-01 BY EXPLICIT USER AUTHORISATION, overriding the paragraph
    # above, which still stands as the correct engineering position: a bigger number does not fix
    # #1489, it only stops this job from being the thing that reports it. Recorded here rather than
    # silently applied, because the previous sentence would otherwise read as a rule the file itself
    # ignores.
    # The override is grounded: the last three runs to reach the test step were killed AT the 35m cap
    # (36-37m elapsed) while still passing tests steadily -- test #402 passed 160ms before one kill --
    # so 35 now truncates healthy runs rather than catching wedges. The 4.6-17.7 minute range quoted
    # above predates the host-load regression and no longer describes this pool.
    # ⚠ 45 is NOT a new derived bound -- it is headroom bought while #1489 is unresolved. Do not
    # quote it as measured, and do not raise it again: the next increase is an admission that the
    # host cannot carry the matrix, which is #1489's actual subject.
    timeout-minutes: 45
    environment: e2e  # Access Clerk secrets from e2e environment

    # #1598. Postgres and both Redis instances are provisioned by Actions rather than by hand.
    # This replaced ~250 lines across this job and apps/web/scripts/e2e-postgres.sh: `docker run`
    # calls, 30-attempt health-poll loops, orphan reaping by run_id prefix, a `docker port`
    # read-back, a container watchdog, and retrying cleanup steps. GitHub health-gates these
    # before the first step runs and destroys them with the VM, so none of that machinery has
    # anything left to do.
    #
    # It also deletes three latent defects rather than fixing them, which is the better kind of
    # fix:
    #   - `docker port … | cut -d: -f2` assumed the IPv4 line comes first. On Linux `docker port`
    #     emits both `0.0.0.0:PORT` and `[::]:PORT` and the order is not contractual; if IPv6 led,
    #     the value became multi-line and $GITHUB_ENV rejects that with `Invalid format`.
    #   - a bare `-p 6379` let Docker choose the host port from its OWN allocator (default begin
    #     32768), which overlaps the top of the E2E port block at 32768-44999 — so a Redis
    #     container could squat a port find-available-ports.js was about to assign.
    #   - the same bare `-p` bound on every interface. Untidy on a LAN Mac Mini, wrong on a
    #     cloud VM.
    #
    # Images are digest-pinned. Ubicloud pools share a host IP, so Docker Hub's per-IP pull limit
    # is a live failure mode (Ubicloud disabled IPv6 on runner VMs over it), and a digest also
    # makes the pull reproducible. Credentials match e2e-postgres.sh's defaults (test/test/test)
    # so the CI and local paths describe the same database.
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432/tcp
        # 20 retries, not the 10 the Redis services use. `pg_isready` succeeding is NOT the same
        # as this Postgres being ready to serve: the official image's entrypoint restarts the
        # server after first-time initdb, so a probe can succeed against the instance that is
        # about to go away (diagnosed at apps/web/scripts/e2e-postgres.sh:183-196). This widens
        # the window; run-e2e-ci.sh closes it by opening a real connection before migrating.
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      cache_redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # A SEPARATE instance, not a second database on the first. The two roles have different
      # eviction semantics (the cache may evict, the rate limiter must not), and sharing one
      # server would let cache pressure silently drop rate-limit state.
      ratelimit_redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # No `sudo rm -rf` pre-clean and no `path:`/`clean: false` any more: those existed so four
      # runners sharing one Mac Mini could not stamp on each other's checkout. This VM is created
      # for this job and destroyed after it.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # #1598. This job moved from a hand-configured Mac Mini to an ephemeral Ubicloud VM, so
      # every tool it used to inherit from the host is now an assumption about a machine image --
      # and Ubicloud documents nothing about its image contents (it forks GitHub's packer
      # templates in ubicloud/runner-images). "Should match by inheritance, undocumented" is
      # exactly when you assert rather than hope.
      #
      # This checks CAPABILITY, not presence. `command -v sudo` says nothing about whether
      # `sudo -n` actually works, and a `docker` binary with an unusable daemon socket fails
      # twenty minutes later in a step that looks unrelated. PyYAML matters most: two of the
      # guard suites below import it, and without it they fail with a traceback that reads like a
      # defect in the guard rather than a missing package.
      - name: Preflight — required tooling
        run: |
          set -euo pipefail
          missing=""
          for tool in node python3 jq curl tar sha256sum git; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          python3 -c 'import yaml' 2>/dev/null || missing="$missing python3-yaml"
          sudo -n true 2>/dev/null || missing="$missing passwordless-sudo"
          if [ -n "$missing" ]; then
            echo "::error::this runner image cannot support the e2e-test job, missing:$missing"
            exit 1
          fi
          echo "arch=$(uname -m) nproc=$(nproc) mem=$(free -m | awk '/^Mem:/{print $2}')MB"
          echo "bash=$(bash --version | head -1)"

      # Regression suite for scripts/check-e2e-storage-state.py — the guard the "Guard — E2E
      # auth session must have been obtained" step below delegates to. Placed here, right
      # after checkout and before Bun/Playwright/Go setup, because this job (unlike the other
      # three jobs that host a shell-suite step) has no `needs: detect-changes` / paths-filter
      # gate at all (`if: always() && !cancelled()` only reacts to prior job outcomes, not to
      # changed paths) — it runs unconditionally on every ordinary PR, guaranteeing the fixture
      # suite executes even on a change confined to scripts/**. The suite itself is pure
      # Python/shell with no E2E/Playwright/browser dependency, so it does not need to wait for
      # any of the setup below. Was previously unwired from every runner — see the suite's own
      # header comment.
      - name: Test E2E storage-state guard
        run: bash scripts/__tests__/check-e2e-storage-state.test.sh

      # Truth table for the two MCP jobs' `if:` conditions (#1464 U1a). Hosted in this job for the
      # same reason as the suite above: of the jobs that host a shell-suite step, this is the one
      # with no `needs:`/paths-filter gate, so the guard runs even on a PR that changes only
      # .github/workflows/** — i.e. exactly the PR that can break it. (It is not the workflow's only
      # ungated job — detect-changes and security-scan are also unconditional — just the only
      # ungated one that already hosts suites like this.) Pure Python/YAML, no Playwright/browser
      # dependency, so it needs none of the setup below. The defect it exists to catch (a filter
      # reasoned about in isolation from the full boolean condition it feeds) shipped twice before
      # this guard existed.
      # Also covers the same suite's --deploy cases (#1484), which govern the `filter-mcp` steps in
      # deploy-production.yml / deploy-to-staging.yaml. Those two workflows never run their own CI
      # checks (they are workflow_dispatch deploys), so this is the ONLY place their MCP trigger
      # surface is validated — which is exactly why #1484 was originally deferred as unverifiable.
      - name: Test MCP job trigger truth table
        run: bash scripts/__tests__/check-mcp-job-triggers.test.sh

      # #1569 round 15 task 1. scripts/assert-no-ungated-migrate-down-invocation.sh was built on an
      # explicit user ruling — "make bypass structurally hard" — after the `migrate-reset`
      # disposability gate was defeated three separate ways in three rounds. It ran in NO CI job at
      # all: a new ungated `migrate ... down` could have been added anywhere in the tree and nothing
      # would have caught it. Its regression suite was likewise unrun.
      #
      # Hosted HERE, not in migration-tests, on purpose. The guard's candidate set is every tracked
      # *.sh, Makefile, workflow, Dockerfile and extensionless shell-shebang script in the tree (63
      # files today) — so a violation can be introduced in the root Makefile, infra/Dockerfile or
      # apps/web/scripts/*.sh, none of which match the `migrations`/`backend` paths-filters that gate
      # migration-tests and backend-test. A guard whose whole purpose is "structurally hard to
      # bypass" must not itself be bypassable by choosing which file you put the invocation in. This
      # job has no `needs:`/paths-filter gate at all (`if: always() && !cancelled()` reacts only to
      # prior job outcomes), so it runs on every PR — the same argument the two steps above make.
      # Both steps are pure shell against the checked-out tree: no Postgres, no `migrate` binary, no
      # browser, so they need none of the setup below and cost ~1s each on an already-loaded runner.
      #
      # Regression suite first (proves the guard itself can still reject a fixture), then the real
      # scan against this checked-out tree — the same two-step shape as the typographic-quote guard
      # in backend-test. The suite mutates tracked files in THIS WORKSPACE only and restores every
      # one through an explicit backup copy in its own EXIT trap (never `git stash`/`git checkout`).
      - name: Test ungated-migrate-down guard (#1569 regression suite)
        run: bash scripts/__tests__/no-ungated-migrate-down-invocation-guard.test.sh

      - name: Guard — no ungated 'migrate ... down' anywhere in the tree (#1569)
        run: bash scripts/assert-no-ungated-migrate-down-invocation.sh

      # #1569 round 17 task 1. Every step above, and the "whole-tree corpus guards" step further
      # down, is correct ONLY because this job has no `needs:`/paths-filter gate. That property is
      # load-bearing and invisible: adding `needs: detect-changes` and an `if:` here would silently
      # unwire five history/citation guards plus three shell guards, and every one of them would
      # keep passing locally. This checks it, naming the steps that depend on it.
      #
      # Regression suite first (proves the guard can still reject a gated fixture), then the real
      # scan — the same two-step shape as the three guards above. Pure Python against the
      # checked-out workflow file: no Go, no Bun, no browser, ~1s.
      - name: Test ungated-guard-step wiring guard (#1569 regression suite)
        run: bash scripts/__tests__/check-ungated-guard-steps.test.sh

      - name: Guard — whole-tree guard steps must live in an ungated job (#1569)
        run: python3 scripts/check-ungated-guard-steps.py

      # #1569 round 17 task 2. Unit suite for the history-foreign-key assertions that replaced
      # test_schema_constraints' three count floors in scripts/test-migrations.sh. Hosted HERE
      # rather than in migration-tests because that job is paths-gated on
      # `backend/migrations/**` / `backend/**` / `.github/workflows/**` — and this suite's corpus
      # is scripts/test-migrations.sh plus backend/internal/repository/history_cascade_guard_test.go,
      # so a change confined to scripts/** would not run it there. Pure shell against synthetic
      # fixtures and the real Go guard: no Postgres, no migrate binary, no browser, ~1s.
      - name: Test schema-constraint history-FK assertions (#1569)
        run: bash scripts/__tests__/schema-constraint-history-fks.test.sh

      # #1569 round 17 task 3. scripts/smoke-test.sh is the hard gate on real production and
      # staging deploys, and until this round it could not fail on a lost HTTPS redirect, absent
      # CORS, or an RFC 9728 OAuth `resource` mismatch. This suite runs the real script against a
      # stubbed curl and asserts both directions: the fatal checks exit non-zero, and the
      # unreliable-probe variant of each still exits 0 so a network flake cannot block a release.
      # Hosted HERE because its corpus spans scripts/**, .github/workflows/** (the deploy
      # workflows that invoke it) and apps/mcp-server/wrangler.toml, which no single paths filter
      # covers. No network, no Postgres, no Bun: ~1s.
      - name: Test smoke-test deploy-gate failure paths (#1569)
        run: bash scripts/__tests__/smoke-test-failure-paths.test.sh

      # #1598. Hosted here for the same reason as every guard above: this job has no
      # `needs:`/paths-filter gate (`if: always() && !cancelled()` reacts only to prior job
      # outcomes), so these run on EVERY pull request. Both are pure shell/Python against the
      # checked-out tree and cost ~1s each.
      #
      # Regression suite first (proves the guard can still reject a fixture), then the real scan
      # -- the same two-step shape as the guards above.
      #
      # check-portable-sed.sh in particular is load-bearing for THIS migration: the
      # ungated-migrate-down suite two steps up used BSD-only in-place sed at four sites, which
      # GNU sed rejects outright. It would have broken the moment this job moved to Linux while
      # still passing on every developer's Mac.
      - name: Test portable-sed guard (#1598 regression suite)
        run: bash scripts/__tests__/check-portable-sed.test.sh

      - name: Guard — no non-portable in-place sed in the tree (#1598)
        run: bash scripts/check-portable-sed.sh

      # #1625 cluster F. Hosted here rather than in a frontend job because it needs Docker (it
      # boots a real nginx against apps/web/nginx.conf) and this is the Linux runner that has it.
      # ⚠ #1625: this step is NOT gated on the frontend paths filter -- `e2e-test` carries
      # `if: always() && !cancelled()` and no `needs:`, so it runs on every PR unconditionally,
      # regardless of what changed. (An earlier version of this comment claimed the `frontend`
      # filter covered it; verified false -- there is no such gate on this job.) It is still
      # deliberately NOT in check-ungated-guard-steps.py's REQUIRED_UNGATED_STEPS, because that
      # list is for guards a paths filter fails to cover -- this one runs unconditionally, which is
      # a stronger guarantee than any filter would give it, not a hole.
      - name: Test nginx secret-path blocking (#1625 behavioural suite)
        run: bash scripts/__tests__/check-nginx-secret-paths.test.sh

      - name: Test runner-portability guard (#1598 regression suite)
        run: bash scripts/__tests__/check-runner-portability.test.sh

      - name: Guard — runner placement and Linux portability (#1598)
        run: python3 scripts/check-runner-portability.py

      - name: Test mobile CI and dependency-policy guard (#1654 regression suite)
        run: bash scripts/__tests__/check-mobile-ci.test.sh

      - name: Guard — mobile CI triggers and dependency policy (#1654)
        run: python3 scripts/check-mobile-ci.py

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Read from package.json's `packageManager` field (bun@1.3.14) rather than hardcoding a
          # version here or using `latest`, which is what this said before. `latest` made every
          # run's toolchain a moving target -- tolerable on a hand-maintained Mac, worse on an
          # ephemeral VM where nothing else is stable, and it silently contradicted the repo's own
          # pin.
          bun-version-file: package.json

      # run-e2e-with-ports.sh / run-e2e-ci.sh call `node` directly (find-available-ports.js), and
      # this job previously had no setup-node at all -- it inherited whatever node the Mac Mini
      # happened to have. On an ephemeral runner that is an unpinned dependency on the image.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # `cache:` intentionally LEFT UNSET, unlike setup-go's explicit `cache: false` below --
          # the two are not parallel. setup-go's `cache` input defaults to true and silently
          # caches GOMODCACHE under its own key if you don't turn it off; setup-node's `cache`
          # input only recognizes 'npm' | 'yarn' | 'pnpm' and does nothing (no caching, no error)
          # when omitted -- but passing the LITERAL boolean `false` serializes to the string
          # "false" over the Actions input protocol, which setup-node treats as an unrecognized
          # package manager and fails the step with "Caching for 'false' is not supported". This
          # repo uses bun, not any of the three, so its dependency cache is the explicit
          # `bun-store-*` actions/cache step above/below -- setup-node's own cache has nothing to
          # do here regardless of this input's value.

      # ── Caches ──────────────────────────────────────────────────────────────────────────────
      # Ephemeral runners start cold, so these are new with #1598. Every key carries
      # `runner.arch` as well as `runner.os`: `runner.os` is `Linux` on both amd64 and arm64, so
      # an os-only key would serve amd64 binaries to an arm64 runner the day someone tries one
      # (and Ubicloud does offer `-arm` labels).
      #
      # Keys must stay byte-identical to .github/workflows/warm-ci-cache.yml, which is the only
      # thing that writes them in the DEFAULT-BRANCH scope. This workflow is `on: pull_request`
      # only, and a cache written by a pull_request run is scoped to that PR -- so without that
      # companion workflow every new PR's first run is fully cold. If you change a key here,
      # change it there, and re-run the key-diff check in that file's header.
      - name: Restore Bun package store
        id: cache-bun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # setup-bun caches the bun EXECUTABLE, not the package store, so this is not a
          # duplicate of the action's own cache (verified in its action.yml at the pinned SHA).
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Install workspace dependencies
        id: install-deps
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        # Keyed on the RESOLVED Playwright version, not hashFiles('bun.lock'). The lockfile
        # changes on every Dependabot bump of any dependency, which would evict a still-valid
        # ~200MB browser set weekly for no reason. Read after `bun install`, since it comes from
        # the installed package.
        run: |
          set -euo pipefail
          version="$(node -p "require(require.resolve('@playwright/test/package.json', { paths: ['./apps/web'] })).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Playwright ${version}"

      - name: Restore Playwright browsers
        id: cache-playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # Exact match only, deliberately: no restore-keys. A fallback would hand this run a
          # DIFFERENT Playwright version's browsers, which is worse than downloading the right
          # ones -- the failure would surface as an inscrutable browser-launch error.
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # WebKit was previously installed by a SECOND step without `--with-deps`. That is a no-op on
      # macOS (no system deps to fetch), which is why the omission was invisible for so long; on
      # Linux it installs a browser that is present but cannot launch, and the `webkit-sticky`
      # project (apps/web/playwright.config.ts) would fail to start one at all.
      #
      # ⚠ UNCONDITIONAL, and it must stay that way. The tempting `if: cache-hit != 'true'` guard
      # is a bug: `--with-deps` installs apt packages that do NOT live in ~/.cache/ms-playwright,
      # so a browser-cache hit would skip them -- shipping a job that is green on its first run
      # and broken on every cached run afterwards.
      - name: Install Playwright browsers and OS dependencies
        id: install-playwright-browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # ⚠ EXPLICIT false, and it is NOT a no-op: this input DEFAULTS TO TRUE (verified in
          # action.yml at this pinned SHA). Left at the default, setup-go caches GOMODCACHE *and*
          # `go env GOCACHE` under its own key `setup-go-<os>-<arch>-go<ver>-<hash(go.sum)>`, in
          # addition to the two explicit caches below -- the same bytes moved twice, against
          # Ubicloud's 30 GB cache quota. And because that key hashes ONLY go.sum, every
          # run after the first save for a given go.sum is an exact hit, so its build-cache half
          # never absorbs newly-compiled packages. That is precisely the freeze this repo already
          # diagnosed for its own hand-rolled key at the "Save Go build cache" step in
          # backend-test ("the cache silently froze at whatever was compiled on that first run").
          cache: false
        # `go clean -cache` remains intentionally absent, but the reason has changed: it used to
        # be "destructive on a shared self-hosted runner when other jobs build concurrently".
        # Nothing is shared now -- it is simply pointless work on a VM that starts empty and is
        # destroyed after the job.

      # The job-local GOCACHE step that used to sit here is gone. Its entire rationale was
      # isolation from openapi-validate's CONCURRENT `go clean -cache` on the shared Mac Mini;
      # there are no concurrent jobs on this VM, so the Linux default (~/.cache/go-build) is
      # correct and is what the cache below stores.
      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Go build cache
        id: cache-go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          # A COMPILATION-INPUT hash, never github.sha. backend-test's "Save Go build cache" step
          # records why the github.sha version was itself a bug: it minted a new entry on every
          # commit, including ones that cannot change compiled output, evicting warm entries under
          # a capped quota. That argument survives the move to Ubicloud with different numbers --
          # Ubicloud's quota is 30 GB free PER REPOSITORY PER WEEK (a rolling write budget, not a
          # standing cap on total stored bytes, which is how an earlier version of these comments
          # described it), AND it evicts any entry unaccessed for 7 days. Measured from the
          # Ubicloud console on #1598: the four keys this branch writes occupy 848.8 MB (playwright
          # 363.7, bun-store 203.9, go-modules 156.1, gocache-e2e 125.0) -- well under the weekly
          # write budget, so THAT axis is not currently a concern. The 7-day eviction is the one
          # that matters here: it is why warm-ci-cache.yml's keys must stay byte-identical to
          # these (R9 in scripts/check-runner-portability.py) -- a quiet week ages an entry out,
          # and a mismatched key means the "warm" save never lands on the key a PR run restores,
          # so every run pays the cold-start cost regardless of how recently the warm job ran. A
          # per-commit key would also churn entries for no benefit, which is the actual argument
          # against `github.sha`.
          key: gocache-e2e-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', '**/go.sum', 'backend/testdata/**/*.json') }}
          restore-keys: |
            gocache-e2e-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
            gocache-e2e-${{ runner.os }}-${{ runner.arch }}-

      # ⚠ This build is REQUIRED, and that is a change from before #1598. The old path ran
      # run-e2e-with-ports.sh, which rebuilds bin/server unconditionally at its line 224 -- so
      # this step was pure duplicated work. run-e2e-ci.sh deliberately does NOT build (it assumes
      # services and a built binary), and Playwright's `webServer` command runs ./bin/server, so
      # this is now the only thing that produces it. Keeping the build here also means a compile
      # error reports as a build failure rather than as an inscrutable Playwright webServer
      # timeout.
      #
      # The `chmod +x` step that used to follow is gone: it was always dead, because `go build`
      # writes mode 0755.
      - name: Build backend binary
        id: build-backend
        working-directory: backend
        run: |
          mkdir -p bin
          go build -o bin/server ./cmd/server

      # #1569 round 17 task 1. FIVE Go guards scan corpora that live OUTSIDE the paths-filters of
      # the only job that ran them (backend-test, gated `backend || api || workflow || config`,
      # where `backend` is backend/**, go.mod, go.sum, scripts/**):
      #
      #   TestNoUnallowlistedFrontendFixtureHistoryDelete  scans apps/web/scripts/**
      #   TestMarkdownCitedTestNamesResolve                scans docs/** + root *.md
      #   TestMarkdownDecisionCrossReferencesResolve       scans docs/** + root *.md
      #   TestMarkdownCitedPathsResolve                    scans docs/** + root *.md
      #   TestCitedLineNumbersAreInRange                   adds docs/**, CLAUDE.md, apps/**, packages/**
      #
      # `apps/web/**` matches only the `frontend` filter and `docs/**` + root `*.md` match NO filter
      # at all, so a PR confined to any of those corpora skipped backend-test and ran none of them.
      # The severe case: an unallowlisted `DELETE FROM <history table>` added to
      # apps/web/scripts/seed-e2e-data.sql — a file deliberately brought INTO G4's universe in
      # #1569 task 7.9 — touched nothing the gate could see, so the guard never executed and the
      # delete shipped. A guard extension that cannot execute is indistinguishable from one that
      # was never written.
      #
      # Hosted HERE for the same reason as the three steps at the top of this job: e2e-test has no
      # `needs:`/paths-filter gate at all (`if: always() && !cancelled()` reacts only to prior job
      # outcomes), so it runs on EVERY pull request. That makes the trigger unconditional rather
      # than merely wider — there is no changed-path set that can evade it, which is strictly
      # stronger than adding `docs/**`/`apps/web/scripts/**` to backend-test's `if:`. It was chosen
      # over the two alternatives on cost: widening backend-test would run the entire -race +
      # coverage backend suite on every docs-only PR, and a dedicated job would take one of the
      # four self-hosted Mac Mini runner slots on every PR — the saturation that has already caused
      # job failures on this pool. This step takes a runner slot from nobody: it is ~15s appended to
      # a job that is already running, reusing the Go toolchain and GOCACHE set up just above for
      # the backend binary. The duplicate execution on backend PRs (backend-test runs `./...`) is
      # accepted as the price of an ungated trigger.
      #
      # ⚠ Whole packages, NOT `-run '<regex>'`: an `-run` pattern that matches nothing exits 0, so a
      # renamed test would silently turn this step into a no-op — the same "green but not running"
      # failure this step exists to fix. `internal/repository` additionally carries G1/G2/G4's other
      # halves and `internal/testsupport/citations` is entirely corpus guards, so nothing here is
      # off-topic. Kept BEFORE the E2E run so a corpus violation fails in seconds instead of after
      # a 15-minute browser suite.
      #
      # ⚠ The "this job is ungated" property this step depends on is itself enforced, by
      # scripts/check-ungated-guard-steps.py (run below, and by `make test-scripts`). Adding
      # `needs: detect-changes` + an `if:` to this job would otherwise silently unwire all five
      # guards again, which is exactly how they came to be unwired in the first place.
      - name: Guard — whole-tree corpus guards (#1569 R17 T1)
        working-directory: backend
        run: go test -count=1 ./internal/repository/ ./internal/testsupport/citations/

      - name: Install golang-migrate
        env:
          # #1514: pin to a specific release and verify the published checksum before
          # executing the binary — the previous `releases/latest` URL was mutable and
          # unverified.
          # #1598: the artefact and its checksum were darwin-arm64-only, verified with BSD
          # `shasum`. This job now runs on Linux amd64, so all three had to change. The checksum
          # was re-derived by DOWNLOADING THE FILE and hashing it, never by piping curl into a
          # hasher: `curl … | shasum -a 256` truncates (measured: 13,878 of 17,394,526 bytes) and
          # returns a stable but wrong digest, so a "correction" from that value would ship a pin
          # that fails here every time.
          MIGRATE_VERSION: v4.19.1
          MIGRATE_SHA256: 2ac648fbd1b127b69ab5a7b33cf96212178f71e22379fc50573630c6f4c7ce18
        run: |
          set -euo pipefail
          # $HOME/bin rather than /usr/local/bin: no sudo needed, and it is already on PATH via
          # $GITHUB_PATH below.
          mkdir -p "$HOME/bin"
          curl -sSfL -o migrate.tar.gz "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz"
          echo "${MIGRATE_SHA256}  migrate.tar.gz" | sha256sum -c -
          tar -xz -f migrate.tar.gz migrate
          rm -f migrate.tar.gz
          mv migrate "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/migrate" --version
      # #1598. Was ~88 lines of `docker pull` with retries, two `docker run`s with bare `-p 6379`,
      # a `docker port` read-back parsed with `cut -d: -f2`, and 30-attempt `redis-cli ping`
      # loops. All three containers are now Actions services (see the `services:` block above),
      # already health-gated before this step runs, so the only thing left to do is tell the app
      # where they are.
      #
      # `job.services.<id>.ports['<container-port>']` is the mapped host port. Reading it here
      # rather than parsing `docker port` is what removes the IPv4/IPv6 ordering bug described in
      # the services block.
      #
      # Two specs (cache-freshness.auth.spec.ts, cache-household-visibility.auth.spec.ts) hard-fail
      # unless the backend reports cache_enabled=true, which needs BOTH CACHE_ENABLED=true and a
      # CACHE_REDIS_URL that resolves to a working client -- hence both are set, here and on the
      # test step.
      - name: Export service URLs
        run: |
          set -euo pipefail
          # One grouped redirect rather than three appends (shellcheck SC2129).
          {
            echo "DATABASE_URL=postgres://test:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/test?sslmode=disable"
            echo "CACHE_REDIS_URL=redis://127.0.0.1:${{ job.services.cache_redis.ports['6379'] }}/0"
            echo "RATE_LIMIT_REDIS_URL=redis://127.0.0.1:${{ job.services.ratelimit_redis.ports['6379'] }}/0"
          } >> "$GITHUB_ENV"

      # psql is used by run-e2e-ci.sh to seed, and to open a real connection before migrating.
      # The old path reached the database with `docker cp` + `docker exec psql` against a
      # container it had named itself, which cannot address an Actions-managed service -- which is
      # precisely why the service container's name never has to be known here.
      - name: Install postgresql-client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # #1598, added after a Codex review of the migration commit flagged it. The E2E port block
      # runs to 44999 (apps/web/scripts/find-available-ports.js), and Linux's default
      # net.ipv4.ip_local_port_range starts at 32768 -- so the kernel can hand an OUTBOUND socket
      # a port in 32768-44999 in the window between find-available-ports.js probing it and
      # Playwright's webServer binding the backend to 0.0.0.0:<that port>
      # (backend/cmd/server/main.go:2606). The result is an intermittent, load-dependent
      # EADDRINUSE or webServer startup failure that reads as test flake rather than as a
      # port-allocation bug. This job makes plenty of outbound connections (Clerk, the staging MCP
      # worker, the Docker registry), so the window is not theoretical. macOS never had the
      # problem: its ephemeral floor is 49152, which is why the allocator's ceiling was chosen.
      #
      # ⚠ SCOPE, precisely. This controls KERNEL selection for outbound sockets, and nothing else.
      # It does NOT move Docker's own host-port allocator, which reads its range when `dockerd`
      # starts -- an earlier draft of this migration claimed it did, and that claim was wrong.
      # That no longer matters here: this job starts no containers of its own, and the Postgres and
      # Redis service containers are already started and bound before the first step runs, so
      # raising the floor afterwards cannot disturb them.
      #
      # Prevention rather than detection, deliberately. The local path guards this with an `lsof`
      # preflight (run-e2e-with-ports.sh:200-219), which run-e2e-ci.sh does not carry: moving the
      # range so the collision cannot occur is strictly better than racing to notice it, and
      # non-root `lsof` on Linux cannot see a root-owned listener anyway.
      - name: Raise kernel ephemeral port floor above the E2E port block
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_port_range="49152 60999"
          floor="$(sysctl -n net.ipv4.ip_local_port_range | awk '{print $1}')"
          # Assert the property, not the command: a sysctl that silently no-ops (a restricted
          # container, a changed key) must fail here rather than leave the hazard in place.
          [ "$floor" -gt 44999 ] || {
            echo "::error::kernel ephemeral floor is $floor, which still overlaps the E2E port block (max 44999)"
            exit 1
          }
          echo "ephemeral floor now $floor (E2E block ceiling 44999)"

      - name: Run E2E tests
        working-directory: apps/web
        env:
          CI: true
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TEST_CLERK_EMAIL: ${{ secrets.TEST_CLERK_EMAIL }}
          TEST_CLERK_PASSWORD: ${{ secrets.TEST_CLERK_PASSWORD }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          # #1531 Task 11e (fix round 1): real app config var names — see the "Start Redis
          # containers for E2E cache verification" step above for why this job (unlike
          # backend-integration-test) uses them directly. CACHE_ENABLED=true is the top-level
          # kill switch (config.go: default true, but explicit here so this job's intent is
          # never accidentally inherited from some other CACHE_ENABLED left in the runner's
          # environment) — cache.enabled on /api/v1/admin/system/health is false unless BOTH
          # this is true AND CACHE_REDIS_URL resolves to a working client.
          CACHE_ENABLED: "true"
          CACHE_REDIS_URL: ${{ env.CACHE_REDIS_URL }}
          RATE_LIMIT_REDIS_URL: ${{ env.RATE_LIMIT_REDIS_URL }}
        run: bash scripts/run-e2e-ci.sh

      # Issue #1437 (second half): a lost Clerk session must fail CI loudly, not pass
      # silently. e2e/auth.setup.ts calls setup.skip() whenever TEST_CLERK_EMAIL/
      # TEST_CLERK_PASSWORD are unset (e.g. a misconfigured `e2e` GitHub environment, a
      # renamed secret) — Playwright treats a skipped setup test as neither a pass nor a
      # failure, so `bun run test:e2e` above can exit 0 with every *.auth.spec.ts test
      # having silently run unauthenticated (or self-skipped), while the job shows green.
      # This is exactly the failure mode that let the react-router P0 (#1437) reach
      # staging undetected. Runs only when the E2E step above succeeded — if it already
      # failed, the job is already red and this adds nothing.
      #
      # Local dev is unaffected: this check lives in CI only. auth.setup.ts's skip() path
      # (and the no-auth spec subset it leaves runnable) is untouched.
      - name: Guard — E2E auth session must have been obtained
        working-directory: apps/web
        run: |
          AUTH_FILE="e2e/.auth/user.json"

          if [ ! -s "$AUTH_FILE" ]; then
            echo "::error::${AUTH_FILE} is missing or empty — the Clerk auth setup (e2e/auth.setup.ts) did not produce a session, most likely because TEST_CLERK_EMAIL/TEST_CLERK_PASSWORD were unset and auth.setup.ts called setup.skip(). Every *.auth.spec.ts test would then have run unauthenticated (or been skipped) while this job still reports green — see #1437."
            exit 1
          fi

          if ! grep -q '"cookies"' "$AUTH_FILE"; then
            echo "::error::${AUTH_FILE} exists but has no 'cookies' key — the storage state is malformed, so no real Clerk session was saved."
            exit 1
          fi

          # #1464 batch T2 (G5-13): the shape-validation logic below was extracted to
          # scripts/check-e2e-storage-state.py so scripts/__tests__/check-e2e-storage-state.test.sh
          # can exercise it against malformed-shape fixtures — CI previously only ever fed this
          # guard the real, valid storage-state file, so none of the malformed shapes it was
          # written to reject had ever actually been rejected by a test run. See that script's
          # module docstring for the two defect fixes it preserves (grep-based "name" counting,
          # and len()-on-any-type). Also wired into `make test-scripts`.
          #
          # jq is NOT unavailable here — deploy-qa.yml uses it unguarded at multiple sites on
          # this same [self-hosted, macOS, mac-mini] runner label, and deploy-production.yml /
          # deploy-to-staging.yaml use `jq -r`. python3 is used instead simply for consistency
          # with the skip-ceiling guard below, which already parses Playwright's JSON report
          # the same way — not because jq is unproven on this runner.
          python3 "$GITHUB_WORKSPACE/scripts/check-e2e-storage-state.py" "$AUTH_FILE"

      # Issue #1437 (defect b): the auth guard above only proves *a* session was obtained — it
      # says nothing about how many tests actually ran. #1437's real failure mode was a total
      # runtime break where every *.auth.spec.ts test silently skipped while CI stayed green;
      # a skip-count ceiling catches that shape of failure even when the auth guard above
      # passes cleanly.
      #
      # Ceiling derivation. MEASURED FROM A REAL FULL RUN, 2026-08-02: 281 passed, 0 failed,
      # 134 skipped, 2 flaky (stats.skipped = 134, executed = 283 in results.json). Ceiling 140
      # — 6 of headroom over 134, and far below the ~400 that would show as skipped under a
      # #1437-style total breakage. (An earlier draft of this comment said "Ceiling 150"; the
      # step below enforces 140 — 150 was considered and deliberately rejected as too loose,
      # since the guard sees only aggregate counts and no planned work adds new E2E skips, so
      # any margin above the measured 134 beyond a small buffer would be invented, not derived.)
      #
      # Do NOT re-derive this from `playwright test --list`. That was tried first and gave 122
      # (119 statically-known skips — test.describe.skip, test.fixme(title, fn), describe-body
      # test.skip(cond) — plus 3 tests that call test.skip() dynamically on TEST_CLERK_EMAIL_2,
      # which this workflow never sets). The real number is 134, so the static approach
      # undercounts by 12: --list cannot see runtime skip decisions, and enumerating the
      # dynamic ones by grep missed some. A ceiling set from 122 would have looked comfortable
      # while sitting only a few tests above the true baseline.
      #
      # If this trips on an otherwise-green run, re-measure the same way — a full local run via
      # `bash scripts/run-e2e-with-ports.sh`, then read stats.skipped from
      # playwright-report/results.json — and work out whether the rise is a real regression
      # before raising the number. Bumping it without that is how this guard becomes decorative.
      # Reads playwright-config's already-configured `json` reporter
      # (playwright.config.ts: ['json', { outputFile: 'playwright-report/results.json' }])
      # rather than grepping the `list` reporter's stdout. Structured output is immune to ANSI
      # colour codes and to Playwright changing its human-readable summary wording, and — the
      # reason it matters here — it lets this guard FAIL CLOSED. A stdout grep that stops
      # matching yields an empty string, which defaults to 0 and makes the guard silently
      # report "verified"; that is the same false-confidence shape as the cookie-count defect
      # fixed in the step above, and it would sit inside the very guard meant to catch it.
      - name: Guard — E2E skipped-test count must not exceed ceiling
        working-directory: apps/web
        run: |
          RESULTS="playwright-report/results.json"
          if [ ! -s "$RESULTS" ]; then
            echo "::error::${RESULTS} is missing or empty — the json reporter should always emit it, so this guard cannot verify anything. Do not delete this check; fix the reporter."
            exit 1
          fi

          # Two thresholds, because they catch different regressions:
          #   ceiling 140  — measured 134 skipped, so 6 of headroom (was 150, i.e. 16: a real
          #                  regression of up to 16 newly-skipping tests slipped through silently).
          #   floor   260  — measured 283 executed. Catches a COLLECTION regression, which the
          #                  ceiling structurally cannot: if a testMatch/testDir/project-config
          #                  change stops tests being collected at all, `skipped` stays ≈134 while
          #                  `executed` collapses — and the run reports green. playwright.config.ts
          #                  keys six testMatch regexes off filename suffixes, so a rename doing
          #                  exactly this is realistic.
          python3 - "$RESULTS" 140 260 <<'PY'
          import json, sys

          path, ceiling, floor = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          try:
              stats = json.load(open(path)).get("stats")
          except (ValueError, OSError) as exc:
              print(f"::error::could not parse {path}: {exc}")
              sys.exit(1)

          if not isinstance(stats, dict) or "skipped" not in stats:
              print(f"::error::{path} has no stats.skipped — Playwright's JSON reporter shape changed, so this guard can no longer verify anything. Fix the guard rather than deleting it.")
              sys.exit(1)

          skipped = stats["skipped"]
          executed = stats.get("expected", 0) + stats.get("unexpected", 0) + stats.get("flaky", 0)

          # The #1437 shape directly: a run where essentially nothing executed. Checked
          # separately from the ceiling because a suite that skips everything and a suite that
          # skips nothing-but-runs-nothing both need to be red, and only one of them trips a
          # skip ceiling.
          if executed == 0:
              print(f"::error::Playwright executed 0 tests ({skipped} skipped). This is exactly the failure mode that let the #1437 P0 reach staging while CI stayed green.")
              sys.exit(1)

          if skipped > ceiling:
              print(f"::error::{skipped} E2E tests skipped, exceeding the ceiling of {ceiling} ({executed} executed). Investigate before assuming this is fine — see the derivation comment above.")
              sys.exit(1)

          # The collection-regression guard. Deliberately separate from `executed == 0`: that only
          # catches a total wipeout, and from the ceiling: a suite can stop COLLECTING most of its
          # tests while the skip count barely moves, which trips neither of the other two.
          if executed < floor:
              print(f"::error::only {executed} E2E tests executed, below the floor of {floor} ({skipped} skipped). The skip count alone would not reveal this — tests appear to have stopped being COLLECTED rather than skipped. Check playwright.config.ts's testMatch/testDir and project definitions before adjusting this number.")
              sys.exit(1)

          print(f"E2E counts verified: {skipped} skipped (ceiling {ceiling}), {executed} executed (floor {floor})")
          PY

      - name: Upload E2E test results
        id: upload-playwright-report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-report/
          retention-days: 1
          if-no-files-found: warn

      - name: Report if E2E report upload failed
        if: steps.upload-playwright-report.outcome == 'failure'
        run: echo "::warning::E2E test report upload failed (storage quota/network). Test results valid."

      - name: Upload E2E test videos (on failure)
        id: upload-playwright-videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: playwright-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: warn

      - name: Report if E2E videos upload failed
        if: steps.upload-playwright-videos.outcome == 'failure'
        run: echo "::warning::E2E videos upload failed (storage quota/network). Test results valid."

      # ── Cache saves (#1598) ─────────────────────────────────────────────────────────────────
      # Three guards on every one of these, each for a different reason:
      #
      #   `if: ${{ !cancelled() }}` -- NOT `always()`. `always()` also fires on CANCELLATION, and
      #     cancellation is this job's normal recent outcome: all eleven of its most recent runs
      #     on the Mac pool ended `cancelled`. On a billed ephemeral runner that means paying to
      #     upload a cache built by a job that was killed mid-compile, then paying again to
      #     download it into the next run.
      #
      #   `&& steps.<producer>.outcome == 'success'` (#1598 G10) -- `!cancelled()` ALONE still lets
      #     a FAILED producer's save run: a step that errors out (a broken lockfile, a Playwright
      #     install that dies partway through OS deps, a Go compile failure) is neither cancelled
      #     nor skipped, so without this the save step still executes and uploads whatever partial
      #     or empty directory the failed step left behind. Cache entries are IMMUTABLE -- once a
      #     key exists, no later successful run can overwrite it, only wait ~7 days for it to age
      #     out on its own -- and this repo has Ubicloud shared-branch caching enabled, so a
      #     poisoned entry written on one branch is served to EVERY branch that restores the same
      #     key, not just the one that produced it. Each save below is therefore gated on the
      #     specific step that actually populates its cached path having `outcome == 'success'`,
      #     not merely on the job not having been cancelled.
      #
      #   `continue-on-error: true` -- actions/cache/save fails outright if its exact key already
      #     exists, which is EXPECTED on a rerun of the same commit, or on a second commit that
      #     changes no cached input. That must not redden the job; a persistent failure (a real
      #     quota or network problem) still surfaces as a workflow warning rather than silence.
      #     Kept even after adding the producer-outcome check above: colliding with an existing key
      #     is a normal rerun, not evidence the producer is unhealthy, and the two failure modes
      #     must stay distinguishable.
      #
      # Deliberately NOT guarded on `steps.<id>.outputs.cache-hit != 'true'`: `cache-hit` is true
      # only on an EXACT primary-key match, so guarding a save on it freezes the entry at
      # whatever the first save contained. backend-test's "Save Go build cache" step documents
      # that bug at length; do not reintroduce it here.
      - name: Save Bun package store
        if: ${{ !cancelled() && steps.install-deps.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Save Playwright browsers
        if: ${{ !cancelled() && steps.install-playwright-browsers.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Go modules AND Go build cache are both gated on "Build backend binary", not on a
      # dedicated `go mod download` step -- this job has none. `go build` resolves and downloads
      # any missing modules into ~/go/pkg/mod before it compiles, and it is also the first Go
      # invocation in the job (it runs before the "Guard -- whole-tree corpus guards" `go test`
      # step further down), so it is the step that actually populates both cached paths for a run
      # starting cold. If it fails -- a broken go.sum, a network failure resolving a module, a
      # real compile error -- neither cache should be trusted as complete.
      - name: Save Go modules cache
        if: ${{ !cancelled() && steps.build-backend.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}

      - name: Save Go build cache
        if: ${{ !cancelled() && steps.build-backend.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: gocache-e2e-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', '**/go.sum', 'backend/testdata/**/*.json') }}
  openapi-validate:
    name: OpenAPI Spec Validation
    needs: detect-changes
    # Also run on `api` changes so a hand-edited / stale api/openapi.yaml is re-validated
    # against the backend (the spec must always match the Huma routes — #1247).
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-openapi-validate-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
        # Note: go clean -cache is intentionally omitted — it is destructive on
        # a shared self-hosted runner when other jobs build concurrently.

      - name: Configure job-local Go build cache
        # runner context is unavailable in job-level env blocks (GitHub Actions limitation),
        # so we export GOCACHE here where $RUNNER_TEMP is a real shell variable. Replaces
        # the previous "go clean -cache" step: that wiped the SHARED default
        # ~/Library/Caches/go-build out from under any other job building concurrently on
        # this runner (root cause of intermittent "no such file or directory" import
        # failures elsewhere, e.g. e2e-test). A fresh, job-unique GOCACHE needs no cleaning.
        run: echo "GOCACHE=$RUNNER_TEMP/gocache-openapi" >> "$GITHUB_ENV"

      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          # Key: go-modules-<os>-go<version>-<sum-hash>
          key: go-modules-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-modules-${{ runner.os }}-

      - name: Download Go dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go mod download

      - name: Generate OpenAPI spec
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go run scripts/generate-openapi/main.go

      - name: Check if spec is up to date
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          if git diff --exit-code api/openapi.yaml; then
            echo "::notice::OpenAPI spec is up to date"
          else
            echo "::error::OpenAPI spec is outdated!"
            echo "The generated spec differs from the committed version."
            echo "Run 'make generate-openapi' locally and commit the changes."
            echo ""
            echo "Diff (first 100 lines):"
            git diff api/openapi.yaml | head -100
            exit 1
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # TypeScript Client Validation (ensures generated client is committed)
  # =============================================================================
  typescript-client-validate:
    name: TypeScript Client Validation
    needs: [detect-changes, openapi-validate]
    if: |
      always() &&
      (needs.detect-changes.outputs.api == 'true' ||
       needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-ts-client-validate-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npx orval)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install workspace dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        # Bun handles workspace:* protocol, npm doesn't
        run: bun install

      - name: Generate TypeScript client
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/packages/api-client
        # Use npx orval (not bunx) - Bun's AJV version has compatibility issues.
        # Then normalize output exactly as `make generate-api-client` does: orval appends
        # trailing blank lines and the committed client is the normalized form, so checking
        # the raw output here fails against a correctly generated tree.
        run: |
          npx orval
          node scripts/normalize-generated-output.mjs

      - name: Check if generated client is up to date
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          if git diff --exit-code packages/api-client/src; then
            echo "::notice::Generated TypeScript client is up to date"
          else
            echo "::error::Generated TypeScript client is outdated!"
            echo "The generated client differs from the committed version."
            echo "Run 'make generate-api-client' locally and commit the changes."
            echo ""
            echo "Diff (first 100 lines):"
            git diff packages/api-client/src | head -100
            exit 1
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # MCP Server Validation (Issue #1087: manifest completeness + anti-bypass)
  # =============================================================================
  mcp-server-validate:
    name: MCP Server Validation
    needs: [detect-changes, openapi-validate]
    # DO NOT hand-reason about this condition one output at a time — that is exactly how the
    # #1464 U1a defect was introduced. scripts/check-mcp-job-triggers.py holds the path ->
    # expected-jobs truth table and evaluates it against this whole expression; change either and
    # run it (`make test-scripts`, or the step in e2e-test).
    #
    # `deps` (originally `frontend`, G5-11; narrowed #1464): miniflare (which backs
    # @cloudflare/vitest-pool-workers, used by mcp-server-integration below) pins undici
    # exactly, while root package.json's `overrides` force a different undici version to
    # clear a HIGH advisory — a regression there is only actually exercised by the MCP
    # suites. `frontend` covered root package.json/bun.lock but also apps/web/** and
    # scripts/**, so both MCP jobs ran on nearly every frontend PR — two extra jobs on the
    # same 4-runner Mac Mini that hit ENOSPC on 2026-08-04. `deps` matches only root
    # package.json/bun.lock, the actual pin risk; real MCP source surface (including
    # packages/api-client/**) is covered by the `mcp` filter instead.
    #
    # `backend` is deliberately NOT OR'd in (#1464 U1a). It matched scripts/**, so a
    # script-only PR still launched both MCP jobs and the load reduction above never actually
    # happened for script changes.
    #
    # Dropping it loses no coverage, and the decisive reason is what these two jobs DO, not what the
    # backend means: neither job builds or runs the backend — no Go toolchain, no Postgres service,
    # nothing but bun/vitest against apps/mcp-server. So backend source cannot change either job's
    # outcome except through a generated artefact, and both generated artefacts are drift-checked and
    # OR'd in here: api/openapi.yaml (regenerated + `git diff --exit-code` by openapi-validate, a
    # `needs:` of this job, which itself runs on backend||api||workflow) matches the `api` filter,
    # and packages/api-client/src (regenerated + diffed by typescript-client-validate) matches the
    # `mcp` filter. A committed contract change therefore always trips one of them.
    #
    # What this argument does NOT claim: backend changes cannot affect the MCP server at all. They
    # obviously can at RUNTIME — the worker calls the API, so changed error bodies, auth handling or
    # pagination defaults reach it. That risk belongs to the backend's own suites and to staging, not
    # to a CI job that never starts the backend.
    if: |
      always() &&
      (needs.detect-changes.outputs.mcp == 'true' ||
       needs.detect-changes.outputs.api == 'true' ||
       needs.detect-changes.outputs.deps == 'true' ||
       needs.detect-changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-mcp-validate-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install MCP server dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun install --frozen-lockfile

      - name: Run MCP server unit tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        # timeout lives in apps/mcp-server/package.json — single source of truth.
        #
        # Output is tee'd so the count guard below can read bun's summary. `set -o pipefail` keeps
        # bun's own exit code authoritative through the pipe — without it `tee` would mask a real
        # test failure, which would be a strictly worse regression than the one the guard prevents.
        # The log is removed first: this is a self-hosted runner, so nothing here is guaranteed
        # to start empty, and a guard that verified a PREVIOUS run's summary would be worse than
        # no guard at all.
        #
        # Nothing is stamped into the log to identify the suite. An earlier version wrote
        # GUARD_SUITE_CWD/GUARD_SUITE_PKG lines and the guard required them; that is attack surface
        # without provenance — anything able to write the log can write the stamp, and a fabricated
        # log carrying the right stamp plus a matching 22-file summary was ACCEPTED at 600 tests.
        # What actually ties the log to this suite is the file-count cross-check in the guard below,
        # which is enumerated from apps/mcp-server/src at run time and cannot be pre-fabricated.
        run: |
          set -o pipefail
          LOG="${{ runner.temp }}/mcp-unit-test-output.log"
          rm -f "$LOG"
          bun run test 2>&1 | tee "$LOG"

      # Issue #1537: this job had NO coverage or count gate of any kind, so a test FILE that stops
      # being collected — a rename, a moved directory, a `src/` layout change that slips past the
      # `bun test ... src/` glob in apps/mcp-server/package.json — simply reports fewer tests and
      # stays green. That is the same COLLECTION-regression shape the E2E job's `executed < floor`
      # guard was written for (see the derivation comment on that step); this job just never had
      # the equivalent.
      #
      # Floor derivation. MEASURED 2026-08-21 on bun 1.3.14: `bun run test` reports
      # "293 pass / 0 fail" and "Ran 293 tests across 22 files." Floor 270 — 23 of headroom, ~7.8%,
      # matching the headroom the E2E guard carries (260 against a measured 283, ~8.1%). Raise the
      # floor when the suite grows substantially; do NOT lower it to make a red run green without
      # first establishing WHY fewer tests ran.
      #
      # HOW TO CHANGE THE FLOOR when tests are legitimately DELETED. This is a real, expected
      # maintenance action, not a defect: deleting a 30-case file drops the count to 263, the floor
      # holds at 270, and the guard goes red saying tests "stopped being COLLECTED". That is the
      # floor working — a floor that moved on its own would catch nothing — but the fix must be a
      # deliberate edit, not a mystery. Procedure:
      #   1. Confirm the reduction is intended: the cases were REMOVED in this change, not silently
      #      dropped from collection (`git log -p` the test files; compare the file list the
      #      cross-check below prints against the previous run's).
      #   2. Re-measure locally: `cd apps/mcp-server && bun run test`, read "N pass".
      #   3. Set the floor to roughly N minus 8% and update the MEASURED line above with the new
      #      number and date, in the SAME commit as the deletion so review sees both together.
      # The `270` case floor and the `22` FILE floor both live on the `python3 - "$LOG" 270 22`
      # line below — that is the only place to edit either. The file floor's own maintenance rules
      # are on the FILE_FLOOR block inside the script; the two floors are tuned independently.
      #
      # Counts executed test CASES, not files, on purpose. A file count cannot see `it.skip`
      # spreading through a file, and it cannot see a single file losing half its cases; both leave
      # the file count untouched. `executed = pass + fail` — skipped cases are by definition not
      # executed, so counting them would let the floor be satisfied by tests that ran nothing.
      #
      # ⚠ HONEST LIMIT of the 270 case floor: its 23 cases of headroom are also 23 cases of
      # TOLERATED genuine loss. A single `if (false) it(...)`, a `describe.skip` over a handful of
      # cases, or one small file losing its assertions drops the executed count by less than 23 and
      # the gate stays green — the file count is untouched, so the cross-check and the FILE_FLOOR
      # below see nothing either. That is ACCEPTED HEADROOM, not a bug to chase: a zero-headroom
      # case floor would go red on every ordinary refactor that merges or reshapes cases, and a
      # floor that is edited every week stops being read. The gate catches a whole file leaving the
      # suite (exactly, via FILE_FLOOR and the equality cross-check) and catches large-scale case
      # loss (via 270). It does NOT catch a handful of cases quietly switching themselves off.
      # This paragraph exists so the file says that plainly instead of implying a tighter gate.
      #
      # FAILS CLOSED. If the summary cannot be parsed at all the guard exits non-zero rather than
      # defaulting to 0-or-pass. An unparseable summary must never read as a pass: that is the same
      # false-confidence shape the E2E storage-state guard was fixed for, and it would sit inside
      # the very check meant to catch silent loss.
      - name: Guard — MCP unit suite must execute at least the floor of test cases
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: |
          # Kept OUTSIDE the checkout: an untracked file in the workspace is exactly the kind of
          # thing a later `git diff` drift check trips over, and this job runs one.
          LOG="${{ runner.temp }}/mcp-unit-test-output.log"
          if [ ! -s "$LOG" ]; then
            echo "::error::${LOG} is missing or empty — the step above always tees bun's output to it, so this guard cannot verify anything. Fix that step rather than deleting this check."
            exit 1
          fi

          python3 - "$LOG" 270 22 <<'PY'
          import os, re, sys

          path, floor, file_floor = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          raw = open(path, encoding="utf-8", errors="replace").read()

          # Strip ANSI SGR codes before matching: bun colourises its summary when it thinks it has a
          # TTY, and a colour-blind regex is exactly how a guard starts silently matching nothing.
          text = re.sub(r"\x1b\[[0-9;]*m", "", raw)

          def tail(n=20):
              return "\n".join(text.splitlines()[-n:])

          # Each `bun test` PROCESS emits exactly one of each of these lines. Requiring exactly one
          # is what makes the guard safe against counting the wrong suite: run from the repo root
          # instead of apps/mcp-server, `bun run test` resolves to the ROOT package.json and goes
          # through turbo, which runs every workspace's tests and emits several such blocks with
          # `@boostedbudget/web:test:` prefixes. Taking the last match there would silently measure
          # the frontend suite against the MCP floor. Observed while testing this guard, hence the
          # explicit count check rather than a `findall()[-1]`.
          def counts(word):
              return [int(m) for m in
                      re.findall(rf"^\s*(\d+)\s+{word}\b", text, re.M)]

          ran = re.findall(r"Ran\s+(\d+)\s+tests?\s+across\s+(\d+)\s+files?", text)
          passes, fails, skips = counts("pass"), counts("fail"), counts("skip")

          if len(ran) != 1 or len(passes) != 1 or len(fails) != 1:
              print(f"::error::{path} does not contain exactly one bun test summary "
                    f"(found {len(ran)} 'Ran N tests' lines, {len(passes)} 'N pass', "
                    f"{len(fails)} 'N fail'). Either bun's output format changed, or this ran "
                    f"somewhere other than apps/mcp-server and picked up other workspaces' suites "
                    f"via turbo. Either way the count cannot be trusted, so this guard refuses to "
                    f"report a pass. Fix the step or the parser — do not delete the guard.")
              print("--- last 20 lines of the log ---")
              print(tail())
              sys.exit(1)

          # ── Every test FILE on disk must have been collected ────────────────────────────────
          # A per-file collection gate, and the only thing tying this log to THIS suite now that the
          # forgeable GUARD_SUITE_* stamp is gone: bun's "across N files" must equal the number of
          # test files that actually exist under this directory's src/. Enumerated from disk, so it
          # needs no maintenance — but it also means a foreign log has to match apps/mcp-server's
          # exact file count, and a file that stops being collected (a rename into a name bun's glob
          # misses, a moved directory) fails HERE even when the surviving files still clear the
          # case floor.
          # MEASURED on bun 1.3.14: "across N files" counts every matched file, including one whose
          # tests are all `it.skip` and one that is empty — so equality is the right relation.
          #
          # Equality ALONE is not enough, which is why FILE_FLOOR follows it. Equality compares two
          # numbers that move TOGETHER: rename a test file out of the recognised suffix set —
          # `src/index.test.ts` -> `src/index-checks.ts` — and bun stops collecting it AND the walk
          # below stops counting it. MEASURED 2026-08-21: 293/22 becomes 292/21, the two still
          # agree, 292 still clears 270, and the gate reports a pass with a whole test file gone
          # from the suite. Renaming the 19-case src/sandbox/host-proxy.test.ts the same way gave
          # 274/21 — also green. The absolute floor below is the only thing that sees that.
          stems = ("test", "spec")
          exts = ("js", "jsx", "ts", "tsx", "mjs", "cjs", "mts", "cts")
          suffixes = tuple(f"{sep}{stem}.{ext}"
                           for sep in (".", "_") for stem in stems for ext in exts)
          on_disk = []
          for root, dirs, names in os.walk("src"):
              dirs[:] = [d for d in dirs if d != "node_modules"]
              on_disk += [os.path.join(root, n) for n in names if n.endswith(suffixes)]

          if not on_disk:
              print(f"::error::no test files found under {os.path.abspath('src')} — this guard "
                    f"cannot cross-check bun's file count against anything, so it refuses to "
                    f"report a pass. Is the working-directory right?")
              sys.exit(1)

          # PINNED floor on the NUMBER of test files. HARD-CODED ON PURPOSE, and this is the whole
          # point: the only job this number has is to NOTICE that the count went down, so it can
          # never be derived from the current count. A floor computed at run time from the same walk
          # it is checking would be circular — it would equal the count every single time, including
          # the run where a file vanished, and would report a pass forever. The pinned literal is a
          # record of what a HUMAN last confirmed, which is the only thing a drop can be measured
          # against. (Local precedent: scripts/__tests__/check-isolated-test-lists.test.sh pins its
          # 22 isolated paths the same way, for the same reason.)
          #
          # MEASURED 2026-08-21 on bun 1.3.14: 22 test files under apps/mcp-server/src. Floor 22 —
          # ZERO headroom, deliberately. Any headroom here would defeat the check outright, because
          # the failure being guarded against is losing ONE file; a floor of 21 would wave through
          # exactly the regression this was added for. Adding test files only raises the real count,
          # so this stays green as the suite grows and never needs a raise for growth.
          #
          # RE-TUNE BY HAND when a test file is DELETED OR MERGED ON PURPOSE. It will go red, and
          # that is correct — a floor that moved on its own would catch nothing. Procedure: confirm
          # the file was removed in this change rather than silently dropped from collection (check
          # `git log -p` / `git status` for a rename into a name the `bun test ... src/` glob misses
          # and the suffix list above does not match), then set this literal to the new count and
          # update the MEASURED line, in the SAME commit as the deletion so review sees both.
          # The literal lives in the `python3 - "$LOG" 270 22` invocation above.
          if len(on_disk) < file_floor:
              print(f"::error::only {len(on_disk)} test files exist under {os.path.abspath('src')}, "
                    f"below the pinned floor of {file_floor}. A test file has LEFT THE SUITE. Note "
                    f"that bun's 'across N files' count agrees with this number, so the cross-check "
                    f"below cannot see this on its own — a test file renamed out of the recognised "
                    f"suffix set stops being collected AND stops being counted. Check recent renames "
                    f"and moves. If the removal was intentional, re-pin this floor by hand (see the "
                    f"comment above this check). Files on disk:")
              for f in sorted(on_disk):
                  print(f"  {f}")
              sys.exit(1)

          ran_files = int(ran[0][1])
          if ran_files != len(on_disk):
              print(f"::error::bun reported 'across {ran_files} files' but {len(on_disk)} test "
                    f"files exist under {os.path.abspath('src')}. Either this log is not from the "
                    f"MCP suite, or {abs(len(on_disk) - ran_files)} file(s) stopped being COLLECTED "
                    f"by the `bun test ... src/` glob in apps/mcp-server/package.json. Files on "
                    f"disk:")
              for f in sorted(on_disk):
                  print(f"  {f}")
              print("--- last 20 lines of the log ---")
              print(tail())
              sys.exit(1)

          passed, failed = passes[0], fails[0]
          skipped = skips[0] if len(skips) == 1 else 0
          executed = passed + failed
          ran_desc = f", bun reported 'Ran {ran[0][0]} tests across {ran[0][1]} files'"

          if executed == 0:
              print(f"::error::the MCP unit suite executed 0 test cases{ran_desc}. Nothing was "
                    f"verified, yet the suite would otherwise report green.")
              sys.exit(1)

          if executed < floor:
              print(f"::error::only {executed} MCP unit test cases executed ({passed} pass, "
                    f"{failed} fail, {skipped if skipped is not None else 0} skip), below the floor "
                    f"of {floor}{ran_desc}. Tests appear to have stopped being COLLECTED. Check the "
                    f"`bun test ... src/` glob in apps/mcp-server/package.json and any recent file "
                    f"moves or renames before adjusting this number.")
              sys.exit(1)

          print(f"MCP unit counts verified: {executed} test cases executed (floor {floor}) — "
                f"{passed} pass, {failed} fail, {skipped if skipped is not None else 0} skip{ran_desc}")
          PY

      # #1569 task 7.1: same shape as the frontend-test job above — each of the checks below is
      # INDEPENDENT of the "Guard — MCP unit suite" step and of each other (none consumes another's
      # output), so each gets `if: always() && !cancelled()` so one early failure cannot hide the
      # rest. The job still goes red overall because a failing step fails the job regardless of
      # `if:`.
      - name: Typecheck MCP server
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        # Uses --skipLibCheck to avoid OOM from large generated api-client type declarations.
        run: NODE_OPTIONS=--max-old-space-size=2048 bun run typecheck

      - name: Lint MCP server
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run lint

      - name: Check manifest completeness (deny-by-default CI gate)
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run scripts/check-manifest-completeness.ts

      - name: Check no direct API call bypasses
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: bun run scripts/check-no-direct-api-calls.ts

      - name: Rebuild spec index and check for drift
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: |
          bun run src/spec/index-builder.ts
          if git diff --exit-code src/spec/generated/spec-index.json; then
            echo "::notice::MCP spec index is up to date"
          else
            echo "::error::MCP spec index is outdated! Run 'bun run src/spec/index-builder.ts' and commit."
            exit 1
          fi

      - name: Rebuild facade and check for drift
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: |
          bun run scripts/generate-facade.ts
          if git diff --exit-code src/client/generated/facade.ts; then
            echo "::notice::MCP client facade is up to date"
          else
            echo "::error::MCP client facade is outdated! Run 'bun run scripts/generate-facade.ts' and commit."
            exit 1
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # MCP Server Integration Tests (Issue #1222: vitest-pool-workers runtime tests)
  # =============================================================================
  mcp-server-integration:
    name: MCP Server Integration Tests
    needs: [detect-changes, openapi-validate]
    # Condition is identical to mcp-server-validate's — see that job's comment for the `deps`,
    # `mcp`/packages/api-client/**, and dropped-`backend` rationale, and for the truth-table guard that
    # enforces both jobs. This is the job that actually exercises
    # miniflare/@cloudflare/vitest-pool-workers and their pinned undici.
    if: |
      always() &&
      (needs.detect-changes.outputs.mcp == 'true' ||
       needs.detect-changes.outputs.api == 'true' ||
       needs.detect-changes.outputs.deps == 'true' ||
       needs.detect-changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-mcp-integration-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies (from root for workspace bin symlinks)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bun install --frozen-lockfile

      - name: Ensure workspace vitest binary exists
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        run: |
          # vitest MUST run from the workspace-level binary (node_modules/.bin/vitest
          # using a RELATIVE symlink through node_modules/vitest/) so Node.js resolves
          # @cloudflare/vitest-pool-workers from apps/mcp-server/node_modules/ —
          # not from the bun cache's nested node_modules (which has no exports and
          # breaks the pool workers plugin). Root bun install creates this on bun 1.3+;
          # we create it explicitly here for older bun versions.
          if [ ! -f node_modules/.bin/vitest ]; then
            mkdir -p node_modules/.bin
            # Ensure workspace vitest package symlink exists.
            # IMPORTANT: symlink targets are relative to the symlink's location
            # (node_modules/), NOT to the CWD (apps/mcp-server/).
            # From node_modules/:  ../   = apps/mcp-server/
            #                      ../../ = apps/
            #                      ../../../ = repo root  ← correct
            # So the target must be ../../../node_modules/vitest (3 levels up).
            if [ ! -e node_modules/vitest ] && [ -d ../../node_modules/vitest ]; then
              ln -sf ../../../node_modules/vitest node_modules/vitest
              echo "Created node_modules/vitest -> ../../../node_modules/vitest"
            fi
            # Find the vitest binary entry from package.json (bin.vitest field) and
            # create a RELATIVE symlink. Using relative path keeps __dirname inside
            # node_modules/vitest/ so @cloudflare/vitest-pool-workers resolves correctly.
            if [ -e node_modules/vitest/package.json ]; then
              VITEST_BIN=$(node -e "
                try {
                  const pkg = JSON.parse(require('fs').readFileSync('node_modules/vitest/package.json','utf8'));
                  const b = typeof pkg.bin === 'string' ? pkg.bin : (pkg.bin && pkg.bin.vitest);
                  if (b) process.stdout.write(b.replace(/^\.\//,''));
                } catch(e) { process.stderr.write(String(e)); }
              " 2>/dev/null)
              if [ -n "$VITEST_BIN" ] && [ -e "node_modules/vitest/$VITEST_BIN" ]; then
                ln -sf "../vitest/$VITEST_BIN" node_modules/.bin/vitest
                echo "Created node_modules/.bin/vitest -> ../vitest/$VITEST_BIN"
              else
                echo "ERROR: vitest bin '$VITEST_BIN' not found in node_modules/vitest/"
                ls node_modules/vitest/ | head -20
                exit 1
              fi
            else
              echo "ERROR: node_modules/vitest/package.json missing — install may have failed"
              exit 1
            fi
          fi
          ls -la node_modules/.bin/vitest

      - name: Run MCP integration tests (all, --no-isolate --max-workers=1)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/mcp-server
        # All tests run in a single workerd process to prevent "Failed to start
        # cloudflare-pool worker" / TCP.onStreamRead failures caused by the CI runner
        # failing to start multiple simultaneous workerd JIT-compilation sessions.
        run: bun run test:integration

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Backend Tests (runs in parallel with frontend)
  # =============================================================================
  backend-test:
    name: Backend Tests
    needs: detect-changes
    # config == 'true': a config/subscription_tiers*.yaml-only edit doesn't touch backend/**,
    # but tier_config_test.go (part of `go test ./...` below) is what actually validates the
    # catalogues — see the `config` filter's own comment above for why this isn't folded into
    # the `backend` condition instead.
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.workflow == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-backend-test-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
        # Note: go clean -cache is intentionally omitted — it is destructive on
        # a shared self-hosted runner when other jobs build concurrently.

      - name: Configure job-local Go build cache
        # runner context is unavailable in job-level env blocks (GitHub Actions limitation),
        # so we export GOCACHE here where $RUNNER_TEMP is a real shell variable. Replaces
        # the previous "Clean Go toolchain cache" step: that step's `go clean -cache` wiped
        # the SHARED default ~/Library/Caches/go-build out from under any other job building
        # concurrently on this runner — the actual root cause of the intermittent "no such
        # file or directory" import corruption previously attributed to "stale toolchain
        # data" (it was cross-job cache races, not a Go 1.25 bug). A fresh, job-unique
        # GOCACHE needs no cleaning and can't be raced by (or race) sibling jobs.
        run: echo "GOCACHE=$RUNNER_TEMP/gocache-backend-test" >> "$GITHUB_ENV"

      - name: Restore Go build cache
        # Keyed distinctly from backend-integration-test's build cache below: this job
        # compiles WITHOUT -tags integration, so the two jobs' compiled test binaries
        # (and therefore build cache contents) differ. Sharing one key would race on
        # save and each job would poison the other's cache. GOCACHE itself stays
        # job-local (see step above) — only its contents are persisted across runs.
        #
        # Primary key is a Go SOURCE hash, not github.sha (#1446 follow-up G4 used
        # github.sha; this is the Codex review fix for that): keying on the commit SHA
        # made EVERY commit — including doc-only or workflow-only ones, which cannot
        # change compiled output — mint a brand-new cache entry. Under GitHub's 10GB
        # per-repository cache cap, that churn can evict a still-warm entry and silently
        # turn a later, genuinely-unrelated build cold. The key hashes Go source, go.mod,
        # go.sum AND the JSON that backend/testdata/plaid/fixtures.go go:embeds — embedded
        # assets are compilation inputs but are not .go files, so a *.go-only hash would let
        # a fixture change restore a stale cache (found in round 3). This is what #1446
        # originally asked for ("GOCACHE keyed by go.sum + a source hash").
        # restore-keys still falls back to the most recent cache for this Go version (any
        # source hash), then to the most recent cache for this OS at all, so a commit that
        # DOES change Go source still gets a warm (if imperfect) starting cache rather than
        # a fully cold one.
        id: cache-go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.GOCACHE }}
          key: gocache-backend-test-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', '**/go.sum', 'backend/testdata/**/*.json') }}
          restore-keys: |
            gocache-backend-test-${{ runner.os }}-go${{ env.GO_VERSION }}-
            gocache-backend-test-${{ runner.os }}-

      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-modules-${{ runner.os }}-

      - name: Download Go dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go mod download

      - name: Run Go tests with coverage
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          # -coverpkg scopes the denominator to real testable packages only.
          # cmd/server, cmd/encrypt-migrate, scripts/generate-openapi are entrypoints
          # with no unit tests; including them at 0% drags the total unfairly.
          # cmd/plaid_validation/validators IS real logic and IS included.
          #
          # -timeout 20m is EXPLICIT, and that is the point. This step previously ran with
          # Go's DEFAULT 10m per package -- a limit nobody chose. #1569 round 18: the
          # internal/repository package hit 602s and was killed by it. That package is
          # dominated by the ~30 mechanical guards, which walk and parse the whole tree;
          # it takes ~85s locally under -race, so CI on this loaded four-runner pool is
          # ~7x slower, and the accumulated guard runtime finally crossed the default.
          #
          # ⚠ This is NOT the same call as e2e-test's timeout-minutes (45 since 2026-09-01,
          # 35 before that). That one was DERIVED from twelve observed runs, then raised by
          # explicit authorisation once the derivation stopped describing the host; its own
          # comment still says raising it is the wrong answer to #1489. This one replaces an
          # unexamined default with a stated bound -- a different act from either.
          # ⚠ If 20m starts firing, do NOT raise it again -- the guards' runtime is the
          # real signal, and the fix is to make them cheaper or move them to their own job.
          go test -v -race -timeout 20m \
            -coverprofile=coverage.out -covermode=atomic \
            -coverpkg=./internal/...,./cmd/plaid_validation/validators/... \
            ./...

      - name: Check Go coverage threshold (≥74%)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          echo "::group::Checking coverage threshold"
          # Delegates to scripts/check-coverage.sh for decimal-safe comparison.
          # Threshold history: 60% → 69% (#1286 scope fix) → 73% (#1286 test campaign) → 74% (#1286 B4 gap-fill)
          bash ${{ github.workspace }}/${{ env.UNIQUE_WORKSPACE }}/scripts/check-coverage.sh \
            coverage.out \
            74
          echo "::endgroup::"

      - name: Generate Go coverage HTML report
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload backend coverage report
        id: upload-backend-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: backend-coverage-${{ github.run_id }}
          path: |
            ${{ env.UNIQUE_WORKSPACE }}/backend/coverage.out
            ${{ env.UNIQUE_WORKSPACE }}/backend/coverage.html
          retention-days: 1
          if-no-files-found: warn

      - name: Report if backend coverage upload failed
        if: steps.upload-backend-coverage.outcome == 'failure'
        run: echo "::warning::Backend coverage upload failed (storage quota/network). Test results valid."

      - name: Save Go modules cache
        if: always() && steps.cache-go-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}

      - name: Save Go build cache
        # G4 fix: the old guard (`if: ... && steps.cache-go-build.outputs.cache-hit != 'true'`)
        # was wrong. `cache-hit` is true ONLY on an exact primary-key match — and since the old
        # key was scoped to just go.sum (which rarely changes while source changes on every
        # commit), the first successful save for a given go.sum made every later run on that
        # same go.sum hit exactly and skip this save, forever. The cache silently froze at
        # whatever was compiled on that first run and never absorbed newly-compiled first-party
        # packages from later commits — most of the intended speedup was lost with the job still
        # reporting a "warm" cache.
        #
        # The key above is now a compilation-input hash (Go source, go.mod, go.sum, embedded JSON),
        # not github.sha — see the "Restore Go build cache" step above for why the earlier
        # github.sha-keyed version (#1446 follow-up G4) was itself a bug: it minted a new cache
        # entry on EVERY commit, including ones that cannot change compiled output, and could
        # evict warm entries under GitHub's per-repository cache cap. This save step now only
        # produces a genuinely new entry when Go source or go.sum actually changed.
        # `continue-on-error: true` guards the one collision that can still happen:
        # actions/cache/save fails outright if its exact key already exists — expected on a
        # re-run of the SAME commit (retried job, manual re-run), or now also on a second commit
        # that changes non-Go files only (same source hash as the prior save). That failure is
        # harmless — the prior save is still valid — so it must not redden the job; a failure
        # here still surfaces as a workflow warning annotation (not a job failure), so a
        # PERSISTENT save failure (e.g. a real quota/network problem, not just a key collision)
        # remains visible rather than being fully silent.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.GOCACHE }}
          key: gocache-backend-test-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', '**/go.sum', 'backend/testdata/**/*.json') }}

      # #1487: `gofmt -w` rewrites the byte sequence '' into U+201D (and `` into
      # U+201C) inside Go doc comments, silently corrupting SQL documentation.
      # It cannot reach production behaviour (string literals are untouched),
      # but nothing else in this pipeline flags it — the code still compiles
      # and every test still passes. This is deliberately NOT `gofmt -l`: after
      # the #1487 repair, the corrected files are exactly the ones `gofmt -l`
      # wants to change back (confirmed: `gofmt -l backend/internal/repository/
      # analytics_repository.go` lists that already-fixed file), so using the
      # formatter as the guard would forbid the fixed state. See
      # scripts/check-typographic-quotes.sh's own header for the full argument.
      #
      # Regression suite first (proves the guard itself can still reject a
      # fixture), then the real scan against this checked-out tree.
      - name: Test typographic-quote guard (#1487 regression suite)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-typographic-quotes.test.sh

      - name: Guard — no U+201C/U+201D in tracked backend/*.go files (#1487)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/check-typographic-quotes.sh

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Backend Integration Tests (real PostgreSQL, //go:build integration)
  # Runs in parallel with backend-test — only needs detect-changes.
  # Spins up its own ephemeral Postgres 17 with a dynamically-assigned host
  # port so it never clashes with the migration-tests job on the shared runner.
  # =============================================================================
  backend-integration-test:
    name: Backend Integration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    # This job is COMPILE-bound, not test-bound. The integration tests themselves run in
    # ~8s against a warm local Postgres; the "Run integration tests" step spends almost all
    # its time compiling every package's test binary with -tags integration from the
    # job-local Go build cache configured below (deliberately job-local, to avoid
    # cross-job contamination on the shared self-hosted runner). That compile time grows
    # with the codebase: measured 9m24s → 11m12s → >15m over three days of #1413 work,
    # which is what pushed it past the previous 15m limit.
    # Raised to 25m as an unblock. #1446 added a persisted job-local GOCACHE (restore/save
    # steps below, keyed separately from backend-test's since compile flags differ), so
    # warm runs should compile much faster now. Re-measure actual wall-clock time across a
    # few real CI runs before lowering this — don't drop it back to 15m without that data.
    # #1531 Task 11e: raised 25m -> 30m. Compile time is unaffected (the Task 11b-d integration
    # files already existed and were already compiled by this job before this change — they just
    # silently t.Skip'd at runtime for lack of a real Redis). What changes here is that those
    # tests — the full cache-parity harness (4 suites) and the fail-safe suite (FLUSHDB, eviction,
    # 50x50 concurrency under -race, bump-failure) — now actually EXECUTE for the first time, plus
    # two new `docker run`/health-wait blocks for the Redis containers below. All of that measured
    # low single-digit seconds locally (see task-11e-report.md); the 5m margin is headroom for a
    # cold `docker pull redis:7-alpine` on a runner that hasn't cached the image yet, not because
    # execution time is expected to meaningfully grow. Re-measure across real CI runs before
    # lowering, same as the note above.
    #
    # ⚠ RAISED 30 -> 45 ON 2026-09-01, same user authorisation as e2e-test above, and this one is
    # measurement-driven rather than a concession: on run 33466644820 this job SUCCEEDED at 27m
    # against the 30m cap -- three minutes of headroom -- and on the immediately preceding run it was
    # cancelled at 32m under host load. A job that passes at 27/30 is one slow dependency pull away
    # from a false red that looks like a test failure.
    timeout-minutes: 45
    env:
      UNIQUE_WORKSPACE: workspace-backend-integration-test-${{ github.run_id }}
      # Container names are unique per run AND per rerun attempt, so a killed
      # prior attempt can never collide with this one.
      PG_CONTAINER: test-postgres-integ-${{ github.run_id }}-${{ github.run_attempt }}
      # #1531 Task 11e: two SEPARATE disposable Redis containers — one standing in for the app's
      # cache backend, one for the rate-limit backend — exported as REDIS_TEST_URL /
      # CACHE_REDIS_TEST_URL (see cachetest.ConnectTestRedis / redisclient's client_integration_test.go
      # / ratelimitstore's redis_backend_integration_test.go). Deliberately two containers, not one
      # shared instance: the fail-safe suite's FLUSHDB/eviction tests use their own fully disposable
      # StartRedisContainer instances per-test anyway, but ConnectTestRedis-based parity tests share
      # whichever single instance CACHE_REDIS_TEST_URL points at across the whole run, and giving
      # cache and rate-limit tests independent instances keeps them from stepping on each other's
      # keys/memory pressure.
      CACHE_REDIS_CONTAINER: test-redis-cache-integ-${{ github.run_id }}-${{ github.run_attempt }}
      RATELIMIT_REDIS_CONTAINER: test-redis-ratelimit-integ-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      # #1569 round 15 task 1. Round 14 added two pieces of anti-vacuity tooling —
      # scripts/check-ci-env-drift.sh and scripts/summarize-go-test.sh — after a real regression hid
      # for two rounds inside 30 integration tests that t.Skip()'d silently for want of
      # CACHE_REDIS_TEST_URL/REDIS_TEST_URL. Both had falsification suites; neither suite ran in any
      # CI job, because they were reachable only through `make test-scripts`, which no job invokes.
      # The things that exist to stop a silent-skip regression were themselves unrun.
      #
      # Filed in THIS job because this is the job they are about: check-ci-env-drift.sh derives its
      # list of load-bearing vars by parsing this job's own "Guard — DATABASE_URL,
      # CACHE_REDIS_TEST_URL, REDIS_TEST_URL must be set" step out of this file, so the suite is a
      # real cross-file guard on the workflow, not just on the script — renaming or restructuring
      # that step turns five of its seven cases red. This job's `if:` covers both inputs the suite
      # depends on (`backend` matches scripts/**; `workflow` matches .github/workflows/**).
      #
      # Runs before "Set up Go" deliberately: it is pure shell + awk over a YAML file and needs no
      # toolchain, so it reports a drifted guard step in seconds rather than after the Go module
      # download. It sets its own env vars per case under `env -i`, so it neither reads nor depends
      # on this job's DATABASE_URL/Redis URLs, and it starts nothing.
      - name: Test CI-env-drift checker (#1569 falsification suite)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-ci-env-drift.test.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
        # Note: go clean -cache is intentionally omitted — it is destructive on
        # a shared self-hosted runner when backend-test runs concurrently.

      # Sibling of the step above, and the reason it is on THIS side of "Set up Go": this suite
      # drives scripts/summarize-go-test.sh against a throwaway two-file Go module in a temp dir
      # (module github.com/example/summarizetestfixture — never the backend module), so it needs a
      # Go toolchain. It runs in well under a second, touches no database and no network, and
      # asserts the wrapper really does tally PASS/FAIL/SKIP so a skipped test can never read as an
      # indistinguishable clean `ok`. #1569 round 15 task 1 also made its "go not on PATH" branch
      # fail closed when $CI is set, so wiring it here cannot degrade into a step that silently
      # exits 0. #1652 G22 extended it to cover the second false-green: a Go BUILD failure emits a
      # package-level `FAIL <pkg> [build failed]` line and never a `--- FAIL:` line, so the old
      # summary printed PASS=0 FAIL=0 SKIP=0 at a non-zero exit. The suite now asserts the summary
      # surfaces PKG_FAIL and a warning for that case, and that a clean run reports PKG_FAIL=0.
      - name: Test go-test skip summarizer (#1569 falsification suite)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/summarize-go-test.test.sh

      # Sibling of the step above and on this side of "Set up Go" for the same reason: it drives
      # scripts/check-coverage.sh against synthetic coverage profiles in a temp dir and needs a Go
      # toolchain for `go tool cover`. No database, no network, well under a second.
      #
      # Deliberately NOT added to check-ungated-guard-steps.py's REQUIRED_UNGATED_STEPS. That list
      # is for guards whose subject no paths filter covers; this suite's subject is
      # scripts/check-coverage.sh, and `scripts/**` IS in the `backend` filter (detect-changes,
      # filters: backend), which is exactly what gates this job. Being gated here is correct, not
      # a hole — the same reasoning that keeps the summarizer suite above off that list.
      #
      # Like its sibling, its "go not on PATH" branch fails closed when $CI is set, so wiring it
      # here cannot degrade into a step that silently exits 0.
      - name: Test backend coverage-gate diagnostics (#1622 falsification suite)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-coverage.test.sh

      - name: Configure job-local Go build cache
        # runner context is unavailable in job-level env blocks (GitHub Actions limitation),
        # so we export GOCACHE here where $RUNNER_TEMP is a real shell variable.
        # This isolates this job's build cache from backend-test's concurrent go clean -cache.
        run: echo "GOCACHE=$RUNNER_TEMP/gocache-integ" >> "$GITHUB_ENV"

      - name: Restore Go build cache
        # Keyed distinctly from backend-test's build cache above: this job compiles
        # WITH -tags integration, so the two jobs' compiled test binaries (and therefore
        # build cache contents) differ. Sharing one key would race on save and each job
        # would poison the other's cache. GOCACHE itself stays job-local (see step
        # above) — only its contents are persisted across runs. This is the #1446 fix:
        # the "Run integration tests" step below is compile-bound (see timeout-minutes
        # comment), and a warm GOCACHE should cut most of that time.
        #
        # Primary key is a Go SOURCE hash, not github.sha (G4 follow-up used github.sha;
        # this is the Codex review fix for that — see the "Save Go build cache" step
        # below for the full rationale, identical to backend-test's above): keying on
        # the commit SHA minted a brand-new cache entry on every commit, including
        # doc-only/workflow-only ones that cannot change compiled output, risking
        # eviction of a still-warm entry under GitHub's 10GB per-repository cache cap.
        # restore-keys still falls back to the most recent cache for this Go version
        # (any source hash), then to the most recent cache for this OS at all, so a
        # commit that DOES change Go source still gets a warm (if imperfect) cache.
        id: cache-go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.GOCACHE }}
          key: gocache-backend-integration-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', '**/go.sum', 'backend/testdata/**/*.json') }}
          restore-keys: |
            gocache-backend-integration-${{ runner.os }}-go${{ env.GO_VERSION }}-
            gocache-backend-integration-${{ runner.os }}-

      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-modules-${{ runner.os }}-

      - name: Download Go dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: go mod download

      - name: Start PostgreSQL container (dynamic port)
        run: |
          # Reap orphans from ANY prior attempt of this run (different run_attempt suffix).
          # The container name is unique per run_id+run_attempt, so a hard-killed prior
          # attempt leaves its container behind with a different suffix. Filter by run_id
          # prefix so we never touch a concurrent other-PR container.
          postgres_orphans=$(docker ps -aq --filter "name=test-postgres-integ-${{ github.run_id }}-" 2>/dev/null || true)
          if [ -n "$postgres_orphans" ]; then
            while IFS= read -r container; do [ -z "$container" ] || docker rm -f "$container" 2>/dev/null || true; done <<< "$postgres_orphans"
          fi
          # Also reap the exact name in case a prior step already set the container.
          docker rm -f ${{ env.PG_CONTAINER }} 2>/dev/null || true

          echo "Pulling PostgreSQL image..."
          for i in 1 2 3; do
            docker pull postgres:17 && break || {
              echo "Pull attempt $i/3 failed"
              [ $i -lt 3 ] && sleep 10
            }
          done

          # -p 5432 (no host side) lets Docker pick any free port — prevents
          # clashes with the migration-tests job running on the same runner.
          docker run -d \
            --name ${{ env.PG_CONTAINER }} \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -p 5432 \
            --memory=512m \
            --shm-size=256m \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:17

          # Discover the OS-assigned host port.
          sleep 2
          POSTGRES_PORT=$(docker port ${{ env.PG_CONTAINER }} 5432 | cut -d: -f2)
          echo "PostgreSQL running on dynamically assigned port: $POSTGRES_PORT"

          echo "POSTGRES_PORT=$POSTGRES_PORT" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://test:test@localhost:$POSTGRES_PORT/test?sslmode=disable" >> $GITHUB_ENV

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec ${{ env.PG_CONTAINER }} pg_isready -U test > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Timeout waiting for PostgreSQL to start"
              exit 1
            fi
            sleep 1
          done

      - name: Start Redis containers (dynamic ports)
        run: |
          # #1531 Task 11e: mirrors "Start PostgreSQL container (dynamic port)" above —
          # same reap-orphans / dynamic-host-port / health-wait shape, same rationale.
          # Two independent containers (see the CACHE_REDIS_CONTAINER / RATELIMIT_REDIS_CONTAINER
          # env comment above for why two, not one).
          cache_orphans=$(docker ps -aq --filter "name=test-redis-cache-integ-${{ github.run_id }}-" 2>/dev/null || true)
          if [ -n "$cache_orphans" ]; then
            while IFS= read -r container; do [ -z "$container" ] || docker rm -f "$container" 2>/dev/null || true; done <<< "$cache_orphans"
          fi
          ratelimit_orphans=$(docker ps -aq --filter "name=test-redis-ratelimit-integ-${{ github.run_id }}-" 2>/dev/null || true)
          if [ -n "$ratelimit_orphans" ]; then
            while IFS= read -r container; do [ -z "$container" ] || docker rm -f "$container" 2>/dev/null || true; done <<< "$ratelimit_orphans"
          fi
          docker rm -f ${{ env.CACHE_REDIS_CONTAINER }} 2>/dev/null || true
          docker rm -f ${{ env.RATELIMIT_REDIS_CONTAINER }} 2>/dev/null || true

          echo "Pulling Redis image..."
          for i in 1 2 3; do
            docker pull redis:7-alpine && break || {
              echo "Pull attempt $i/3 failed"
              [ $i -lt 3 ] && sleep 10
            }
          done

          # -p 6379 (no host side) lets Docker pick a free port for each — same reason
          # as Postgres above: avoids clashing with any other job/container on the runner.
          docker run -d \
            --name ${{ env.CACHE_REDIS_CONTAINER }} \
            -p 6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 10 \
            redis:7-alpine

          docker run -d \
            --name ${{ env.RATELIMIT_REDIS_CONTAINER }} \
            -p 6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 10 \
            redis:7-alpine

          sleep 2
          CACHE_REDIS_PORT=$(docker port ${{ env.CACHE_REDIS_CONTAINER }} 6379 | cut -d: -f2)
          RATELIMIT_REDIS_PORT=$(docker port ${{ env.RATELIMIT_REDIS_CONTAINER }} 6379 | cut -d: -f2)
          echo "Cache Redis running on dynamically assigned port: $CACHE_REDIS_PORT"
          echo "Rate-limit Redis running on dynamically assigned port: $RATELIMIT_REDIS_PORT"

          # Deliberately NOT the app's own CACHE_REDIS_URL / RATE_LIMIT_REDIS_URL — those would
          # leak into every config.Load() unit test on this runner and silently change what they
          # assert. See cachetest/redis.go and redisclient/client_integration_test.go doc comments.
          echo "CACHE_REDIS_TEST_URL=redis://localhost:$CACHE_REDIS_PORT/0" >> $GITHUB_ENV
          echo "REDIS_TEST_URL=redis://localhost:$RATELIMIT_REDIS_PORT/0" >> $GITHUB_ENV

          echo "Waiting for cache Redis to be ready..."
          for i in {1..30}; do
            if docker exec ${{ env.CACHE_REDIS_CONTAINER }} redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Cache Redis is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Timeout waiting for cache Redis to start"
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for rate-limit Redis to be ready..."
          for i in {1..30}; do
            if docker exec ${{ env.RATELIMIT_REDIS_CONTAINER }} redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Rate-limit Redis is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Timeout waiting for rate-limit Redis to start"
              exit 1
            fi
            sleep 1
          done

      - name: Guard — DATABASE_URL, CACHE_REDIS_TEST_URL, REDIS_TEST_URL must be set
        run: |
          # Integration tests call t.Skip() when these are unset, which makes them appear
          # green while testing nothing. Fail loudly instead.
          # #1531 Task 11e: extended from DATABASE_URL-only to also cover the two Redis test
          # URLs — cachetest.ConnectTestRedis (CACHE_REDIS_TEST_URL) and redisclient's /
          # ratelimitstore's own integration tests (REDIS_TEST_URL) t.Skip identically on an
          # unset var, which would otherwise let the entire #1531 cache-parity and fail-safe
          # suite report "ok" having executed zero cases.
          MISSING=""
          if [ -z "$DATABASE_URL" ]; then
            MISSING="${MISSING}DATABASE_URL "
          fi
          if [ -z "$CACHE_REDIS_TEST_URL" ]; then
            MISSING="${MISSING}CACHE_REDIS_TEST_URL "
          fi
          if [ -z "$REDIS_TEST_URL" ]; then
            MISSING="${MISSING}REDIS_TEST_URL "
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Unset env var(s) would make integration tests silently skip: $MISSING"
            exit 1
          fi
          echo "DATABASE_URL is set (port $POSTGRES_PORT)"
          echo "CACHE_REDIS_TEST_URL is set"
          echo "REDIS_TEST_URL is set"

      - name: Install golang-migrate (job-local)
        env:
          # #1514: pin to a specific release and verify the published checksum before
          # executing the binary — the previous `releases/latest` URL was mutable and
          # unverified.
          MIGRATE_VERSION: v4.19.1
          MIGRATE_SHA256: 2ac648fbd1b127b69ab5a7b33cf96212178f71e22379fc50573630c6f4c7ce18
        run: |
          # Install into a job-local dir under RUNNER_TEMP to avoid write-racing
          # the migration-tests job which also installs migrate into $HOME/bin.
          mkdir -p "$RUNNER_TEMP/bin-integ"
          curl -sSfL -o "$RUNNER_TEMP/migrate.tar.gz" "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz"
          (cd "$RUNNER_TEMP" && echo "${MIGRATE_SHA256}  migrate.tar.gz" | sha256sum -c -)
          tar -xz -f "$RUNNER_TEMP/migrate.tar.gz" -C "$RUNNER_TEMP/bin-integ" migrate
          rm -f "$RUNNER_TEMP/migrate.tar.gz"
          echo "$RUNNER_TEMP/bin-integ" >> $GITHUB_PATH
          "$RUNNER_TEMP/bin-integ/migrate" --version

      - name: Apply migrations
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          migrate -database "$DATABASE_URL" -path backend/migrations up

      - name: Run integration tests
        id: run-integration-tests
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          CACHE_REDIS_TEST_URL: ${{ env.CACHE_REDIS_TEST_URL }}
          REDIS_TEST_URL: ${{ env.REDIS_TEST_URL }}
        run: |
          set -euo pipefail

          # Find packages with //go:build integration tags (prevents running
          # env-sensitive unit packages in DATABASE_URL-populated environment).
          # -p 1 serializes to prevent DB state corruption. -timeout 10m bounds hung connections.
          FILES=$(grep -rl '^//go:build integration' --include='*_test.go' . || true)
          if [ -z "$FILES" ]; then
            echo "::error::No integration-tagged test files found"
            exit 1
          fi
          PKGS=$(printf '%s\n' "$FILES" | xargs -n1 dirname | sort -u)
          if [ -z "$PKGS" ]; then
            echo "::error::No integration packages resolved from found files"
            exit 1
          fi
          echo "Integration packages: $PKGS"
          # #1569 Task 9.2: -coverpkg used to be ./internal/... — every package under internal,
          # whether or not this job ever executes it. That kept packages this job NEVER runs
          # (e.g. internal/workers) permanently in the denominator at 0.0%, and it's why the
          # floor below was measured wrong last round: `./internal/...` as the TEST TARGET
          # exercises far more code than `$PKGS` does, against the same denominator, so the old
          # comment's 83.6% baseline was never reproducible by CI's actual command (CI: 76.7%).
          # -coverpkg is now pinned to the literal $PKGS set (comma-joined, same 11 packages
          # the go test invocation below actually runs), so the number means "of the code these
          # integration tests target, how much do they cover" — not "of all internal code".
          # The original rationale for using a set BROADER than any single package still holds
          # among these 11: a covered line executed by an integration test in one package but
          # living in another (e.g. a repository method exercised only via a service integration
          # test) still counts, because both internal/repository and internal/services are in
          # the set — matching the unit job's -coverpkg semantics, just scoped to what runs here.
          # ./cmd/server is deliberately included even though it's outside ./internal/...: it's
          # one of the 11 packages this job actually tests (cmd/server has an integration-tagged
          # test file), so by the "same set the job runs" rule it belongs in the denominator too.
          COVERPKG=$(printf '%s\n' "$PKGS" | tr '\n' ',' | sed 's/,$//')
          echo "Integration coverpkg: $COVERPKG"
          # shellcheck disable=SC2086
          go test $PKGS -tags integration -p 1 -timeout 10m -v \
            -coverprofile=coverage-integration.out -covermode=atomic -coverpkg="$COVERPKG"

      - name: Check Go integration coverage threshold (≥77%)
        # #1569 Task 8.3: the backend-test job's 74% gate runs WITHOUT -tags integration, so the
        # entire read path for retained history (data_export_repository.go, the history-dated
        # holding/liability queries, rule_execution_history_repository.go, etc.) measures 0% there
        # and is invisible to that gate — even though it is well covered by the integration suite
        # this job runs. This step closes that blind spot with its own gate on THIS job's profile.
        #
        # #1569 Task 9.2: the prior floor (80%, comment below preserved for history) was measured
        # with `-coverpkg=./internal/... ./internal/...` — using ./internal/... as both the TEST
        # TARGET and the coverage scope. CI never runs `./internal/...` as the test target; it
        # runs only the 11 packages containing a `//go:build integration` file ($PKGS above).
        # Testing all of ./internal/... exercises far more code against the same denominator,
        # which is why that measurement (83.6%) never matched CI's real number (76.7%) — it was
        # measuring a broader run than the one that actually happens. The denominator is now
        # narrowed to $PKGS too (see the `run: Run integration tests` step's coverpkg comment),
        # so this floor and that scope agree.
        #
        # Floor re-measured 2026-08-27 against a warm Postgres 17 (`boostedbudget-db`, port 5434)
        # and both dev Redis containers, reproducing CI's exact command from `/bin/bash -c` (NOT
        # zsh — zsh does not word-split an unquoted $PKGS and silently reports 0.0%):
        #   FILES=$(grep -rl '^//go:build integration' --include='*_test.go' .)
        #   PKGS=$(printf '%s\n' "$FILES" | xargs -n1 dirname | sort -u)   # 11 packages
        #   COVERPKG=$(printf '%s\n' "$PKGS" | tr '\n' ',' | sed 's/,$//')
        #   go test $PKGS -tags integration -p 1 -timeout 10m -v \
        #     -coverprofile=/tmp/int.out -covermode=atomic -coverpkg="$COVERPKG"
        #   go tool cover -func=/tmp/int.out | tail -1
        #
        # ⚠ THE COMMAND ABOVE IS THE ONE THE STEP ABOVE RUNS, AND IT DID NOT USED TO BE
        # (#1569 T9-FIX item 9). It said `-timeout 15m` and appended `./...` after $PKGS, which
        # widens the TEST TARGET back to every package — the exact mistake the paragraph above it
        # exists to describe having already fixed once, restated as the reproduction recipe. A
        # "reproduce CI exactly" comment that does not is worse than none: it produces a number
        # under a different run and files it against this floor.
        #
        # Re-measured 2026-08-27 with the CORRECTED command, same warm Postgres 17 on port 5434:
        # 80.2% (11 packages, all green). The 80.3% the widened command reported happens to land
        # within noise of the right one, so the floor below did not have to move — but that is a
        # coincidence, not a validation, and the recipe is now the thing it claims to be.
        #
        # Floor set to 77% — a few points below the measured baseline, not a guess — so it
        # ratchets against regression without failing on ordinary environment variance
        # (Postgres/Redis timing, etc.). Confirmed the gate can still fail: locally,
        # `check-coverage.sh coverage-integration.out 81` on this same profile FAILED
        # ("80.3% is below threshold 81%") and `... 77` PASSED — RED above the measured value,
        # GREEN at the floor.
        # (The two portfolio-snapshot re-link failures this paragraph used to record as
        # "already-uncommitted-locally" were the money-doubling fix mid-flight; both are green as
        # of the run that produced the 80.2% above.)
        #
        # Runs even if the tests step failed or was cancelled-but-not-cancelled, so a real
        # coverage regression is never hidden behind an unrelated red test (Round 7: steps
        # defaulting to if: success() silently skipped 13 later steps, including a coverage
        # gate, in another job). This step is independent of test pass/fail — it only needs the
        # profile file the previous step wrote — so it does not gate on that step's outcome.
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          echo "::group::Checking integration coverage threshold"
          bash ${{ github.workspace }}/${{ env.UNIQUE_WORKSPACE }}/scripts/check-coverage.sh \
            coverage-integration.out \
            77
          echo "::endgroup::"

      - name: Save Go build cache
        # G4 fix: the old guard (`if: ... && steps.cache-go-build.outputs.cache-hit != 'true'`)
        # was wrong. `cache-hit` is true ONLY on an exact primary-key match — and since the old
        # key was scoped to just go.sum (which rarely changes while source changes on every
        # commit), the first successful save for a given go.sum made every later run on that
        # same go.sum hit exactly and skip this save, forever. The cache silently froze at
        # whatever was compiled on that first run and never absorbed newly-compiled first-party
        # packages from later commits — defeating the #1446 fix this cache exists for, on the
        # one job (compile-bound, see timeout-minutes comment) that most needs it warm.
        #
        # The key above is now a compilation-input hash (Go source, go.mod, go.sum, embedded JSON),
        # not github.sha — see backend-test's "Save Go build cache" step above for the full
        # rationale: keying on github.sha (G4 follow-up) minted a new cache entry on every
        # commit, including ones that cannot change compiled output, risking eviction of a
        # still-warm entry under GitHub's per-repository cache cap. `continue-on-error: true`
        # guards the one collision that can still happen: actions/cache/save fails outright if
        # its exact key already exists — expected on a re-run of the SAME commit (retried job,
        # manual re-run), or now also a second commit with an identical source hash (non-Go
        # files only). That failure is harmless — the prior save is still valid — so it must not
        # redden the job; it still surfaces as a workflow warning annotation (not a job
        # failure), so a PERSISTENT save failure remains visible rather than being fully silent.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.GOCACHE }}
          key: gocache-backend-integration-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('backend/**/*.go', 'backend/go.mod', '**/go.sum', 'backend/testdata/**/*.json') }}

      - name: Cleanup PostgreSQL container
        if: always()
        run: |
          cleanup_status=0
          existing=$(docker ps -aq --filter "name=^${{ env.PG_CONTAINER }}$" 2>/dev/null || true)
          if [ -z "$existing" ]; then exit 0; fi
          for attempt in 1 2; do
            if docker rm -f "${{ env.PG_CONTAINER }}" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 2 ]; then cleanup_status=1; fi
            [ "$attempt" -eq 2 ] || sleep 1
          done
          remaining=$(docker ps -aq --filter "name=^${{ env.PG_CONTAINER }}$" 2>/dev/null || true)
          if [ -n "$remaining" ]; then cleanup_status=1; fi
          if [ "$cleanup_status" -ne 0 ]; then
            echo "::error::PostgreSQL container cleanup failed or container remains: ${{ env.PG_CONTAINER }}"
            exit 1
          fi

      - name: Cleanup Redis containers
        if: always()
        run: |
          cleanup_status=0
          cleanup_container() {
            local name="$1"
            local existing
            existing=$(docker ps -aq --filter "name=^${name}$" 2>/dev/null || true)
            [ -n "$existing" ] || return 0
            for attempt in 1 2; do
              if docker rm -f "$name" >/dev/null 2>&1; then break; fi
              if [ "$attempt" -eq 2 ]; then return 1; fi
              sleep 1
            done
            remaining=$(docker ps -aq --filter "name=^${name}$" 2>/dev/null || true)
            [ -z "$remaining" ] || return 1
          }
          cleanup_container "${{ env.CACHE_REDIS_CONTAINER }}" || cleanup_status=1
          cleanup_container "${{ env.RATELIMIT_REDIS_CONTAINER }}" || cleanup_status=1
          if [ "$cleanup_status" -ne 0 ]; then
            echo "::error::One or more integration Redis containers could not be de-provisioned"
            exit 1
          fi

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Universal Expo Mobile Build (iOS, Android, and mobile web)
  # =============================================================================
  mobile-test:
    name: Mobile Build Scaffold
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Expo SDK 57 requires Node >=22.13. Pin the compatibility floor so the
          # ephemeral runner image cannot silently change the toolchain underneath us.
          node-version: '22.13.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check generated design tokens
        run: bun run --filter @boostedbudget/design-tokens check

      - name: Test shared design tokens
        run: bun run --filter @boostedbudget/design-tokens test

      - name: Test portable API client
        run: bun run --filter @boostedbudget/api-client test

      - name: Lint mobile application
        run: bun run --cwd apps/mobile lint

      - name: Typecheck mobile application
        run: bun run --cwd apps/mobile typecheck

      - name: Test mobile application with coverage
        run: >-
          bun run --cwd apps/mobile test:ci
          --coverageThreshold='{"global":{"lines":82}}'

      - name: Validate Expo dependency compatibility
        working-directory: apps/mobile
        # This is the compatibility gate for Dependabot's grouped Expo/React Native updates.
        # `expo-doctor` is an exact mobile devDependency: never replace this with `bunx`, which
        # may resolve a registry version absent from the reviewed lockfile.
        run: bun run doctor

      - name: Export mobile web bundle
        run: bun run --cwd apps/mobile export:web

      - name: Export iOS bundle
        run: bun run --cwd apps/mobile export:ios

      - name: Export Android bundle
        run: bun run --cwd apps/mobile export:android

      - name: Run NativeWind RC evidence gate
        # Todo 4 (#1658): re-runs doctor + the three exports so the sizes are measured, not
        # reported, and exits non-zero when any threshold in nativewind-gate.evidence.json fails.
        run: bun run --cwd apps/mobile gate:nativewind --check

      - name: Install Playwright browsers
        # Todo 22 (#1658). `--with-deps` is mandatory on the Linux runner (rule R2 in
        # scripts/check-runner-portability.py): without it Chromium installs but cannot launch.
        run: bunx playwright install --with-deps chromium

      - name: Run mobile visual and accessibility tests
        # Todo 22 (#1658): drives the static web export served by apps/mobile/scripts/serve-web.ts
        # (never `expo start`). The step is pinned in scripts/check-mobile-ci.py's REQUIRED_STEPS,
        # so it cannot be dropped from CI without that guard failing.
        run: bun run --cwd apps/mobile e2e:visual

  # =============================================================================
  # Frontend Tests (Single job - no sharding)
  # =============================================================================
  frontend-test:
    name: Frontend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-frontend-test-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bun install --frozen-lockfile

      - name: Check generated design tokens
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bun run --filter @boostedbudget/design-tokens check

      # Runs BEFORE the suite on purpose: it asserts the suite will run with a usable per-test
      # timeout. bunfig.toml's `[test] timeout = 30000` was not taking effect, so the 362-file suite
      # ran at bun's 5000ms default and a 441ms test that took 9910ms on a loaded runner reddened
      # this job (#1537). The guard checks the runner passes an explicit --timeout >= 15000 and that
      # the value has real effect, and it needs bun — which is installed two steps above.
      #
      # Wired here rather than left to `make test-scripts`, which no CI job runs: a guard written
      # because a missing flag broke CI was itself invisible to CI.
      #
      # #1569 task 7.1: this and every other step down to "Combine coverage reports" below is an
      # INDEPENDENT guard/verification — none of them consumes another's output, they only share
      # the workspace set up by "Install workspace dependencies" above. Before this fix, one early
      # guard failing (e.g. the typecheck-tests-gate meta-test) skipped all 13 steps after it
      # (default GitHub Actions behaviour: a step with no `if:` only runs while job status is
      # still "success"), so CI reported one red step instead of "none of your gates ran". Each
      # gets `if: always() && !cancelled()` so a sibling's failure cannot hide it; the job still
      # goes red overall because a failing step fails the job regardless of `if:`. Genuinely
      # dependent steps below (the rrweb proof on Chromium install, the coverage-merge test on
      # lcov, "Combine coverage" on the coverage run) are NOT blanket always() — each is additionally
      # gated on ITS OWN real prerequisite's outcome, so it does not run against missing input and
      # produce a confusing secondary failure that masks the true cause.
      - name: Guard — frontend suite must run with an effective per-test timeout (#1537)
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-frontend-test-timeout.test.sh

      # #1569 Codex finding 5: the test-typecheck gate must fail closed whenever tsc did not
      # finish. Drives a COPY of the gate against a stub compiler, so the crash-mid-check and
      # failed-mktemp paths are constructed rather than reasoned about.
      - name: Test the test-typecheck gate fails closed
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash apps/web/scripts/__tests__/typecheck-tests-gate.test.sh

      # Same "make test-scripts runs in no CI job" reasoning as the step above. This one asserts
      # that the 23 hand-maintained process-isolated test paths all still EXIST and that
      # test-conflict-files.sh and test-regular.sh still agree on them. Both runners take those
      # paths on faith, and a stale entry in any MULTI-file group is silent: bun exits 0 having
      # skipped the filter it could not resolve, so the file simply stops being tested while this
      # job stays green. Runs BEFORE the suite so the failure names the stale path rather than
      # surfacing later as unexplained pollution in an unrelated test.
      - name: Guard — process-isolated test list must exist and stay in sync (#1537)
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-isolated-test-lists.test.sh

      # #1569 task 20 (A1). The E2E seeder swallowed a totally failed seed four separate ways and
      # printed "✅ Test data seeded successfully!", so the E2E job ran the whole suite against a
      # database holding one user row and nothing else. This guard really CALLS seed_e2e_data
      # against a recording docker stub and asserts it returns non-zero when psql fails.
      #
      # Wired into this job rather than the E2E job on purpose: it needs no database, no browser
      # and no Clerk credentials, so it must not wait behind the E2E job to report that the E2E
      # job's own reporting is broken.
      - name: Guard — the E2E seeder must fail loudly (#1569)
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-e2e-seed-fails-loudly.test.sh

      - name: Lint frontend
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        run: bun run lint

      - name: Typecheck frontend
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        run: bun run typecheck

      # Issue #1514 (fix round 9): regression gate for the rrweb <option>-masking proof —
      # verifies the ACTUAL PostHog session-replay recorder (posthog-js's vendored rrweb
      # fork, not our own scanForUnmaskedPII test double) still masks a data-ph-mask
      # <option>'s text. Belongs in this fast job, not the "E2E tests" job below: it needs
      # only Chromium — no backend, no webServer, no Clerk auth (see
      # apps/web/e2e/rrweb-mask-proof/playwright.config.ts, a dedicated minimal config
      # separate from the main E2E harness). A routine posthog-js bump is exactly the kind
      # of change that could silently break this mechanism, which eight of #1514's
      # <option>-text fixes depend on.
      - name: Install Chromium for rrweb mask-proof
        id: install-chromium-rrweb
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        run: bunx playwright install --with-deps chromium

      # Genuinely dependent on the step above (needs the Chromium binary it installs), so it is
      # gated on that step's own outcome rather than unconditional always() — running this without
      # a real Chromium would fail for an unrelated reason and mask whichever earlier guard failed.
      - name: Run rrweb <option> masking proof
        if: always() && !cancelled() && steps.install-chromium-rrweb.outcome == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        run: bun run test:rrweb-mask-proof

      - name: Run frontend tests with coverage
        id: frontend-coverage-run
        if: always() && !cancelled()
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        run: |
          echo "::group::Running frontend tests with coverage"
          bun run test:ci
          echo "::endgroup::"

      - name: Ensure lcov is installed
        id: ensure-lcov
        if: always() && !cancelled()
        env:
          LC_ALL: C
          LANG: C
        run: |
          if ! command -v lcov >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y lcov
          fi
          lcov --version

      # Regression suite for the LCOV-merge logic in check-frontend-coverage.sh (SF-path
      # double-counting, the "group e omitted" bug — see the script's own header comment).
      # Must run after "Ensure lcov is installed" above: it invokes the real lcov binary,
      # not a stub. Was previously unwired from every runner (no Makefile target, no CI
      # step) — see scripts/check-frontend-coverage.test.sh's own header.
      # Genuinely dependent on "Ensure lcov is installed" (invokes the real lcov binary), so
      # gated on that step's own outcome rather than unconditional always().
      - name: Test frontend coverage merge tooling
        if: always() && !cancelled() && steps.ensure-lcov.outcome == 'success'
        env:
          LC_ALL: C
          LANG: C
        run: bash ${{ github.workspace }}/${{ env.UNIQUE_WORKSPACE }}/scripts/check-frontend-coverage.test.sh

      # Genuinely dependent on "Run frontend tests with coverage" (merges the lcov files that step
      # produces), so gated on that step's own outcome — an unconditional always() here would try
      # to merge coverage that was never generated and fail for a confusing, unrelated reason.
      - name: Combine coverage reports and enforce thresholds
        id: combine-coverage
        if: always() && !cancelled() && steps.frontend-coverage-run.outcome == 'success'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/apps/web
        env:
          LC_ALL: C
          LANG: C
        run: |
          echo "::group::Combining coverage reports and checking thresholds (≥82% lines)"
          # Delegates to scripts/check-frontend-coverage.sh which:
          #   1. Merges all lcov groups (regular + conflict a/b/c/d/e)
          #   2. Filters packages/api-client/** (orval-generated, not unit-testable)
          #   3. Enforces Lines >= 82% (raised from 63% after excluding generated code, #1286)
          # Functions/Branches gates removed: Bun LCOV emits no per-fn/branch data.
          # ⚠ Denominator caveat: bun 1.3.x measures only test-imported files (no --coverage-include).
          #   ~84% applies to the measured subset, not all of apps/web/src/. See #1345 for follow-up.
          bash ${{ github.workspace }}/${{ env.UNIQUE_WORKSPACE }}/scripts/check-frontend-coverage.sh \
            . \
            82
          echo "::endgroup::"

      - name: Upload combined coverage report
        id: upload-frontend-coverage
        if: always() && !cancelled() && steps.combine-coverage.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: |
            ${{ env.UNIQUE_WORKSPACE }}/apps/web/coverage/combined.lcov
          retention-days: 1
          if-no-files-found: warn

      - name: Report if frontend coverage upload failed
        if: steps.upload-frontend-coverage.outcome == 'failure'
        run: echo "::warning::Frontend coverage upload failed (storage quota/network). Test results valid."

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Migration Integration Tests
  # =============================================================================
  migration-tests:
    name: Migration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-migration-tests-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      # Regression suites for the migration-tooling scripts this job depends on, run before
      # any Postgres container/client setup so a broken checker fails fast instead of after
      # several minutes of Docker pull + container startup. Both are pure shell (source the
      # real scripts' functions; pg_dump-via-docker.test.sh's subprocess part uses a fake
      # `docker` on PATH, never the real daemon) — no DATABASE_URL or running Postgres needed.
      # Were previously unwired from every runner — see each suite's own header comment.
      - name: Test migration rollback-residue comparison logic
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/rollback-residue.test.sh

      - name: Test pg_dump-via-docker
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/pg_dump-via-docker.test.sh

      # #1569 round 15 task 9: the replay loop must execute a CONCURRENTLY migration the way
      # golang-migrate does (no transaction). Its static half needs nothing; its live half is
      # skipped here because this step runs BEFORE the Postgres container is started, exactly like
      # the two above — the live half is covered by "Run comprehensive migration tests" below,
      # which now replays 000182 for real.
      - name: Test migration replay transaction semantics
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/replay-concurrently-transaction.test.sh

      - name: Configure PostgreSQL client tools
        run: |
          echo "::group::Configuring PostgreSQL client"

          # This job dumps/restores against a postgres:17 container (see "Start PostgreSQL
          # container" below), and pg_dump REFUSES to dump a server whose major version is newer
          # than the client's own. A >= 17 client is therefore PREFERRED, and both paths below —
          # a client already on PATH, and one found via Homebrew search — are version-checked so
          # an older major is never silently accepted as if it were current.
          #
          # It is NOT fatal, though, and an earlier version of this comment saying a <17 client is
          # "useless here" was wrong: the "Run comprehensive migration tests" step sets
          # PG_DUMP=scripts/pg_dump-via-docker, which execs the CONTAINER's pg_dump, so every
          # schema dump is produced by the container's 17 no matter what the host client is. The
          # host psql is used only for ordinary queries against that container, which an older
          # major handles. Preferring 17 while warning-but-continuing below is the accurate
          # policy; treating it as fatal gated the job on a binary it does not depend on.
          REQUIRED_MAJOR=17

          # This function PROBES candidates; it does not decide the outcome. Its failures must not
          # be annotated as errors — the caller deliberately recovers and continues with a single
          # ::warning:: when no >= $REQUIRED_MAJOR client is found. Emitting ::error:: here painted
          # red annotations on runs that then succeeded on purpose, which is exactly the kind of
          # misleading signal that makes a green build hard to trust.
          check_client_version() {
            local psql_bin="$1" version
            version=$("$psql_bin" --version | grep -oE '[0-9]+' | head -1)
            if [ -z "$version" ]; then
              echo "::notice::Could not parse a version number from '$psql_bin --version' — skipping this candidate"
              return 1
            fi
            if [ "$version" -lt "$REQUIRED_MAJOR" ]; then
              echo "::notice::$psql_bin is PostgreSQL $version (< $REQUIRED_MAJOR) — skipping this candidate; the container's pg_dump is used for dumps regardless."
              return 1
            fi
            return 0
          }

          # Fast path: tools already on PATH. Previously accepted unconditionally — on a
          # runner whose default PATH resolves to an older Postgres (verified: a Homebrew
          # install with only postgresql@14/@15 present resolves `psql`/`pg_dump` on PATH to
          # 14 with no error), this silently proceeded with an incompatible client. Now checked
          # the same way as the Homebrew-search path below.
          if command -v psql &> /dev/null && command -v pg_dump &> /dev/null; then
            if check_client_version "$(command -v psql)"; then
              echo "✅ PostgreSQL client already in PATH ($(psql --version | cut -d' ' -f3))"
              echo "::endgroup::"
              exit 0
            fi
            echo "::notice::PATH's PostgreSQL client is below the required major version — searching Homebrew for >= $REQUIRED_MAJOR instead."
          fi

          find_postgres17_bin() {
            local path
            for path in \
              "/opt/homebrew/opt/postgresql@$REQUIRED_MAJOR/bin" \
              "/usr/local/opt/postgresql@$REQUIRED_MAJOR/bin"
            do
              if [ -d "$path" ] && [ -f "$path/psql" ] && [ -f "$path/pg_dump" ]; then
                echo "$path"
                return 0
              fi
            done
            return 1
          }

          # Locate a PostgreSQL >= 17 Homebrew install. No <17 fallback (see comment above) —
          # a runner with only an older Homebrew Postgres installed must not silently use it.
          POSTGRES_BIN="$(find_postgres17_bin)" || true

          # Self-heal rather than just failing: mirrors "Ensure lcov is installed" in the
          # Frontend Tests job (brew install lcov if missing). Without this, dropping the <17
          # fallback above would turn any runner that happens to have only postgresql@14/@15
          # installed — which this job's PG_DUMP override (pg_dump-via-docker, used by "Run
          # comprehensive migration tests" below) had been silently tolerating, since it runs
          # the CONTAINER's own pg_dump regardless of the host client this step resolves — from
          # a passing job into a hard failure with no remediation path. Attempting the install
          # here keeps the fail-fast/no-silent-downgrade behavior for a genuinely broken runner
          # (no Homebrew, no network) while not breaking a currently-working one over a version
          # this step was never actually the load-bearing guard for.
          if [ -z "$POSTGRES_BIN" ]; then
            # `brew` is NOT on this runner's PATH (measured: "line 71: brew: command not found"
            # on runner-4), so try its two standard locations explicitly rather than assuming
            # the shim is resolvable. If none is present, skip the install attempt instead of
            # emitting a misleading "attempting brew install" notice that cannot succeed.
            BREW_BIN=""
            for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              [ -x "$candidate" ] && BREW_BIN="$candidate" && break
            done
            if [ -n "$BREW_BIN" ]; then
              echo "::notice::No PostgreSQL >= $REQUIRED_MAJOR client found — attempting $BREW_BIN install postgresql@$REQUIRED_MAJOR"
              "$BREW_BIN" install "postgresql@$REQUIRED_MAJOR" || true
              POSTGRES_BIN="$(find_postgres17_bin)" || true
            else
              echo "::notice::No PostgreSQL >= $REQUIRED_MAJOR client found and no brew executable at /opt/homebrew/bin/brew or /usr/local/bin/brew — skipping the install attempt."
            fi
          fi

          # A host client BELOW $REQUIRED_MAJOR is a WARNING, not a failure — and this is the
          # correction to a regression this workflow shipped once already. The reasoning that
          # justified failing hard ("a <17 client is useless here") is wrong for THIS job: the
          # "Run comprehensive migration tests" step sets PG_DUMP=scripts/pg_dump-via-docker,
          # and that wrapper `exec docker exec`s into the CONTAINER's pg_dump (see its main()),
          # so the pg_dump that produces every schema hash is always the container's 17 — the
          # host client this step resolves is never the one dumping. The host `psql` is used
          # only for ordinary queries against the container, which an older major does fine.
          #
          # Failing hard therefore gated the job on a binary it does not depend on, and did
          # break it: this runner has no PostgreSQL >= 17 and no brew on PATH, so a previously
          # green job went red. Warning keeps the property that actually mattered — no SILENT
          # acceptance of an old client — without inventing a requirement.
          #
          # The genuine requirement is that SOME psql exists, since test-migrations.sh cannot
          # run without one. That, and only that, is still fatal.
          if [ -n "$POSTGRES_BIN" ]; then
            echo "$POSTGRES_BIN" >> $GITHUB_PATH
            echo "::notice::PostgreSQL client $("$POSTGRES_BIN/psql" --version | cut -d' ' -f3) at $POSTGRES_BIN"
          elif command -v psql &> /dev/null; then
            echo "::warning::No PostgreSQL >= $REQUIRED_MAJOR client on this runner; proceeding with $(psql --version | cut -d' ' -f3) on PATH. Schema dumps are unaffected — the migration-tests step overrides PG_DUMP to scripts/pg_dump-via-docker, which runs the container's own pg_dump $REQUIRED_MAJOR. Install postgresql@$REQUIRED_MAJOR to silence this."
          else
            # Only psql is required, matching the comment above. A host pg_dump is NOT: the
            # migration-tests step sets PG_DUMP=scripts/pg_dump-via-docker, which execs the
            # container's own pg_dump. The previous condition also demanded `command -v pg_dump`,
            # so a runner with a working psql and no host pg_dump fell through to this fatal
            # branch — contradicting the stated requirement directly above it.
            echo "::error::No psql found at all — scripts/test-migrations.sh cannot run. Install postgresql@$REQUIRED_MAJOR."
            exit 1
          fi
          echo "::endgroup::"

      - name: Start PostgreSQL container
        run: |
          docker stop test-postgres-${{ github.run_id }} 2>/dev/null || true
          docker rm test-postgres-${{ github.run_id }} 2>/dev/null || true

          echo "Pulling PostgreSQL image..."
          for i in 1 2 3; do
            docker pull postgres:17 && break || {
              echo "Pull attempt $i/3 failed"
              [ $i -lt 3 ] && sleep 10
            }
          done

          docker run -d \
            --name test-postgres-${{ github.run_id }} \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -p 5432 \
            --memory=512m \
            --shm-size=256m \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:17

          # Get the dynamically assigned port
          sleep 2
          POSTGRES_PORT=$(docker port test-postgres-${{ github.run_id }} 5432 | cut -d: -f2)
          echo "PostgreSQL running on dynamically assigned port: $POSTGRES_PORT"

          # Export for use in subsequent steps
          echo "POSTGRES_PORT=$POSTGRES_PORT" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://test:test@localhost:$POSTGRES_PORT/test?sslmode=disable" >> $GITHUB_ENV

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec test-postgres-${{ github.run_id }} pg_isready -U test > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Timeout waiting for PostgreSQL to start"
              exit 1
            fi
            sleep 1
          done

      - name: Install migration tools
        env:
          # #1514: pin to a specific release and verify the published checksum before
          # executing the binary — the previous `releases/latest` URL was mutable and
          # unverified.
          MIGRATE_VERSION: v4.19.1
          MIGRATE_SHA256: 2ac648fbd1b127b69ab5a7b33cf96212178f71e22379fc50573630c6f4c7ce18
        run: |
          mkdir -p $HOME/bin
          curl -sSfL -o migrate.tar.gz "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz"
          echo "${MIGRATE_SHA256}  migrate.tar.gz" | sha256sum -c -
          tar -xz -f migrate.tar.gz migrate
          rm -f migrate.tar.gz
          mv migrate $HOME/bin/
          echo "$HOME/bin" >> $GITHUB_PATH
          npm install -g squawk-cli
          $HOME/bin/migrate --version && squawk --version

      # The glob is *.up.sql so the command matches the policy that .squawk.toml already
      # enforces. This step used to pass `migrations/*.sql` (366 files) and print "Found 0
      # issues in 180 files", which LOOKED like half the input vanishing. It is not:
      # .squawk.toml:32-38 excludes `*.down.sql` deliberately -- "rollback migrations NEED
      # DROP TABLE statements" -- plus three up-migrations, each with its own stated reason.
      # 183 up files minus those three = the 180 linted. Coverage here is unchanged; only the
      # command's appearance is.
      #
      # ⚠⚠ #1569 r19, corrected by Codex: an earlier version of THIS comment claimed squawk
      # "REFUSES a .down.sql path and still exits 0" and that the three files were
      # "unparseable". BOTH WERE FALSE. squawk exits 1 on a down-only invocation (the earlier
      # measurement piped through `tail`, so it read tail's exit code, not squawk's), and the
      # three files parse fine -- run with `--config=/dev/null` and they emit ordinary
      # warnings. The exclusions are configuration, not capability. ⚠ Do not re-derive this
      # step's scope from its output count without reading .squawk.toml first: the count is
      # a consequence of that file, and a drop in it means an exclusion was ADDED there.
      - name: Lint migrations with Squawk
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: squawk migrations/*.up.sql --pg-version=17

      # PG_DUMP points at the server container's own pg_dump, regardless of what the "Configure
      # PostgreSQL client tools" step above resolved on the host. That step PREFERS a host client
      # >= 17 and never silently accepts an older one as if it were current — but it is a WARNING,
      # not a failure: an older `psql` on PATH emits ::warning:: and the job proceeds (it used to
      # silently fall back to whatever Homebrew postgresql@15 it could find, which is older than
      # the postgres:17 container this job starts, and pg_dump refuses to dump a server newer than
      # itself, which was the actual bug that step fixes). Only a TOTAL ABSENCE of any `psql` is
      # fatal there, because scripts/test-migrations.sh cannot run without one at all. That warning
      # is safe specifically because of the indirection below: PG_DUMP=scripts/pg_dump-via-docker
      # execs the CONTAINER's own pg_dump, so the host client's major version never affects a
      # schema hash — this indirection is kept as a second, independent guard: it is never wrong to run the
      # container's own pg_dump against the container's own server, no matter which host client
      # version was resolved above or how that resolution logic changes in the future.
      #
      # That mismatch was not merely inconvenient: test-migrations.sh discarded pg_dump's stderr and hashed
      # its empty stdout, so the idempotency and up->down->up schema-identity suites compared an
      # empty string with itself and reported PASSED. This job has therefore been green while
      # verifying nothing about schema identity — on every run before this commit. The script now
      # fails closed on both an unchecked `migrate` exit code and an empty dump, and checks
      # client-vs-server major versions up front, so a future mismatch is loud rather than silent.
      # #1569 Codex finding 1: the destructive-target guard's own suite. Runs HERE, after the
      # Postgres container is up, and not with the other pure-shell suites at the top of this job,
      # because half of its cases must point at a LIVE cluster: a suite that can only reach dead
      # ports can observe the guard refusing, never the guard SAYING YES to a real database — which
      # is exactly the blind spot that let a name-only guard admit `production_test`. It creates and
      # drops its own guardprobe_* databases on the container; it never touches DATABASE_URL's.
      - name: Test migration destructive-target guard
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bash scripts/__tests__/test-migrations-target-guard.test.sh

      # #1569 round 12 task 7: the entry-point guard on `make migrate-reset`
      # (backend/scripts/assert-migrate-reset-target-disposable.sh, wired into
      # backend/Makefile's migrate-reset target). Filed here, beside the sibling
      # test-migrations.sh guard above, for the same reason: half its cases need a LIVE cluster to
      # observe the guard saying YES to a real (empty) database, not just refusing. It creates and
      # drops its own mrguard_* databases on the container; it never touches DATABASE_URL's.
      - name: Test migrate-reset entry-point guard
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bash scripts/__tests__/migrate-reset-target-guard.test.sh

      # #1569 round 5 (G3). This comment used to call this "the LAST suite under scripts/__tests__
      # that no workflow ran"; that was FALSE when written and stayed false for nine rounds —
      # no-ungated-migrate-down-invocation-guard.test.sh, check-ci-env-drift.test.sh and
      # summarize-go-test.test.sh were all still unwired, and round 15 task 1 wired them. As of
      # that commit all 21 suites in `make test-scripts` do have an individual CI step, but
      # `make test-scripts` itself still runs in no CI job, so the per-suite wiring below and in
      # frontend-test remains the only thing that executes them. It was
      # reachable only through `make test-scripts`, which no job invokes — so its eight cases,
      # including its own mutant, proved nothing about any commit. A guard that exists but never
      # runs is the same as no guard, and this was the third instance of that class on this branch.
      #
      # Filed HERE, beside the target-guard suite, because it is about the same subject: the root
      # Makefile's migrate-* recipes and scripts/resolve-dev-database-url.sh, i.e. WHICH database a
      # destructive migration command would reach. It does not need the Postgres container — every
      # case either dry-runs make (`make -n` against a sentinel URL on a dead port) or drives the
      # resolver through docker/psql shims — but it must not be pulled away from the guard it is a
      # sibling of. It neither reads nor writes this job's DATABASE_URL database: the make cases
      # override DATABASE_URL with the sentinel, and the resolver cases run under `env -u
      # DATABASE_URL`.
      - name: Test root Makefile migrate delegation and dev-URL resolver
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/root-migrate-delegation.test.sh

      - name: Run comprehensive migration tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PG_DUMP_CONTAINER: test-postgres-${{ github.run_id }}
        run: |
          cd ${{ env.UNIQUE_WORKSPACE }}
          chmod +x scripts/test-migrations.sh scripts/pg_dump-via-docker
          # PG_DUMP is set HERE, after the cd, and absolutised with $PWD rather than being declared
          # in `env:` above. UNIQUE_WORKSPACE is a RELATIVE path (workspace-migration-tests-<run_id>),
          # so an env-level `${{ env.UNIQUE_WORKSPACE }}/scripts/...` resolves against the wrong
          # directory once this step cds into the workspace — the script then cannot find the shim.
          # (That exact mistake failed this job once; the prerequisites guard reported
          # "pg_dump not found: <relative path>" instead of silently continuing, which is what the
          # guard exists for.)
          PG_DUMP="$PWD/scripts/pg_dump-via-docker" ./scripts/test-migrations.sh

      - name: Upload performance benchmarks
        id: upload-migration-perf
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: migration-performance-${{ github.run_id }}
          path: ${{ env.UNIQUE_WORKSPACE }}/migration-performance.json
          retention-days: 1
          if-no-files-found: warn

      - name: Report if migration performance upload failed
        if: steps.upload-migration-perf.outcome == 'failure'
        run: echo "::warning::Migration performance upload failed (storage quota/network). Test results valid."

      - name: Cleanup PostgreSQL container
        if: always()
        run: |
          docker stop test-postgres-${{ github.run_id }} 2>/dev/null || true
          docker rm test-postgres-${{ github.run_id }} 2>/dev/null || true

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Security Scan - Native Tools (govulncheck, npm audit, Hadolint)
  # =============================================================================
  # Replaces Trivy with official/native tools to avoid SSL download issues
  # - Backend: govulncheck (official Go vulnerability scanner with reachability analysis)
  # - Frontend: npm audit (security audit via Bun)
  # - Dockerfiles: Hadolint (Dockerfile best practices linter)
  security-scan:
    name: Security Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      UNIQUE_WORKSPACE: workspace-security-scan-${{ matrix.component }}-${{ github.run_id }}

    steps:
      - name: Clean workspace (fix permission issues)
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      # =========================================================================
      # Backend Security: govulncheck (Go official vulnerability scanner)
      # =========================================================================
      - name: Setup Go
        if: matrix.component == 'backend'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ env.UNIQUE_WORKSPACE }}/backend/go.mod
          cache-dependency-path: ${{ env.UNIQUE_WORKSPACE }}/backend/go.sum

      - name: Configure job-local Go build cache
        if: matrix.component == 'backend'
        # cache-dependency-path above only scopes the actions/cache KEY for module
        # downloads — GOCACHE itself still defaults to the shared, un-isolated
        # ~/Library/Caches/go-build on this self-hosted runner. govulncheck compiles
        # the codebase for analysis, so it's exposed to the same cross-job cache
        # corruption as any other `go build`/`go test` (see e2e-test/backend-test
        # fixes). runner context is unavailable in job-level env blocks, so we
        # export GOCACHE here where $RUNNER_TEMP is a real shell variable.
        run: echo "GOCACHE=$RUNNER_TEMP/gocache-security-scan" >> "$GITHUB_ENV"

      - name: Run govulncheck (Go vulnerabilities)
        if: matrix.component == 'backend'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}/backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # =========================================================================
      # Frontend Security: npm audit (Bun uses npm-compatible packages)
      # =========================================================================
      - name: Setup Bun
        if: matrix.component == 'frontend'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Run bun audit (JS vulnerabilities)
        if: matrix.component == 'frontend'
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high

      # =========================================================================
      # Dockerfile Linting: Hadolint (pre-installed on Mac Mini runner)
      # =========================================================================
      - name: Lint Dockerfile (Hadolint) - Backend
        if: matrix.component == 'backend'
        run: /opt/homebrew/bin/hadolint "${{ env.UNIQUE_WORKSPACE }}/backend/Dockerfile" \
          --failure-threshold warning || echo "::warning::Dockerfile linting issues found"

      - name: Lint Dockerfile (Hadolint) - Frontend
        if: matrix.component == 'frontend'
        run: /opt/homebrew/bin/hadolint "${{ env.UNIQUE_WORKSPACE }}/apps/web/Dockerfile" \
          --failure-threshold warning || echo "::warning::Dockerfile linting issues found"

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Docker Image Security Scan (Grype)
  # =============================================================================
  # Builds Docker images and scans for vulnerabilities in the compiled artifacts
  # This catches issues that govulncheck misses (e.g., stdlib CVEs in binary)
  docker-image-scan:
    name: Docker Image Scan (${{ matrix.component }})
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true' ||
      needs.detect-changes.outputs.scanconfig == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      UNIQUE_WORKSPACE: workspace-docker-scan-${{ matrix.component }}-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set Dockerfile path
        id: dockerfile
        run: |
          if [ "${{ matrix.component }}" = "frontend" ]; then
            echo "path=apps/web/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=${{ matrix.component }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image (local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.UNIQUE_WORKSPACE }}
          file: ${{ env.UNIQUE_WORKSPACE }}/${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64
          push: false
          load: true
          tags: test-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Ensure Grype is installed
        run: |
          if ! command -v grype &> /dev/null; then
            echo "Installing Grype..."
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          fi
          grype version

      - name: Scan Docker image with Grype
        run: |
          grype test-${{ matrix.component }}:${{ github.sha }} \
            --config ${{ env.UNIQUE_WORKSPACE }}/.grype.yaml \
            --fail-on high \
            --only-fixed \
            --output table

      - name: Cleanup Docker image
        if: always()
        run: docker rmi test-${{ matrix.component }}:${{ github.sha }} 2>/dev/null || true

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

  # =============================================================================
  # Lighthouse CI Audit (Performance, Accessibility, Best Practices, SEO)
  # =============================================================================
  # Audits the landing page and /mcp with 3 runs (median scoring) against hard thresholds:
  #   Performance >= 80, Accessibility >= 95, Best Practices >= 90, SEO >= 95
  #
  # RE-ENABLED on Linux runners by #1598, closing #996. This job was dark from 2026-04-07
  # (commit 2ce659b6) until then, because Chrome headless under LHCI shared a process group with
  # the Mac Mini's own browser session and LHCI SIGKILLs that group after an audit -- taking the
  # developer's browser with it.
  #
  # ⚠ The exact FLAG mechanism is recorded inconsistently across the repo and was NOT re-verified
  # here, so do not quote either version as established. #996 says LHCI "always appends
  # `--headless=new`". But .lighthouserc.js's chromeFlags comment says plain `--headless` was
  # chosen precisely BECAUSE `--headless=new` caused EPERM/WebSocket failures on the macOS
  # runners -- which would be pointless if LHCI overrode it unconditionally. Both cannot be true.
  # What IS certain is that the conflict was macOS process-group behaviour, which Linux does not
  # share, and that is the reason this job had to wait for the Ubicloud migration.
  lighthouse-audit:
    name: Lighthouse CI Audit
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    # Least-privilege token, scoped to this job rather than the whole workflow (#1598). This is
    # one of only two jobs that now run on an ephemeral cloud VM, which is the entire reason the
    # restriction is worth stating -- and neither writes with GITHUB_TOKEN.
    #
    # ⚠ Declared PER JOB on purpose. A workflow-level block was tried first and broke
    # `detect-changes`: setting any `permissions:` drops every scope not listed, and
    # dorny/paths-filter calls the PR Files API, which needs `pull-requests: read`. It failed with
    # the generic "Resource not accessible by integration" -- naming neither the scope nor the
    # action -- and because 11 jobs are gated on detect-changes' outputs, that one failure cascaded
    # into skipping most of the matrix. Job-level scoping keeps a hardening change to the jobs it
    # was justified for, and matches this repo's existing convention (deploy-production.yml,
    # deploy-to-staging.yaml, cleanup-artifacts.yml all declare permissions per job).
    permissions:
      contents: read
    # NEW in #1598. This job had no timeout at all, so it inherited GitHub's 360-minute default:
    # a wedged LHCI run would have billed six hours of runner time. 20 minutes is a wedge bound,
    # not a performance target -- a frontend build plus 3 audit runs over 2 URLs is minutes.
    timeout-minutes: 20
    # Needed for secrets.CLERK_PUBLISHABLE_KEY, which is an `e2e` ENVIRONMENT secret rather than
    # a repo-level one (verified: the repo has no CLERK_* secrets at all; the e2e environment has
    # six). That environment has no protection rules and no branch policy, so declaring it neither
    # gates this job nor requires an approval -- e2e-test already declares it for the same reason.
    environment: e2e

    steps:
      # No `sudo rm -rf` and no `path:`/`clean: false`: those existed so concurrent jobs on one
      # Mac Mini could not collide. This VM is created for this job and destroyed after it.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # LHCI launches a real Chrome through chrome-launcher, and this job installs no browser --
      # on the Mac Mini it silently used the desktop Chrome at /Applications. Ubicloud documents
      # nothing about its image contents, and its published Arm image inventory omits Chrome
      # entirely, so resolve it explicitly: a runner image without Chrome must fail here with a
      # clear message rather than inside `lhci autorun`.
      #
      # The version is echoed on purpose. Chrome 132 REMOVED old headless, so on a current
      # browser the `--headless` flag in .lighthouserc.js selects new headless regardless of what
      # that file's comment says. That is fine on Linux (the process-group conflict was
      # macOS-specific), but the version is the only way to know which mode actually ran.
      - name: Preflight — resolve Chrome
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo "::error::no Chrome/Chromium on this runner image — install one before lhci autorun"
          exit 1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # From package.json's packageManager field, not `latest` -- see e2e-test's Setup Bun.
          bun-version-file: package.json

      # `npx lhci` and `npx serve` both need a predictable Node; this job previously had none and
      # used whatever the Mac Mini happened to provide.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # `cache:` intentionally LEFT UNSET -- see e2e-test's Set up Node for the full
          # argument. In short: unlike setup-go, omitting setup-node's `cache` input is already
          # a no-op (no caching, no error), while the literal boolean `false` is NOT a no-op --
          # it serializes to the string "false", which setup-node rejects as an unsupported
          # package manager. This job uses bun, not npm/yarn/pnpm, so this input has nothing to
          # cache regardless.

      # Same key as e2e-test and warm-ci-cache.yml. Keep the three byte-identical.
      #
      # Restore-only here: this job does NOT save this cache. e2e-test and lighthouse-audit run
      # concurrently on the same PR, install the same --frozen-lockfile deps from the same
      # bun.lock, and would therefore always write a byte-identical entry -- one job's save was
      # observed losing the race in real CI ("Failed to save: Unable to reserve cache with key
      # bun-store-Linux-X64-1.3.14-... another job may be creating this cache"), wasting a 203.9 MB
      # upload attempt (~24s) for zero benefit. Under Ubicloud's shared-branch caching (see
      # "Caching" below), any branch's save already serves every branch, so e2e-test alone is a
      # sufficient sole writer (#1598).
      - name: Restore Bun package store
        id: cache-bun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # ⚠ VITE_CLERK_PUBLISHABLE_KEY is REQUIRED for this build, and its absence is why the very
      # first Ubicloud run of this job failed. That failure was NOT a Linux or Ubicloud problem,
      # and it was not the threshold variance this migration anticipated -- it is a latent defect
      # that has been in this job since #995 created it, invisible because the job has never once
      # executed (it was `if: false` from 2026-04-09 onward).
      #
      # The mechanism: `bun run build` is a PRODUCTION build, so `import.meta.env.MODE` is
      # 'production' and `isDevelopment` is false in apps/web/src/main.tsx. The runtime
      # `window.ENV` shim (apps/web/public/config.js) ships with CLERK_PUBLISHABLE_KEY explicitly
      # `undefined` -- the real values are injected by docker-entrypoint.sh at CONTAINER start,
      # which never happens here because Lighthouse serves the static dist with `npx serve`. With
      # neither source present, main.tsx throws at module top level:
      #   "FATAL: Clerk configuration not loaded. window.ENV is undefined or empty."
      # Nothing renders, and Lighthouse reports only `NO_FCP` ("The page did not paint any
      # content"), which names neither Clerk nor the missing variable.
      #
      # Reproduced locally to be sure, rather than inferred: building with the key absent gives
      # `#root` innerHTML length 0 and that exact pageerror; building with a real key gives ~49KB
      # of rendered DOM. A syntactically valid DUMMY key is NOT sufficient -- it clears the throw
      # but Clerk's SDK then fails to load its script from the encoded domain
      # (ERR_NAME_NOT_RESOLVED) and the app still never paints. It must be a real publishable key.
      #
      # Embedding it is safe by design: a Clerk PUBLISHABLE key is public and already ships inside
      # every production frontend bundle. The secret key is not used here.
      - name: Guard — Clerk publishable key must be present for the build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY resolved empty. The frontend build would produce a bundle that throws before first paint, and Lighthouse would report only NO_FCP. Check the 'e2e' environment secret and this job's environment: declaration."
            exit 1
          fi
          echo "Clerk publishable key present (${#VITE_CLERK_PUBLISHABLE_KEY} chars)"

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: bun run build

      # Fails loudly if the bundle cannot paint, instead of leaving Lighthouse to report NO_FCP --
      # which is what made the original failure take a local reproduction to diagnose. Cheap
      # (~2s) relative to three Lighthouse runs, and it names the actual cause.
      - name: Guard — built bundle must render before auditing
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx --yes serve dist -l 31001 --no-clipboard --single >/tmp/serve-probe.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf "http://localhost:31001/" >/dev/null 2>&1 && break
            sleep 1
          done
          node --input-type=module -e "
            import { chromium } from '@playwright/test';
            // executablePath is REQUIRED here, not an optimisation. This job never runs
            // \\`playwright install\\` (only e2e-test does), so Playwright's own bundled Chromium is
            // not on disk and a bare launch() dies with 'Executable doesn't exist at
            // .../chromium_headless_shell-.../chrome-headless-shell'. That is exactly how the
            // first version of this guard failed -- masking the very question it exists to
            // answer. Reusing CHROME_PATH (resolved by the preflight above) also makes the probe
            // faithful rather than merely cheap: it exercises the SAME browser lhci will launch.
            const b = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              args: ['--no-sandbox'],
            });
            const p = await b.newPage();
            const errors = [];
            p.on('pageerror', e => errors.push(e.message));
            await p.goto('http://localhost:31001/', { waitUntil: 'load' });
            await p.waitForTimeout(3000);
            const size = await p.evaluate(() => (document.getElementById('root')?.innerHTML || '').length);
            await b.close();
            if (size < 500) {
              console.error('::error::the built bundle rendered ' + size + ' bytes into #root — Lighthouse would report NO_FCP. Page errors: ' + (errors.join(' | ') || '(none)'));
              process.exit(1);
            }
            console.log('bundle renders (' + size + ' bytes into #root)');
          "

      - name: Allocate LHCI port
        # Was `45000 + (run_id % 50) * 100`, to keep 50 concurrent jobs from colliding on one
        # shared Mac Mini. This runner is a dedicated ephemeral VM with no siblings, so the
        # arithmetic bought nothing -- and its range (45000-49900) sits INSIDE Linux's default
        # ip_local_port_range (32768-60999), meaning the kernel could hand the same port to an
        # outbound socket while `npx serve` was trying to bind it. 31000 is below the 32768
        # floor, so it is unreachable by ephemeral allocation and needs no sysctl change.
        run: echo "LHCI_PORT=31000" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        env:
          LHCI_PORT: ${{ env.LHCI_PORT }}
        run: npx lhci autorun

      # .lighthouserc.js writes its reports to /tmp/lhci-reports, which vanishes with the VM.
      # Without this, a threshold failure leaves nothing to look at -- and the thresholds were
      # calibrated on completely different hardware, so the first failures are the ones most
      # worth reading.
      # ⚠ `always()`, not `failure()` (#1601). Uploading only on failure made a PASSING run's
      # scores unobservable, and that became a real gap the moment the thresholds were ratcheted
      # to measured values (0.55 / 0.45 performance, 0.78 best-practices): a run sitting at 0.56
      # against a 0.55 floor is one point from red and looks identical to one at 0.79. LHCI prints
      # category values only for assertions that FAIL, so a green job's log says nothing either.
      #
      # Concretely: I could not tell from a passing run whether deferring the Paddle SDK had moved
      # performance at all — the question the change was made to answer. Six reports at ~800KB
      # with 3-day retention is a negligible price for being able to see headroom trend.
      - name: Upload Lighthouse reports
        id: upload-lighthouse-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lhci-reports
          retention-days: 3
          if-no-files-found: warn

  # =============================================================================
  # Bundle Size Check (size-limit + orphan-chunk guard)
  # =============================================================================
  # Hard fails if any JS chunk exceeds its per-route budget OR if a Rollup-emitted
  # chunk has no budget entry at all. Budgets set at baseline + 20% (vendor +25%).
  bundle-size:
    name: Bundle Size Check
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      UNIQUE_WORKSPACE: workspace-bundle-size-${{ github.run_id }}

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.UNIQUE_WORKSPACE }}
          clean: false
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bun install --frozen-lockfile

      # Regression suite for scripts/check-orphan-chunks.sh (the guard that "Check bundle
      # size" below relies on). Pure shell, no build/lcov/docker dependency — see the
      # suite's own header. Was previously unwired from every runner.
      - name: Test orphan-chunk checker
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-orphan-chunks.test.sh

      # #1601. Hosted here rather than in e2e-test (where the other shell guards live) for two
      # reasons: check-route-weight.sh needs a BUILT apps/web/dist, which only this job produces
      # (via `make check-bundle-size` below), and the sibling bundle guard's suite is already
      # hosted here. The guard itself runs inside that make target, so it is gated on the same
      # frontend/workflow filters as the rest of this job -- correct here, because unlike the
      # #1569/#1598 whole-tree guards its subject IS the frontend, so it is deliberately NOT in
      # check-ungated-guard-steps.py's REQUIRED_UNGATED_STEPS.
      - name: Test route-weight guard (#1601 regression suite)
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: bash scripts/__tests__/check-route-weight.test.sh

      - name: Check bundle size
        working-directory: ${{ env.UNIQUE_WORKSPACE }}
        run: make check-bundle-size

      - name: Final workspace cleanup
        if: always()
        run: sudo rm -rf "$GITHUB_WORKSPACE/${{ env.UNIQUE_WORKSPACE }}" 2>/dev/null || true
