# actionlint configuration (#1598).
#
# actionlint validates `runs-on:` against GitHub's own hosted-label list and reports anything
# else as unknown. This repo uses two kinds of label it cannot know about, so without this file
# every job in every workflow produces a spurious "label is unknown" error and the real findings
# are buried:
#
#   - `mac-mini` — the self-hosted pool of four runners on one Mac Mini. See
#     infra/runners/README.md for what that host actually is.
#   - `ubicloud-standard-*` — Ubicloud's hosted runners. `e2e-test` and `lighthouse-audit` moved
#     to these in #1598; #1668 adds migration-tests on standard-2 and backend integration plus
#     Docker scans on standard-4. Listed explicitly rather than by
#     wildcard so a typo in a size still fails, and so this file stays a readable record of which
#     sizes the repo has actually adopted.
#
# Runner placement itself is enforced separately and more strictly by
# scripts/check-runner-portability.py, which also knows WHICH jobs are allowed on which target.
# This file only teaches actionlint that the labels exist.
self-hosted-runner:
  labels:
    - mac-mini
    - ubicloud-standard-2
    - ubicloud-standard-4
