# Dependabot configuration for BoostedBudget
# Monitors dependencies across all workspaces and creates automated PRs for updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # =============================================================================
  # Backend - Go Modules
  # =============================================================================
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "backend"
      - "go"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 5
    # Protect major Go version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates together
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # Bun Workspace Monorepo - All frontend dependencies
  # =============================================================================
  # Monitors ALL workspaces (apps/*, packages/*) from the root directory.
  # Bun workspaces use a SINGLE root bun.lock file, so Dependabot must run
  # from the root to correctly update the shared lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 10
    # Protect major version updates for critical frameworks
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-query"
        update-types: ["version-update:semver-major"]
      - dependency-name: "orval"
        update-types: ["version-update:semver-major"]
      # Expo SDK upgrades are coordinated compatibility events, not routine bumps. Dependabot
      # may group patch/minor updates below; majors stay manual and must pass Expo Doctor plus
      # all three static exports in the mobile CI job.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major"]
      # AsyncStorage is pinned exactly to the Expo SDK 57 compatibility version. It is a
      # compatibility-critical native module, so every update class stays manual; the
      # `@react-native/*` pattern above does NOT cover it (its scope is `@react-native`, not
      # `@react-native-async-storage`).
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "nativewind"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-native-css"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    # Group dependencies by type across ALL workspaces
    groups:
      # These packages form one Expo SDK 57 compatibility surface. Keeping them in one PR lets
      # Expo Doctor and the iOS/Android/web export gate assess the combination Dependabot would
      # actually merge, instead of independently green-lighting versions that conflict together.
      expo-react-native-compatibility:
        patterns:
          - "@babel/core"
          - "@babel/runtime"
          - "@expo/*"
          - "@react-native/*"
          - "@react-native-async-storage/*"
          - "@testing-library/react-native"
          - "babel-preset-expo"
          - "expo"
          - "expo-*"
          - "jest-expo"
          - "nativewind"
          - "react"
          - "react-dom"
          - "react-native*"
        update-types:
          - "minor"
          - "patch"
      frontend-framework:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "react"
          - "react-dom"
      frontend-ui-libraries:
        patterns:
          - "@radix-ui/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@heroicons/*"
          - "clsx"
          - "class-variance-authority"
        update-types:
          - "minor"
          - "patch"
      frontend-state:
        patterns:
          - "@tanstack/*"
          - "@reduxjs/*"
          - "axios"
          - "swr"
        update-types:
          - "minor"
          - "patch"
      frontend-dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
          - "@playwright/*"
          - "@axe-core/*"
          - "playwright"
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@testing-library/react-native"
      build-tools:
        patterns:
          - "turbo"
          - "orval"
        update-types:
          - "minor"
          - "patch"
      mcp-worker:
        # Cloudflare Worker + MCP Server deps in apps/mcp-server
        patterns:
          - "wrangler"
          - "@cloudflare/*"
          - "agents"
          - "@modelcontextprotocol/*"
          - "jose"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # GitHub Actions
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
      - "devops"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 5
    # Group all actions updates together
    groups:
      github-actions:
        patterns:
          - "*"

  # =============================================================================
  # Docker - Backend
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect major Go version updates
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-major"]
    groups:
      docker-backend:
        patterns:
          - "*"

  # =============================================================================
  # Docker - Frontend
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect major Node version updates
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]
    groups:
      docker-frontend:
        patterns:
          - "*"

  # =============================================================================
  # Docker Compose - Infrastructure Services
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect major database/service version updates
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      docker-services:
        patterns:
          - "*"
