# Dependabot configuration for BoostedBudget
# Monitors dependencies across all workspaces and creates automated PRs for updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # =============================================================================
  # Backend - Go Modules
  # =============================================================================
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "backend"
      - "go"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 5
    # Protect major Go version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates together
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # Root Workspace - Turborepo and shared tooling
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "root"
      - "tooling"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    groups:
      root-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # Frontend App - /apps/web
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 10
    # Protect major version updates for critical frameworks
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-query"
        update-types: ["version-update:semver-major"]
    # Group dependencies by type
    groups:
      # Core framework dependencies
      frontend-framework:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      # UI component libraries
      frontend-ui-libraries:
        patterns:
          - "@radix-ui/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@heroicons/*"
          - "clsx"
          - "class-variance-authority"
        update-types:
          - "minor"
          - "patch"
      # State management and data fetching
      frontend-state:
        patterns:
          - "@tanstack/*"
          - "@reduxjs/*"
          - "axios"
          - "swr"
        update-types:
          - "minor"
          - "patch"
      # Development and testing tools
      frontend-dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
          - "@playwright/*"
          - "playwright"
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # API Client Package - /packages/api-client
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/packages/api-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "api-client"
      - "packages"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect Orval (code generation tool - breaking changes impact workflow)
    ignore:
      - dependency-name: "orval"
        update-types: ["version-update:semver-major"]
    groups:
      api-client-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # Shared Types Package - /packages/shared-types
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/packages/shared-types"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "shared-types"
      - "packages"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    groups:
      shared-types-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # GitHub Actions
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
      - "devops"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 5
    # Group all actions updates together
    groups:
      github-actions:
        patterns:
          - "*"

  # =============================================================================
  # Docker - Backend
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect major Go version updates
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-major"]
    groups:
      docker-backend:
        patterns:
          - "*"

  # =============================================================================
  # Docker - Frontend
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect major Node version updates
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]
    groups:
      docker-frontend:
        patterns:
          - "*"

  # =============================================================================
  # Docker Compose - Infrastructure Services
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    reviewers:
      - "maxnussbaum"
    open-pull-requests-limit: 3
    # Protect major database/service version updates
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rabbitmq"
        update-types: ["version-update:semver-major"]
    groups:
      docker-services:
        patterns:
          - "*"
